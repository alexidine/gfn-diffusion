# Workflow diagram source: unconditional crystal training on the NF policy.
# A VARIANT of unconditional.yaml (diagram.py): only the boxes and edges that differ
# live here; every other box is the base's, edited, audited and stamped there.
# Edited by /workvis; rendered by render.py; anchors checked by scan.py.
# A DERIVED VIEW of current behaviour: the code is the authority.
# Math between single dollars is TeX. Single-quoted strings keep backslashes literal
# (a literal ' is written '').

workflow: unconditional_nf
extends: unconditional
title: Unconditional crystal training · NF policy
subtitle: 'committed mk_dev + model.kind nf · protocol unconditional_tb · MIPCAS, ELJ'
route:
  config: configs/mk_dev.yaml
  pins:
    protocol: unconditional_tb
    temperature_conditioning: false
    molecule_conditioning: false
    sg_conditioning: false
    zp_conditioning: false
    vector_conditioning: false
    embedding_conditioning: false
  overrides:                     # set on top of the committed config
    model.kind: nf
    gradient_norm_clip: 10.0     # 'auto' (fitted to SDE gradients) is refused under nf; 10.0 as the oct28 NF runs
stamp:
  commit: a264b41b
  date: 2026-10-30
  audited: 'audited 2026-10-29 at 7f21f9f8, all nodes; corrections applied, not re-audited'

triage:                          # read by scan.py --triage
  swaps: [models/gfn.py::GFN, models/nf_policy.py::NFPolicy]
  terms: ['P_F', 'P_B', '\sum_i', 'trajector', 'path', 'bridge', 'grid', 'wall', 'clamp', '\pm 200']

nodes:
  - id: model
    group: init
    kind: once
    title: Policy · autoregressive spline flow · 3.19 M parameters
    lines:
      - 'one step $x_0 = 0 \to x$: $\log P_F = \log q_\theta(x)$, exact · the backward step is deterministic, $\log P_B = 0$'
      - 'rows: 4 wrapped (7, 8, 10, 11) on the circle of period 2 · 8 bounded (0–6, 9) on the closed $[-1, 1]$, zero density outside · none dead'
      - 'base uniform on $[-1, 1]^{12}$ · no standardisation: every row is bounded or wrapped'
      - 'one block, autoregressive in the order 8, 11, 10, 9, 7, 6, 5, 4, 3, 2, 1, 0'
      - 'per row a rational-quadratic spline, 32 bins on $[-1, 1]$: a wrapped row is first shifted, $z = \mathrm{wrap}(x + s(x_{o_{<j}}))$, end slopes matched; a bounded row is unshifted, both end slopes learned'
      - 'bin width floor $10^{-3}$, height floor $10^{-7}$ · knot slopes tied: harmonic mean of the adjacent bin slopes × a learned factor in $[1/2,\ 2]$ · tail bound 5 unused (no unbounded row)'
      - '$q_\theta(x) = \prod_{j=1}^{12} q_j(x_{o_j} \mid x_{o_{<j}})$, $\ \log q_\theta(x) = -12\ln 2 + \sum_j \log\big|\partial y_{o_j}/\partial x_{o_j}\big|$, $\ y = f_\theta(x)$: exact (triangular Jacobian)'
      - 'a draw: $u \sim \mathcal{U}[-1, 1]^{12}$, $\ x = f_\theta^{-1}(u)$ row by row, cached; in bf16 it rounds differently from the full pass that scores $\log q_\theta(x)$'
      - 'conditioner: causal transformer, width 256, 4 layers, 8 heads, pre-LayerNorm, MLP 256 → 1024 → 256; slot $j$ reads row $o_{j-1}$ ($x$, or $\sin, \cos\,\pi x$ if wrapped)'
      - 'head → 97 numbers per row: weights and biases zero, except the knot-slope biases at $\mathrm{softplus}^{-1}(1)$, so bins are equal and slopes 1: $q_\theta$ starts uniform, $\log q_\theta = -12\ln 2$'
      - 'layers in bf16 on CUDA, head and spline in fp32, each layer recomputed in backward · unconditional: no context'
      - '$\log Z$: one scalar, initialised to 0'
      - 'weights ignore the run seed: the geometry probe resets the torch seed to 0 first'
    anchors: [train.py::Modeller.init_gfn, models/nf_policy.py::NFPolicy, models/nf_policy.py::resolve_flow_settings,
              models/spline_flow.py::LatentFlow, models/spline_flow.py::invert_block_cached,
              energies/prior_flow.py::_Block, energies/prior_flow.py::_rq_spline, energies/prior_flow.py::_tied_derivatives,
              energies/prior_flow.py::_bin_fractions, energies/prior_flow.py::_Flow.log_prob,
              energies/ar_transformer.py::CausalTransformerConditioner, models/architectures.py::LearnableScalar,
              'cfg:model.kind', 'cfg:model.nf', 'cfg:model.shared.periodic_centroids']

  - id: optim_init
    group: init
    kind: once
    title: Optimizers
    lines:
      - 'Adam $\beta = (0.9,\ 0.999)$, $\ \epsilon = 10^{-8}$, no weight decay'
      - 'policy LR base $1.25\times10^{-4}$ on the flow''s conditioner (time, state and backward groups empty) · $\log Z$ group LR 0.1'
      - 'grad clip seed $\tau_0 = 10$ (route override: auto is refused under the NF)'
    anchors: [train.py::Modeller.init_schedulers_optimizers, utils.py::resolve_derived_config,
              config_invariants.py::nf_policy_refuses_sde_only_settings,
              'cfg:lr_control.seed_lr', 'cfg:gradient_norm_clip', 'cfg:lr_flow', 'cfg:use_weight_decay']

  - id: fit_scalers
    after: optim_init
    group: init
    kind: inert
    title: Fit the flow's standardisers · no effect here
    lines:
      - 'standardises the linear rows on the 30,827 kept rows'
      - 'every live row here is bounded or wrapped, so $\mu = 0$, $\sigma = 1$ stay and $\log q_\theta$ carries no $-\sum\log\sigma$ term'
      - 'sets a persistent fitted flag: a resume does not refit'
    anchors: [train.py::Modeller.fit_policy_data_scalers, models/nf_policy.py::NFPolicy.fit_data_scalers,
              energies/prior_flow.py::_Flow.set_scaler]

  - id: mle_bwd
    group: mlestep
    title: Backward step · deterministic, to $x_0 = 0$
    lines:
      - 'one step $x \to x_0 = 0$, $\log P_B = 0$: no path is sampled, nothing reparameterised (traj_grads 1 has nothing to act on)'
      - 'the stored terminal, detached, wrapped rows folded onto $[-1, 1)$, scored in one conditioner pass: $\log P_F = \log q_\theta(x)$'
      - 'every kept row lies in the closed box (1,262 of 30,827 exactly on a face, all on row 6: 554 at $+1$, 708 at $-1$), so $\log q_\theta$ is finite on all'
    anchors: [models/nf_policy.py::NFPolicy.get_traj_bwd, models/nf_policy.py::NFPolicy._one_step,
              models/spline_flow.py::LatentFlow.log_prob, 'cfg:bwd_loss_coeffs.traj_grads']

  - id: mle_loss
    group: mlestep
    title: MLE loss · exact negative log-likelihood
    lines:
      - '$L = -\langle \log q_\theta(x) \rangle$: the Jensen bound $\langle \log P_B - \log P_F \rangle$ on one deterministic path, so it is tight'
      - 'at initialisation $L = 12\ln 2 = 8.318$ nats ($q_\theta$ uniform on the box)'
      - 'gradient to the conditioner only; none to $\log Z$'
      - 'these rows do not write the tracker''s EMA of $\log w$ (z-feed forward: only forward draws do) · $\log Z$ never moves'
    anchors: [gflownet_losses.py::get_gfn_backward_loss, gflownet_losses.py::terminal_mle,
              buffer.py::ConditionLogZTracker.update, train.py::Modeller._offpolicy_feeds_log_z, 'cfg:@train_prior.loss_coeffs',
              'cfg:condition_log_z.z_feed', 'cfg:bwd_loss_coeffs.freeze_z']

  - id: mle_eval
    group: mle
    kind: periodic
    title: Step 50, then every 250 steps · evaluation
    lines:
      - '10,000 one-step draws from $q_\theta$ at $kT = 2.5$, scored with ELJ (the training step itself makes no energy call); every draw lies in the box, so the wall term is 0'
      - '10,000 dataset rows scored by exact $\log q_\theta$, no gradient'
      - 'w1r (per latent column, $W_1$ to the MLE dataset over the median of 4 reference self-draws) is not computed: it needs $\ge 4 \times 10{,}000$ reference rows (exit gate)'
      - 'density readouts: mean and P90 of $-\log q_\theta$ on fixed rows ($\le 4096$ per set): training rows, held-out anchor groups (1,732), clean training anchors (3,799), molecule crystals (4,096 of all 44,132 prior-file rows: the molecule source is the prior file)'
      - 'each also against the reference measure, $-\log q_\theta + \log\rho$ with $\log\rho = -E_{\mathrm{jac}}/kT$ · held-out gap $=$ held-out $-$ training'
      - 'a held-out plateau gate on the held-out reference reading (6 evals, 0.25 nats, median of 3) is published; the stage exit does not read it'
      - 'its forward draws write the tracker''s EMA of $\log w$: one update per eval, half-life 2 updates (z-feed forward, update_log_z on)'
      - 'no rows enter any buffer, except from the hand-off eval at $n = 50{,}000$, run after the switch to stage 2: $\le 1000$ rows to replay'
    anchors: [train.py::Modeller.evaluation, train.py::Modeller._admit_eval_rollout, train.py::Modeller.fwd_eval_sampling, train.py::Modeller.bwd_eval_sampling,
              train.py::Modeller._eval_feed_log_z, 'cfg:condition_log_z.z_feed', 'cfg:condition_log_z.eval_half_life_visits',
              train.py::Modeller.progress_metrics, progress_metrics.py::_column_w1_ratio,
              train.py::Modeller.density_readouts, train.py::Modeller.update_heldout_gate, progress_metrics.py::heldout_plateau,
              train.py::Modeller.init_mol_dataset,
              models/nf_policy.py::NFPolicy.get_traj_fwd, models/nf_policy.py::NFPolicy.log_density,
              'cfg:eval_num_samples', 'cfg:eval_period', 'cfg:heldout_gate']

  - id: eq_entry
    patch:
      replace:
        - ['bootstrap: 4000 poli',
           'bootstrap: 4000 draws $x \sim q_\theta$, $\ \log w = \log R - \log q_\theta(x)$, $\ \log Z \leftarrow z^*(\log w)$ with gain $K = 1$']

  - id: fwd
    group: eqstep
    title: Forward draw · 1000 samples, one step
    lines:
      - '$x_0 = 0 \to x$ in one step: $x = f_\theta^{-1}(u)$, $\ u \sim \mathcal{U}[-1, 1]^{12}$ · no time grid'
      - 'inside the box by construction: bounded rows on the closed $[-1, 1]$, wrapped rows on the circle'
      - '$\log P_F = \log q_\theta(x)$, exact, from a second full pass · $\log P_B = 0$ · draw and score carry no gradient'
      - 'no exploration noise'
    anchors: [train.py::Modeller.fwd_train_step, models/nf_policy.py::NFPolicy.get_traj_fwd, models/nf_policy.py::NFPolicy._one_step,
              models/spline_flow.py::LatentFlow.sample, models/spline_flow.py::invert_block_cached,
              energies/prior_flow.py::rq_spline_inverse, 'cfg:model.nf.bounded_rows', 'cfg:model.nf.tf_fp32',
              'cfg:fwd_loss_coeffs.exploration_std']

  - id: reward
    patch:
      replace:
        - ['the crystal is built',
           'drawn and replayed states lie in the box, so the wall term is 0; the decode clamp still moves draws inside its bands (see Target)']
      anchors_add: [models/nf_policy.py::NFPolicy.get_traj_fwd, 'cfg:model.nf.bounded_rows']

  - id: fwd_tb
    group: eqstep
    kind: inert
    title: Forward TB · computed, then detached
    lines:
      - '$r = \log Z + \log q_\theta(x) - \log R$'
      - 'forward share pinned at 0: no gradient from this branch'
      - 'still updates the tracker EMA of $\log w = \log R - \log q_\theta(x)$ and the best energy'
    anchors: [gflownet_losses.py::get_gfn_forward_loss, gflownet_losses.py::get_tb_loss, train.py::Modeller.fused_train_step,
              'cfg:@equilibration.fracs', 'cfg:@equilibration.deactivate_threshold', 'cfg:condition_log_z.z_feed']

  - id: zfill
    patch:
      replace:
        - ['$\log w_j = \log R_j',
           '$\log w_j = \log R_j - \log q_\theta(x_j)$ over $j = 1..1000$']

  - id: bwd
    group: eqstep
    title: Backward branch · 1000 rows, uniform from the prior buffer
    lines:
      - 'no backward path: $x \to x_0 = 0$ is deterministic, $\log P_B = 0$'
      - 'the stored terminal, wrapped and detached, scored exactly: $\log q_\theta(x)$; the gradient reaches the flow only through this density'
      - '$\log R$ from the row''s stored energy terms, bound term 0'
      - '$L_b = \langle\rho_{80}(r)\rangle,\quad r = \log\bar Z + \log q_\theta(x) - \log R$'
    anchors: [train.py::Modeller.bwd_train_step, train.py::Modeller.draw_bwd_sample, models/nf_policy.py::NFPolicy.get_traj_bwd,
              models/nf_policy.py::NFPolicy._one_step, gflownet_losses.py::get_gfn_backward_loss, gflownet_losses.py::get_tb_loss,
              'cfg:@equilibration.loss_coeffs']

  - id: replay
    group: eqstep
    title: Replay branch · 1000 rows, uniform from the replay buffer
    lines:
      - 'stored pair $(x_0, x)$; $x$ re-scored exactly under the current flow: $\log q_\theta(x)$'
      - '$\log R$ from stored terms, bound term live on the stored $x$ (0: drawn inside the box)'
      - '$L_r = \langle\rho_{80}(r)\rangle$, same residual, $\bar Z$ detached'
    anchors: [train.py::Modeller.replay_train_step, train.py::Modeller.draw_replay_sample, train.py::Modeller._finish_replay_draw,
              models/nf_policy.py::NFPolicy.get_traj_replay, 'cfg:buffers.replay_buffer.prioritise']

  - id: optim
    patch:
      replace:
        - ['clip $\|g\| \le \tau',
           'clip $\|g\| \le \tau$: $\ \tau = 10$ (route override) for the stage''s first 100 steps, then a lognormal fit to those norms, $\tau_1 = e^{\mu + 2.326\sigma}$']
      anchors_add: ['cfg:gradient_norm_clip']

  - id: eq_eval
    group: eq
    kind: periodic
    title: Every 250 steps · evaluation
    lines:
      - '10,000 one-step draws from $q_\theta$ at $kT = 2.5$ · 10,000 prior-buffer rows scored by $\log q_\theta$, no gradient'
      - 'density readouts and the held-out gate as in stage 1'
      - '→ $\log Z$ fill (same estimator) → $\le 1000$ rows to replay'
    anchors: [train.py::Modeller.evaluation, train.py::Modeller._admit_eval_rollout, train.py::Modeller._eval_z_fill,
              'cfg:eval_period', 'cfg:eval_num_samples', 'cfg:z_calibration.fill_from_eval',
              'cfg:buffers.replay_buffer.admit_from_eval', train.py::Modeller.density_readouts]

  - id: ckpt
    patch:
      add:
        - 'records the resolved flow settings with the weights'
      anchors_add: [train.py::Modeller._build_gfn_config]

  - id: notation
    patch:
      add:
        - '$q_\theta$: the flow''s exact density on the box, no $\pm 200$ clip · $\log P_F = \log q_\theta(x)$, $\log P_B = 0$'
      anchors_add: [models/nf_policy.py::NFPolicy._one_step]

edges:
  - {from: load, to: fit_scalers}
  - {from: fit_scalers, to: seed_stores}
  - {from: mle_data, to: fit_scalers, kind: data, label: latents}
  - {from: load, to: mle_eval, kind: data, label: readout rows}
  - {from: replay_buf, to: replay, kind: data, label: 'stored pairs $(x_0, x)$'}
remove_edges:
  - {from: load, to: seed_stores}
