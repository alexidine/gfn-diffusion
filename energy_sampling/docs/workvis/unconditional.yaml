  - {from: eq_eval, to: logz, kind: write}
  - {from: eq_entry, to: logz, kind: write}
  - {from: logz, to: bwd, kind: data, label: detached}
  - {from: logz, to: replay, kind: data, label: detached}
  - {from: prior_buf, to: bwd, kind: data, label: terminal states}
