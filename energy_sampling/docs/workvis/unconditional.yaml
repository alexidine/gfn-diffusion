# Workflow diagram source: unconditional crystal training.
# Edited by /workvis; rendered by render.py; anchors checked by scan.py.
# A DERIVED VIEW of current behaviour: the code is the authority.
# Math between single dollars is TeX. Single-quoted strings keep backslashes literal
# (a literal ' is written '').

workflow: unconditional
title: Unconditional crystal training
subtitle: 'committed mk_dev · protocol unconditional_tb · MIPCAS, ELJ'
route:
  config: configs/mk_dev.yaml
  pins:
    protocol: unconditional_tb
    temperature_conditioning: false
    molecule_conditioning: false
    sg_conditioning: false
    zp_conditioning: false
    vector_conditioning: false
    embedding_conditioning: false
    model.kind: sde
stamp:
  commit: b92ced74
  date: 2026-10-29
  audited: 'audited 2026-10-29; corrections applied, not re-audited'

groups:
  - {id: init, title: 'Launch · prior initialization', style: init}
  - {id: mle, title: 'Stage 1 · MLE warm start', style: mle}
  - {id: mlestep, parent: mle, title: 'One step $n$ · $B = 1000$', style: step}
  - {id: eq, title: 'Stage 2 · Equilibration', style: eq}
  - {id: eqstep, parent: eq, title: 'One step $n$ · $B = 1000$', style: step}

nodes:
  # ---------------------------------------------------------------- launch
  - id: target
    group: init
    kind: once
    title: Target · MIPCAS in $P\bar 1$, $Z' = 1$, one condition
    lines:
      - 'state $x \in \mathbb{R}^{12}$, nominal box $[-1, 1]^{12}$: cell lengths (3), cell angles (3), centroid (3), orientation (3)'
      - 'lengths $L_d = 2R\,\exp\!\big(\ln lo_d + (x_d/2 + 1/2)\ln(hi_d/lo_d)\big)/a_d$, $\ lo = (0.075, 0.075, 0.1)$, $hi = (3, 3, 4)$, $R$ = molecule radius'
      - 'angles $(x/2 + 1/2)\,0.6\pi + 0.2\pi$ · centroid $(x/2 + 1/2)\,a_d$, $\ a = (0.5, 1, 1)$'
      - 'orientation $\theta = \tfrac{\pi}{4}(x + 1),\ \phi = \pi x,\ r = \pi(x + 1)$ → rotation vector'
      - 'periodic, wrapped with period 2: centroid $y, z$ and $\phi, r$'
      - 'decode clamps to the box → unit cell → cluster (cutoff 10) → ELJ'
    anchors: [models/gfn.py::GFN.get_periodic_dimensions, train.py::Modeller._resolve_periodic_centroid_axes,
              models/aunit_periodicity.py::sg_periodic_centroid_axes,
              mxtaltools/dataset_utils/data_class_methods/crystal_ops.py::MolCrystalOps.latent_to_cell_params,
              mxtaltools/common/geometry_utils.py::lat2sph_rotvec,
              'cfg:energy_config.crystal_coordinates', 'cfg:model.shared.periodic_centroids', 'cfg:space_groups']

  - id: energy_fn
    group: init
    kind: once
    title: Energy function · ELJ at $kT = 2.5$
    lines:
      - 'computes the reduction energy and ELJ'
      - 'its ELJ coefficient and clip level are set later, by the prior load'
    anchors: [train.py::Modeller.init_energy_function, 'cfg:energy_config.temperature']

  - id: model
    group: init
    kind: once
    title: Policy network · 6.17 M parameters
    lines:
      - 'time: $[\sin 2\pi k t,\ \cos 2\pi k t]_{k=1..64}$ → one block → 64'
      - 'state: 8 raw coordinates + $\sin, \cos\,\pi x$ of the 4 wrapped → 4 blocks × 512'
      - 'block: $h \leftarrow R\,h + \mathrm{GELU}(\mathrm{LN}(Wh + b))$, $\ R$ a learned bias-free projection'
      - '$P_F$ head: $[s, t]$ (576) → 4 × 512 → $\mu$ (12), $\ell$ (12), $\rho$ logit (12), $U$ (12 × 6); outputs clipped to $\pm 200$'
      - '$\rho = 0.5\,\sigma(\rho_{\mathrm{logit}} - 4)$, 0 on wrapped dims; $\ d = (1 - \rho)\,s^2$, $\ V = \sqrt{\rho}\,s\,\hat U$'
      - '$P_B$ head: → $m$ (12), $v$ (12), bounded by tanh maps: mean $x_k(1 - \kappa\,\Delta t/t_k)$, $\ \kappa = 1 + 0.4\tanh(m/0.4)$, variance $0.05\,e^{6\tanh(v/6)}\,\Delta t\,t_{k-1}/t_k$'
      - '$\log Z$: one scalar, initialised to 0'
      - 'torch seed reset to 0 inside each MLP constructor: $P_F$ and $P_B$ hidden layers start identical'
    anchors: [train.py::Modeller.init_gfn, models/gfn.py::GFN.get_dplr_cov, models/gfn.py::GFN.get_bwd_correction,
              models/architectures.py::TimeEncoding, models/architectures.py::StateEncoding,
              models/architectures.py::PolicyModel, models/architectures.py::LearnableScalar,
              'cfg:model.shared', 'cfg:model.sde']

  - id: optim_init
    group: init
    kind: once
    title: Optimizers
    lines:
      - 'Adam $\beta = (0.9,\ 0.999)$, $\ \epsilon = 10^{-8}$, no weight decay'
      - 'policy LR base $1.25\times10^{-4}$ · $\log Z$ group LR 0.1'
      - 'grad clip seed $\tau_0 = 37.88$ (auto: from the 10-step grid and width 512)'
    anchors: [train.py::Modeller.init_schedulers_optimizers, utils.py::resolve_derived_config,
              'cfg:lr_control.seed_lr', 'cfg:gradient_norm_clip', 'cfg:lr_flow', 'cfg:use_weight_decay']

  - id: prior_file
    group: init
    kind: store
    title: Prior file · pre-noised build, 44,132 rows
    lines:
      - '4,012 anchors (3,799 train, 213 held out), 10 children each, built at $kT = 2.5$'
      - 'child $= \mathrm{clip}(x_a + \rho\,\hat u)$, $\ \hat u$ uniform on $S^{11}$, $\ \log_{10}\rho \sim U(-2.5,\ -1.125)$'
      - 'then written as a random $P\bar 1$ normaliser image'
    anchors: [data_processing/build_noised_prior.py::kick, data_processing/build_noised_prior.py::choose_images,
              'cfg:prior_path']

  - id: load
    group: init
    kind: once
    title: Load and filter the prior file
    lines:
      - 'sets the ELJ coefficient $\lambda = 0.364$ from the file (replaces the config''s 1.0): effective $kT = 6.88$ in raw ELJ units'
      - '512 stratified rows rebuilt and re-scored against their stored terms (tolerance $0.1 + 10^{-4}|E|$)'
      - 'every row''s reward from its stored energy terms, no rebuild'
      - 'keep: train split, children only, packing $\in [0.55,\ 0.95]$, seed energy (no Jacobian) $\le$ floor $+ 6\,kT$'
      - 'floor $= -141.04$, the best training-split row (an anchor) · 30,827 kept, 7,163 children fail the energy window'
      - 'arms the clip: $c_1 = \min_i E_i + 250\,kT = -152.08 + 625 = 472.9$; kept energies span $[-152, -132]$, so it binds on none'
    anchors: [train.py::Modeller.init_prior_dataset, train.py::Modeller._load_noised_prior, train.py::Modeller._stored_reward_terms,
              noised_prior.py::check_rows, noised_prior.py::select_rows,
              energies/molecular_crystal.py::MolecularCrystal.set_reward_clip,
              'cfg:noised_prior', 'cfg:energy_config.lj_coeff', 'cfg:energy_config.reward_range']

  - id: seed_stores
    group: init
    kind: once
    title: Seed the buffers from the MLE dataset
    lines:
      - 'prior buffer: a static copy · anchor buffer: a frozen copy (children, not anchors)'
      - 'replay buffer: none until the first admission'
    anchors: [train.py::Modeller.init_prior_buffer_seed, train.py::Modeller.init_anchor_buffer_seed,
              train.py::Modeller.init_condition_log_z, 'cfg:buffers.anchor_buffer.frozen']

  # ---------------------------------------------------------------- stage 1
  - id: mle_entry
    group: mle
    kind: once
    title: Stage entry
    lines:
      - 'first stage: no entry actions · optimizers as built at launch'
      - 'LR clock $m$ = steps since stage entry: $\ \alpha = 0.05$ for $m < 3000$, $\times 4$ geometric to $0.2$ by $m = 4000$, then held'
      - '$\log Z = 0$'
    anchors: [protocol.py::StageProtocol.begin, controller.py::LRController.tick, 'cfg:@train_prior', 'cfg:lr_control.schedule']

  - id: mle_data
    group: mle
    kind: store
    title: MLE dataset
    lines:
      - 'the 30,827 kept children'
    anchors: [train.py::Modeller.init_prior_dataset]

  - id: mle_draw
    group: mlestep
    title: Draw 1000 rows, uniform, from the MLE dataset
    lines:
      - '$\log R$ rebuilt from stored energy terms: no energy call'
      - 'writes a per-row priority that only the eval report reads'
    anchors: [train.py::Modeller.draw_bwd_sample, train.py::Modeller.bwd_train_step,
              train.py::Modeller._bwd_retention_priority, 'cfg:batch_size']

  - id: mle_bwd
    group: mlestep
    title: Backward path to $x_0 = 0$
    lines:
      - 'the same learned bridge as the equilibration backward branch, 10 steps'
      - 'reparameterised · last step deterministic to $x_0 = 0$ with $\log P_B = 0$'
    anchors: [models/gfn.py::GFN.get_traj_bwd, models/gfn.py::GFN._bwd_step, models/gfn.py::GFN.bwd_propagate,
              'cfg:bwd_loss_coeffs.traj_grads']

  - id: mle_loss
    group: mlestep
    title: MLE loss · Jensen bound
    lines:
      - '$L = \big\langle \sum_i \log P_B - \sum_i \log P_F \big\rangle$, summed over 10 steps and all live dims, no normalisation'
      - 'gradient to the trunk, $P_F$ and $P_B$ (also through the path); none to $\log Z$'
      - 'a tracker EMA of $\log w = \log R + \sum\log P_B - \sum\log P_F$ is updated (half-life 200 visits); $\log Z$ never moves'
    anchors: [gflownet_losses.py::get_gfn_backward_loss, gflownet_losses.py::terminal_mle,
              buffer.py::ConditionLogZTracker.update, 'cfg:@train_prior.loss_coeffs',
              'cfg:condition_log_z.half_life_visits', 'cfg:bwd_loss_coeffs.freeze_z']

  - id: mle_optim
    group: mlestep
    title: Optimizer step · tripwire
    lines:
      - 'same Adam, LR clock, clip and tripwire rules as equilibration'
      - 'tripwire bars fit at $m = 3000$, refit at $m \approx 4400$'
    anchors: [train.py::Modeller.step_loss, controller.py::LRController.observe, grad_clip_guard.py::GradClipGuard.threshold,
              grad_clip_guard.py::GradClipGuard.observe, hard_failure_bars.py::HardFailureBars.derive,
              'cfg:grad_clip_guard', 'cfg:lr_control.hard_failure']

  - id: mle_eval
    group: mle
    kind: periodic
    title: Step 50, then every 250 steps · evaluation
    lines:
      - '10,000 forward rollouts at $kT = 2.5$, scored with ELJ (the training step itself makes no energy call)'
      - '10,000 backward paths from dataset rows, no gradient'
      - 'w1r per latent column: $W_1(\text{samples}, \text{MLE dataset})$ ÷ median $W_1$ of 4 reference self-draws'
      - 'no rows enter any buffer'
    anchors: [train.py::Modeller.evaluation, train.py::Modeller.fwd_eval_sampling, train.py::Modeller.bwd_eval_sampling,
              train.py::Modeller.progress_metrics, progress_metrics.py::_column_w1_ratio,
              'cfg:eval_num_samples', 'cfg:eval_period']

  - id: mle_gate
    group: mle
    kind: warn
    title: Exit gate · never fires on this config
    lines:
      - 'rule: $n \ge 2000$ and trailing medians (2500 steps) of w1r median $\le 5$, worst $\le 10$'
      - 'w1r needs $\ge 4 \times 10{,}000$ reference rows; the MLE dataset has 30,827, so w1r is never published, silently'
      - 'so the stage always runs to its bound, max_steps $= 50{,}000$'
    anchors: [progress_metrics.py::_column_w1_ratio, protocol.py::StageProtocol.maybe_advance,
              protocol.py::StageProtocol._step_cap_reached,
              'cfg:progress_gate', 'cfg:eval_num_samples', 'cfg:@train_prior.exit', 'cfg:@train_prior.max_steps']

  - id: mle_exit
    group: mle
    kind: once
    title: Hand-off at $n = 50{,}000$
    lines:
      - 'snapshot: weights, Adam state, tracker, buffers'
      - 'carried: weights, $\log Z = 0$, tracker, global step $n$'
      - 'reset: optimizer moments, LR clock, tripwire bars, clip guard'
    anchors: [protocol.py::StageProtocol.advance, controller.py::LRController.on_stage_change,
              grad_clip_guard.py::GradClipGuard.refresh, 'cfg:@train_prior.on_exit']

  # ---------------------------------------------------------------- stage 2
  - id: eq_entry
    group: eq
    kind: once
    title: Stage entry
    lines:
      - 'optimizer moments rebuilt · LR and tripwire clocks restart: $m = n - n_0$'
      - 'prior rebuild skipped: the prior buffer stays the pre-noised file''s kept rows'
      - 'bootstrap: 4000 policy samples, $\log Z \leftarrow z^*(\log w)$ with gain $K = 1$'
      - 'replay opens with those rows ($\le 4000$: finite $\log R \ge -200$) plus $\le 1000$ rows of the hand-off evaluation'
    anchors: [train.py::Modeller.bootstrap_z_by_rollout, train.py::Modeller.z_level_fill, protocol.py::StageProtocol.advance,
              train.py::Modeller.rebuild_prior_by_churn, train.py::Modeller._prior_is_static,
              controller.py::LRController.on_stage_change, train.py::Modeller.manage_replay_buffer,
              'cfg:@equilibration.on_enter']

  - id: gate
    group: eqstep
    kind: gate
    title: Rollout this step?
    lines:
      - '$(n - n_0)\ \mathrm{mod}\ 20 = 0$'
      - 'or replay rows $/\,B < 2$, at least 2 steps after the last rollout'
    anchors: [train.py::Modeller._fwd_gates, train.py::Modeller._rollout_trigger_fires, train.py::Modeller._replay_rows,
              'cfg:@equilibration.fwd_rollout_every', 'cfg:@equilibration.fwd_rollout_triggers', 'cfg:batch_size']

  - id: fwd
    group: eqstep
    title: Forward rollout · 1000 trajectories
    lines:
      - '$x_0 = 0$ · 10 steps · $\Delta t = 0.1$ · periodic dims wrapped'
      - '$x_{i+1} = x_i + \Delta t\,\mu_\theta(x_i, t_i) + \sqrt{\Delta t}\,\xi_i,\quad \xi_i \sim \mathcal{N}\big(0,\ \mathrm{diag}\,d + VV^\top\big),\ \mathrm{rank}\,V = 6$'
      - 'scale $s^2 = 0.05\,e^{6\tanh(\ell/6)}$ · no added exploration noise'
    anchors: [train.py::Modeller.fwd_train_step, models/gfn.py::GFN.get_traj_fwd, models/gfn.py::GFN._fwd_step,
              'cfg:model.sde.T', 'cfg:fwd_loss_coeffs.exploration_std']

  - id: reward
    group: eqstep
    title: Reward
    lines:
      - '$\log R = -E/kT,\quad kT = 2.5$'
      - '$E = \mathrm{cap}_2\big(\mathrm{cap}_1(\lambda E_{\mathrm{ELJ}}/Z'' + 10\,\phi_{\mathrm{pack}} + E_{PV}) + 10kT\sum_d \mathrm{relu}(|x_d| - 1)^2 + 10kT\,\mathrm{relu}(E_{\mathrm{red}})\big) + E_{\mathrm{jac}}$'
      - 'the crystal is built from the clamped state; the wall term scores how far $x$ left the box'
      - '$\lambda = 0.364$ · $\phi_{\mathrm{pack}}$: penalty on packing coefficient outside $[0.55,\ 0.95]$ · $E_{PV}$ at 1 atm'
      - '$\mathrm{cap}_c(y) = c + \log(1 + y - c)$ above $c$; $\ c_1 = 472.9$, $\ c_2 = c_1 + 0.1\,|c_1|$'
      - '$E_{\mathrm{jac}} = -kT\big(2\ln\sin(r/2) + \ln\sin\theta + Z''\ln(V/n_{\mathrm{sym}})\big)$'
    anchors: [energies/molecular_crystal.py::MolecularCrystal.generator_energy, energies/molecular_crystal.py::MolecularCrystal.compute_jacobian,
              energies/molecular_crystal.py::density_penalty, energies/base_set.py::BaseSet.log_reward,
              'cfg:energy_config.temperature', 'cfg:energy_config.density_coeff', 'cfg:energy_config.bounding_coeff',
              'cfg:energy_config.reduction_coeff']

  - id: fwd_tb
    group: eqstep
    kind: inert
    title: Forward TB · computed, then detached
    lines:
      - '$r = \log Z + \sum_i \log P_F - \sum_i \log P_B - \log R$'
      - 'forward share pinned at 0: no gradient from this branch'
      - 'still updates the tracker EMA of $\log w$ and the best energy'
    anchors: [gflownet_losses.py::get_gfn_forward_loss, gflownet_losses.py::get_tb_loss, train.py::Modeller.fused_train_step,
              'cfg:@equilibration.fracs', 'cfg:@equilibration.deactivate_threshold']

  - id: zfill
    group: eqstep
    title: Set $\log Z$ from this rollout
    lines:
      - '$\log w_j = \log R_j + \sum_i \log P_B - \sum_i \log P_F$ over $j = 1..1000$'
      - '$z^*$ solves $\frac{1}{B}\sum_j \mathrm{clip}(z - \log w_j,\ \pm 10) = 0$'
      - 'Kalman: $\log Z \mathrel{+}= K\,(z^* - \log Z),\ K = P/(P + \mathrm{se}^2)$, $P$ grows $0.01$ per step'
      - 'knee 10 is the forward $\beta$, not the 80 the losses use'
    anchors: [train.py::Modeller.z_level_fill, train.py::Modeller._stash_z_fill_logw, train.py::Modeller._z_fill_head_is_fillable,
              gflownet_losses.py::winsorized_z_root, 'cfg:fwd_loss_coeffs.beta', 'cfg:z_calibration.fill_mode',
              'cfg:z_calibration.fill_threshold']

  - id: bwd
    group: eqstep
    title: Backward branch · 1000 rows, uniform from the prior buffer
    lines:
      - 'bridge to $x_0 = 0$ on the 8 linear dims: $\ x_{k-1} = x_k\big(1 - \kappa\,\Delta t/t_k\big) + \sqrt{\sigma^2 \Delta t\, t_{k-1}/t_k}\;\varepsilon$'
      - 'on the 4 wrapped dims: a mixture over arrival lifts $k \in \{-2, \dots, 2\}$, then wrap'
      - 'reparameterised: gradient flows through the sampled states'
      - '$\log R$ from the row''s stored energy terms, bound term 0'
      - '$L_b = \langle\rho_{80}(r)\rangle,\quad r = \log\bar Z + \sum_i \log P_F - \sum_i \log P_B - \log R$'
    anchors: [train.py::Modeller.bwd_train_step, train.py::Modeller.draw_bwd_sample, models/gfn.py::GFN.get_traj_bwd,
              models/gfn.py::GFN._bwd_step, gflownet_losses.py::get_gfn_backward_loss, gflownet_losses.py::get_tb_loss,
              'cfg:@equilibration.loss_coeffs', 'cfg:model.sde.pb_exact_reversal']

  - id: replay
    group: eqstep
    title: Replay branch · 1000 rows, uniform from the replay buffer
    lines:
      - 'stored forward paths re-scored under the current policy'
      - '$\log R$ from stored terms, bound term live on the stored terminal'
      - '$L_r = \langle\rho_{80}(r)\rangle$, same residual, $\bar Z$ detached'
    anchors: [train.py::Modeller.replay_train_step, train.py::Modeller.draw_replay_sample, train.py::Modeller._finish_replay_draw,
              models/gfn.py::GFN.get_traj_replay, 'cfg:buffers.replay_buffer.prioritise']

  - id: fused
    group: eqstep
    title: Fused loss
    lines:
      - '$L = (1 - s)\,L_b + s\,L_r$, $\ s$ = replay share'
      - '$L = L_b$ while the replay buffer is empty'
    anchors: [train.py::Modeller.fused_train_step, train.py::Modeller.train_step, 'cfg:@equilibration.fracs',
              'cfg:fused_grad_accum_min_samples']

  - id: admit
    group: eqstep
    title: Admit this rollout to replay (rollout steps only)
    lines:
      - 'rows with finite $\log R \ge -200$, at most 1000 per call'
    anchors: [train.py::Modeller.manage_replay_buffer, train.py::Modeller.fused_train_step,
              'cfg:buffers.replay_buffer.admit_reward_min', 'cfg:buffers.replay_buffer.churn_rate']

  - id: logz
    group: eq
    kind: param
    title: $\log Z$
    lines:
      - 'one scalar, initialised 0 · never receives gradient on this route'
      - 'still 0 at the end of the MLE stage'
      - 'moved only by the equilibration fill, or restored by a tripwire rewind'
    anchors: [models/architectures.py::LearnableScalar, train.py::Modeller.z_level_fill, 'cfg:z_calibration.fill_from_eval']

  - id: prior_buf
    group: eq
    kind: store
    title: Prior buffer · static
    lines:
      - 'a copy of the MLE dataset: the 30,827 kept children'
      - 'no admission, churn or expiry on a pre-noised prior'
      - 'bwd writes a per-row priority that only the eval report reads'
    anchors: [train.py::Modeller._prior_is_static, train.py::Modeller.manage_prior_buffer,
              train.py::Modeller.init_prior_buffer_seed, train.py::Modeller._bwd_retention_priority]

  - id: anchor_buf
    group: eq
    kind: store
    title: Anchor buffer · frozen
    lines:
      - 'a copy of the same 30,827 children'
      - 'supplies $M$ to every branch''s under-coverage statistic'
    anchors: [train.py::Modeller.init_anchor_buffer_seed, train.py::Modeller._reward_ramp_kwargs,
              'cfg:buffers.anchor_buffer.frozen']

  - id: replay_buf
    group: eq
    kind: store
    title: Replay buffer · $\le 50{,}000$ rows
    lines:
      - 'mean residence 240 steps · max age 1200'
      - '$\approx 13$ batches at steady state (derived: $(50 + 4)$ rows/step × 240 steps; not measured)'
    anchors: [train.py::Modeller.manage_replay_buffer, 'cfg:buffers.replay_buffer.max_size',
              'cfg:buffers.replay_buffer.mean_residence_steps', 'cfg:buffers.replay_buffer.backstop_mult',
              'cfg:buffers.replay_buffer.admit_from_eval', 'cfg:@equilibration.fwd_rollout_every']

  - id: optim
    group: eq
    title: Optimizer step · Adam $\beta = (0.9,\ 0.999)$, no weight decay
    lines:
      - 'policy LR $= 1.25\times10^{-4}\cdot\alpha(m)$: $\ \alpha = 0.05$ for $m < 3000$, $\times 4$ geometric to $0.2$ by $m = 4000$, then held'
      - 'clip $\|g\| \le \tau$: $\ \tau = 37.88$ for the stage''s first 100 steps, then a lognormal fit to those norms, $\tau_1 = e^{\mu + 2.326\sigma}$'
      - 'then $\tau \leftarrow \tau\, e^{0.01(\mathbb{1}[\|g\| > \tau] - 0.01)}$, held within $[\tau_1/100,\ 100\,\tau_1]$ of the fitted bar'
    anchors: [train.py::Modeller.step_loss, grad_clip_guard.py::GradClipGuard.threshold, grad_clip_guard.py::GradClipGuard.observe,
              grad_clip_guard.py::GradClipGuard._accumulate, grad_clip_guard.py::GradClipGuard._apply_cap,
              controller.py::LRController.tick, 'cfg:lr_control.seed_lr', 'cfg:lr_control.schedule',
              'cfg:grad_clip_guard', 'cfg:gradient_norm_clip']

  - id: trip
    group: eq
    title: Tripwire · every step → rewind
    lines:
      - 'fires on $|\mathrm{loss}| \ge 10^6$ or $\|g\| \ge 10^6$'
      - 'from $m = 3000$: loss $\ge hi + 10\,(hi - lo)$ or $\|g\| \ge 100\times$ the largest pre-clip norm, over a 200-step window; refit at $m \approx 4400$'
      - 'a non-finite gradient skips the step; its rewind fires on the 10-step clock; 50 in a row abort'
      - 'a rewind restores weights, Adam state and trackers from the last good checkpoint and keeps the buffers'
      - 'a rewind scales the LR by fire_cut_factor $= 1$: no cut on this config'
      - 'more than $\max(3,\ n/1000)$ rewinds abort the run'
    anchors: [controller.py::LRController.observe, controller.py::LRController.on_divergence, hard_failure_bars.py::HardFailureBars.judge,
              hard_failure_bars.py::HardFailureBars.derive, train.py::Modeller.fire_loss_spike,
              'cfg:lr_control.hard_failure', 'cfg:lr_control.fire_cut_factor', 'cfg:max_reloads_per_1k_steps']

  - id: hot_lr
    group: eq
    kind: periodic
    title: Every 10 steps · hot-LR sensor, report only
    lines:
      - 'reads the EMA of the forward residual spread (std of $r$ over a rollout batch)'
      - 'flags when $\ln(\text{latest} / \text{10th percentile of the last 11 readings}) > 2$'
      - 'action report: logs the flag, moves nothing'
    anchors: [train.py::Modeller.observe_hot_lr, lr_hot_sensor.py::HotSensor.observe, protocol.py::StageProtocol.__init__,
              'cfg:@equilibration.hot_lr_sensor']

  - id: ramp
    group: eq
    kind: periodic
    title: Every 10 steps · replay share $s$
    lines:
      - '$s = 0.1$ held for the first 500 steps of the stage, then'
      - '$u$ = EMA of bwd under-coverage · $v$ = EMA of (mean raw under-coverage over the last 150 steps − mean over the 150 before)'
      - 'trip when $u > \min u + 0.5$, release at $u \le \min u + 0.25$'
      - '$s \mathrel{-}= 0.006$ if $v > 0$ or tripped, else $s \mathrel{+}= 0.004$; $\ s \in [0.1,\ 0.75]$'
    anchors: [protocol.py::StageProtocol._gated_ramp_tick, train.py::Modeller._forgetting_sensor, 'cfg:@equilibration.balance']

  - id: eq_eval
    group: eq
    kind: periodic
    title: Every 250 steps · evaluation
    lines:
      - '10,000 samples on the same grid and $kT$ · 10,000 backward paths from prior-buffer rows, no gradient'
      - '→ $\log Z$ fill (same estimator) → $\le 1000$ rows to replay'
    anchors: [train.py::Modeller.evaluation, train.py::Modeller._admit_eval_rollout, train.py::Modeller._eval_z_fill,
              'cfg:eval_period', 'cfg:eval_num_samples', 'cfg:z_calibration.fill_from_eval',
              'cfg:buffers.replay_buffer.admit_from_eval']

  - id: ckpt
    group: eq
    kind: periodic
    title: Checkpoint every 50 steps · archive every 5000
    lines:
      - 'run ends at $n = 100{,}000$'
    anchors: [checkpointing.py::Checkpointer.save, checkpointing.py::Checkpointer.archive, 'cfg:epochs', 'cfg:archive_period']

  - id: notation
    group: eq
    kind: note
    title: Notation
    lines:
      - '$\rho_\beta(r) = \tfrac12 r^2$ for $|r| \le \beta$, else $\beta|r| - \tfrac12\beta^2$ (gradient $\mathrm{clip}(r, \pm\beta)$)'
      - '$\bar Z$: $\log Z$ with gradient stopped · se: standard error of $z^*$ · $\langle\cdot\rangle$: batch mean'
      - '$n$: global step · $n_0$: the stage''s first step · $m = n - n_0$'
      - 'under-coverage $u = \sqrt{\textstyle\sum_j \tilde w_j \min(r_j, 0)^2}$, $\ w_j = \mathrm{clamp}\big((\log R_j - M + 100)/50,\ 0,\ 1\big)$, $\ \tilde w = w/\sum w$'
      - '$M$ = best $\log R$ in the anchor buffer'
    anchors: [utils.py::quick_tb_stats, gflownet_losses.py::get_tb_loss, gflownet_losses.py::winsorized_z_root,
              'cfg:buffers.prior_buffer.ramp_floor', 'cfg:buffers.prior_buffer.ramp_width']

edges:
  - {from: target, to: energy_fn}
  - {from: energy_fn, to: model}
  - {from: model, to: optim_init}
  - {from: optim_init, to: load}
  - {from: prior_file, to: load, kind: data, label: rows}
  - {from: load, to: seed_stores}
  - {from: load, to: mle_data, kind: data, label: kept rows}
  - {from: seed_stores, to: mle_entry}
  - {from: seed_stores, to: prior_buf, kind: data, label: copy}
  - {from: seed_stores, to: anchor_buf, kind: data, label: copy}
  - {from: mle_entry, to: mle_draw}
  - {from: mle_data, to: mle_draw, kind: data, label: rows}
  - {from: mle_draw, to: mle_bwd}
  - {from: mle_bwd, to: mle_loss}
  - {from: mle_loss, to: mle_optim}
  - {from: mle_optim, to: mle_eval}
  - {from: mle_eval, to: mle_gate}
  - {from: mle_gate, to: mle_draw, label: next step}
  - {from: mle_gate, to: mle_exit, label: '$n = 50{,}000$'}
  - {from: mle_exit, to: eq_entry}
  - {from: eq_entry, to: gate}
  - {from: gate, to: fwd, label: 'yes'}
  - {from: gate, to: bwd, label: 'no'}
  - {from: fwd, to: reward}
  - {from: reward, to: fwd_tb}
  - {from: fwd_tb, to: zfill}
  - {from: zfill, to: bwd}
  - {from: bwd, to: replay}
  - {from: replay, to: fused}
  - {from: fused, to: admit}
  - {from: admit, to: optim}
  - {from: optim, to: trip}
  - {from: trip, to: hot_lr}
  - {from: hot_lr, to: ramp}
  - {from: ramp, to: eq_eval}
