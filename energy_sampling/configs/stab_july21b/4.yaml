protocol:
  stages:
  - bwd_sampling_mode: dataset
    exit:
    - above: 0.5
      metric: gates/mle_flat
      patience: 5
    - below: 0.015
      metric: eval/wass_debiased
    - below: 2.0
      metric: bwd/tbc
    flags:
      mle_gate: true
      scramble_conditions: true
      update_log_z: true
    loss_coeffs:
      bwd:
        mle: 1.0
        repeats: 2.0
        tbc: 1.0
    name: train_prior
    on_exit:
    - snapshot:phase1_exit
    - snapshot_prior
    skip_if: prior_loaded
    train_mode: bwd
  - bwd_sampling_mode: dataset
    exit:
    - below: 0.03
      metric: eval/wass_debiased
    - below: 2.0
      metric: bwd/tbc
    flags:
      scramble_conditions: true
      update_log_z: true
    loss_coeffs:
      bwd:
        mle: 1.0
        repeats: 2.0
        tbc: 1.0
    name: warmstart
    on_exit:
    - snapshot:warmstart_exit
    train_mode: bwd
  - balance:
      default_boost: fwd
      kind: lexicographic
      rules:
      - above: 0.5
        abs: true
        boost: fwd
        metric: fwd/tb_resid_clipped
      - boost: fwd
        drift: 0.003
        margin: 1.3
        metric: fwd/scatter_err
        relative: best
      - above: 20.0
        anneal:
          min: fwd/scatter_err
        boost: replay
        metric: replay/scatter_err
    bwd_sampling_mode: prior
    deactivate_threshold: 0.01
    exit:
    - above: 0.95
      metric: fwd/r2
      patience: 2
    flags:
      buffers_active: true
    fracs:
      bwd: 0.001
      fwd: 0.799
      replay: 0.2
    loss_coeffs:
      bwd:
        tb: 1.0
      fwd:
        tb: 1.0
    min_fracs:
      bwd: 0.001
      fwd: 0.02
      replay: 0.02
    name: buildout
    on_exit:
    - snapshot:fwd_calibrated
    train_mode: fused
  - balance:
      anneal_coeffs:
        bounding_coeff:
          target: 10.0
        reduction_coeff:
          target: 10.0
      default_boost:
        fwd: 0.1
        replay: 0.9
      kind: lexicographic
      rules:
      - above: 0.5
        abs: true
        boost: fwd
        metric: fwd/tb_resid_clipped
      - below: 0.9
        boost: replay
        metric: fwd/r2
      - above: 8.0
        anneal:
          min: 1.0
        boost: bwd
        metric: bwd/relative_under
      - above: 8.0
        boost: replay
        metric: fwd/over_coverage
    bwd_sampling_mode: prior
    deactivate_threshold: 0.001
    flags:
      buffers_active: true
    loss_coeffs:
      bwd:
        tb: 1.0
      fwd:
        freeze_policy: 1.0
        tb: 1.0
    min_fracs:
      bwd: 0.01
      fwd: 0.0009
      replay: 0.0009
    name: terminal
    train_mode: fused
