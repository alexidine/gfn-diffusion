# mipcas elj T=10 PRIOR-ONLY pretrain -- DERIVED from stab_july21c/base_elj.yaml
# (not hand-maintained; regenerate via scratchpad/gen_prior_config.py).
# Purpose: bake one reusable, decoupled prior model. Protocol truncated to
#   train_prior -> done; the prior is written by train_prior's on_exit
#   snapshot_prior, then 'done' idles. Stop after the '-> done' log line.
# Reuse: consumers must reference this SAME prior_path string (problem_def
#   keys on it) and set reuse_prior:true or prior_model_name to the file.
#   Item-5 (train_T stamping) makes them sample it at T=10 whatever their own T.
# Run (from energy_sampling, csd_mxt_gfn venv,
#   PYTHONPATH=...\mxtaltools;...\gfn_diffusion):
#   python train.py --config configs/mipcas_elj_prior_T10.yaml
run_name: mipcas_elj_prior_T10
tag: prior_pretrain
seed: 12345
device: cuda
cuda_memory_fraction: 0.9
anomaly_detection: false
continue_from_checkpoint: false
mlip_path: null
prior_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt
molecules_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt
test_molecules_path: null
checkpoints_dir: C:\Users\mikem\Projects\mxt_gfn\gfn_diffusion\energy_sampling\checkpoints
checkpoint_name: null
prior_model_name: null
reuse_prior: false
load_weights_only: true
override_learning_rates: false
lr_policy: 0.0001
min_lr: 1.0e-06
lr_flow: 0.1
lr_back: 0.0001
lr_replay: 0.0001
lr_fused: 0.0001
lr_warmup_ratio: 100
adaptive_lr:
  enabled: true
  warmup_steps: 1000
  hold_steps: 10000
  decay_halflife_steps: 20000
  decay_floor_scale: 0.05
  cut_loss_abs: 2500.0
  cut_grad_abs: 7500.0
  reset_loss_abs: 25000.0
  reset_grad_abs: 75000.0
  cut_ratio: 0.5
  fire_cooldown_steps: 500
  recovery_target_frac: 0.5
  recovery_wait_steps: 3000
  recovery_ramp_steps: 1000
  control_flow_lr: false
weight_decay: 0.0001
use_weight_decay: false
compile_policy: auto
gradient_norm_clip: 250.0
grad_clip_guard:               # adaptive clip bar, per step_type, tracking a quantile of that branch's pre-clip grad norms
  enabled: true                # false -> the bar is gradient_norm_clip, unchanged
  p: 0.99                      # target quantile; the bar binds on 1-p of steps
  eta: 0.01                    # log-space step of the bar per observation
  warmup_steps: 100            # observations per branch before the tracked bar takes over
  warmup_clip: static          # bar until then: static = gradient_norm_clip, off = no clip
  max_ratio: 100.0             # furthest the bar may travel from its last calibration, either direction
  refresh_on_stage: true       # recalibrate at stage transitions, holding the outgoing bar live
ema_decay: null
model:
  full_flow: false
  s_emb_dim: 512
  t_dim: 64
  harmonics_dim: 64
  condition_embedding_dim: 16
  t_hidden_dim: 512
  s_hidden_dim: 512
  s_layers: 4
  policy_hidden_dim: 512
  policy_layers: 4
  flow_hidden_dim: 512
  flow_layers: 4
  cond_hidden_dim: 512
  cond_layers: 4
  dropout: 0
  norm: layer
  zero_init: false
  t_scale: 0.05
  log_var_range: 6
  pb_drift_range: 0.4
  pb_var_range: 6
  learn_pb: true
  learned_variance: true
  clipping: true
  gfn_clip: 200.0
  periodic_centroids: true
  dplr_rank: 6
  dplr_rho_max: 0.5
  dplr_mask_angular: true
buffer_device: cuda
batch_size: 1000
grow_batch_size: true
max_batch_size: 20000
batch_growth_factor: 1.65
batch_growth_interval: 50
batch_growth_slow_interval: 300
auto_batch_throughput_opt: true
batch_growth_min_throughput_gain: 0.05  # samples/sec gain a jump must clear to be kept -- a SATURATION detector. opt-steps/sec = samples_per_sec / grad-accum target, so this maximises optimizer-step throughput; step time does not enter. MUST be < batch_growth_factor-1 (0.65 here): at or above it a factor-f jump can never deliver the demanded gain, so every jump is rejected and the batch FREEZES at batch_size
gpu_util_window_s: 900  # trailing window for the gpu/util_recent metric. DIAGNOSTIC ONLY -- nothing in the trainer acts on occupancy: batch size does not move it on the MLIP route (measured, umaperf0812)
gpu_util_sample_period_s: 60  # wall-clock seconds between occupancy samples. Time-based, not per-N-steps: a step-based cadence cannot fill a 900 s window at 200 s/step, which is how the metric came to be absent on exactly the slow MLIP arms it was there to watch
gpu_util_policy_window_s: 7200  # the window the CLUSTER averages over when deciding to cancel. Logged as gpu/util_policy so the number the scheduler judges is visible in wandb
batch_knee_recheck_steps: 2000
oom_batch_shrink_factor: 0.5
oom_cooldown_steps: 200
eval_num_samples: 10000
fused_grad_accum_min_samples: 1000
epochs: 100000
eval_period: 250
figs_period: 250
eval_T: 10
integrator:
  T: 10
  min_traj_length: 10
  max_traj_length: 10
  traj_length_strategy: static
  discretizer_max_ratio: 15
  discretizer: uniform
fwd_loss_coeffs:
  tb: 0.0
  freeze_policy: 0.0
  freeze_z: 0.0
  vg_lb: 0.0
  vg_lme: 0
  vg_by_condition: 0.0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  traj_grads: 0.0
  reward_grads: 0.0
  repeats: 1.0
  loss_clip: 1000000000.0
  beta: 10.0
bwd_loss_coeffs:
  tb: 0.0
  freeze_policy: 0.0
  freeze_z: 1.0
  vg_lb: 0
  vg_lme: 0
  vg_by_condition: 1.0
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  mle: 0.0
  tbc: 0.0
  repeats: 1.0
  traj_grads: 1.0
  loss_clip: 1000000000.0
  beta: 10.0
replay_loss_coeffs:
  tb: 1.0
  freeze_policy: 0.0
  freeze_z: 1.0
  vg_lb: 0
  vg_lme: 0
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  mle: 0.0
  repeats: 1.0
  traj_grads: 0.0
  loss_clip: 1000000000.0
  beta: 10.0
condition_log_z:
  min_visits: 20
  half_life_steps: 7.0
  trim_frac: 0.1
  max_batch_weight: 200.0
  discovery_half_life_steps: 200.0
  fwd_tb_z_source: learned
  bwd_tb_z_source: learned
  replay_tb_z_source: learned
  mol_sampling_weighted_by_z_gap: true
  mol_sampling_z_gap_clip_quantile: 0.99
  mol_sampling_z_gap_temperature: 0.5
  mol_sampling_uniform_beta: 0.5
mle_slope_t: 2.0
mle_min_rate: 0.05
mle_slope_window: 300
protocol:
  stages:
  - name: train_prior
    train_mode: bwd
    bwd_sampling_mode: dataset
    skip_if: prior_loaded
    flags:
      update_log_z: true
      scramble_conditions: true
      mle_gate: true
    loss_coeffs:
      bwd:
        mle: 1.0
        tbc: 1.0
        repeats: 2.0
    exit:
    - metric: gates/mle_flat
      above: 0.5
      patience: 5
    - metric: eval/wass_debiased
      below: 0.015
    - metric: bwd/tbc
      below: 2.0
    on_exit:
    - snapshot:phase1_exit
    - snapshot_prior
  - name: done
    train_mode: bwd
    bwd_sampling_mode: dataset
    flags:
      update_log_z: true
      scramble_conditions: true
    loss_coeffs:
      bwd:
        mle: 1.0
        tbc: 1.0
        repeats: 2.0
controller:
  min_mode_frac: 0.001
  beta: 0.025
  deactivate_threshold: 0.01
  refresh_every: 10
  decay_rate: 0.95
  anneal_patience: 5
  lookahead_horizon: 5
  lookahead_trend_alpha: 0.1
terminal_logw_std: 1000.0
terminal_box_violation: 1.0
r2_worst_quantile: 0.0
buffers:
  prior_buffer:
    seed_source: prior_dataset
    mean_lifetime: 100
    churn_batch_ref: 1000
    min_size: 10000
    max_size: 250000
    condition_block_m: 2
    reward_min: -600
    ramp_floor: 100
    ramp_width: 50
  replay_buffer:
    random_churn_rate: 50
    max_size: 10000
  anchor_buffer:
    seed_source: prior_dataset
    max_size: 200000
    dup_cutoff: 0.05
    screen_energy_window: 20
    thin_energy_window: 50
    surprise_cutoff: -5
    confirm_cutoff: -5
    confirm_k: 5
    health_gate_r2: 0.9
    health_gate_zerr: 0.5
    replay_beta: 0.5
    thin_every_n_evals: 5
    refresh_every_n_evals: 5
    noise_log_range:
    - -2.5
    - -1.5
    topup_admit_record_breakers: true
    reach_quantile: 0.9
    reach_threshold: 0.75
    reach_topup_size: 1000
energy_function: elj
temperature_conditioning: false
molecule_conditioning: false
sg_conditioning: false
space_groups:
- 2
zp_conditioning: false
z_primes:
- 1
vector_conditioning: false
vector_conditioning_dim: 3
energy_config:
  internal_oom_recovery: true
  temperature: 2.5
  log_temperature_range:
  - 0
  - 0.693147
  density_coeff: 10.0
  bounding_coeff: 1.0
  reduction_coeff: 1.0
  lj_coeff: 1.0
  reward_range: 500
  analyze_kwargs: {}
