    stages:
    - bwd_sampling_mode: dataset
      exit:
      - above: 0.5
        metric: gates/mle_flat
        patience: 5
      - below: 0.015
        metric: eval/wass_debiased
      - below: 2.0
        metric: bwd/tbc
      flags:
        scramble_conditions: true
        update_log_z: true
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 2.0
          tbc: 1.0
      mle_gate:
        min_rate: 0.05
        slope_t: 2.0
        window: 300
      name: train_prior
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
      lr_sensor:
        kind: plateau
        metrics:
        - bwd/mle
        factor: 0.5
        patience: 60
        cooldown: 10
    - balance:
        alpha: 0.01
        default_boost:
          bwd: 0.5
          fwd: 0.5
        drive: relative
        floor: 0.1
        kind: proportional
        metrics:
          bwd: bwd/logw_std_within
          fwd: fwd/logw_std_within
        pinned:
          replay: 0.0
        targets:
          bwd: 1.0
          fwd: 1.0
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      fracs:
        bwd: 0.5
        fwd: 0.5
        replay: 0.0
      loss_coeffs:
        bwd:
          beta: 80
          level_gap: 1.0
          repeats: 2.0
          vg_lb: 1.0
        fwd:
          beta: 10
          emp_z: 1.0
          repeats: 2.0
          vg_by_condition: 1.0
          vg_lb: 1.0
      name: var_conditioning
      on_enter:
      - rebuild_prior_by_churn
      train_mode: fused
      lr_sensor:
        kind: plateau
        metrics:
        - fwd/vg_lb
        - bwd/vg_lb
        factor: 0.5
        patience: 60
        cooldown: 10
