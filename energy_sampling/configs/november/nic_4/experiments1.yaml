defaults:
  base: base.yaml


# check variance, pb, temperature, energy clip, batch size, lr
experiments:
- tag: 0
  update:
    T: 50
    eval_T: 50
    energy_clip: 10
    energy_static_temperature: 1.0
    max_batch_size: 2000
    log_var_range: 4
    pb_drift_range: 0.2
    pb_var_range: 2
    learn_pb: true
    learned_variance: true

