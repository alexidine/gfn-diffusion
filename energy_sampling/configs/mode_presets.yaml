# ============================================================================
# SCALING REFERENCE -- controller/LR terms vs model width W (the model.*_hidden_dim
# fields) and rollout length T (integrator.T / eval_T). Derived from the loss/grad
# structure: get_tb_loss (gflownet_losses.py) and _forward_kernel, which is re-run
# with the SAME weights at every one of the T steps (models/gfn.py). Anchor is the
# validated W=512 / T=25 mk_dev.yaml state. These are SEEDS -- re-derive the grad
# bars and the LR ceiling from an actual healthy run's medians/fires, exactly as the
# adaptive_lr block in mk_dev.yaml already prescribes.
#
# THE ONE DISTINCTION everything follows from:
#   TB residual  delta = logZ + sum_t(logPF - logPB) - logR   is INTENSIVE.
#     T is discretization over a FIXED [0,1] horizon, so delta converges to its
#     continuous (Girsanov) limit as T grows; heads are bounded (tanh logvar,
#     gfn_clip), so delta is width-independent too. => loss-space bars never scale.
#   Raw grad  d(delta)/d(theta) = sum_t d(...)/d(theta) through SHARED weights is
#     EXTENSIVE: grows with T (sum over T reuses) and with W (~sqrt(W), more params).
#     => grad-space bars and the LR ceiling DO scale.
#
# RULES (relative to the W512/T25 anchor):
#   lr_fused, lr_policy, lr_replay (TB/fused peak):  x 25/T
#     a weight step perturbs all T reuses of theta, and the effect on delta
#     compounds (coherent-error end, amplified by on-policy feedback), so the
#     detonation ceiling ~1/T EVEN under Adam. THE knob -- 1e-4 fused detonated
#     at T=25 (tpkdbegv).
#   lr_back in the phase-1 MLE stage:                x sqrt(25/T)
#     MLE has no on-policy/reward compounding, tolerates a higher LR than TB.
#     BUT lr_back is shared with the anchor_seed/z_match bwd-TB stages, which
#     want the 1/T end -- lean cooler when those are the binding stage.
#   lr_flow (Z head):                                x 1   (T- and W-flat)
#     Z's gradient is 2*delta (intensive); already pinned via control_flow_lr:false.
#   gradient_norm_clip (+ the grad bars riding it):
#       x [grad_median(T) / 6.6e3] x sqrt(W/512)
#     grad_median(T): T=10 ~1e3, T=25 ~6.6e3, T=40 ~9e3, T=100 ~1.7e4 (mipcas runs;
#     log-interpolate between tabulated points for an untabulated T). Keep the
#     ratios cut_grad_abs = 30x clip, reset_grad_abs = 10x cut_grad, so one number
#     drives all three.
#   cut_loss_abs / reset_loss_abs:                   x 1   (T- and W-flat)
#   Huber beta, fracs, deactivate/min_mode_frac:     x 1   (act on intensive delta,
#     or dimensionless)
#   step-denominated safety timings (warmup_steps, fire_cooldown_steps,
#     recovery_*):                                   x 1   (a step is a step;
#     excursion drain is LR-independent). Only CONVERGENCE timings (hold_steps,
#     decay_halflife_steps, epochs) stretch ~inversely with the LR cut, to keep
#     total weight travel constant.
#
# WIDTH past ~2x: the sqrt(W) on the LR rows is a STANDARD-parametrization artifact.
# Move to per-layer LR groups (muP -- give the hidden matrices a 1/W group) and the
# LR rows go W-flat; only the clip keeps its sqrt(W) (it reads the raw pre-Adam grad).
# A vanishing global LR with width means you are fighting std-param with one scalar,
# not hitting a real ceiling.
#
# ----------------------------------------------------------------------------
# QUICK RESCALE CHECKLIST -- every mk_dev.yaml key that MOVES with (W, T), its
# rule, and the current W256/T40 result. Anchor = W512/T25, factor_T = 25/T.
# Copy the result column, recompute for the new (W,T), paste. Any key NOT listed
# here is (W,T)-invariant -- leave it.
#
# AUTOMATED: the LR + clip + tripwire-bar rows below are computed by
# utils.py resolve_derived_config() whenever the mk_dev key is set to `auto`
# (their current state) -- that function is the executable source of truth, and
# this checklist documents the same formulas. So a W/T change now means editing
# ONLY the primitives: the model *_hidden_dim fields (W) and integrator.T +
# eval_T (T); the auto rows recompute at load (logged at startup). Set a key to
# an explicit number to override the resolver for that one key.
#
#   MODEL WIDTH W -- set ALL of these equal (mk_dev model:):
#     s_emb_dim, t_hidden_dim, s_hidden_dim, policy_hidden_dim,
#     flow_hidden_dim, cond_hidden_dim                          [W256 -> 256]
#     (t_dim, harmonics_dim, condition_embedding_dim, *_layers stay fixed)
#
#   ROLLOUT LENGTH T -- set both equal (keep eval_T == train T):
#     integrator.T, eval_T                                      [T40 -> 40]
#
#   LRs (x factor_T = 25/T off the anchor; W-FLAT -- do NOT scale with W):
#     lr_policy = lr_replay = lr_back = 1e-4 * 25/T             [-> 6.25e-5]
#       (lr_back rides the 1/T end, shared with anchor_seed/z_match bwd-TB)
#     lr_fused  = 5e-5 * 25/T                                   [-> 3.1e-5]
#     lr_flow   = UNCHANGED (T/W-flat): 1e-4 conditional net / 0.1 uncond scalar
#     min_lr, lr_warmup_ratio                                   UNCHANGED
#
#   GRAD CLIP + BARS (clip carries the ONLY sqrt(W) term):
#     gradient_norm_clip = 250 * [grad_median(T)/6.6e3] * sqrt(W/512)  [-> ~175]
#     cut_grad_abs   = 30 * clip                               [-> 5.25e3]
#     reset_grad_abs = 10 * cut_grad_abs                       [-> 5.25e4]
#     cut_loss_abs 2.5e3 / reset_loss_abs 2.5e4                UNCHANGED (intensive)
#     Huber beta, fracs, min_fracs, deactivate                UNCHANGED
#
#   CONVERGENCE TIMINGS (x T/T_old vs the file you scale FROM, to hold total
#   weight-travel constant as the LR moves; SOFT -- approximate is fine):
#     hold_steps, decay_halflife_steps          [T100->T40: x0.4 -> 4000, 8000]
#     warmup_steps, fire_cooldown_steps, recovery_*  UNCHANGED (a step is a step)
# ----------------------------------------------------------------------------
#
# WORKED SEEDS (anchor = validated W512/T25):
#   W256  / T40 :  lr_fused 3.1e-5  lr_policy 6.25e-5 clip ~175   cut_grad 5.25e3 cut_loss 2.5e3   (lr_back/lr_replay 6.25e-5; reset_grad 5.25e4; current mk_dev.yaml)
#   W512  / T25 :  lr_fused 5e-5    lr_policy 1e-4    clip 250    cut_grad 7.5e3  cut_loss 2.5e3
#   W1024 / T100:  lr_fused ~1.5e-5 lr_policy 2.5e-5  clip ~900   cut_grad 2.7e4  cut_loss 2.5e3
#   W2048 / T250:  lr_fused ~5e-6   lr_policy 1e-5    clip ~2000  cut_grad 6e4    cut_loss 2.5e3
#     T250 clip is extrapolated past the documented medians -- reseed from a real run.
#     Note the big/long case bottoms at ~5e-6, NOT ~5e-8: 1/T is bounded (T is
#     resolution you stop refining once discretized error hits its floor) and muP
#     removes the width term, so LRs stay well above min_lr 1e-6.
# ============================================================================
