# Reference only -- never loaded by train.py. Records the mk_dev.yaml key
# values for each mode combination actually run, so switching modes is a
# lookup instead of a git-diff archaeology exercise. Update this file
# whenever mk_dev.yaml's mode-defining keys change for a mode that's on
# record here, or add a new column for a mode combination not yet listed.
#
# Two independent axes:
#   conditioning: unconditional | conditional
#   domain:       molecule (real crystal physics) | toy (latent_* energy fn)
#
# Keys NOT listed here (scramble_conditions, the anchor_seed stage and its
# seed_prior_from_anchors action, the fwd/r2_within + fwd/r2_worst gate keys)
# are mode-safe as of 2026-07-21: they no-op or fall back correctly when
# vector_conditioning/molecule_conditioning are both false, so they don't
# need to change between modes and are left as-is in mk_dev.yaml.
#
# A SCALING REFERENCE (controller/LR terms vs model width W and rollout length
# T) is at the BOTTOM of this file -- how the anchor values below should move
# when integrator.T or the model hidden dims change.

unconditional_molecule:
  # last run as elj/mipcas single-molecule, pre-2026-07-21 toy-2cond switch
  lr_flow: 0.1  # flow_model is LearnableScalar (unconditional) -- convex 1-D, O(lr) jitter only at this LR
  prior_path: 'D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt'
  molecules_path: 'D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt'
  model.periodic_centroids: true
  energy_function: 'elj'
  space_groups: [ 2 ]
  vector_conditioning: false
  vector_conditioning_dim: 3
  molecule_conditioning: false
  energy_config.temperature: 2.5
  energy_config.analyze_kwargs: { }
  buffers.anchor_buffer.seed_source: 'prior_dataset'

conditional_toy:
