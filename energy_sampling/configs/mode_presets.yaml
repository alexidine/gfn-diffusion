  lr_flow: 1.0e-4  # flow_model is a real network (scalarMLP) -- match lr_fused/lr_policy, not the unconditional scalar's 0.1 (cazwlyy1: 0.1 detonated Z(c))
  prior_path: 'D:\crystal_datasets\conditional\priors\toy_2cond_manif_prior.pt'
  molecules_path: 'D:\crystal_datasets\conditional\priors\toy_2cond_manif_conditions.pt'
  model.periodic_centroids: false
  energy_function: 'latent_multiharmonic'
  space_groups: [ 1 ]
  vector_conditioning: true
  vector_conditioning_dim: 2
  molecule_conditioning: false
  energy_config.temperature: 1.0
  energy_config.analyze_kwargs: {
    cond_dim: 2,
    n_core: 1,
    n_ghost: 0,
    sigma_range: [ 0.04, 0.12 ],
    aniso_scale: 0.0,
    depth_range: [ 0.0, 4.0 ],
