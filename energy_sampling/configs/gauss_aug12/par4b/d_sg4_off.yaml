protocol:
  stages:
  - name: train_prior
    train_mode: bwd
    bwd_sampling_mode: dataset
    skip_if: prior_loaded
    flags:
      update_log_z: true
      scramble_conditions: true
      mle_gate: true
    loss_coeffs:
      bwd:
        mle: 1.0
        tbc: 1.0
        repeats: 2.0
    exit:
    - metric: eval/wass_debiased
      below: 0.015
    - metric: bwd/tbc
      below: 2.0
    on_exit:
    - snapshot:phase1_exit
    - snapshot_prior
    lr_sensor:
      kind: none
  - name: equilibration
    train_mode: fused
    bwd_sampling_mode: prior
    flags:
      update_log_z: true
      buffers_active: true
    on_enter:
    - rebuild_prior_by_churn
    - bootstrap_z:train_conditioner
    fracs:
      fwd: 0.05
      bwd: 0.45
      replay: 0.5
    min_fracs:
      fwd: 0.02
      bwd: 0.25
      replay: 0.05
    deactivate_threshold: 0.01
    loss_coeffs:
      fwd:
        tb: 1.0
        freeze_policy: 1.0
      bwd:
        tb: 1.0
        beta: 80
      replay:
        tb: 1.0
        beta: 80
    balance:
      kind: ratio
      pinned:
        fwd: 0.05
      metrics:
        replay: fwd/over_coverage
        bwd: bwd/relative_under_wcen
      numerator: replay
      setpoint: 5.0
      gain: 0.05
      max_step: 0.05
      bounds:
        replay:
        - 0.05
        - 0.6
      converge_floor: 1.0
    buffer_servo:
      numerator: replay/ema_loss_mean
      denominator: replay/birth_loss_mean
      bar: 0.368
      release: 0.6
      scale: 0.15
      gain: 0.05
      relax: 0.5
      max_step: 0.05
      max_boost: 8.0
    lr_sensor:
