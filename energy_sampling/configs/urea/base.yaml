run_name: 'urea'
seed: 12345
device: 'cuda'
lr_policy: 0.001              # learning rate of the policy network
min_lr: 1.0e-6                # ihn
lr_flow: 0.1                  # learning rate of the flow network
lr_back: 0.001                # learning rate of the backward pass
scheduler: True               # does LR warmup from max/100 -> max -> 1e-6 over the warmup and annealing period
lr_warmup_time: 500
lr_anneal_time: 10000
weight_decay: 1e-7
use_weight_decay: false
gradient_norm_clip: 1.0        # gradient norm clip for updating gfn model weights

# model parameters
zero_init: true

joint_layers: 4              # number of layers in forward/backward policy models
hidden_dim: 256              # dimensionality of hidden layer
s_emb_dim: 32                # dimensionality of state embedding
t_emb_dim: 32                # dimensionality of time embedding
harmonics_dim: 64            # dimensionality of harmonic embedding
condition_emb_dim: 12         # dimensionality of the conditioning embedding
dropout: 0.1                   # dropout probability
norm: 'layer'                   # null, "layer", "batch"

batch_size: 25               # number of samples per training batch
grow_batch_size: true        # whether to dynamically grow the batch size to fill the RAM
max_batch_size: 500           # maximum batch size to allow
eval_batch_size: 500        # batch size for evaluation
epochs: 1000000             # number of training epochs: relatively large
eval_period: 500              # how often to do evaluation & reporting
figs_period: 500             # how often to log custom figrues  # must be multiple of eval_period or it won't fire
buffer_size: 25000          # size of replay buffer

# GFlowNet settings
T: 10                        # static training diffusion length
eval_T: 100                  # diffusion trajectory length for inference
min_traj_length: 10
max_traj_length: 20
traj_length_strategy: sampled # 'static'  or 'sampled'  will do random between min and max traj lengths
discretizer_max_ratio: 0.5    # maximum ratio between randomly sampled step sizes
discretizer: 'random'        # 'random' 'low_discrepancy' 'equidistant' 'uniform'
t_scale: 1.0                 # scales fixed forward policy variance
log_var_range: 0.5           # controls dynamic range of learned policy variance, when (-1) there is no fixed range or tanh containment
pb_scale_range: 0.5          # range of learned backward policy corrections, only for 'brownian_bridge'
energy: "molecular_crystal"  # "molecular_crystal"
mode_fwd: "tb"               # "tb" is trajectory balance, "vg" is VarGrad
mode_bwd: "tb"               # "tb" is trajectory balance, "vg" is VarGrad
repeats: 5                  # for conditional VarGrad training
both_ways: false             # forward and backward training
bwd_batch_multiplier: 5      # ratio of backward to foward batch size (much cheaper to evaluate)
fwd_train_each: 2            # on which multiples of training iter to train the fwd train model instead of bwd
bwd: false                   # backward training only
learn_pb: true               # whether to learn a correction to the backward policy in 'brownian_bridge' mode
conditional_flow_model: false #  conditional training (currently doing temperature)
learned_variance: true       # whether to learn policy variance
partial_energy: false
clipping: true  # clip the maximumstep size induced by the policy model
gfn_clip: 10.0  # clip the maximumstep size induced by the policy model

# local search settings
################################################################
#buffer_path: 'D:/crystal_datasets/urea_gfn_dataset.pt'
#molecules_path: 'D:/crystal_datasets/test_qm9_dataset.pt'

buffer_path: '/scratch/mk8347/csd_runs/datasets/urea_gfn_dataset.pt'
molecules_path: '/scratch/mk8347/csd_runs/datasets/test_qm9_dataset.pt'

# replay buffer / dataset settings
################################################################
beta: 0.1             # reward prioritized replay sampling: high beta = steep prioritization
rank_weight: 1.0     # rank-based replay sampling: low rank_weight = steep prioritization
prioritized: "boltzmann"   # three kinds of replay training: random, reward prioritized, rank-based
sampling: "buffer"

################################################################

# exploration controls
exploratory: True       # adds variance to optionally learned logvars
exploration_factor: 0.5  # initial exploration value
exploration_wd: True  # decay exploration over time
wd_max_steps: 10000  # number of steps to terminate the added variance


# molecular crystal settings
################################################################
# scales the energy function
energy_function: crystal_multiharmonic
  # 'latent_harmonic' : unimadal harmonic potential in the latent space
  # 'crystal_harmonic': unimodal harmonic potential in the crystal space
  # 'latent_multiharmonic': multimodal harmonic potential in the latent space
  # 'crystal_multiharmonic': multimodal harmonic potential in the crystal space
  # 'ellipsoid_overlap' : minimize ellipsoid overlaps subject to energy_density_coeff external pressure
  # 'silu_energy' : minimize a softened LJ-tye energy subject to energy_density_coeff external pressure
anneal_energy: true  # scale temperature over time, when conditional it scales the distribution, when not it just decreases from static to min
energy_density_coeff: 10  # how much to weight the density penalty term in the energy function
temperature_conditioning: false  # if false, temperatures are set to energy_static_temperature, and there is no annealing
energy_min_temperature: 0.01
energy_max_temperature: 1
energy_static_temperature: 1  # for certain evaluations
temperature_scaling_factor: 0.01  # controls relative frequency of higher vs lower temperatures (higher -> higher)
annealing_max_steps: 5000  # time for scaling_factor to reach 1 (uniform sampling from min to max)
energy_clip: 100

# deprecated or un-used
max_iter_ls: 100                # DEPRECATED # how many iterations to run local search
samples_per_opt: 10             # DEPRECATED #how many noisy samples to take near each optimized minimum
burn_in: 100                    # DEPRECATED # NOT USED IN MXTAL how many iterations to burn in before making local search
ls_cycle: 100                   # DEPRECATED # how frequently to make local search
ld_step: 0.1                    # DEPRECATED # langevin step size
ld_schedule: true               # DEPRECATED # whether to use scheduled langevin step size
target_acceptance_rate: 0.574   # DEPRECATED # target acceptance rate for local search
langevin: false
langevin_scaling_per_dimension: false
lgv_clip: 100.0
lgv_layers: 4
eval: false
pis_architectures: false # false goes to our custom architectures, which are better for training bigger models
subtb_lambda: 2              # subtb currently deprecated
local_search: false             # DEPRECATED we now combine preloaded and sampled elements into a single buffer
energy_annealing_threshold: 1.0e-1 # UNUSED
convergence_history: 100  # UNUSED
bwd_policy: 'brownian_bridge'       # 'brownian_bridge' or 'gaussian'
