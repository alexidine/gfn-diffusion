defaults:
  base: base.yaml


# scan over model sizes

experiments:
  - tag: 0_baseline
    update:
      fwd_loss_coeffs:
        tb: 1.0
        vg_lb: 0.0
        vg_lme: 0.0  # exclusive with vg_lb
        greedy: 0
        mle: 1.0
        smoothed: 0
        var: 1.0  # penalize forward policy for crowded samples
        var_gamma: 0.1  # smaller -> longer range repulsion
        buffer: 0.0  # penalize forward policy for sampling near samples already in the buffer
        buffer_gamma: 1.0  # smaller -> longer range repulsion
      bwd_loss_coeffs:
        tb: 0.0
        vg_lb: 0.0
        vg_lme: 1.0 # exclusive with vg_lb
        mle: 1.0
        smoothed: 0

  - tag: 1_var_10
