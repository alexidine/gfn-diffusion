defaults:
  base: base.yaml

experiments:
  - tag: 0_greedy_var_bmle
    update:
      joint_layers: 8
      hidden_dim: 512
      s_emb_dim: 512
      norm: null
      dropout: 0
      fwd_loss_coeffs:
        tb: 0.0
        vg_lb: 0.0
        vg_lme: 0.0  # exclusive with vg_lb
        greedy: 1.0
        mle: 0.0
        smoothed: 0
        var: 10.0  # penalize forward policy for crowded samples - this and buffer will anneal on expl timescale
        var_gamma: 0.05  # smaller -> longer range repulsion
        var_cutoff: 2.0  # variance below which to penalize
        buffer: 0.0  # penalize forward policy for sampling near samples already in the buffer
        buffer_gamma: 1.0  # smaller -> longer range repulsion
      bwd_loss_coeffs:
        tb: 0.0
        vg_lb: 0.0
        vg_lme: 0.0 # exclusive with vg_lb
        mle: 1.0
        smoothed: 0
    notes: decent coverage, good clustering, good energies

