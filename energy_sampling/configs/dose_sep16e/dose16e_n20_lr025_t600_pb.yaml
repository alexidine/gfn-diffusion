    - balance:
        anneal_coeffs:
          lambda_mix:
            rate: 0.8
            target: 1.0
        anneal_cooldown_steps: 1000
        default_boost:
          bwd: 0.5
          replay: 0.5
        kind: lexicographic
        rules:
        - boost:
            bwd: 0.5
            replay: 0.5
          drift: 0.001
          if_missing: violated
          margin: 1.1
          metric: fwd/r2_unexplained
          relative: best
        - boost:
            bwd: 0.5
            replay: 0.5
          drift: 0.001
          if_missing: violated
          margin: 1.1
          metric: bwd/r2_unexplained
          relative: best
      bwd_sampling_mode: prior
      condition_draw:
        conditions: 0
        pick: uniform
        prior_rows: 2
        replay_rows: 2
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        weighted_bwd_sampling: false
        weighted_condition_sampling: false
      fracs:
        bwd: 0.5
        fwd: 0.0
        replay: 0.5
      fwd_rollout_every: 20
      fwd_rollout_triggers:
        drift_std_max: 0.0
        ess_min: 0.0
        occupancy_min_batches: 0.0
        val_gap_max: 0.0
      fwd_z_sidecar: true
      hot_lr_sensor:
        above: 3.0
        channel: bwd/logw_std_within
        rows: 11
      loss_coeffs:
        bwd:
          condition_block_m: 0
          level_gap: 0.0
          repeats: 1.0
          tb: 0.0
          tb_z_source: persistent
          vg_lb: 0.0
        fwd:
          emp_z: 1.0
          freeze_policy: 1.0
          pooled_beta: 40.0
          pooled_ratio: 0.5
          pooled_source: replay
          pooled_vg: 1.0
          repeats: 2.0
          tb: 0.0
          tb_z_source: persistent
          vg_by_condition: 1.0
          vg_lb: 0.0
        replay:
          condition_block_m: 0
          tb: 0.0
          tb_z_source: persistent
          vg_by_condition: 1.0
      min_fracs:
        fwd: 0.0
      name: var_conditioning
      on_enter:
      - rebuild_prior_by_churn
      - set_lr_flow:1.0e-4
      - freeze_pb
      replay_warmup_rows: 20000
      train_mode: fused
      z_pin_rollout_every: 0
  unconditional_tb:
    stages:
    - bwd_sampling_mode: dataset
      exit:
      - above: -1000000000.0
        metric: bwd/mle
        patience: 1
      flags:
        scramble_conditions: true
        update_log_z: true
      hot_lr_sensor:
        above: 5.0
        channel: bwd/mle
        form: absolute
        rows: 31
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 1.0
          tbc: 0.0
      name: train_prior
      on_exit:
      - snapshot_prior
      train_mode: bwd
    - balance:
        bar: 0.0
        bounds:
          bwd:
          - 0.7
          - 0.7
          replay:
          - 0.3
          - 0.3
        down: 0.006
        guard: bwd
        kind: gated_ramp
        metric: bwd/under_coverage_rise150
        pinned:
          fwd: 0.0
        ramp: replay
        ratchet_cooldown_steps: 500
        ratchet_metric: bwd/under_coverage
        ratchet_release_tol: 0.25
        ratchet_tol: 0.5
        up: 0.004
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        z_calibration: false
      fracs:
        fwd: 0.0
        bwd: 0.7
        replay: 0.3
      fwd_rollout_every: 20
      fwd_rollout_triggers:
        drift_std_max: 0.0
        ess_min: 0.0
        occupancy_min_batches: 2.0
        val_gap_max: 0.0
      hot_lr_sensor:
        above: 2.0
        channel: fwd/scatter_err
        rows: 11
      loss_coeffs:
        bwd:
          beta: 80
          tb: 1.0
        fwd:
          freeze_policy: 1.0
          tb: 1.0
        replay:
          beta: 80
          tb: 1.0
      name: equilibration
      on_enter:
