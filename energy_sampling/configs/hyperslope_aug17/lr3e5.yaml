        slope_t: 1.0
        window: 100
      name: train_prior
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
    - balance:
        alpha: 0.01
        default_boost:
          bwd: 0.5
          fwd: 0.5
        drive: relative
        floor: 0.1
        kind: proportional
        metrics:
          bwd: bwd/logw_std_within
          fwd: fwd/logw_std_within
        pinned:
          replay: 0.0
        targets:
          bwd: 1.0
          fwd: 1.0
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      exit:
      - below: 6.0
        metric: fwd/logw_std_within
        patience: 5
      - below: 3.0
        metric: bwd/logw_std_within
        patience: 5
      flags:
        buffers_active: true
        update_log_z: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      fracs:
        bwd: 0.5
        fwd: 0.5
        replay: 0.0
      loss_coeffs:
        bwd:
          condition_block_m: 2.0
          level_gap: 0
          repeats: 1.0
          tb_z_source: persistent
          vg_lb: 1.0
        fwd:
          emp_z: 1.0
          repeats: 2.0
          tb_z_source: persistent
          vg_by_condition: 1.0
          vg_lb: 1.0
        replay:
          tb_z_source: persistent
      lr_sensor:
        beta: 0.05
        cos_target: 0.0
        kind: hyper
      name: var_conditioning
      on_enter:
      - rebuild_prior_by_churn
      - set_lr_flow:1.0e-4
      on_exit:
      - snapshot:var_conditioned
      train_mode: fused
  unconditional_tb:
    stages:
    - bwd_sampling_mode: dataset
      exit:
      - above: 0.5
        metric: gates/mle_flat
        patience: 5
      - below: 0.015
        metric: eval/wass_debiased
      - below: 2.0
        metric: bwd/tbc
