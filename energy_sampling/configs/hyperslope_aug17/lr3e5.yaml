        update_log_z: true
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 2.0
          tbc: 1.0
      lr_sensor:
        beta: 0.1
        kind: hyper
        cos_target: 0.0
      mle_gate:
        min_rate: 0.05
        slope_t: 2.0
        window: 300
      name: train_prior
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
    - balance:
        bounds:
          bwd:
          - 0.02
          - 0.93
          replay:
          - 0.02
          - 0.93
        converge_floor: 1.0
        gain: 0.05
        kind: ratio
        max_step: 0.05
        metrics:
          bwd: bwd/relative_under_wcen
          replay: fwd/over_coverage
        numerator: replay
        pinned:
          fwd: 0.05
        setpoint: 5.0
      buffer_servo:
