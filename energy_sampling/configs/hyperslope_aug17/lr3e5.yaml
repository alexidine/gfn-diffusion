        release: 0.6
        scale: 0.15
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        z_calibration: true
      fracs:
        bwd: 0.45
        fwd: 0.05
        replay: 0.5
      loss_coeffs:
        bwd:
          beta: 80
          tb: 1.0
        fwd:
          freeze_policy: 1.0
          tb: 1.0
        replay:
          beta: 80
          tb: 1.0
      lr_sensor:
        kind: ray
      min_fracs:
        bwd: 0.02
        fwd: 0.02
        replay: 0.02
