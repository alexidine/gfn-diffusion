defaults:
  base: base.yaml

#General comments
# warmup could be more gentle, I think
# need better tools to analyze mode coverage and exploitation
# rotaions & rotation embedding analysis are not 360-aware
# buffer analysis also needs to be finer grained - these quantiles are not precise enough
# think we need to watch for big updates
# less frequent reporting could be good
# most runs fwd TB plot has too low slope
# log Z learning should perhaps not be included in off-policy training
# lr annealing could maybbe be slower?
# need also straightforward distributional metrics
# reward beta is where its at
# expl schedule makes a huge difference in coverage and learning dynamics
# need to handicap or control variance learning somehow. Currently too wild.
# CONDITIONAL RUNS FAILED
# large models learn more flexibly, but seem to take too-large optimization steps / saturate ranges immediately

experiments:
  - tag: 0_tb
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
    notes: somewhat edgy. Good, though not perfect correlations. Good densities, but never exploited low basins

  - tag: 1_tb_smoothing
    update:
      fwd_loss_coeffs:
        tb: 1
        smoothed: 1
      bwd_loss_coeffs:
        tb: 1
        smoothed: 1
    notes: different opt behaviour. a bit smoother as well, I guess. Very std normal. Poor exploitation

  - tag: 2_tb_vg
    update:
      fwd_loss_coeffs:
        tb: 1
        vg_lme: 1
      bwd_loss_coeffs:
        tb: 1
        vg_lme: 1
    notes: lowish density, but actually continuously improving

  - tag: 3_tb_mle
    update:
      fwd_loss_coeffs:
        tb: 1
        mle: 1
      bwd_loss_coeffs:
        tb: 1
        mle: 1
    notes: terrible for a long time, then quickly switched to merely not good. Interesting - early phase was a variance collapse, then a later regrowth. Was improving actually

  - tag: 4_tb_greedy
    update:
      fwd_loss_coeffs:
        tb: 1
        greedy: 1
      bwd_loss_coeffs:
        tb: 1
    notes: awful, then improving very fast (from poor baseline) before cancelling. Greedy is clearly gradient distorting

  - tag: 5_vg
    update:
      fwd_loss_coeffs:
        vg_lme: 1
      bwd_loss_coeffs:
        vg_lme: 1
    notes: slightly better energies

  - tag: 6_tb_fwd_mle_bwd
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        mle: 1
    notes: slightly better energies. kindof blah

  - tag: 7_tb_vg_greedy
    update:
      fwd_loss_coeffs:
        tb: 1
        vg_lme: 1
        greedy: 1
      bwd_loss_coeffs:
        tb: 1
        vg_lme: 1
    notes: slightly better energies, kindof blah

  - tag: 8_vg_mle
    update:
      fwd_loss_coeffs:
        vg_lme: 1
        mle: 1
      bwd_loss_coeffs:
        vg_lme: 1
        mle: 1
    notes: much better samples, little diffuse. One mode collapsed

  - tag: 9_tb_expl_.25
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      exploration_factor: 0.25
    notes: slightly better samples, lower log z

  - tag: 10_tb_expl_1
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      exploration_factor: 1
    notes: better log z, slower learning, improving, little diffuse

  - tag: 11_tb_expl_perm
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      exploration_wd: false
    notes: never converges - consistently terrible

  - tag: 12_tb_expl_short
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      wd_max_steps: 2500
    notes: better energies faster, worse log z

  - tag: 13_tb_expl_medium
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      wd_max_steps: 5000
    notes: crashed early

  - tag: 14_tb_low_beta
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      beta: 0.01
    notes: not a big difference

  - tag: 15_tb_high_beta
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      beta: 1
    notes: much better energies - best in the battery by far, and still improving

  - tag: 16_tb_rank_buffer
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      prioritized: 'rank'
    notes: weird - very bad, then good and slowly impoving

  - tag: 17_tb_small_range
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      log_var_range: 1.0
    notes: bit worse

  - tag: 18_tb_large_pb
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      pb_scale_range: 0.5
    notes: very bad, then improving, then diffuse, then crashed - wacky variance variations vs. time

  - tag: 19_tb_small_pb
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      pb_scale_range: 0.1
    notes: small difference. Policy is stiffer I guess

  - tag: 20_vg_lb
    update:
      fwd_loss_coeffs:
        vg_lb: 1
      bwd_loss_coeffs:
        vg_lb: 1
    notes: small difference

  - tag: 21_tb_special_1
    update:
      lr_policy: 0.0001
      lr_back: 0.0001
      fwd_loss_coeffs:
        tb: 1
        smoothed: 1
      bwd_loss_coeffs:
        mle: 1
        smoothed: 1
      beta: 1
    notes: one of the best. Excellent fwd loss. Slow improvement, slightly diffuse, low learned log Z

  - tag: 22_vg_mle_aggressive_expl
    update:
      fwd_loss_coeffs:
        vg_lme: 1
        mle: 1
      bwd_loss_coeffs:
        vg_lme: 1
        mle: 1
      beta: 1
      exploration_factor: 1.0
    notes: wacky... maybe iimproving by the end? Hard to say really. Big learned var swings

  - tag: 23_vg_mle_cond
    update:
      fwd_loss_coeffs:
        vg_lme: 1
        mle: 1
      bwd_loss_coeffs:
        vg_lme: 1
        mle: 1
      temperature_conditioning: true
      anneal_energy: true
      annealing_max_steps: 10000
    notes: crashed very early

  - tag: 24_vg_cond
    update:
      fwd_loss_coeffs:
        vg_lme: 1
      bwd_loss_coeffs:
        vg_lme: 1
      temperature_conditioning: true
      anneal_energy: true
      annealing_max_steps: 10000
    notes: crashed very early

  - tag: 25_vg_lb_cond
    update:
      fwd_loss_coeffs:
        vg_lb: 1
      bwd_loss_coeffs:
        vg_lb: 1
      temperature_conditioning: true
      anneal_energy: true
      annealing_max_steps: 10000
    notes: crashed very early

  - tag: 26_tb_small
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      hidden_dim: 128
      s_emb_dim: 128
    notes: more linear/stiff learning. diffuse samples though

  - tag: 26_tb_big
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      hidden_dim: 1024
      s_emb_dim: 1024
    notes: very high losses from which we never recover. Pinned variance extrema immediately (bad)

  - tag: 27_tb_small_var
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      t_scale: 0.01
    notes: kindof blah

  - tag: 28_tb_small_var_big_range
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      t_scale: 0.01
      log_var_range: 8.0
    notes: terrible, then crashed. Actually not really sure why dynamics look OKish

  - tag: 29_tb_big_range
    update:
      fwd_loss_coeffs:
        tb: 1
      bwd_loss_coeffs:
        tb: 1
      log_var_range: 8.0
    notes: terrible, then crashed - extreme pinning