# silu annealing
# mle

# notes
# cancelled for low usage
# some reporting issues
# low T gets low energies but collapses badly
# larger model collapses faster
# total var grows over time - interesting
# clusters don't form measurably until T~0.1
# large model goes to low effective dim quickly
# angular dims are somewhat dubious

experiments:
  - tag: 0_baseline
    update:
      joint_layers: 4
      hidden_dim: 256
      s_emb_dim: 256
      fwd_loss_coeffs:
        tb: 1.0
        vg_lb: 0.0
        vg_lme: 0.0  # exclusive with vg_lb
        greedy: 0
        mle: 0.0
        smoothed: 0
      bwd_loss_coeffs:
        tb: 0.0
        vg_lb: 0.0
        vg_lme: 1.0 # exclusive with vg_lb
        mle: 0.0
        smoothed: 0
      beta: 1.0
      exploration_factor: 1.0
      wd_max_steps: 5000
      anneal_temperature: false
      anneal_repulsion: false
      lj_repulsion: 0.85
      ellipsoid_scale: -0.5
      energy_min_temperature: 0.01
      energy_max_temperature: 10
      energy_static_temperature: 1
      temp_annealing_max_steps: 10000
      repulsion_annealing_max_steps: 10000
    notes:

