defaults:
  base: base.yaml

# single-molecule search
# testing the depth/breadth tradeoff


experiments:
- tag: 0_baseline
  update:
    joint_layers: 4
    hidden_dim: 512
    s_emb_dim: 512
    condition_emb_dim: 512
    dropout: 0.1
    norm: layer
    max_batch_size: 2000
    fwd_loss_coeffs:
      tb: 0.1
      vg_lme: 0
      emp_z: 0
      greedy: 1.0
      reinforce: 0
    bwd_loss_coeffs:
      tb: 0.0
      vg_lme: 0.1
      emp_z: 0
      mle: 1.0
    prior_coverage_cutoff: 0.75
    prior_coverage_ratio: 0.05
    learn_pb: false
    learned_variance: false
    beta: 1.0
    buffer_diversity_coeff: 1.0
    anneal_repulsion_cutoff: 0.5

