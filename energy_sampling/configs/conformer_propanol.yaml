# Propanol on the internal-DoF ladder. Separate from conformer_dev.yaml, which is
# user-owned and stays on butanol.
#
# WIDTHS (CCCO, N=12, 3N-6=30):
#   torsion    d= 1    one collective column; the C-C bond. Methyl and hydroxyl spins are
#                      excluded, so this is a ONE-dimensional problem -- which makes it the
#                      cheapest possible end-to-end check, since brute_force_grid gives
#                      exact log Z, E_p[log R] and an exact Boltzmann draw at d=1.
#   dihedral   d= 9    all phi
#   flex       d=19    theta + phi
#   full       d=30    the target
#
# LEVEL STATUS after ladder step 2 (the change of measure is in the energy):
#
#   torsion  -- correct, AND checkable: d=1 here, so brute_force_grid gives exact log Z.
#               This is the validation rung. Ships as the default for that reason.
#   dihedral -- correct. No quadrature past k=3, so relative diagnostics only.
#   flex     -- correct for a SINGLE molecule. The BAT term is state-dependent here and is
#               carried; what is still reference-based is the force field, which makes
#               log Z depend on the RDKit embedding seed -- harmless for one molecule, not
#               for comparisons across them (step 3).
#   full     -- same. Also the hardest sampling problem: the uniform-on-box prior puts
#               ~300 kcal/mol of strain into every bwd terminal (11 bond lengths uniform
#               over +/-0.3 A at k ~ 300-500), so expect a very wide log-weight spectrum
#               until the prior layer is fitted rather than uniform.
#
# Raising `level` is now a real choice rather than a correctness error. Note that log Z
# MOVED at step 2 -- propanol/torsion went 1.8292 -> 4.7918, exactly the constant log J of
# 2.9626 -- so any reference number recorded before that is not comparable.
run_name: 'conformer_propanol_torsion'
tag: 'ladder1'
seed: 0
device: 'cuda'
wandb_mode: 'online'
num_threads: 2

# Problem
################################################################
problem:
  smiles: 'CCCO'
  level: 'torsion'             # REQUIRED; no default anywhere. See the header.
  epsilon: 0.1                 # LJ well depth, kcal/mol
  log_temperature: 0.0         # energy() returns E / 10**log_temperature
  min_separation: 3            # nonbonded pairs >= 3 bonds apart (1-2, 1-3 excluded)
  scale_14: 0.5                # epsilon multiplier for separation-3 pairs
  lj_k_factor: 2.5             # soft-core exponential stiffness below sigma
  include_trivial_rotations: false   # exclude methyl / amine / hydroxyl rotations
  # Box for the LINEAR blocks. Inert at torsion/dihedral (no linear block is free), and
  # checked at construction: if the box reaches past the physical domain the run refuses
  # to start rather than letting the clamp bind permanently inside the wall.
  delta_r_max: 0.30            # A, half-width of the r box about the reference
  delta_theta_max: 0.50        # rad, half-width of the theta box
  bounding_coeff: 10.0         # wall stiffness, pre-multiplied by temperature
  r_floor: 0.50                # A; hard clamp, the DOMAIN GUARANTEE (not the wall)
  theta_floor: 1.0e-3          # rad; theta clamped to (floor, pi-floor)

# Integrator
################################################################
integrator:
  T: 32

# Model
################################################################
model:
  policy_hidden_dim: 128
  policy_layers: 3
  s_emb_dim: 128
  harmonics_dim: 128
  t_dim: 128
  flow_hidden_dim: 128
  flow_layers: 2
  t_scale: 0.05               # sigma_step must stay << the wrap period
  zero_init: true
  clipping: true
  gfn_clip: 1.0e+4

# Optimizers
################################################################
# EXPLICIT, never `auto`: `auto` means SERVO-MANAGED and this route configures no
# ray_calibration block, so `auto` here is a hard config error rather than a silent pin.
# These are conformer_dev's values at T=32.
lr_policy: 7.8125e-05
lr_back: 7.8125e-05
lr_replay: 7.8125e-05
lr_fused: 3.90625e-05
lr_flow: 1.0e-1
min_lr: 1.0e-6
lr_warmup_ratio: 100
gradient_norm_clip: 1.0
grad_clip_guard:               # adaptive clip bar, per step_type, tracking a quantile of that branch's pre-clip grad norms
  enabled: true                # false -> the bar is gradient_norm_clip, unchanged
  p: 0.99                      # target quantile; the bar binds on 1-p of steps
  eta: 0.01                    # log-space step of the bar per observation
  warmup_steps: 100            # observations per branch before the tracked bar takes over
  warmup_clip: static          # bar until then: static = gradient_norm_clip, off = no clip
  max_ratio: 100.0             # furthest the bar may travel from its last calibration, either direction
  refresh_on_stage: true       # recalibrate at stage transitions, holding the outgoing bar live
weight_decay: 1.0e-4
use_weight_decay: false

adaptive_lr:
  warmup_steps: 200
  divergence_loss_abs: 1.0e+9
  divergence_grad_abs: 1.0e+9
  divergence_cut: 0.5

# Training
################################################################
training:
  steps: 200000
  batch_size: 256
  grow_batch_size: true
  max_batch_size: 4096
  batch_growth_factor: 1.65
  batch_growth_interval: 50
  batch_growth_slow_interval: 300
  auto_batch_throughput_opt: true
  batch_growth_min_throughput_gain: 0.05
  gpu_util_window_s: 900
  gpu_util_sample_period_s: 60
  gpu_util_policy_window_s: 7200
  exploration_std: 0.0
  buffer_path: null
  bwd_frac: 0.5
  # A fitted InternalPrior for the backward terminals, drawn per-DoF in this energy's own
  # spec numbering. Unusable at `torsion` (collective columns are not invertible row-wise;
  # use prior_states_path there), and only PARTLY effective above it -- see the finding
  # about sibling dihedrals: 7 of propanol's 9 tree dihedrals share one C(sp3)-C(sp3)
  # histogram and get independent draws, which destroys the +/-120 deg offsets that
  # tetrahedral geometry locks. Median energy with it is ~320 kcal/mol against ~330 for
  # uniform; rigidly coupling siblings instead gives ~73. Left null until that is settled.
  internal_prior_path: null
  prior_seed: 0

# Evaluation
################################################################
eval:
  report_every: 250
  figs_period: 500
  # d=1 at torsion, so quadrature is exact and cheap. It goes dark the moment `level`
  # passes `torsion` here (k>3), which is the ladder's permanent condition, not a bug.
  brute_force_grid: 512
  out: 'conformer_propanol_run.json'
