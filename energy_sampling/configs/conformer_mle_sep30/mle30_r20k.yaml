protocol: conformer_conditional_tb
protocols:
  conformer_conditional_tb:
    stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: weights_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
        scramble_conditions: false
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
          tb_z_source: persistent
      exit:
      - metric: gates/progress_done
        above: 0.5
        patience: 1
      max_steps: 200000
      on_exit:
      - snapshot:phase1_exit
    - name: tb_conditioning
      train_mode: fused
      bwd_sampling_mode: prior
      hot_lr_sensor:
        channel: bwd/logw_std_within
        rows: 11
        above: 3.0
      flags:
        update_log_z: true
        buffers_active: true
        weighted_bwd_sampling: false
        weighted_condition_sampling: false
        z_calibration: false
      on_enter:
      - rebuild_prior_by_churn
      - set_lr_flow:1.0e-4
      - freeze_pb
      fracs:
        fwd: 0.5
        bwd: 0.5
        replay: 0.0
      min_fracs:
        fwd: 0.02
      deactivate_threshold: 0.01
      fwd_rollout_every: 0
      z_pin_rollout_every: 0
      fwd_rollout_triggers:
        occupancy_min_batches: 0.0
        val_gap_max: 0.0
        drift_std_max: 0.0
        ess_min: 0.0
      fwd_z_sidecar: false
      replay_warmup_rows: 0
      coeff_schedule: {}
      loss_coeffs:
        fwd:
          tb: 1.0
          freeze_policy: 0.0
          freeze_z: 0.0
          repeats: 1.0
          beta: 80.0
          tb_z_source: persistent
          emp_z_persistent: 1.0
          reward_grads: 1.0
          path_grad_last_k: 1
          path_grad_scale: 1
        bwd:
          tb: 1.0
          freeze_z: 1.0
          repeats: 1.0
          beta: 80.0
          tb_z_source: persistent
        replay:
          tb: 1.0
          freeze_z: 1.0
          repeats: 1.0
          beta: 80.0
          tb_z_source: persistent
      balance:
        kind: lexicographic
        default_boost:
          fwd: 0.5
          bwd: 0.5
        rules:
        - metric: fwd/logw_std_within
          relative: best
          margin: 1.5
          drift: 0.005
          if_missing: violated
          boost:
            fwd: 0.5
            bwd: 0.5
        - metric: bwd/logw_std_within
          relative: best
          margin: 1.5
          drift: 0.005
          if_missing: violated
          boost:
            fwd: 0.5
            bwd: 0.5
  conformer_unconditional:
    stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
      exit:
      - metric: gates/progress_done
        above: 0.5
        patience: 1
      max_steps: 20000
      on_exit:
      - snapshot:phase1_exit
    - name: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      hot_lr_sensor:
        channel: fwd/scatter_err
        rows: 11
        above: 2.0
      flags:
        update_log_z: true
        buffers_active: true
        z_calibration: false
      on_enter:
      - rebuild_prior_by_churn
      - bootstrap_z:rollout:4000
      fracs:
        fwd: 0.0
        bwd: 0.9
        replay: 0.1
      deactivate_threshold: 0.01
      fwd_rollout_every: 20
      z_pin_rollout_every: 0
      fwd_rollout_triggers:
        occupancy_min_batches: 2.0
        val_gap_max: 0.0
        drift_std_max: 0.0
        ess_min: 0.0
      loss_coeffs:
        fwd:
          tb: 1.0
          freeze_policy: 1.0
        bwd:
          tb: 1.0
          beta: 80
        replay:
          tb: 1.0
          beta: 80
      balance:
        kind: gated_ramp
        ramp: replay
        guard: bwd
        pinned:
          fwd: 0.0
        metric: bwd/under_coverage_rise150
        bar: 0.0
        ratchet_metric: bwd/under_coverage
        ratchet_tol: 0.5
        ratchet_release_tol: 0.25
        ratchet_cooldown_steps: 250
        up: 0.004
        down: 0.006
        bounds:
          bwd:
          - 0.25
          - 0.9
          replay:
          - 0.1
          - 0.75
