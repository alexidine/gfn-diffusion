experiments:


- tag: 14__2_noise
  update:
    norm: layer
    hidden_dim: 1024
    s_emb_dim: 1024
    condition_emb_dim: 1024
    joint_layers: 4
    lr_policy: 0.0001
    lr_back: 0.0001
    max_fwd_batch_size: 250
    max_bwd_batch_size: 2500
    T: 50
    eval_T: 50
    t_scale: 0.05
    log_var_range: 6
    pb_var_range: 2
    pb_drift_range: 0.2
    learn_pb: true
    anchor_noise_level: 0.2
    energy_static_temperature: 2.5
    energy_function: 'uma'


