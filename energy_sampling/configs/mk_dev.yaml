# Freeze a step-tagged copy of 'running' every N steps (0/null = off). The
# single-stage protocol fires no on_exit snapshots, so 'running' and 'best' are
# the only saves, both rewritten in place under a run_name every run shares --
# a relaunch destroys the previous run's state within minutes. Both the model
# state and the buffer sidecar are HARDLINKED off bytes already on disk, so an
# archive costs no write I/O; it does retain the old inodes, so disk grows
# ~910MB per archive (~30MB model + ~880MB buffers) = ~13GB/day at this cadence.
# Buffers are included because they are part of the DYNAMICS -- a stale replay
# buffer acts as hidden state -- so a branch point without them is not the same
# run state.
archive_period: 5000
archive_buffers: true
checkpoint_name: vargrad_island.pt  # v8 PREVENTION ARM (2026-07-29 ~10:40): the full handoff replayed under the v7 fwd/bwd coverage controller + residual VG 0.15, from the island. v7/b52sxexb (rescue arm, from v6_settled.pt) confirmed the controller's causal authority mid-run; its rescued state is preserved as v7_rescued.pt + _buffers.pt. v6_settled.pt + _buffers.pt = v6/m2kxf4vg at ~43.5k (mid-stage resume: no transition/tween). vargrad_island.pt -- the VarGrad stability island: copy of the block_m-6 + level_gap soak run's running.pt at step 16850 (stage var_conditioning, fracs 0.686/0.314, all VG-era state: own best written 18:42, fresh lr schedule) + vargrad_island_buffers.pt sidecar. Resuming from it passes the 6.0/3.0 exit gates within ~patience ticks -> REAL transition into naive (LR rearm, on_enter rebuild, on_exit snapshot:var_conditioned). oscbench_hwvz06zx_vg50c.pt = the pre-VG oscillating start (remap: stage/fracs/lr_ctrl/combo reset)  # DEFAULT: train_prior's own exit snapshot, so a resume replays that transition straight into the 'naive' stage with the broad MLE policy in hand and nothing localized. For a MID-STAGE intervention instead (skips the first ~3k steps and lands already inside naive, so on_enter does NOT re-run and the prior buffer is kept as-is), point this at a copy of a run's _running.pt with its sidecar copied alongside as <name>_buffers.pt -- checkpoints/zsrc_intervene.pt + _buffers.pt is one such snapshot (8oz5frdi at step ~4500), kept for that purpose  # OLD NOTE: the prior buffer is kept as-is -- the only delta vs that run is bwd/replay_tb_z_source. Swap back to ..._phase1_exit.pt for a clean full-route run  # OLD: dev_mk_dev_latent_multiharmonic-toy_big_unif_prior-T1-87913f_phase1_exit.pt  # RESUME POINT for the naive route: train_prior's own exit snapshot, so the resume replays that transition straight into the 'naive' stage (broad MLE policy in hand, nothing localized). Was ..._z_matched.pt for the staged route  # OLD NOTE: the thermalize->z_match pre-transition snapshot (request_eval stamped, so the transition replays through the normal eval path under the edited config). Swap back to ..._prior.pt + load_weights_only: true for a fresh BROAD-ROUTE ENTRY: warm-start the policy FROM the phase-1 MLE prior. reuse_prior separately reloads this same file as the frozen sampling prior and skips train_prior -- but that skip is sampling-only and leaves the policy random, which is wrong here: thermalize's premise is backward TB starting from the broad prior policy. Set to null + load_weights_only false to retrain phase 1 from scratch. NB a full (load_weights_only: false) resume off an older _best.pt will now ABORT -- those checkpoints carry stage 'buildout'/'anchor_seed', which this protocol no longer defines #dev_mk_dev_latent_multiharmonic-toy_2cond_conn_prior-T1-90a45e_running.pt
prior_model_name: null  # fresh toy problem: reuse_prior auto-refinds {run_name}_{problem_slug}_prior.pt once train_prior has run
# prior_model_name loads a SEPARATE frozen GFN used only for prior-buffer sampling. It is rebuilt from its
# own stored gfn_config, so it may be any architecture/conditioning (only the problem TARGET must match --
# mol_cond/temp_cond are exempt from the compatibility check) and it never touches the live policy's
# weights. To ALSO warm-start the policy from it, point checkpoint_name at the same file with
# load_weights_only: true (requires matching architecture).
reuse_prior: true  # if true and prior_model_name is null, auto-reload this run's own saved prior checkpoint ({run_name}_{problem_slug}_prior.pt) as the frozen prior model, provided its stored problem_def matches this config exactly (stricter than prior_model_name: no conditioning exemption -- the file was written under this same identity). A fresh run then skips the warm-start stage via skip_if: prior_loaded, exactly as if the path were given; missing/mismatched checkpoint = train phase 1 normally (which re-saves it). Policy weights/optimizers/buffers untouched -- warm-starting stays explicit via checkpoint_name + load_weights_only
load_weights_only: false  # if true, checkpoint_name loads just the model/EMA weights into an otherwise-fresh run - optimizers, buffers, metrics, and phase/step state all initialize from scratch
# (no override_loss_coeffs any more: checkpoints carry only the stage name; live
# coefficients always re-derive from this config's protocol block on resume)
override_learning_rates: false  # if true, overwrite just the numeric LR restored from a resumed checkpoint's optimizers with this config's lr_* values - warmup/anneal status and Adam momentum buffers are left as-is

#Optimizers
################################################################
lr_policy: auto              # PEAK policy LR (v6 controller: scale ramps to 1.0 == this and never exceeds). auto -> resolve_derived_config = 1e-4 * 25/T, W-flat. Explicit number = override (mipcas A/B edges 7.5e-5 flat-stable / ~3e-4 edge were T=25; toys more forgiving)
min_lr: 1.0e-6                # ihn
# NB comments on this block were lost and reconstructed from the live run's
# wandb config (2hl21ziu) plus train.py::z_calibration_tick -- VALUES are the
# originals, the notes are not.
# Interspersed Z-only calibration: extra Z optimizer steps per policy step.
# Expected steps/train step = min(gain * (sensor/threshold - 1),
# max_steps_per_step), Bernoulli on the fractional part. Frequency-modulated,
# never size-modulated, so every step is an ordinary Adam step at the live
# flow LR. Silent when disabled, inside the deadband, cold, mid-accumulation,
# or in a scramble_conditions stage.
z_calibration:
  enabled: false             # overkill falsification complete: oscillation survived 9x mean-pinned Z; machinery retired to hygiene duty (huber + grad_rms + low cap) if ever re-enabled
  mode: rollout              # rollout = fresh fwd rollout under freeze_policy, TB's own Z gradient (no estimator mismatch, costs a rollout + energy call); regression = ~free fit onto tracker ema_logw, benchmark it against rollout
  unclipped: true            # OVERKILL EXPERIMENT: z-step tb loss run at beta 1e6 = exact MSE (fixed point -> arithmetic mean, tails at full influence) with loss_clip disabled in the copy; gradient_norm_clip on flow params is the only backstop. Pair with sensor: rms (bias is the MSE loss's own first-order condition)
  sensor: rms                # rms = rms_z_bias(), unclipped stream: the aligned sensor under unclipped: true | grad_rms = rms_z_grad(), clipped stream: aligned when unclipped: false (huber) | worst = worst_z_bias(sensor_quantile) | pooled = |EMA fwd/tb_resid_clipped|
  sensor_quantile: 0.5
  threshold: 0.1             # deadband: no steps while sensor <= this. 0.1 sits BELOW rms_z_bias's estimator-noise floor (~1-2 nats) -> deadband decorative, dose runs at max_steps_per_step permanently (the overkill semantics). huber pairings: grad_rms 0.75, rms 1.0, pooled 0.5
  gain: 1.0
  max_steps_per_step: 8.0    # the operative dose dial while threshold is unreachable: 8 z-rollouts per fused step = 9x on-policy fwd data
  min_visits: null
  freshness_half_life_steps: 300.0
  se2_floor: 0.25
  holdout_modulus: 8         # regression mode only
lr_flow: 1.0e-4              # learning rate of the flow network. UNCONDITIONAL mode: flow_model is LearnableScalar (convex 1-D, O(lr) jitter only at this LR). Conditional mode: flow_model is a real Z(c) network trained by Adam -- use 1.0e-4 (match lr_fused/lr_policy; cazwlyy1: log_Z_learned diverged within ~10 steps of live Z(c) training at 0.1). See mode_presets.yaml
lr_back: auto                # backward-pass LR. auto -> resolve_derived_config = 1e-4 * 25/T (the 1/T end, binding for anchor_seed/z_match bwd-TB; MLE tolerates the higher 1/sqrt(T) end but is skipped when a prior is loaded). Explicit number = override
lr_replay: auto               # trajectory-replay LR. auto -> resolve_derived_config = 1e-4 * 25/T, W-flat. Explicit number = override
lr_fused: auto                # PEAK fused fwd/bwd/replay LR. auto -> resolve_derived_config = 5e-5 * 25/T, W-flat (5e-5 = the T=25 documented ceiling; mipcas 1e-4 fused detonated, tpkdbegv). Explicit number = override. NB: 1e-4 (3.2x auto at T=40) was tried for the VG stage and came back noisier-and-worse -- the jitter floor scales with LR
lr_warmup_ratio: 100           # how much smaller the initial (warmup) LR should be than the peak
# v6 LR controller (controller.py LRController). Radical simplification of v5:
# the configured LRs are a FIXED PEAK (scale <= 1.0 always -- the v5 probe/
# coherence climb measured update AGREEMENT, which stayed honestly positive
# straight into detonations, aijrfwuy/s706frkh, and is gone entirely), a basic
# per-stage ramp -> hold -> decay schedule, and two-tier ABSOLUTE tripwires
# (no medians, no relative bars -- the floored-median bars fired on
# clip-neutralized steps when the median rode the floor, and went blind when a
# sustained incident raised the median, s706frkh). ALL durations below are in
# TRAIN STEPS -- the schedule is a pure function of steps-since-stage-start,
# so the controller's own evaluation cadence (every 10 steps) can never change
# what a config value means. The schedule restarts at every stage transition
# (rearm_warmup). enabled: false pins scale flat at 1.0; the tripwires run
# regardless. lr_ctrl state ver=6 invalidates any v1-v5 checkpoint state.
adaptive_lr:
  enabled: true                # true = ramp/hold/decay schedule; false = flat at configured LRs. Tripwires are unconditional either way.
  # --- schedule (per stage, in TRAIN STEPS) ---
  warmup_steps: 1000           # blind exponential ramp 1/lr_warmup_ratio -> 1.0, at run start and after every stage transition (rebuilt optimizers must not land at the peak on cold Adam moments)
  hold_steps: 4000            # train steps at scale 1.0 (the peak) before decay begins
  decay_halflife_steps: 8000  # exponential decay half-life after the hold; 0/null = hold at 1.0 forever. Decay buys back the late-run precision the LR jitter floor otherwise caps (phase-1 study: wass/MLE floors at the operating LR were weight jitter, not capacity)
  decay_floor_scale: 0.05      # decay stops at this scale (min_lr still floors the absolute LR per group)
  # --- FIRE: two-tier absolute tripwires on branch loss + pre-clip grad norm ---
  # cut tier = parameter thrash: LR cut in place, no rewind (training state is
  # intact, just too hot). reset tier = true explosion (tb err at +1e4 scale,
  # or non-finite): rewind to best + cut. s706frkh's bars (healthy losses
  # 1.5-176, healthy pre-clip grads 10-750, clip 100) were measured at
  # integrator.T=10; grad_norm_pre_clip is T-extensive (per-step variance
  # mismatch summed over the rollout: T=10 baseline median ~1e3, T=25 ~6.6e3,
  # T=100 ~1.7e4 across mipcas runs tpkdbegv/3t8kvb8f/asazfhqk/m69c7iuz), so
  # for this file's current T=100 the grad bars are the T=25 bars scaled by
  # 1.7e4/6.6e3 (~2.6x, the documented median ratio). The LOSS bars are NOT
  # scaled with T: loss is the batch mean of the per-trajectory squared TB
  # residual, T is discretization over a fixed diffusion horizon, so the
  # residual converges to its continuous-time limit rather than growing with T
  # -- loss bars keep their T=25 values. Revisit if integrator.T changes, and
  # re-derive from an actual healthy T=100 window once one is on record.
  # MEASURED on the broad route (c17erxo7, thermalize): healthy bwd loss ~25-38,
  # NOT the thousands I first budgeted for. The reason is structural -- the
  # policy enters thermalize as the phase-1 MLE prior, so P_F ~= mu by
  # construction and the backward residual starts small. (The huge-residual
  # case belongs to the LOCALIZED route, where the buffer is flushed to a
  # target the policy has never seen.)
  # The one legitimately large residual on this route is the z_match handoff:
  # the measured J_b - J_f gap at thermalize is ~150 nats (eval_fwd/tb_err_worst
  # 160 vs bwd 9.8), and the Huber far-field loss is ~beta * |resid|, so expect
  # a fwd entry loss ~1.5e3 at the fixed beta 10. This bar sits ~3x above that
  # and ~200x above the healthy backward loss.
  # The grad tripwire (cut_grad_abs, auto = 30 * gradient_norm_clip = 1.03e4
  # here, vs observed pre-clip grads 60-135) is the other half of the
  # protection and is unaffected by a large-but-honest residual.
  cut_loss_abs: 5.0e+3         # branch loss above this = thrash -> cut
  cut_grad_abs: auto         # pre-clip grad norm above this = thrash -> cut. auto -> resolve_derived_config = 30 * gradient_norm_clip. Explicit = override
  reset_loss_abs: auto       # true explosion -> rewind + cut. auto -> resolve_derived_config = 10 * cut_loss_abs. Explicit = override
  reset_grad_abs: auto       # true explosion -> rewind + cut. auto -> resolve_derived_config = 10 * cut_grad_abs. Explicit = override
  cut_ratio: 0.5               # multiplicative cut per fire; cuts compound across fires. Instance-held (rewind-proof), reset to 1.0 at stage transitions
  fire_cooldown_steps: 500     # min train steps between finite fires on one channel -- gives a post-cut/post-rewind state time to re-synchronize instead of machine-gunning (s706frkh's 18-fire loop ran at exactly the old 100-step cooldown). Non-finite readings ignore it. NB a fire also LATCHES its channel's cut tier until the metric recrosses below the cut bar (g8d8se26: 4 tail fires on one excursion's grad drain compounded 0.25 -> 0.01); reset tier + non-finite ignore the latch
  # --- RECOVERY: re-ramp after a cut instead of keeping it for the stage ---
  # g8d8se26: cut correct at step ~2400, then 24k of 27k steps pinned at the
  # 0.01 floor with grads 30-50x under the bar and metrics still slowly
  # climbing at kill. A fire during recovery cuts from the current level and
  # re-records the firing level, so repeat detonations ratchet the cruise
  # target down (AIMD) rather than sawtoothing at the ceiling.
  recovery_target_frac: 0.5    # cruise at this fraction of the cut factor that was running at the last fire (0 = no recovery, cuts are stage-permanent)
  recovery_wait_steps: 3000    # COLD train steps (no fires AND every monitored reading below its cut bar) before the re-ramp starts -- a latched channel simmering between the bars blocks recovery indefinitely rather than being ramped back into (the drain after g8d8se26's caught excursion took ~600 steps; LR cuts do not accelerate it -- LR is the trigger, not the sustainer)
  recovery_ramp_steps: 1000    # exponential re-ramp duration from the cut level to the cruise target
  control_flow_lr: false       # false (default): flow/Z-head groups PINNED at lr_flow, exempt from scaling (the schedule has no sensor mandate over Z; scaling it ran the Z head ~20x under design, ylmtpqjy). true = uniform scaling, for A/B
weight_decay: 1.0e-4
use_weight_decay: false
compile_policy: auto           # torch.compile the dense policy trunk (t/s encoders, fwd/bwd policies, flow) with inductor kernel fusion (default mode; CUDA graphs are incompatible with the T-times-per-rollout module re-invocation pattern) -- the fused loop is launch-overhead-bound (~30% GPU util at batch 2500 locally), this is the lever. 'auto' = Linux+CUDA only (inductor has no CUDA support on native Windows, so dev boxes stay eager); true/false force it. Compile errors degrade to eager with a warning rather than crashing. Recompiles on every new batch size, so prefer grow_batch_size: false alongside it
traj_checkpoint: false         # gradient-checkpoint each rollout step (recompute activations in backward): trajectory activation memory ~O(1) in T instead of O(T), at ~1 extra policy forward per step. Values/gradients identical to false (verified bitwise incl. RNG stream); false = exact legacy behavior
gradient_norm_clip: auto        # policy grad-norm clip. auto -> resolve_derived_config = 250 * grad_median(T)/6.6e3 * sqrt(W/512). Explicit number = override
ema_decay: null #0.95  # set to null for no ema # NOTE this breaks some important statistics - leave as null for now

# model parameters
################################################################
model:
  full_flow: false           # true for subtb or db losses
  # shared dimensions
  s_emb_dim: 512             # dimensionality of state embedding
  t_dim: 64                   # dimensionality of time embedding
  harmonics_dim: 64           # dimensionality of harmonic embedding
  condition_embedding_dim: 16  # dimensionality of the conditioning embedding
  # per-sub-model architecture
  t_hidden_dim: 512          # time encoder hidden dim
  s_hidden_dim: 512          # state encoder hidden dim
  s_layers: 4                 # state encoder layers
  policy_hidden_dim: 512     # forward/backward policy hidden dim
  policy_layers: 4            # forward/backward policy layers
  flow_hidden_dim: 512       # flow model hidden dim
  flow_layers: 4              # flow model layers
  cond_hidden_dim: 512       # conditioning embedding hidden dim
  cond_layers: 4              # conditioning embedding layers
  # regularization (shared)
  dropout: 0                  # dropout probability
  norm: layer                 # null, "layer" - DON'T PUT 'batch'
  zero_init: false
  # SDE params
  t_scale: 0.05               # scales fixed forward policy variance
  log_var_range: 6            # controls dynamic range of learned policy variance
  pb_drift_range: 0.4         # range of learned backward drift corrections
  pb_var_range: 6             # range of learned backward policy variance
  learn_pb: true              # whether to learn a correction to the backward policy
  learned_variance: true      # whether to learn policy variance
  clipping: true              # clip the maximum step size induced by the policy model
  gfn_clip: 200.0             # clip value for policy step size
  # Wrap the aunit centroid dims whose aunit spans the full cell width (auv == 1), so the SDE
  # flows through the aunit face instead of piling up against the bounding-energy wall -- which
  # is where real probability mass tends to bunch, precisely because that face is an artificial
  # cut rather than a physical one. The aunit is NOT periodic in general (crossing a face
  # usually re-enters through a symmetry op, e.g. P21/c at y=1/4); at auv == 1 the wrap is a
  # whole-cell lattice translation, so it is safe for every space group. Axes are resolved per
  # space group and intersected over `space_groups` (models/aunit_periodicity.py), which makes
  # the model space-group specific. e.g. P21/c -> x,z wrap; y does not.
  # Verified 2026-07-16 over all 123 SGs with defined aunit bounds (energy+RDF vs an exact
  # symmetry derivation, 369/369 agreement): auv==1 wrap-safe in 80/80 cases, no exceptions.
  # The auv==0.5 half-cell wrap is often valid too but is deliberately excluded -- it
  # identifies points within the fundamental domain, which we aren't exploring yet.
  # Changes expanded_dim (wrapped dims get a sin/cos encoding), so it is NOT checkpoint
  # compatible with a run trained without it.
  periodic_centroids: false  # for physical problems on crystals, not toy problems (false for toys)
  # diagonal-plus-low-rank (DPLR) forward covariance: C = diag(d) + V V^T, forward SDE only.
  # fixed marginal-variance budget: rho redistributes the existing policy variance
  # between private (d) and correlated (V) parts, it never inflates the marginal.
  dplr_rank: 10                 # rank r of the low-rank factor V; 0 = disabled (exactly original diagonal SDE)
  dplr_rho_max: 0.9            # cap on correlated variance fraction; also an exact cap on pairwise |corr_jk| <= rho_max. Keep < 1 strictly
  dplr_mask_angular: false      # zero the correlated fraction on wrapped dims (angular, plus any periodic_centroids ones); correlations then only couple non-wrapped dims

# training params
################################################################
buffer_device: cuda           # where the churned/static sample stores live (replay + prior + anchor buffers, mol/prior datasets). 'cuda' turns per-step buffer draws/admits/purges into async device gathers instead of serial CPU work + host round trips; footprint is ~1KB/graph (250k graphs ~ 250MB) so VRAM cost is negligible next to activations. 'cpu' = legacy
batch_size: 1000              # number of samples per training batch -- single shared batch size for all rollout work (train fwd/bwd/replay/fused AND eval sampling), so there's one adaptive value reacting to OOMs instead of several independently-tuned ones
grow_batch_size: false       # whether to dynamically grow the batch size to fill the RAM. OFF for the oscillation-diagnostic run: removes the grow/OOM/slash sawtooth (23% ripple-coherent on flwl4jxz) as a candidate external clock
max_batch_size: 50000
# jump-mode batch growth: multiply by batch_growth_factor once every batch_growth_interval steps
# instead of a little every step, so the run visits only ~log_f(max/base) distinct batch sizes
# (torch.compile treats each distinct size as a recompile + its own CUDA graph; continuous growth
# blows dynamo's recompile limit and silently reverts to eager). OOM cuts divide by the same
# factor -- exactly one rung down -- then cool down as before. f=2 over 25->2500 = 8 shapes.
batch_growth_factor: 1.65
batch_growth_interval: 50       # steps between jumps before the first OOM (25->2500 in ~350 steps, similar to the old 1.01/step walk); 0/absent = legacy continuous mode below. WITH compile_policy active, each new size is a ~30-60s recompile stall, so keep dwell >> compile: use ~250-500 here (or start batch_size near max/4 so there are only a few rungs); 50 is fine locally where compile is off
batch_growth_slow_interval: 300 # jump spacing after any OOM (congestion avoidance; ~the old 1.002/step doubling time)
# --- automatic batch-size throughput optimization (train.py increment_batch_size) ---
# The growth walk measures marginal samples/sec at every jump (batch / median step time over the
# trailing ~20 steps, robust to the one-off compile stall at rung entry). Past GPU saturation a
# factor-f batch jump returns ~x1.0 throughput at xf step time -- pure steps/hour loss (rpvez6ep
# on A100-80GB: batch 50k ran the same 13.3k samples/s as batch 1.6k, at 31x the step time, 958
# vs 30k steps/hr). A jump that underperforms min_gain reverts one rung and PINS the batch for
# the current protocol stage (per-stage: fused vs bwd steps have different cost profiles); the
# pin re-arms at stage transitions and after OOM cuts, so the controller re-finds the knee per
# stage, per GPU, per model width on its own. With this ON, max_batch_size is a safety ceiling
# rather than a target. NB nvidia-smi-style utilization cannot drive this decision -- it
# saturates at 100% below the knee; marginal throughput discriminates on both sides.
auto_batch_throughput_opt: true  # master switch; false = grow to max_batch_size/OOM as before
batch_growth_min_gain: 0.15  # marginal samples/sec gain a jump must clear to be kept (a x1.65 jump below the knee buys ~+65%; at the knee ~+0-10%). LOWER = climb higher up the saturation shoulder: more throughput, fewer steps/hr. 0.05-0.10 throughput-leaning, 0.15 steps-leaning
batch_knee_recheck_steps: 2000  # re-estimate a pinned knee every N steps: drop one rung and re-climb (adapts BOTH directions -- the knee moves within a stage as the fused composition drifts, e.g. the fwd branch activating/deactivating). 0 = pin holds until stage transition/OOM
oom_batch_shrink_factor: 0.5
oom_cooldown_steps: 200  # steps to hold batch_size flat after an OOM before resuming growth, to let the reduced level prove stable first
eval_num_samples: 10000       # minimum number of samples for evaluation
test_eval_num_samples: 2000   # samples for the held-out conditional eval pass (test_molecules_path); null/absent -> eval_num_samples. No-op when test_molecules_path is null
fused_grad_accum_min_samples: 1000  # fused steps only: effective-gradient floor. Batches BELOW this accumulate micro-steps (loss weighted batch/target) until this many samples contribute, then clip and step; batches AT/ABOVE it take a plain unscaled step (no batch/target > 1 loss inflation). Pairs with the throughput knee: rollout batch stays at the knee, gradient stability comes from accumulation. 0 disables
epochs: 100000             # number of training epochs
eval_period: 250              # how often to do evaluation & reporting
figs_period: 500             # how often to log custom figures EXPENSIVE # must be multiple of eval_period or it won't fire

# SDE integration
################################################################
eval_T: 40                  # diffusion trajectory length for inference
integrator:
  T: 40                        # static training diffusion length
  min_traj_length: 10
  max_traj_length: 10
  traj_length_strategy: static # 'static'  or 'sampled'  will do random between min and max traj lengths
  discretizer_max_ratio: 15    # maximum ratio between randomly sampled step sizes - needs to be >25 for 15 steps, or 10 for 30 steps to get good coverage at extrema
  discretizer: uniform         # 'random' 'low_discrepancy' 'equidistant' 'uniform'

# BASE DEFAULTS for the per-mode loss coefficients. The live values on any
# given step are these blocks overlaid with the CURRENT protocol stage's
# loss_coeffs overrides (see the protocol: block below) -- a pure function of
# (defaults, stage), rebuilt every set_loss_coeffs() call. No schedules, no
# cross-step mutation; keep these blocks to structural values (beta,
# loss_clip, vg_by_condition, subtb_lambda, ...) and put anything a stage
# turns on in that stage's own override dict.
fwd_loss_coeffs:
  tb: 0.0
  z_level: 0.0  # Z-ONLY condition-grouped regression of log_Z(c) onto the LIVE per-condition mean log w: mean_c (log_Z(c) - mean_c log w)^2. Computed on the fwd rollout that already exists (no extra sampling / no extra reward call) with log w DETACHED, so it buys Z gradient WITHOUT buying on-policy policy gradient -- the two things raising fwd's share otherwise moves together, which is why this is the only clean way to test "is it Z tracking or is it the on-policy signal". MAGNITUDE, not dispersion: an earlier cut mean-centered this into Var_c(e_c) on the theory that a uniform offset is a harmless global Z shift TB already owns, and that was wrong twice -- a uniform e_c = +4 pushes log_pf down at EVERY sample (so the policy inflates everywhere, same uphill mechanism, just global), and TB is empirically not driving that mean to zero anyway (the z_bias histogram sits centered near -4). Target is every condition on its own level, i.e. tracker/z_bias_rms and tracker/z_bias_worst -> 0. Overlaps TB's Z gradient so part of the effect is just a Z learning-rate multiplier; the non-redundant parts are that it stays QUADRATIC where TB's Huber has gone linear (a 30-nat condition pulls ~3x a 10-nat one instead of identically -- past beta the Huber caps magnitude but not sign, and Adam turns a persistent sign-consistent gradient into a full step forever) and that it groups by condition BEFORE squaring so within-condition noise averages out. 0 = off
  freeze_policy: 0.0  # 1 => train Z only (detach policy + conditioner from the loss, replaces old tb_z=2)
  freeze_z: 0.0       # 1 => train policy only, log_Z_learned detached from the loss (replaces old tb_z=0). neither set => train both (old tb_z=1). fwd tb must be >0
  vg_lb: 0.0
  vg_lme: 0  # exclusive with vg_lb
  vg_by_condition: 0.0  # group VarGrad/emp_z estimation by condition_id (scatter: pools K-repeat tiles AND independent same-condition draws per batch) instead of by the K-repeats tile. Small condition libraries then get large per-batch estimates with repeats staying 1; large libraries (each condition ~once per batch) still want repeats > 1 so every group has >= K samples
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0  # train Z(c) toward the batch's empirical per-condition estimate (Jensen mean of log w unless vg_lme > 0 selects logmeanexp). With vg_by_condition it works standalone; in the legacy repeats-grouped path it must combine with a VG loss. NB: > 0 also disables fwd tb activation at phase1to3 (emp_z owns Z training)
  emp_z_persistent: 0  # separate sidecar: train log_Z_learned to regress onto condition_log_z's persistent per-condition estimate (masked to warmed-up conditions), independent of tb_z_source
  traj_grads: 0.0
  reward_grads: 0.0
  repeats: 1.0  # per-mode K-tiling factor (scheduled like any coefficient); with vg_by_condition and a 2-condition library, condition grouping already pools ~B/2 rows per estimate, so no fwd tiling (and its per-rollout energy cost) is needed
  loss_clip: 1.0E+9
  beta: 10.0  # Huber beta
bwd_loss_coeffs:
  tb: 0.0 #1.0  # must be nonzero for log Z backwards-trained warm start
  freeze_policy: 0.0  # 1 => train Z only (replaces old tb_z=2, the bwd warm-start default)
  freeze_z: 1.0       # 1 => train policy only, Z detached (replaces old tb_z=0). neither => train both (old tb_z=1). bwd tb must be >0
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  vg_by_condition: 1.0  # group bwd VarGrad by condition_id (cross-terminal; pools buffer draws + K repeats). Off-policy SAFE as a policy loss: zero variance is a measure-independent fixed point, and a dropped mode is an extreme positive log w outlier, so this doubles as mode retention. The group center is a biased Z estimate off-policy, so bwd emp_z is asserted off with this. Per-tile (repeats) grouping would just be TBC in disguise -- cross-terminal pressure requires condition grouping
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
  emp_z_persistent: 0  # see fwd_loss_coeffs.emp_z_persistent
  level_gap: 0.0  # linear term pulling J_B(c) onto J_F(c), coefficient = condition_log_z's detached EMA delta (bwd_level_ema - fwd_level_ema, the z_match gate's signed gap), masked to conditions past min_visits on BOTH level streams. One-sided: no matching forward-loss half. Acts as a proportional controller on J_B with gain = this value and lag = condition_log_z.half_life_visits; coefficient self-cancels at gap 0. The logged bwd/level_gap VALUE is g*log w, not a distance -- read bwd/level_gap_coeff_rms instead
  level_gap_clamp: 10.0  # nats; bounds |coefficient| on the level_gap term, hence the per-row force on log_pf
  mle: 0.0  # weighted MLE if VG is running with repeats, otherwise trajectory-wise. Default 0 -- the train_prior stage turns it on in its own loss_coeffs override
  tbc: 0.0  # trajectory balance consistency (arXiv:2209.02606 eq. 33): reward-free VarGrad over the K backward rollouts per terminal state -- trains flow consistency during MLE pre-training so intra-terminal Var(log w) is already tame when Z learning activates. REQUIRES repeats > 1. Default 0; the train_prior stage turns it on
  repeats: 1.0  # per-mode K-tiling: K same-terminal backward rollouts (multiplies bwd batch rows) for exact-MLE and tbc; larger K = better-conditioned consistency/IWAE estimates at proportionally larger batches. Default 1; the train_prior stage raises it
  traj_grads: 1.0
  loss_clip: 1.0E+9
  beta: 10.0  # Huber beta for TB-style losses
replay_loss_coeffs: # applied to trajectories pulled from the replay buffer (see replay_buffer below)
  tb: 1.0
  freeze_policy: 0.0  # 1 => train Z only (old tb_z=2)
  freeze_z: 1.0       # 1 => train policy only, Z detached (replaces old tb_z=0). neither => train both (old tb_z=1)
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
  emp_z_persistent: 0  # see fwd_loss_coeffs.emp_z_persistent
  mle: 0.0  # will do weighted MLE if VG is running with repeats, otherwise trajectory-wise
  repeats: 1.0  # per-mode K-tiling factor; replay replays stored trajectories (K copies would be identical), keep at 1
  traj_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10.0 # Huber beta for TB-style losses

# persistent per-condition empirical log Z tracker (buffer.py: ConditionLogZTracker),
# decoupled from prior/replay/anchor buffers entirely -- see emp_z_persistent above.
# fwd/bwd/replay_tb_z_source live here rather than inside *_loss_coeffs because the
# coeff namespaces are numeric-only (rebuilt from defaults + stage overrides every
# set_loss_coeffs() call) -- a string field there would break that rebuild.
condition_log_z:
  min_visits: 20  # a condition needs this many visits before tb_z_source: persistent / emp_z_persistent will use its estimate
  half_life_visits: 28.0  # tracker's evidence half-life, in OWN-VISITS (update() calls for that condition), not elapsed training steps. 28 (from 7) for the persistent-Z regime: at ~1 visit/1-2 steps the memory window was ~10-15 steps with per-condition SE ~1 nat landing straight in the TB residual; 28 -> SE ~0.4-0.5 nats at a lag cost of ~30-60 steps of deliberately-slow policy motion. NB stored-wins on resume was fixed in train.py (config re-asserts on restore)
  trim_frac: 0.1  # per-condition-group trimmed mean for ema_logw (top/bottom fraction dropped by rank before averaging) -- guards the arithmetic-mean Jensen estimate's VALUE against rare catastrophic-energy outliers; no-op on small batches with nothing to trim
  max_batch_weight: 200.0  # caps how much effective evidence (min of a batch's ESS and this ceiling) any single update() call can contribute, regardless of raw batch size -- guards against one huge batch (e.g. eval, ~5000/condition here) nearly overwriting hundreds of steps of accumulated training-time evidence just by being large
  discovery_half_life_steps: 200.0  # half-life (TRAINING STEPS) of the minima-discovery rate EMAs (condition_minima_rate_ema / condition_minima_depth_rate_ema): per-step rate of strict per-condition best_energy improvements -- ~0 when minima have gone static, rising with discovery churn. Depth metrics are intensive: energy units of reduction PER VISITED CONDITION, so they don't scale with condition-library size. Pure monitoring; nothing feeds back into training
  fwd_tb_z_source: persistent  # 'learned' or 'persistent': once a condition has enough visits, swap the persistent per-condition empirical log Z in for log_Z_learned in the TB residual. PERSISTENT everywhere (2026-07-28 handoff v3): the tracker EMA IS Z -- updates at data rate (fastest possible Z, no optimizer in the loop), learned head demoted to cache via emp_z_persistent. NO staleness gating by user directive ("use them and suck it up; stability and simplicity"); min_visits mask still routes never-visited conditions to the learned head. Island audit at 16850: staleness 0/2/4/6 steps (p50/90/99/max), zero NaN among trusted
  bwd_tb_z_source: persistent
  replay_tb_z_source: persistent
  # PERSISTENT for the two POLICY-training losses (95% of the batch), learned
  # for fwd (which must keep training the flow model on-policy). Testing the
  # per-condition-Z hypothesis: the pooled dL/dZ is ~0 while the per-condition
  # z_grad spreads roughly -3..+4 and z_bias runs -20..+5, so the SHARED policy
  # is pulled in conflicting directions by conditions whose Z is individually
  # wrong but cancels in the mean -- unbalanced TB. The persistent source
  # substitutes ConditionLogZTracker's own per-condition empirical log Z (a
  # separate scalar per condition: no network capacity limit, no cross-
  # condition interference) into the TB residual, so the policy is trained
  # against a per-condition-correct level. If the conflicting-gradient story
  # drives the variance walk, the ~800-step ringing should damp.
  # REVERTED to learned 2026-07-27: the persistent substitution was tested on
  # 0j0tg0iq (from step 4500) and made the oscillation WORSE, not better --
  # fwd/logw_std peaked 61 vs the learned-Z control's ~33 at matched phase. The
  # tracker's per-condition Z is an EMA over visits, so it is LEAST reliable for
  # exactly the hard/rare conditions carrying the largest level error, and
  # feeding it to 95% of the batch added lag where the error was biggest. Read
  # together with tracker/z_grad_rms (~1.5 nats, flat, and LAGGING the blow-up
  # by 111 steps): per-condition Z accuracy is not what drives this.
  weighted_condition_sampling: true  # if true, fwd_train_step draws mol_dataset rows weighted toward higher tracked fit error (z_bias_ema^2 + Var(log w), at each molecule's base condition_id) instead of uniformly, so molecules whose log Z estimate hasn't converged (the under-covered extrema tail) get sampled more often -- concentrates forward attention on the tail instead of the already-converged bulk. Applies ONLY in stages declaring the weighted_condition_sampling flag (stages where forward trains the POLICY, so steering reduces the tail's Var(log w)); in a Z-only forward stage high fit error = high Var(log w) = worst TB-Z gradient the policy can't fix, so leave the flag off there
  weighted_condition_sampling_clip_quantile: 0.99  # fit error is clipped at this quantile and NORMALIZED by it -> scale-free priority in [0,1], so temperature never needs retuning as the range shrinks / changes per problem, and no single z_bias_ema blowup can dominate. Falls back to uniform when the tail has closed (scale ~0). null = legacy raw signal (temperature then in nats)
  weighted_condition_sampling_temperature: 0.3  # softmax temperature over the [0,1] normalized priority; ~0.3 sharper (top ~1% ~27x the bulk), ~1.0 gentler (~2.7x). 0.5 -> tail ~5% of conditions gets ~4-5x its uniform share
  weighted_condition_sampling_uniform_beta: 0.5  # fraction of each mol_dataset draw taken uniformly at random regardless of the fit-error weight -- a freshness floor so every condition still gets visited (keeps tracker stats + retention alive on the converged bulk). 0.5 = half uniform / half tail-steered

# ============================================================================
# TRAINING PROTOCOL -- the declarative stage interface (protocol.py).
# One ordered list of stages replaces the old phase-1/2/3 + forward-first
# machinery. Each stage declares its train mode, backward sampling source,
# behavior flags, loss-coefficient overrides (over the base *_loss_coeffs
# defaults above), mode-frac balance rules, exit trigger, and transition
# actions. Checkpoints store only the stage NAME plus the engine state
# (stage_ctrl); behavior always re-derives from THIS config, so editing it
# rewrites a resumed run's future -- no override flags needed.
#
# Per-stage keys:
#   train_mode:        'bwd' (every step is a backward step) | 'fused'
#                      (fwd/bwd/replay fire together, losses fused by frac)
#   bwd_sampling_mode: 'dataset' (static prior_dataset) | 'prior' (churned
#                      prior_buffer, requires a prior model -- see snapshot_prior)
#   flags:             per-stage behavior switches:
#                        update_log_z         condition_log_z tracker updates
#                                             on bwd/replay losses
#                        scramble_conditions  unconditional prior by
#                                             construction: scramble the
#                                             condition embedding INSIDE the
#                                             model (conditioner runs on the
#                                             true pairing; its detached output
#                                             rows are K-tile-permuted at the
#                                             conditioner->trunk seam, so the
#                                             trunk is trained to IGNORE the
#                                             embedding). Vector conditioning
#                                             only (no-op otherwise -- see
#                                             Modeller.scramble_applicable)
#                        weighted_condition_sampling  fit-error-weighted forward
#                                             mol draws
#                        buffers_active       prior/replay buffer management +
#                                             which buffer backward stats
#                                             report on
#                        mle_gate             run the MLE slope gate publisher
#   fracs:             mode fractions applied once at stage ENTRY (omit to
#                      carry the previous stage's fracs across)
#   exit:              AND-list of {metric, above|below, abs?, patience?}.
#                      Metrics resolve against the RUNNING metric_tracker EMAs
#                      ('dir/name'), gate-published values ('gates/name'), or
#                      -- explicit opt-in, evals are rare -- the eval metrics
#                      dict ('eval/name'). Tick terms are checked every 10
#                      steps; when all reach patience, the next eval is pulled
#                      forward and the transition executes there with fresh
#                      eval metrics. No exit = terminal stage.
#   on_exit/on_enter:  route-specific actions -- snapshot:<tag> (pre-transition
#                      reload point, stamps request_eval so a resume replays
#                      the transition), snapshot_prior (freeze the EMA model as
#                      THE prior + 'prior' checkpoint + drop 'best'),
#                      bootstrap_z (Z warm start; ':train_conditioner' lets the
#                      conditional fit shape an untrained conditioner).
#                      Everything generic happens AUTOMATICALLY at every
#                      transition: spike monitors reset + cooldown, combo
#                      record cleared, optimizers rebuilt (fresh Adam moments),
#                      LR re-warmed with a fresh probe baseline, eval + figs
#                      pulled forward.
#   skip_if:           'prior_loaded' -- on a fresh run, skip this stage when a
#                      prior model was loaded, by path (prior_model_name) or
#                      auto-refound (reuse_prior). The loaded prior is
#                      sampling-only: skipping does NOT warm-start the policy
#                      from it (see prior_model_name)
#
# Balance (fused stages): kind lexicographic walks rules in order, FIRST
# violated rule's `boost` mode gets the EMA frac nudge; default_boost when all
# clean, and anneal_patience clean ticks tighten every annealed rule by
# controller.decay_rate toward its `min` (a number, or a metric name = dynamic
# floor). Rules: absolute `above: X` (annealable), `below: X` (fixed floor,
# never annealed -- e.g. an fwd/r2 calibration gate: bounded, saturating
# metrics make deliberately LOOSE gates that don't steal priority from
# coverage work during absorption), or `relative: best` with
# `margin` (violated when value > own-running-best x margin; the best relaxes
# upward by `drift`/tick -- degradation detectors, never absolute bars, since
# achievable floors legitimately RISE with coverage). `abs: true` takes |value|;
# `if_missing: violated` makes a cold metric vote instead of abstain;
# `lookahead: true` projects the log-space trend before thresholding.
# Per-stage `min_fracs: {mode: floor}` (fallback controller.min_mode_frac) and
# `deactivate_threshold` state EXPLICITLY which modes may switch off: a floor
# at/above the deactivate threshold = that branch is always computed; below it
# = the mode can go truly dark (s706frkh: terminal bwd sat below the implicit
# global deactivate for ~1700 steps -- zero backward gradients). A mode no
# rule can boost is excluded from the fused loss; a mode whose metrics nothing
# reads skips its force-refresh rollout.
# kind: proportional instead splits two modes' mass proportionally to a pair
# of lagging-spread metrics: {kind: proportional, metrics: {fwd: fwd/x, bwd:
# bwd/x}, alpha: 0.05, floor: 0.01} -- the old phase-2 balancer, kept as a
# capability.
# `anneal_coeffs: {energy_config_key: {target: X, rate?: Y}}` (lexicographic
# only) RAMPS UP a numeric energy_config coefficient (e.g. bounding_coeff,
# reduction_coeff) toward `target` at the SAME clean-streak anneal event as
# the rule thresholds above -- i.e. strictly lower priority than every rule,
# since it only moves once the whole balance has been clean for
# anneal_patience ticks in a row. The coefficient's base energy_config value
# is the SOFT one: it's what the energy function is built with, so it's in
# effect for every stage from run start (including stages that name nothing
# here); a stage's anneal_coeffs only climbs its named coefficients off that
# base once ITS balance is fully converged. Coefficients no stage names stay
# pinned at their energy_config default forever (e.g. lj_coeff, which is
# calibrated separately at init and must not be listed here).
# ============================================================================

# MLE slope gate (train.py update_mle_gate, runs on stages flagged mle_gate;
# publishes gates/mle_flat for the exit trigger -- latching now lives in the
# trigger's own `patience`). Regresses the RAW per-step bwd/mle batch loss
# sampled every 10 steps: raw losses are ~independent across steps, so plain
# OLS standard errors apply and the old 1000-step window (forced by regressing
# a 100-step-EMA whose samples were ~90% correlated -- ~5 independent points)
# shrinks to 300. If the raw series proves too noisy on a real system, raise
# the window before touching mle_min_rate.
mle_slope_t: 2.0  # confidence multiplier on the descent rate's standard error. 'flat' = rate + mle_slope_t * se(rate) < mle_min_rate, i.e. ~95% confident (at 2.0, one-sided) the true descent is below the negligible rate. HIGHER = more conservative = exits later. This is an EQUIVALENCE test, not a significance test: noise argues AGAINST exiting (an uncertain window cannot clear the bound) -- the safe direction
mle_min_rate: 0.05  # the negligible descent rate, nats per 100 train steps: the warm-start exits once it is confident further MLE training buys less than this. Needs no normalization -- the MLE LEVEL carries the target's differential entropy and varies by system, but the RATE does not (nats are nats). Must sit above 2*se(rate) for the window or a true plateau can never clear the bound
mle_slope_window: 300  # train steps of raw-loss gate samples (one per 10 steps) the slope is regressed over. Sets the resolution floor: long enough that 2*se(rate) < mle_min_rate. Code floors this at 4 samples (max(window // 10, 4))

protocol:
  stages:
    # -- MLE warm-start: build a broad, self-consistent policy on the dataset
    #    prior (unconditional by design), then freeze it as THE prior model
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded          # a prior loaded by path IS this stage's product
      flags:
        update_log_z: true           # accumulate ema_logw / best_energy evidence
        scramble_conditions: true    # unconditional prior by construction (see the flags key in the header comment); a later bootstrap_z:train_conditioner relies on this having kept the conditioner untrained
        mle_gate: true
      loss_coeffs:
        bwd: { mle: 1.0, tbc: 1.0, repeats: 2.0 }
      exit:
        # gate flat for 5 consecutive checks (the old mle_plateau_patience),
        # wass as a loose underfit-plateau ceiling (~4x the old convergence
        # threshold -- it catches 'optimizer stalled but match still bad', not
        # convergence), tbc converged so Z learning starts with tame
        # intra-terminal Var(log w)
        - { metric: gates/mle_flat, above: 0.5, patience: 5 }
        - { metric: eval/wass_debiased, below: 0.015 }
        - { metric: bwd/tbc, below: 2.0 }
      on_exit: [ 'snapshot:phase1_exit', 'snapshot_prior' ]

    # -- var_conditioning: condition-grouped VarGrad on fwd + bwd -- Z-free
    #    policy losses whose fixed point is zero within-condition Var(log w).
    #    Z(c) trains as a FWD-ONLY sidecar (emp_z toward the group Jensen
    #    mean; bwd emp_z is asserted off in the loss -- the off-policy group
    #    center is a biased Z target). Fixed fracs, no balance, replay off
    #    (no groups to pool). buffers.prior_buffer.condition_block_m (2)
    #    auto-activates while bwd vg_lb > 0: bwd draws M distinct same-
    #    condition terminals per block, repeats tiles stack on top, so bwd
    #    VG groups are M*repeats cross-terminal samples. Exit = the designed
    #    var-conditioning criterion: per-condition within-spread below 1 nat.
    - name: var_conditioning
      train_mode: fused
      bwd_sampling_mode: prior
      flags:
        update_log_z: true
        buffers_active: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      on_enter: [ 'rebuild_prior_by_churn' ]
      fracs: { fwd: 0.5, bwd: 0.5, replay: 0.0 }
      deactivate_threshold: 0.01
      loss_coeffs:
        # beta stays at the base 10: 30 was tried (louder tail pull) as part
        # of the hot retune that came back noisier-and-worse
        fwd: { vg_lb: 1.0, vg_by_condition: 1.0, emp_z: 1.0, repeats: 2.0 }
        bwd: { vg_lb: 1.0, repeats: 2.0, level_gap: 1.0 }
      balance:
        kind: proportional
        pinned: { replay: 0.0 }
        metrics: { fwd: fwd/logw_std_within, bwd: bwd/logw_std_within }
        drive: relative                  # s = metric/target - 1
        # both targets = the stage's exit criterion scale (within-spread ~1
        # nat); both-healthy -> default_boost
        targets: { fwd: 1.0, bwd: 1.0 }
        default_boost: { fwd: 0.5, bwd: 0.5 }
        # floor keeps each side >= 0.1 of the pair: bwd VG is the
        # anti-degeneracy anchor (fwd VG alone has within-condition variance
        # -> 0 by concentration as a global minimum; buffer-support constancy
        # removes it)
        floor: 0.1
        alpha: 0.01                     # ~1k-step time constant at a ~10-step tick
      on_exit: [ 'snapshot:var_conditioned' ]
      exit:
        # rolling channels ONLY: _resolve reads gates/, eval/, or dir/name via
        # metric_tracker -- tracker/* never reaches metric_tracker, so a
        # tracker/ exit term resolves None and its streak stays 0 forever
        # (verified on sbb9491u: streak 0 at every step)
        # thresholds sit just above the observed structural floors (fwd ~5.5,
        # bwd ~2.4 in m=6 units), so a resumed run passes within ~patience
        # ticks and hands off to naive through the REAL transition path (LR
        # rearm, on_enter rebuild, best-minima reset); the on_exit snapshot
        # preserves the conditioned state as a named retry point
        - { metric: fwd/logw_std_within, below: 6.0, patience: 5 }
        - { metric: bwd/logw_std_within, below: 3.0, patience: 5 }

    # -- naive: ONE always-on stage, no transitions. fwd (Z + policy), bwd and
    #    replay (freeze_z from base, policy-only) all permanently active;
    #    buffers churn from entry. No exit term, so this stage is TERMINAL --
    #    thermalize/z_match/terminal below are unreachable while it is here
    #    (left in place, not deleted; delete this stage to restore that route).
    #
    #    on_enter rebuilds prior_buffer from zero through the online admission
    #    gate to init_fraction (1.0) * max_size, so bwd trains against the
    #    designed composition at full size from step one instead of against a
    #    dataset seed that churn grinds out over ~10k steps (measured: 2.5%
    #    turnover per 250-step window at 135k rows).
    #
    #    fwd is PINNED at its entry frac; bwd and replay split the remaining
    #    mass proportionally (see balance). From replay_july26 (elj, ~18k
    #    steps) a fixed mix beat a 4-rule lexicographic controller 29 vs 41.4
    #    nats at matched step -- the rules limit-cycled (Replay Frac swinging
    #    0.05<->0.89) because lexicographic is winner-take-all and all three
    #    concerns are live at once here. Proportional replaces the switching
    #    with a continuous blend. Same battery: bwd share sets mode retention
    #    (0.001 -> EffDim ~1.6, 0.3 -> 5.33, 0.9 -> 5.90), and
    #    fwd/tb_resid_clipped walks to ~0 within ~500-700 steps on a ~5% fwd
    #    share with no controller at all (z_match, emergent).
    - name: naive
      train_mode: fused
      bwd_sampling_mode: prior
      tween_steps: 2000        # blend loss_coeffs linearly from var_conditioning's vector over the first 2000 steps (fwd vg_lb 1->0.15 residual with vg_by_condition held at 1 and repeats held at 2, tb 0->1, emp_z 1->0, z_level 0->1, bwd vg_lb 1->0, level_gap 1->0, emp_z_persistent 0->1): the gradient transformation morphs instead of stepping. Open-loop; fires only across a real transition (remaps/fresh runs get naive's coeffs immediately). v4/d5dmq6zk ran 1000; drift continued past tween end at the same slope, so 2000 is headroom, not a fix
      flags:
        update_log_z: true
        buffers_active: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      # NO on_enter: rebuild_prior_by_churn fires on entry to var_conditioning
      # (whichever buffer-consuming stage comes FIRST) and must not repeat --
      # f3jp9y4j: repeating it at the naive handoff replaced the 6k-step
      # curated VG buffer with broad prior draws, and bwd at 0.85 share spent
      # the transition re-inflating the spread to cover them (fwd/vg_lb 13->30,
      # z_bias 0.7->2.0, every sampling metric regressed)
      # under kind: proportional these are the LITERAL entry split. fwd is
      # re-asserted to pinned.fwd every tick; bwd/replay are then rewritten by
      # the split, so their entry values only set where the alpha EMA starts
      # fwd pin 0.4 (from 0.1) for the post-VG handoff: at the flip the Z
      # head's only data (fwd tb + z_level) dropped ~7x while a fresh-Adam
      # policy started moving under it -- the two-timescale violation
      # recreated at the boundary (yubxzlvg: fwd/replay jensen_z_err rising,
      # log_Z_learned destabilized while bwd held). Evidence for higher fwd:
      # bwd03_norep frontier at 0.5/0.5 (bwd 0.9 far past the retention
      # knee), and the VG stage's controller walked to fwd ~0.69 with both
      # spreads improving. bwd/replay split the remaining 0.6.
      # replay QUARANTINED overnight 2026-07-29 (~00:45): v5/f7jieoy5 detonated
      # mid-tween exactly as the controller fed replay past ~0.02 (0.02->0.067
      # share; step_var 0.0003->0.0075 exponential, fwd_in 5.6->20, bwd_in
      # 2.3->4.4, resid_clip IMPROVING -2.85->-1.5 = loss-invisible
      # flat-direction walk; adaptive-LR never fired). v4 rode the same window
      # stably at replay <= 0.012. Suspected driver: replay TB trains on STORED
      # trajectories (draw_replay_sample return_traj=True) -- off-support under
      # a policy in transit, cheapest descent direction is joint P_F/P_B
      # variance inflation. CONFOUND resolved by v6/m2kxf4vg: cleared the
      # detonation window untouched at bwd 0.555 => replay dose was the
      # driver. Quarantine now expressed as pinned.replay 0.005 (< deactivate
      # 0.01 = branch never computed), freeing the metric pair for fwd/bwd.
      fracs: { fwd: 0.4, bwd: 0.595, replay: 0.005 }
      # NB min_fracs is INERT under kind: proportional -- floors are applied in
      # _nudge_mode_fracs, which only the lexicographic path calls. The
      # proportional floor below does that job instead. Kept here so switching
      # this stage back to lexicographic doesn't silently lose its floors.
      min_fracs: { fwd: 0.02, bwd: 0.05, replay: 0.02 }
      deactivate_threshold: 0.01
      loss_coeffs:
        # z_level ARMED: Z-only condition-grouped level regression. Rides
        # this same fwd rollout (no extra sampling / no extra reward call) with
        # log w detached, so it adds Z gradient WITHOUT adding on-policy policy
        # gradient -- the only change that separates "Z tracks each condition"
        # from "the policy samples itself", which every fwd-share change
        # confounds (fwd is tb: 1.0 with neither freeze, so raising it raises
        # both at once).
        #   SCALE: losses are stacked and MEANED, so tb:z_level = 1:c is the
        #   gradient ratio directly. At batch ~1400 over ~300 live conditions,
        #   TB contributes ~(n_c/N)*beta ~ 0.034 per condition in its LINEAR
        #   (|resid| > beta) regime, while z_level contributes (2/K)*e_c ~ 0.03
        #   at a typical 4-5 nat level error -- so c = 1.0 is roughly balanced
        #   in the bulk and ~6x TB out at a 30-nat tail condition, which is the
        #   intended asymmetry (TB's Huber is flat there). NB this is the
        #   UNCENTERED form, so unlike the earlier Var_c version it also picks
        #   up the ~-4 global offset rather than only the spread -- expect it
        #   to bite harder than the same coefficient did before, and consider
        #   c < 1.0 if log_Z_learned starts getting DRAGGED (over-constrained
        #   Z) instead of staying smooth.
        #   READOUT: tracker/z_bias_rms and tracker/z_bias_worst are the target;
        #   tracker/z_bias_var stays as the diagnostic that splits the level
        #   error into global vs per-condition via rms^2 - var = mean^2.
        fwd: { tb: 1.0, z_level: 1.0, emp_z_persistent: 1.0, vg_lb: 0.15, vg_by_condition: 1.0, repeats: 2.0 }   # policy + Z(c) on-policy + Z-only level regression + head-shadows-tracker sidecar (the head is the CACHE of the persistent source below, out of the training loop) + residual grouped VarGrad: Z-error-free hold on fwd conditioning, minimized at TB's own fixed point (logw = logZ(c) per condition => Var_c = 0) so it biases nothing; requires repeats 2 for within-condition pairs (which also holds fwd batch composition constant across the boundary)
        bwd: { tb: 1.0 }               # freeze_z stays 1 from base: policy only
      balance:
        kind: proportional
        pinned: { replay: 0.005 }          # must equal fracs.replay; the quarantine pin (re-asserted every tick)
        # v7 (2026-07-29 morning): fwd/bwd co-converge the two COVERAGE
        # complements -- relative_under (mass the policy under-covers; bwd
        # absorption closes it) vs over_coverage (mass parked where reward
        # doesn't want it; fwd on-policy TB prunes it). v6 with bwd parked at
        # 0.595 (controller inert under the replay cap) drove rel_under to
        # 0.90 -- past its target -- while over_coverage sat ~9.1-9.5 and
        # fwd_in ~8.1: over-funding a solved objective while fwd stayed loose.
        metrics: { fwd: fwd/over_coverage, bwd: bwd/relative_under }
        drive: relative                    # s = metric/target - 1; split tilts default_boost by (1 + s), so at-target drives reproduce default_boost exactly
        #   fwd 6.0 = over_coverage at the var_conditioning exit (6.31-6.38);
        #             v6 settled ~9.1-9.5 => entry drive ~+0.5
        #   bwd 1.0 = relative_under's "absorption done" point; v6 read 0.90
        #             at 32k => entry drive ~-0.10
        targets: { fwd: 6.0, bwd: 1.0 }
        # symmetric idle: co-convergence has no preferred side. At entry
        # drives the split walks 0.4/0.595 -> ~0.63/0.37; both-at-target
        # equilibrium = 0.5/0.5 (the bwd03_norep retention frontier)
        default_boost: { fwd: 0.5, bwd: 0.5 }
        alpha: 0.005                       # ~2k-step time constant at a ~10-step tick
        floor: 0.25                        # neither side below 0.25 of the pair (~0.25 absolute): fwd never Z-data-starved (the v2 failure), bwd never below the retention floor
        # no anneal configured

    # -- thermalize: backward TB against the FULL, BROAD prior buffer. This is
    #    the original paper route (broad prior -> thermalize on prior buffer ->
    #    active forward), restored in place of the localized anchor_seed +
    #    buildout pair, which is archived at the bottom of this stage list.
    #
    #    WHY the swap: argmin-per-condition seeding makes the buffer's target
    #    location jump discontinuously in c wherever two modes cross in depth
    #    (mode identity is discontinuous even though pi(c) is not), so the
    #    policy is asked to learn a map no smooth conditioner can represent.
    #    A broad buffer holds every mode at once, so c -> mu_c stays smooth and
    #    the discontinuity never enters.
    #
    #    on_enter rebuilds prior_buffer from ZERO through the online admission
    #    gate (init_fraction * max_size), so the buffer is model-generated and
    #    gate-screened rather than a static dataset dump -- the energy screen
    #    (prior_buffer.ramp_floor above each condition's own Emin(c)) is what
    #    prunes the high-energy junk that would otherwise inflate Var(log w).
    #    anchor_buffer is seeded from the CONDITIONS file -- 100 samples per
    #    condition from the ACTUAL TARGET distribution -- so shortfall backfill
    #    and reach top-ups inject genuine thermal samples. That is what keeps
    #    KL(buffer || pi) small, and since the z_match walk distance IS that
    #    KL, it is also what should keep the handoff short.
    #
    #    bwd tb with freeze_z: 0.0 trains flow_model, the conditioner and the
    #    policy together off this buffer's TB residual (ordinary Adam steps,
    #    not a fitted regression). The conditioner is untrained coming out of
    #    train_prior (scramble_conditions), so this is the stage that first
    #    fits the whole conditional field at once -- the concept under test.
    # ===================================================================
    # STAGED ROUTE, commented out. The live route is train_prior -> naive,
    # and naive declares no exit terms, so it is terminal: these three were
    # already unreachable and commenting them changes no behavior.
    # ===================================================================
#    - name: thermalize
#      train_mode: bwd
#      bwd_sampling_mode: prior
#      flags:
#        update_log_z: true
#        buffers_active: true         # live buffer: churn + anchor top-ups keep improving it
#        weighted_bwd_sampling: true  # 10% of each bwd batch drawn ~ema_loss (weighted_bwd_beta 0.9)
#      on_enter: [ 'rebuild_prior_by_churn' ]
