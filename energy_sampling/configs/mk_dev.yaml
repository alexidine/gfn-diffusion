device: 'cuda'
cuda_memory_fraction: 0.9
anomaly_detection: false  # dramatic slowdown when True

# MODE: unconditional_molecule (mipcas ELJ, sg2 z'1), rewired 2026-07-29 for the
# post-periodic-fix reference run. Fresh from scratch including the phase-1 MLE
# prior. The previous conditional_toy state (toy_big_unif + var_conditioning ->
# naive protocol, vargrad_island resume staging) is snapshotted in
# configs/mode_presets.yaml (conditional_toy + conditional_toy_protocol_2026_07_29).

# Checkpoints
################################################################
continue_from_checkpoint: true
mlip_path: null #'D:\crystal_datasets\esen_s.pt'
prior_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt
molecules_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt
test_molecules_path: null
checkpoints_dir: 'C:\Users\mikem\Projects\mxt_gfn\gfn_diffusion\energy_sampling\checkpoints'
# Freeze a step-tagged copy of 'running' every N steps (0/null = off). Both the
# model state and the buffer sidecar are HARDLINKED off bytes already on disk,
# so an archive costs no write I/O; disk grows ~910MB per archive.
archive_period: 5000
archive_buffers: true
# MLE handoff resume: this snapshot is train_prior's pre-transition end-state (its
# exit streaks and a stamped request_eval ride in the saved stage_ctrl), so the first
# post-resume eval re-fires the exit and hands off to naive -- snapshot_prior writes
# the prior model in-process. A non-null name TAKES PRECEDENCE over
# continue_from_checkpoint: every relaunch returns here, not to 'running'.
checkpoint_name: null
prior_model_name: null
# prior_model_name loads a SEPARATE frozen GFN used only for prior-buffer sampling. It is rebuilt from its
# own stored gfn_config, so it may be any architecture/conditioning (only the problem TARGET must match --
# mol_cond/temp_cond are exempt from the compatibility check) and it never touches the live policy's
# weights. To ALSO warm-start the policy from it, point checkpoint_name at the same file with
# load_weights_only: true (requires matching architecture).
reuse_prior: false  # false for this run: retrain the MLE prior under the fixed periodic scoring rather than auto-reloading a pre-fix {run_name}_{problem_slug}_prior.pt
load_weights_only: false
# (no override_loss_coeffs any more: checkpoints carry only the stage name; live
# coefficients always re-derive from this config's protocol block on resume)
override_learning_rates: false  # if true, overwrite just the numeric LR restored from a resumed checkpoint's optimizers with this config's lr_* values - warmup/anneal status and Adam momentum buffers are left as-is

#Optimizers
################################################################
lr_policy: auto              # PEAK policy LR (v6 controller: scale ramps to 1.0 == this and never exceeds). auto -> resolve_derived_config = 1e-4 * 25/T, W-flat. Explicit number = override (mipcas A/B edges 7.5e-5 flat-stable / ~3e-4 edge were T=25)
min_lr: 1.0e-6                # ihn
# Interspersed Z-only calibration: extra Z optimizer steps per policy step.
# Silent when disabled, inside the deadband, cold, mid-accumulation, or in a
# scramble_conditions stage.
z_calibration:
  enabled: false            # retired to hygiene duty after the 9x mean-pinned-Z falsification; parameters below are now set for the UNCONDITIONAL route, so re-enabling is a one-word change
  mode: rollout              # rollout = fresh fwd rollout under freeze_policy, TB's own Z gradient; regression = ~free fit onto tracker ema_logw
  unclipped: false           # false => the sidecar's Z fixed point IS the fused Huber loss's (beta from fwd_loss_coeffs). true substitutes beta 1e6, moving it to the arithmetic mean while the fused step keeps pulling to the winsorized one
  sensor: pooled             # |EMA fwd/tb_resid_clipped|, clipped at fwd_loss_coeffs.beta => exactly dL/dZ of the fused loss. rms/worst are per-condition dispersion and read identically zero on a single-condition (unconditional) run
  sensor_quantile: 0.5
  threshold: 0.5             # nats. Same bar as buffers.anchor_buffer.health_gate_zerr. Must stay above the flow head's own jitter floor (O(lr_flow) = 0.1 here)
  grace: 0.8                 # early-out bar as a fraction of threshold: the loop stops once a rollout's OWN fresh reading clears threshold * grace, rather than running out the sampled step count against a stale EMA
  gain: 1.0
  max_steps_per_step: 8.0
  min_visits: null
  freshness_half_life_steps: 300.0
  se2_floor: 0.25
  holdout_modulus: 8         # regression mode only
lr_flow: 0.1                 # unconditional: flow_model is LearnableScalar (convex 1-D, O(lr) jitter only at this LR); conditional nets use 1.0e-4 (see mode_presets.yaml)
lr_back: auto                # backward-pass LR. auto -> resolve_derived_config = 1e-4 * 25/T (the 1/T end, binding for naive's bwd-TB; MLE tolerates the higher 1/sqrt(T) end). Explicit number = override
lr_replay: auto               # trajectory-replay LR. auto -> resolve_derived_config = 1e-4 * 25/T, W-flat. Explicit number = override
lr_fused: auto                # PEAK fused fwd/bwd/replay LR. auto -> resolve_derived_config = 5e-5 * 25/T, W-flat (5e-5 = the T=25 documented ceiling; mipcas 1e-4 fused detonated, tpkdbegv). Explicit number = override
lr_warmup_ratio: 100           # how much smaller the initial (warmup) LR should be than the peak
# v6 LR controller (controller.py LRController): the configured LRs are a FIXED
# PEAK (scale <= 1.0 always), a per-stage ramp -> hold -> decay schedule, and
# two-tier ABSOLUTE tripwires. ALL durations in TRAIN STEPS; the schedule is a
# pure function of steps-since-stage-start and restarts at every stage
# transition (rearm_warmup). enabled: false pins scale flat at 1.0; the
# tripwires run regardless. lr_ctrl state ver=6 invalidates v1-v5 checkpoint state.
adaptive_lr:
  enabled: true                # true = ramp/hold/decay schedule; false = flat at configured LRs. Tripwires are unconditional either way.
  # --- schedule (per stage, in TRAIN STEPS) ---
  warmup_steps: 1000           # blind exponential ramp 1/lr_warmup_ratio -> 1.0, at run start and after every stage transition (rebuilt optimizers must not land at the peak on cold Adam moments)
  hold_steps: 20000            # train steps at scale 1.0 (the peak) before decay begins
  decay_halflife_steps: 25000  # exponential decay half-life after the hold; 0/null = hold at 1.0 forever. Decay buys back the late-run precision the LR jitter floor otherwise caps
  decay_floor_scale: 0.05      # decay stops at this scale (min_lr still floors the absolute LR per group)
  # --- FIRE: two-tier absolute tripwires on branch loss + pre-clip grad norm ---
  # cut tier = parameter thrash: LR cut in place, no rewind. reset tier = true
  # explosion (tb err at +1e4 scale, or non-finite): rewind to best + cut.
  # Loss bars are T-flat (the TB residual is intensive); grad bars are
  # T-extensive and ride the auto resolver.
  cut_loss_abs: 2.5e+3         # branch loss above this = thrash -> cut
  cut_grad_abs: 3800         # pre-clip grad norm above this = thrash -> cut. auto -> resolve_derived_config = 30 * gradient_norm_clip. Explicit = override
  reset_loss_abs: auto       # true explosion -> rewind + cut. auto -> resolve_derived_config = 10 * cut_loss_abs. Explicit = override
  reset_grad_abs: auto       # true explosion -> rewind + cut. auto -> resolve_derived_config = 10 * cut_grad_abs. Explicit = override
  cut_ratio: 0.5               # multiplicative cut per fire; cuts compound across fires. Instance-held (rewind-proof), reset to 1.0 at stage transitions
  fire_cooldown_steps: 500     # min train steps between finite fires on one channel. NB a fire also LATCHES its channel's cut tier until the metric recrosses below the cut bar; reset tier + non-finite ignore the latch
  # --- RECOVERY: re-ramp after a cut instead of keeping it for the stage ---
  recovery_target_frac: 0.85   # cruise at this fraction of the cut factor that was running at the last fire (0 = no recovery, cuts are stage-permanent). Inert unless > cut_ratio
  recovery_wait_steps: 3000    # COLD train steps (no fires AND every monitored reading below its cut bar) before the re-ramp starts
  recovery_ramp_steps: 1000    # exponential re-ramp duration from the cut level to the cruise target
  control_flow_lr: false       # false (default): flow/Z-head groups PINNED at lr_flow, exempt from scaling. true = uniform scaling, for A/B
weight_decay: 1.0e-4
use_weight_decay: false
compile_policy: auto           # torch.compile the dense policy trunk with inductor kernel fusion. 'auto' = Linux+CUDA only (no inductor on native Windows; dev boxes stay eager); true/false force it. Compile errors degrade to eager with a warning. Recompiles on every new batch size
traj_checkpoint: false         # gradient-checkpoint each rollout step: trajectory activation memory ~O(1) in T instead of O(T), at ~1 extra policy forward per step. Values/gradients identical to false (verified bitwise incl. RNG stream)
gradient_norm_clip: auto        # policy grad-norm clip. auto -> resolve_derived_config = 250 * grad_median(T)/6.6e3 * sqrt(W/512). Explicit number = override
ema_decay: null #0.95  # set to null for no ema # NOTE this breaks some important statistics - leave as null for now

# model parameters
################################################################
model:
  full_flow: false           # true for subtb or db losses
  # shared dimensions
  s_emb_dim: 512             # dimensionality of state embedding
  t_dim: 64                   # dimensionality of time embedding
  harmonics_dim: 64           # dimensionality of harmonic embedding
  condition_embedding_dim: 16  # dimensionality of the conditioning embedding
  # per-sub-model architecture
  t_hidden_dim: 512          # time encoder hidden dim
  s_hidden_dim: 512          # state encoder hidden dim
  s_layers: 4                 # state encoder layers
  policy_hidden_dim: 512     # forward/backward policy hidden dim
  policy_layers: 4            # forward/backward policy layers
  flow_hidden_dim: 512       # flow model hidden dim
  flow_layers: 4              # flow model layers
  cond_hidden_dim: 512       # conditioning embedding hidden dim
  cond_layers: 4              # conditioning embedding layers
  # regularization (shared)
  dropout: 0                  # dropout probability
  norm: layer                 # null, "layer" - DON'T PUT 'batch'
  zero_init: false
  # SDE params
  t_scale: 0.05               # scales fixed forward policy variance
  log_var_range: 6            # controls dynamic range of learned policy variance
  pb_drift_range: 0.4         # range of learned backward drift corrections
  pb_var_range: 6             # range of learned backward policy variance
  learn_pb: true              # whether to learn a correction to the backward policy
  learned_variance: true      # whether to learn policy variance
  clipping: true              # clip the maximum step size induced by the policy model
  gfn_clip: 200.0             # clip value for policy step size
  # Wrap the aunit centroid dims whose aunit spans the full cell width (auv == 1), so the SDE
  # flows through the aunit face instead of piling up against the bounding-energy wall. Axes
  # are resolved per space group and intersected over `space_groups`
  # (models/aunit_periodicity.py). Verified 2026-07-16 over all 123 SGs with defined aunit
  # bounds: auv==1 wrap-safe in 80/80 cases. Changes expanded_dim (wrapped dims get sin/cos
  # encoding), so NOT checkpoint compatible with a run trained without it.
  periodic_centroids: true  # for physical problems on crystals, not toy problems (false for toys)
  # diagonal-plus-low-rank (DPLR) forward covariance: C = diag(d) + V V^T, forward SDE only.
  # fixed marginal-variance budget: rho redistributes the existing policy variance
  # between private (d) and correlated (V) parts, it never inflates the marginal.
  dplr_rank: 6                 # rank r of the low-rank factor V; 0 = disabled (exactly original diagonal SDE)
  dplr_rho_max: 0.5            # cap on correlated variance fraction; also an exact cap on pairwise |corr_jk| <= rho_max. Keep < 1 strictly
  dplr_mask_angular: true      # zero the correlated fraction on wrapped dims (angular, plus any periodic_centroids ones); correlations then only couple non-wrapped dims. Required true when DPLR runs with periodic dims (asserted at construction)
  pb_exact_reversal: true      # P_B on angular dims: true = exact reversal of the wrapped reference bridge (mixture over arrival lifts); false = its single-image term. See docs/periodic_scoring_fix.html

# training params
################################################################
buffer_device: cuda           # where the churned/static sample stores live (replay + prior + anchor buffers, mol/prior datasets). 'cuda' turns per-step buffer draws/admits/purges into async device gathers instead of serial CPU work + host round trips; footprint ~1KB/graph. 'cpu' = legacy
batch_size: 2831              # number of samples per training batch -- single shared batch size for all rollout work (train fwd/bwd/replay/fused AND eval sampling)
grow_batch_size: false        # whether to dynamically grow the batch size to fill the RAM
max_batch_size: 2831
# jump-mode batch growth: multiply by batch_growth_factor once every batch_growth_interval steps
# so the run visits only ~log_f(max/base) distinct batch sizes (torch.compile treats each
# distinct size as a recompile). OOM cuts divide by the same factor, then cool down.
batch_growth_factor: 1.65
batch_growth_interval: 50       # steps between jumps before the first OOM. WITH compile_policy active use ~250-500 (each new size is a ~30-60s recompile stall); 50 is fine locally where compile is off
batch_growth_slow_interval: 300 # jump spacing after any OOM (congestion avoidance)
# --- automatic batch-size throughput optimization (train.py increment_batch_size) ---
# The growth walk measures marginal samples/sec at every jump; a jump that underperforms
# min_gain reverts one rung and PINS the batch for the current protocol stage. The pin
# re-arms at stage transitions and after OOM cuts. With this ON, max_batch_size is a
# safety ceiling rather than a target.
auto_batch_throughput_opt: true  # master switch; false = grow to max_batch_size/OOM as before
batch_growth_min_gain: 0.15  # marginal samples/sec gain a jump must clear to be kept. LOWER = climb higher up the saturation shoulder. 0.05-0.10 throughput-leaning, 0.15 steps-leaning
batch_knee_recheck_steps: 2000  # re-estimate a pinned knee every N steps: drop one rung and re-climb. 0 = pin holds until stage transition/OOM
oom_batch_shrink_factor: 0.5
oom_cooldown_steps: 200  # steps to hold batch_size flat after an OOM before resuming growth
eval_num_samples: 10000       # minimum number of samples for evaluation
test_eval_num_samples: 2000   # held-out conditional eval batch; inert while test_molecules_path is null
fused_grad_accum_min_samples: 1000  # fused steps only: effective-gradient floor. Batches BELOW this accumulate micro-steps until this many samples contribute; batches AT/ABOVE it take a plain unscaled step. 0 disables
epochs: 100000             # number of training epochs
eval_period: 250              # how often to do evaluation & reporting
figs_period: 500             # how often to log custom figures EXPENSIVE # must be multiple of eval_period or it won't fire

# SDE integration
################################################################
eval_T: 10                  # diffusion trajectory length for inference -- keep equal to integrator.T (the stab_july21 elj battery's eval_T=2T floored wass_debiased on an integration-dt mismatch artifact)
integrator:
  T: 10                        # static training diffusion length
  min_traj_length: 40
  max_traj_length: 40
  traj_length_strategy: static # 'static'  or 'sampled'  will do random between min and max traj lengths
  discretizer_max_ratio: 15    # maximum ratio between randomly sampled step sizes
  discretizer: uniform         # 'random' 'low_discrepancy' 'equidistant' 'uniform'

# BASE DEFAULTS for the per-mode loss coefficients. The live values on any
# given step are these blocks overlaid with the CURRENT protocol stage's
# loss_coeffs overrides -- a pure function of (defaults, stage), rebuilt every
# set_loss_coeffs() call. Keep these blocks structural; put anything a stage
# turns on in that stage's own override dict.
fwd_loss_coeffs:
  tb: 0.0
  z_level: 0.0  # Z-ONLY condition-grouped regression of log_Z(c) onto the LIVE per-condition mean log w, log w DETACHED (Z gradient without on-policy policy gradient). 0 = off
  freeze_policy: 0.0  # 1 => train Z only (detach policy + conditioner from the loss)
  freeze_z: 0.0       # 1 => train policy only, log_Z_learned detached. neither set => train both. fwd tb must be >0
  vg_lb: 0.0
  vg_lme: 0  # exclusive with vg_lb
  vg_by_condition: 0.0  # group VarGrad/emp_z estimation by condition_id instead of by the K-repeats tile
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0  # train Z(c) toward the batch's empirical per-condition estimate. NB: > 0 also disables fwd tb activation at phase1to3
  emp_z_persistent: 0  # sidecar: regress log_Z_learned onto condition_log_z's persistent per-condition estimate
  traj_grads: 0.0
  reward_grads: 0.0
  repeats: 1.0  # per-mode K-tiling factor
  loss_clip: 1.0E+9
  beta: 1000.0  # Huber beta
bwd_loss_coeffs:
  tb: 0.0  # must be nonzero for log Z backwards-trained warm start
  freeze_policy: 0.0  # 1 => train Z only
  freeze_z: 1.0       # 1 => train policy only, Z detached. neither => train both. bwd tb must be >0
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  vg_by_condition: 1.0  # group bwd VarGrad by condition_id (cross-terminal). Off-policy SAFE as a policy loss; doubles as mode retention. bwd emp_z asserted off with this
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  level_gap: 0.0  # linear term pulling J_B(c) onto J_F(c); coefficient = condition_log_z's detached EMA delta, self-cancels at gap 0
  level_gap_clamp: 10.0  # nats; bounds |coefficient| on the level_gap term
  mle: 0.0  # weighted MLE if VG is running with repeats, otherwise trajectory-wise. Default 0 -- train_prior turns it on
  tbc: 0.0  # trajectory balance consistency (arXiv:2209.02606 eq. 33): reward-free VarGrad over the K backward rollouts per terminal. REQUIRES repeats > 1. Default 0; train_prior turns it on
  repeats: 1.0  # per-mode K-tiling: K same-terminal backward rollouts for exact-MLE and tbc
  traj_grads: 1.0
  loss_clip: 1.0E+9
  beta: 10.0  # Huber beta for TB-style losses
replay_loss_coeffs: # applied to trajectories pulled from the replay buffer
  tb: 1.0
  freeze_policy: 0.0  # 1 => train Z only
  freeze_z: 1.0       # 1 => train policy only, Z detached. neither => train both
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  mle: 0.0
  repeats: 1.0  # replay replays stored trajectories (K copies would be identical), keep at 1
  traj_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10.0 # Huber beta for TB-style losses

# persistent per-condition empirical log Z tracker (buffer.py: ConditionLogZTracker)
condition_log_z:
  min_visits: 20  # a condition needs this many visits before tb_z_source: persistent / emp_z_persistent will use its estimate
  half_life_visits: 7.0  # tracker's evidence half-life, in OWN-VISITS (the conditional persistent-Z regime used 28; see mode_presets.yaml)
  trim_frac: 0.1  # per-condition-group trimmed mean for ema_logw
  max_batch_weight: 200.0  # caps how much effective evidence any single update() call can contribute
  discovery_half_life_steps: 200.0  # half-life (TRAINING STEPS) of the minima-discovery rate EMAs. Pure monitoring
  fwd_tb_z_source: learned  # 'learned' or 'persistent' (the conditional persistent-Z regime; see mode_presets.yaml)
  bwd_tb_z_source: learned
  replay_tb_z_source: learned
  weighted_condition_sampling: true  # fit-error-weighted forward mol draws; applies only in stages declaring the flag
  weighted_condition_sampling_clip_quantile: 0.99  # fit error clipped at this quantile and NORMALIZED by it -> scale-free priority in [0,1]
  weighted_condition_sampling_temperature: 0.3  # softmax temperature over the normalized priority
  weighted_condition_sampling_uniform_beta: 0.5  # fraction of each draw taken uniformly regardless of weight

# MLE slope gate (train.py update_mle_gate, runs on stages flagged mle_gate;
# publishes gates/mle_flat for the exit trigger). Regresses the RAW per-step
# bwd/mle batch loss sampled every 10 steps.
mle_slope_t: 2.0  # confidence multiplier on the descent rate's standard error. HIGHER = more conservative = exits later. An EQUIVALENCE test: noise argues AGAINST exiting
mle_min_rate: 0.05  # the negligible descent rate, nats per 100 train steps
mle_slope_window: 300  # train steps of raw-loss gate samples the slope is regressed over

# ============================================================================
# TRAINING PROTOCOL -- the declarative stage interface (protocol.py). Field
# docs: see the conditional_toy_protocol snapshot in mode_presets.yaml and
# protocol.py itself. This is the unconditional ELJ route as actually run in
# uncond_july28 / postfix_july30: train_prior (MLE) -> naive. The staged
# anchor_seed -> z_match -> buildout -> terminal route it replaces is
# preserved in uncond_july28/base_elj.yaml and in git history.
# ============================================================================
protocol:
  stages:
    # -- MLE warm-start: build a broad, self-consistent policy on the dataset
    #    prior (unconditional by design), then freeze it as THE prior model
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded          # a prior loaded by path IS this stage's product
      flags:
        update_log_z: true           # accumulate ema_logw / best_energy evidence
        scramble_conditions: true    # unconditional prior by construction
        mle_gate: true
      loss_coeffs:
        bwd: { mle: 1.0, tbc: 1.0, repeats: 2.0 }
      exit:
        - { metric: gates/mle_flat, above: 0.5, patience: 5 }
        - { metric: eval/wass_debiased, below: 0.015 }
        - { metric: bwd/tbc, below: 2.0 }
      on_exit: [ 'snapshot:phase1_exit', 'snapshot_prior' ]

    # -- ONE always-on terminal stage, straight off the MLE prior. No exit
    #    block: it runs to `epochs`. Each parameter group has exactly ONE
    #    trainer and each trainer one sampler:
    #      fwd    -> Z only (freeze_policy), on-policy. Z's sole source.
    #      bwd    -> policy only, from the churned prior_buffer: spread and
    #                mode retention, the long-horizon restoring force.
    #      replay -> policy only, from a |resid|-prioritized resample of the
    #                fwd rollouts (~200-step turnover): the over-weighting
    #                corrector. Stored trajectories, so its TB gradient has the
    #                same form as fwd's -- only the sampler differs.
    #    On-policy TB is mode-seeking (it only ever sees the policy's own
    #    support), which is why the policy term is taken off it; prioritized
    #    replay upweights both residual tails instead. fwd stays PINNED at 0.2
    #    not for Z's sake -- Adam cancels a single source's scale -- but because
    #    replay admission draws churn_rate=50 slots from the fwd batch, and a
    #    thin candidate pool degrades the buffer from prioritized to FIFO.
    #    No on_enter buffer surgery -- the dataset-seeded prior_buffer churns
    #    from step one.
    - name: naive
      train_mode: fused
      bwd_sampling_mode: prior       # churned prior_buffer, never the atomic dataset
      flags:
        update_log_z: true
        buffers_active: true
      # entry split puts the bwd/replay pair's mass at the idle ratio
      # (default_boost) so the controller starts at its own operating point
      fracs: { fwd: 0.2, bwd: 0.6, replay: 0.2 }
      min_fracs: { fwd: 0.02, bwd: 0.05, replay: 0.02 }  # INERT under kind: proportional; kept for a lexicographic switch-back
      deactivate_threshold: 0.01
      loss_coeffs:
        fwd: { tb: 1.0, freeze_policy: 1.0 }   # Z ONLY: policy + conditioner detached at the source
        bwd: { tb: 1.0 }               # freeze_z stays 1 from base: policy only
      balance:
        kind: proportional
        pinned: { fwd: 0.2 }               # must equal fracs.fwd
        metrics: { bwd: bwd/relative_under_wcen, replay: fwd/over_coverage }
        drive: relative
        # SOFT reference levels, not gates, and NOT a priority ratio: the two
        # metrics have different units, and 'relative' drive divides that out.
        # over_coverage 18.0 is the top of its settling band on the fixed-mix
        # dev run (17.0-17.8). Bound to that run -- re-read off a live trace
        # before trusting it on a different system.
        #
        # bwd 3.0 is UNCALIBRATED for this metric. It was read off the same run
        # as the top of relative_under's 2.48-3.18 band; the bwd metric has
        # since been swapped to relative_under_wcen, which drops the batch-
        # composition offset relative_under carries and so reads LOWER by an
        # unmeasured amount. Under drive: relative a target above the metric's
        # operating range pins the bwd drive at 0, which under the tilt makes
        # the split exactly default_boost. Read bwd/relative_under_wcen's
        # settled band off the next run and reset this before treating the bwd
        # side of the split as live.
        targets: { bwd: 3.0, replay: 18.0 }
        max_fracs: { replay: 0.45 }
        # The idle mix IS the controller's authority. At 0.94/0.06 the tilt was
        # one-sided and nearly inert: bwd sat at 94% of the pair with no
        # headroom, and replay needed over_coverage ~5x target to reach its cap.
        # With fwd no longer training the policy, replay is the ONLY corrector
        # for the policy's own over-weighted samples, so it needs a real dose
        # and real authority. At 0.75/0.25 a 2x over_coverage moves replay
        # 0.20 -> 0.32 and a 2x relative_under_wcen moves it 0.20 -> 0.11.
        default_boost: { bwd: 0.75, replay: 0.25 }
        alpha: 0.005
        floor: 0.03

# shared balance/fused mechanics (per-stage thresholds live in the rules above)
controller:
  min_mode_frac: 0.001  # FALLBACK frac floor for modes a stage's min_fracs doesn't name
  beta: 0.025  # probability mass the frac nudge moves per tick toward the boosted mode
  deactivate_threshold: 0.01  # FALLBACK for stages without their own. Fused loss only: skip computing a branch entirely if its frac falls below this. Keep < 1/3
  refresh_every: 10  # fused loss only: force-evaluate every non-dormant branch at least this often so its rolling stats don't go stale
  decay_rate: 0.95  # per-anneal-event tightening factor for annealed rule thresholds
  anneal_patience: 5  # consecutive all-clean balance ticks before one anneal event
  lookahead_horizon: 5  # rules with lookahead: true -- controller ticks to extrapolate metrics ahead before thresholding
  lookahead_trend_alpha: 0.1  # EMA smoothing on the estimated per-tick trend

# --- terminal policy-state detector (train.py::_terminal_policy_state) ---
# ABSOLUTE sanity bounds on the fwd channels -> "this is no longer physics" -> rewind to best +
# ratchet LR. RELATIVE spike monitors go blind once the explosion IS the median; these don't.
# Healthy: logw_std 8-46, box_violation 0.001-0.004. null disables a channel.
terminal_logw_std: 1000.0      # >20x the worst healthy logw_std (46), >100x below djr13t0j's death (1.8e5)
terminal_box_violation: 1.0    # ~300x above healthy (0.004); "samples a full unit outside a [-1,1] box"

conditional_worst_quantile: 0.25  # fraction of conditions allowed to sit beyond the bar for worst-case metrics; drives tb_err_worst / z_grad_worst / delta_worst (all upper-tail). Degrades to pooled on unconditional runs

buffers:
  prior_buffer:
    seed_source: 'prior_dataset'  # 'generated' or 'prior_dataset': seed at init with the full prebuilt prior dataset, FRESH per-sample records
    mean_lifetime: 100 # batch size adjusted mean lifetime to buffer samples
    weighted_bwd_beta: 0.9  # uniform fraction for stages with weighted_bwd_sampling; 0.9 => 10% of the bwd batch drawn ~ema_loss
    churn_batch_ref: 1000  # fixed reference batch size for churn pacing -- decoupled from the live batch_size so a growth event doesn't multiply buffer turnover (gejezmjg)
    min_size: 10000
    max_size: 250000
    init_fraction: 0.25  # rebuild_prior_by_churn refill target as a fraction of max_size, admitted through the online gate. INERT on this route: no stage declares that on_enter action
    condition_block_m: 1  # >= 2: bwd 'prior' draws are condition-blocked (M distinct same-condition terminals per block). Auto-active only while bwd vg_lb > 0. 0 = off
    reward_min: 0 # bootstrap-only fallback admission floor (absolute), used until a tracker/anchor_buffer exists to admit relative to each condition's best energy
    # quick_tb_stats' weighted under_coverage ramp, in ENERGY units of per-condition depth
    # above each condition's best known energy. ramp_floor doubles as manage_prior_buffer's
    # admission/reach-trigger margin (equivalence holds only at temperature==1.0; elj runs
    # hotter -- revisit if the ramp and admission margins need separating)
    ramp_floor: 100
    ramp_width: 50

  # trajectory replay buffer - stores full forward trajectories of overweighted on-policy
  # samples so they can later be exactly replayed (get_traj_replay) during the "replay"
  # training step
  replay_buffer:
    churn_rate: 20  # softmax-drawn admission attempts budgeted per manage call; SUPPLY-side
    max_size: 4000  # if too big or slow to churn it becomes a lagging indicator
    max_residence_steps: 250  # hard age eviction (train steps), 0 disables. MUST STAY ABOVE the occupancy cliff max_size/churn_rate (= 200) or TTL becomes the BINDING constraint and the buffer turns into a pure delay line (hhg6ux10)
    admit_temperature: 2.0  # softmax T (nats) over clipped |resid| (admission) / ema_loss (purge); fixed. replay_july26/tsched_july24: T 2 beat T 5, T 20 diverged
    admit_cap_max: 30.0  # admission/purge score clip (nats) when fwd/scatter_err == 0
    admit_cap_min: 8.0  # score clip (nats) as fwd/scatter_err -> inf
    admit_cap_health_h0: 10.0  # fwd/scatter_err at which the cap sits halfway between max and min
    admit_reward_min: -50

  # permanent archive of high-quality, mutually latent-distinct samples -- grows only
  # through admission, and tops up prior_buffer via noising + rescoring whenever a
  # prior-sampling churn cycle comes up short
  anchor_buffer:
    seed_source: 'prior_dataset'   # domain rule (mode_presets.yaml): molecule problems seed from prior_dataset; toys seed from the CONDITIONS .pt
    max_size: 200000
    dup_cutoff: 0.05          # latent L2 distance below which two CONFIRMED-SURPRISING candidates are literal duplicates; same-condition_id pairs only
    screen_energy_window: 20  # cheap screen's energy pre-filter vs that condition's Emin(c)
    thin_energy_window: 50   # thin()'s energy-window trim; monotonic and safe since Emin(c) only decreases
    surprise_cutoff: -5       # screen gate on the CENTERED TB residual (k=1 estimate)
    confirm_cutoff: -5        # confirm gate on the K-rollout logsumexp estimate
    confirm_k: 5               # backward rollouts for the logsumexp confirmation pass
    # policy-health gate on the whole screen/confirm path: admissions pause while pooled
    # fwd/r2 (EMA) sits below health_gate_r2 OR |fwd/tb_resid_clipped| exceeds
    # health_gate_zerr; cold channels abstain. r2 survives HERE as a damage detector only
    health_gate_r2: 0.9
    health_gate_zerr: 0.5
    replay_beta: 0.5           # random-floor fraction of anchor replay draws in top_up_prior_from_anchors
    thin_every_n_evals: 5     # cadence (eval cycles) for the energy-window thin/hard-cap pass
    refresh_every_n_evals: 3   # cadence (eval cycles) for refresh_anchor_buffer_surprise's full sweep
    noise_log_range: [ -2.5, -1.5 ]  # log10-uniform isotropic latent noise magnitude for prior top-ups
    topup_admit_record_breakers: true  # noised children that STRICTLY lower their condition's Emin(c) stand for anchor admission
    mcmc: # anchor_seed prior seed via local Metropolis reheat at target T; sweeps 0 -> isotropic noise_log_range kick
      sweeps: 0               # MIPCAS sg2 z'1 argmin probe, 512 chains: excursion/kT 5.28->7.05 at 200->10000 sweeps (equipartition D/2 = 6); 1500-4000 = measured thermalization; 200 leaves the mode half-melted. 0 = off
      burn_in: 2000              # adaptive-sigma sweeps; sigma frozen after
      init_sigma: 0.02           # starting per-row isotropic latent step
      target_accept: 0.3         # Robbins-Monro sigma target during burn_in
      sigma_adapt_rate: 0.1      # log-sigma step per sweep toward target_accept
      sigma_min: 1.0e-4
      sigma_max: 0.5
      energy_ceiling_kt: null    # reject proposals more than this many kT above a chain's running-best reward; null = off
      log_geometry: true         # per-condition latent covariance survey off the terminal ensemble
    reach_quantile: 0.9        # prior_buffer quantile (energy above own condition's best) checked against ramp_floor
    reach_threshold: 0.75      # trigger a purge-and-replace top-up if that quantile covers less than this fraction of ramp_floor
    reach_topup_size: 1000     # samples purged from prior_buffer's worst and replaced from anchors when the trigger fires

# energy function settings
################################################################
energy_function: 'elj'
temperature_conditioning: false  # if false, temperatures are set to temperature, and there is no annealing
molecule_conditioning: false  # conditions the generative prediction on the molecule
sg_conditioning: False  # whether to conditionally sample across space groups
space_groups: [ 2 ]  # which space groups to sample over ([1] for toys)
zp_conditioning: false # whether to condition over z prime values
z_primes: [ 1 ]
vector_conditioning: false  # per-sample condition vectors embedded through a plain MLP -- for toy energy functions
vector_conditioning_dim: 3  # inert while vector_conditioning is false
energy_config:
  internal_oom_recovery: true  # if false, an OOM propagates up to train.py's global batch size reduction instead of the energy function's own sub-batching loop
  temperature: 2.5 # room temperature kT in kJ/mol (1.0 for toys)
  log_temperature_range: [ 0, 0.693147 ]
  # loss coefficients
  density_coeff: 10.0  # how much to weight the density penalty term in the energy function
  bounding_coeff: 10.0  # static (the old soft-start + terminal anneal was removed with the terminal-stage redesign)
  reduction_coeff: 10.0
  lj_coeff: 1.0  # loss coefficient
  reward_range: 250 # max ptp of reward values allowed before soft clipping, null to go unrestricted
  analyze_kwargs: { }  # elj: none
