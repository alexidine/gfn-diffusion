#      exit:
        # worst-condition RMS TB residual in NATS. FIRST-RUN VALUE: the floor
        # here is the buffer's own within-condition Var(log w), which is
        # unmeasured for a broad buffer -- set this from the run's record.
#        - { metric: bwd/tb_err_worst, below: 5.0, patience: 2 }
#      on_exit: [ 'snapshot:thermalized' ]

    # -- z_match: level-matching handoff. bwd maintains the backward TB fit
    #    against the DETACHED Z(c) (freeze_z stays 1 from base); fwd trains
    #    Z(c) only (freeze_policy) on on-policy rollouts. gates/delta_worst =
    #    worst-condition |bwd_level - fwd_level| from ConditionLogZTracker's
    #    per-mode level streams (delta = -mean bwd residual at Z-stationarity,
    #    so bwd r2 recovery coincides with the gate closing). replay dark.
#    - name: z_match
#      train_mode: fused
#      bwd_sampling_mode: prior
#      flags:
#        buffers_active: false   # freeze the buffer through the handoff: bwd_level must be a STATIONARY target while Z walks toward the forward level. Churn resumes in terminal
#      fracs: { fwd: 0.1, bwd: 0.899, replay: 0.001 }
#      min_fracs: { fwd: 0.05, bwd: 0.05, replay: 0.0001 }
#      deactivate_threshold: 0.01
#      loss_coeffs:
        # beta stays at the base 10.0 here and in every stage: it sets the
        # scale of the clipped-residual ruler (fwd/tb_resid_clipped,
        # fwd/z_grad_worst, and the tracker's z_grad stream), so a per-stage
        # override silently rescales the metric the whole protocol is judged
        # against. If the elj Z-only entry loss needs a walkdown rate limit,
        # take it from the LR, not from beta.
#        fwd: { tb: 1.0, freeze_policy: 1.0 }   # Z-only Huberized TB
#        bwd: { tb: 1.0 }                       # policy-only vs detached moving Z
#      balance:
#        kind: lexicographic
        # BWD-HEAVY IDLE, measured on c17erxo7 vs 4ravi7j7 (A/B at matched steps).
        # Z is Adam-trained, so its step size is gradient-NORMALIZED: extra fwd
        # share buys a better gradient estimate, not a faster walkdown. What
        # actually closes delta is fwd_level RISING, which happens when the
        # POLICY improves -- and the policy is trained by bwd. The A/B: raising
        # Fwd Frac 0.05 -> 0.67 left delta unchanged-to-worse (13.38 -> 13.86 at
        # step 5200) and degraded the backward fit (scatter 4.93 -> 7.12).
        # So during z_match the forward branch needs only enough share to keep
