#        default_boost: { fwd: 0.1, bwd: 0.9 }
#        rules:
          # backward fit degrading = Z's demand outpacing the policy: shift
          # weight to policy maintenance until the fit recovers.
          # SAFETY NET only -- the bwd-heavy default above is what carries the
          # stage. scatter_err (SPREAD only) is the right channel: tb_err_worst
          # is level+spread and tb_err^2 = delta^2 + scatter^2 almost exactly on
          # this route, so a tb_err bar near the spread floor can never go clean
          # until delta is already ~0. Bar 10.0 = ~2.3x the 4.4 healthy floor;
          # scatter peaks ~15-28 during the entry walkdown (Z genuinely
          # outrunning the policy) and recovers below the bar by ~step 3700.
#          - { metric: bwd/scatter_err, above: 10.0, boost: bwd }
#      exit:
        # delta tolerance 2.0 -- the equilibrium gap is leakage-mass x
        # leak-severity and the elj floor is unmeasured; if delta plateaus
        # ABOVE this bar, the plateau level is the leakage floor readout, not a
        # defect. Toy values: 1.5 / patience 3 (fxr4h4zy exited at 0.14).
        # patience 15: fwd_level updates only on fwd rollouts (~1 per 10 steps),
        # so a shorter patience lets the gate fire on a stale phase-1 level
        # before the walkdown is real (stab_july21c: 30-step exits at min_lr)
        # MEASURED PLATEAU, not an aspiration: on this route delta_worst runs
        # 46 -> ~12 over ~5000 steps and then crawls (~0.3 per 300 steps and
        # decelerating), with the SAME trajectory under both guard variants
        # tested -- so ~10-12 is the leakage floor readout for this buffer, not
        # a controller defect (see the stage comment). A 2.0 bar simply never
        # fires and the run never reaches terminal. Re-tighten if a future
        # buffer (MC-thermalized / Boltzmann-reweighted seeds) lowers the floor.
#        - { metric: gates/delta_worst, below: 10.0, patience: 15 }
#      on_exit: [ 'snapshot:z_matched' ]

    # -- TERMINAL: active forward training. fwd policy frozen (Z-only), so the
    #    policy work is bwd (coverage off the churning buffer) + replay
    #    (on-policy retention). Ordering here is COVERAGE-FIRST, the old paper
    #    ordering, restored deliberately: on this route coverage is the thing
    #    that must not be lost, and by this stage the calibration ceiling is
    #    largely a capacity question the controller can't move anyway.
    #      Z > coverage-while-it-still-moves > calibration-not-degrading
#    - name: terminal
#      train_mode: fused
#      bwd_sampling_mode: prior
#      flags:
#        buffers_active: true         # churn resumes: the buffer tracks the policy
      # explicit entry split (buildout used to hand one over): z_match exits at
      # bwd ~0.9 / replay ~0.001, which would leave replay dark for thousands of
      # steps at the controller's 0.025/tick nudge rate
      # replay-leaning entry: the OBJECTIVE here is A = KL(P_F || pi P_B), and
      # replay is the branch that reduces it. bwd is the CONSTRAINT branch.
      # (Until the replay buffer refills, its share folds into bwd anyway --
      # fused_train_step does that explicitly -- so the effective entry is
      # bwd-heavy regardless for the first ~200 steps.)
#      fracs: { fwd: 0.2, bwd: 0.3, replay: 0.5 }
      # explicit floor/deactivation intent: NO mode may switch off in terminal.
      # bwd's floor sits ABOVE the deactivate threshold -- backward training
      # never goes to zero here (s706frkh: bwd starved to the old implicit
      # 0.001 floor and was skipped outright for ~1700 steps while
      # relative_under sat 4x over its bar; if Pf gets bad enough to demand
      # zero backward, the run is better restarted from a healthy snapshot)
      # fwd's floor is the Z-MAINTENANCE floor: bwd and replay both train the
      # policy against a DETACHED Z, so a stale Z shifts the whole log_pf
      # surface and (since log_pf normalizes) distorts the policy. ioq6wapu:
      # fwd decayed to 0.023, Z stopped tracking, and bwd/tb_resid_clipped ran
      # to -6.2 while delta went 6 -> 29 with every channel degrading together.
#      min_fracs: { fwd: 0.05, bwd: 0.01, replay: 0.0009 }
#      deactivate_threshold: 0.001
#      loss_coeffs:
#        fwd: { tb: 1.0, freeze_policy: 1.0 }   # THE stage flip: forward becomes Z-only
#        bwd: { tb: 1.0 }
#      balance:
#        kind: lexicographic
        # ===================================================================
        # TERMINAL = "reduce A without letting B blow up."
        #   A = KL(P_F || pi P_B)   mode-seeking error  -- THE OBJECTIVE
        #                           reduced by REPLAY (forward-population grads)
        #   B = KL(mu P_B || P_F)   mass-covering error -- THE CONSTRAINT
        #                           reduced by BWD (buffer-population grads)
        #   Z                       a NUISANCE PARAMETER, not an objective: it
        #                           has one d.o.f. but two populations want it
        #                           delta apart, so its placement decides WHICH
        #                           branch eats the error, never whether error
        #                           exists. Maintained by the fwd min_frac
        #                           floor above, NOT by a rule -- Z is
        #                           Adam-normalized, so it needs gradient
        #                           DIRECTION (a guaranteed slice), not volume.
        # NB delta_worst = A + B - C (C = KL(mu||pi), buffer quality) is
        # deliberately NOT gated on here: a WORSE buffer raises C and so LOWERS
        # delta, i.e. gating on it rewards degrading the buffer. It stays a
        # z_match handoff diagnostic only.
        # ===================================================================
#        default_boost: { replay: 0.8, fwd: 0.2 }   # idle: work the objective, keep Z fed
#        rules:
          # 1. Z-STALENESS TRIPWIRE. Watches the branch that TRAINS THE POLICY
          #    against a detached Z, never fwd/tb_resid_clipped -- fwd is
          #    freeze_policy here, so it trains Z and only Z and self-zeroes:
          #    ioq6wapu held it at +-0.1 for the whole stage (rule never fired,
          #    protocol/boost never once read 'fwd') while bwd's ran to -6.2
          #    and delta went 6 -> 29. A tautology, not a ruler.
          #    RELATIVE, not absolute: z_match parks Z at fwd_level by
          #    construction, so bwd's residual STARTS at ~-delta (-3.7 here).
          #    An absolute bar would latch on day one exactly like the 5.0
          #    tb_err bar did. This fires only when the offset GROWS, which is
          #    the divergence signature.
#          - { metric: bwd/tb_resid_clipped, abs: true, relative: best, margin: 1.5, drift: 0.003, boost: fwd }
          # 2. CONSTRAINT: B bounded. Coverage is the asset the route is built
          #    on and its loss is unrecoverable, so it outranks the objective.
          #    DELIBERATELY UNANNEALED. A constraint that tightens toward its
          #    own operating level latches into permanent breach and turns the
          #    lexicographic controller into a bang-bang oscillator. v3mmzucb
          #    ran the annealed version (min 1.0) and produced a GROWING limit
          #    cycle: bar ratcheted below relU's natural ~4-5 level, fired at
          #    relU 4.79, bwd annexed the batch (0.81) and starved fwd to its
          #    floor, A blew up (fwd/tb_err_worst 5.5 -> 24.3), coverage
          #    recovered, repeat -- with the second excursion 2.2x the first.
          #    8.0 fixed sits ~1.7x above the operating level, so it is quiet
          #    until coverage genuinely degrades. See controller-ratchet-
          #    marginal-breach: the anneal is one-way, its fixed point IS
          #    permanent breach, so retuning decay_rate/min was never the fix.
#          - { metric: bwd/relative_under, above: 8.0, boost: bwd }
          # 3. OBJECTIVE: A down. With Z well-placed on the fwd stream (rule 1
          #    keeps it so), fwd/tb_err_worst is ~the within-condition spread of
          #    log w on-policy, and A ~ spread^2/2 -- monotone in the objective.
          #    relative:best because the achievable floor RISES as coverage
          #    grows (an absolute bar deadlocks, b9ze0p5c).
#          - { metric: fwd/tb_err_worst, relative: best, margin: 1.15, drift: 0.003, boost: replay }
          # over_coverage RETIRED as a rule: it is the positive tail of the same
          # A that rule 3 measures completely, and as a separate 8.0 bar it was
          # already breached at 8.4 on entry -- it would fire permanently and
          # annex the batch (the c8utdn8q pattern). Still logged.
        # lexicographically LAST: bounding/reduction_coeff above are set LOW
        # (1.0) so they're soft for the WHOLE run, from train_prior onward --
        # only once every rule above has run clean for anneal_patience ticks
        # in a row (the same clean-streak event that tightens their
        # thresholds) does the live value ramp up off that base toward
        # `target`, never traded against an active violation. reduction_coeff
        # co-anneals with bounding_coeff since both introduce similar
        # boundary artifacts.
#        anneal_coeffs:
#          bounding_coeff: { target: 10.0 }
#          reduction_coeff: { target: 10.0 }

    # =====================================================================
    # ARCHIVED ALTERNATE METHOD -- the LOCALIZED FORWARD-FIRST route.
    # To restore it: replace the `thermalize` stage above with `anchor_seed`
    # below, and insert `buildout` between z_match and terminal. z_match and
    # terminal are shared by both routes (terminal's rule ORDER differs --
    # forward-first wants calibration above coverage, since it is rebuilding
    # coverage it deliberately gave up; see terminal's rules 2/3).
    #
    # The method: seed prior_buffer with 100 noised copies of each condition's
    # ARGMIN anchor (:flush replaces the buffer outright), freeze it, fit that
    # localized target, hand Z over, then let forward collapse onto it
    # (calibration over coverage) before terminal pries support back open.
    # Its known cost, and the reason for the swap: argmin-per-condition makes
    # c -> mu_c DISCONTINUOUS wherever two modes cross in depth, so the policy
    # is taught a map no smooth conditioner can fit, and terminal spends its
    # life unlearning it.
