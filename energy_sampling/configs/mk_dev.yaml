 # The live config-schema state this operational surface is written against.
# Generated runs record the state they were spawned from so a mismatch fails
# visibly. This is not a promise to migrate historical configs: add a transition
# only when an explicitly active config or checkpoint still needs one.
# This is a migration identifier, NOT a release version, and it is separate from
# the checkpoint problem_def's schema_version (which versions problem identity).
project_state_version: 10

run_name: 'mk_dev'
tag: 'dev'
seed: 12345
device: 'cuda'
cuda_memory_fraction: 0.9  # NOTE increment this to 0.97 when spawning a cluster run
anomaly_detection: false  # dramatic slowdown when True

# Checkpoints
################################################################
continue_from_checkpoint: false  # inert while checkpoint_name is set (train.py init_gfn takes that branch first); true resolves to this run identity's own _running.pt
mlip_path: null              # MLIP weights, for energy_function uma/mace only. Unused on elj and the toys. e.g. 'D:\crystal_datasets\esen_s.pt'
checkpoints_dir: 'D:\crystal_datasets\gfn_checkpoints'  # where this run writes and reloads every checkpoint
# Kept under a prefix no run writes to, so train_prior's own on_exit snapshot
# cannot overwrite the warm start it is being started FROM.
checkpoint_name: 'dev_mk_dev_elj-mipcas_sg2_zp1_elj_prior_dataset-T2.5-573c92_phase1_exit.pt'  # warm start: weights + optimizers + buffers, with its _buffers.pt sidecar. null = fresh run
prior_model_name: null       # a SEPARATE frozen GFN, used only to sample the prior buffer; rebuilt from its own stored config, so any architecture. To warm-start the POLICY from it instead, use checkpoint_name + load_weights_only
load_weights_only: false     # true = take only model weights from checkpoint_name; optimizers, buffers and step count start fresh
prior_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt  # seeds the prior buffer, and the anchor buffer on molecule routes
molecules_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_prior_dataset.pt  # the condition set the run trains over. Same file as the prior here: one molecule, unconditional
test_molecules_path: null    # held-out conditions, scored as eval_test. null = no held-out eval, and every eval_test metric is absent
archive_period: 5000         # freeze a step-tagged copy of 'running' every N steps (0/null = off). Hardlinked, so it costs disk but no write I/O  # todo on MLIP models set this to 1k
archive_buffers: true        # include the buffer sidecar in each archive; without it an archive can be inspected but not resumed
override_learning_rates: false  # on resume, replace the LRs restored from the checkpoint's optimizers with this config's. Adam moments are left as they were, and the LR bracket re-stamps every rate on its next tick anyway
checkpoint_read_only: false  # suppress ALL checkpoint WRITES ('running', 'best', archives, 'final'); loading stays active. For smoke tests and refactor validation, which resume real state but must not rewrite the run they resumed from
warm_start_ignore_problem_keys: null  # list of problem-definition keys a warm start may differ on. Only the keys in checkpointing.WARM_START_EXEMPTIBLE are nameable; the rest change what the target IS, and are refused at load. Every exemption is printed
rewind_tolerance: 0.25       # 'last_ok' is relinked whenever the combo loss is within this FRACTION of the running best, additively in the metric's own scale (so it holds for negative metrics such as bwd/mle). 0 = only a new best relinks
nonfinite_abort_streak: 50   # consecutive steps with a non-finite gradient before the run aborts outright. check_spike cannot catch this -- it reads last_grad_norm_pre_clip, which the non-finite path leaves at its last FINITE value. 0 = never abort
freeze_backward_policy: false  # freeze P_B from step 0 of THIS process. false | true (= 'full') | a mode string. The stage actions freeze_pb / unfreeze_pb are how to switch it at a boundary; a checkpoint carrying a snapshot has already restored it and is not overwritten

#Optimizers
################################################################
# Each lr_* key below takes one of two spellings:
#   auto   BRACKET-MANAGED. Starts at lr_control.seed_lr and is then multiplied
#          by the one scale the brute-force bracket sets. Requires an
#          `lr_control` block; with none nothing sets the scale, the run trains
#          at the seed for its whole life, and the config reads as adaptive
#          (refused at load).
#   float  a FIXED rate. Takes divergence handling and the max_lr rail; the
#          bracket's scale never touches it. Mixing is legal (lr_fused: auto,
#          lr_back: 3e-4).
# There is no (W, T) scaling rule here. lr_flow is neither -- see below.
lr_policy: auto
lr_back: auto
lr_replay: auto
lr_fused: auto
lr_flow: 0.1                 # PINNED: exempt from the bracket's scale entirely, because it is a different object. Unconditional flow_model is a LearnableScalar (convex 1-D, O(lr) jitter at this LR); conditional nets use 1.0e-4
min_lr: 1.0e-8               # PERMISSIVE ON PURPOSE: a floor is a numerical backstop, not a policy, and it must never be the thing choosing the rate. A binding floor silently turns the conservative burn-in rate into a hotter one -- and then the root the bracket measures from is not the rate the config named. lr_ctrl/lr_floored_groups reports when it binds
max_lr: null                 # hard ceiling on every group's rate, applied AFTER the bracket's scale. null = no cap. Refused at load if <= 0 or <= min_lr -- clamp order decides which bound wins, so the pair must not cross

weight_decay: 1.0e-4
use_weight_decay: false
# ============================================================================
# CONVERGENCE / EXIT CRITERION -- rate of improvement, not slope.
# PUBLISHED AND NOT CONSUMED unless a stage names `gates/progress_done` in its
# `exit` block. Emitted by Modeller.progress_metrics, which is route-agnostic.
#
# WHY NOT A SLOPE BAR. `gates/mle_flat` tests the slope of bwd/mle, which cannot
# be calibrated even in principle: bwd/mle carries an unknown additive constant
# H(p_data), and any slope bar is satisfied eventually by a slowly-descending
# curve. Measured on tetraglycine it fired at 0.04 nats/100 steps while the loss
# fell in a visibly straight line.
#
# Each metric below has a TARGET, so the remaining gap is computable and the
# question becomes "what fraction of it closes over the next `horizon` steps".
# The gate fits the local decay and projects -- so `horizon` sets the QUESTION,
# not the estimator, and can be changed freely without retuning anything else.
#
# LEVEL GATE (owner 2026-08-26): plain absolute bars on the two w1r headline
# stats, judged on a short trailing median -- "we just pick a number". The
# rate/projection/veto design is no longer the default; it remains reachable
# via mode: 'rate' and _PROGRESS_GATE_RATE.
# CALIBRATION SCALE (owner): median 5 / worst 10 = decent;
#                            median 2 / worst 5  = incredibly good.
# An absent channel BLOCKS the verdict, never passes by absence -- and
# progress_metrics ABSTAINS loudly when it cannot run at all.
progress_gate:
  mode: level
  level_window: 2500       # trailing-median smoothing: one noisy eval dipping
                           # under a bar must not end a stage
  min_history: 2000
  metrics:
    - { key: 'w1r/median', bar: 5.0 }
    - { key: 'w1r/worst',  bar: 10.0 }

# ---- THE LEARNING RATE ------------------------------------------------------
# A BRUTE-FORCE BRACKET. Burn in at a deliberately conservative fixed rate,
# checkpoint the complete mature state, run a configured grid of fixed-LR
# continuations from that one checkpoint, find the lowest rung that detonates,
# and keep the highest rung a safety margin below it. Nothing here is estimated,
# fitted, pooled or servoed; every rate the run applies is a number written in
# this file.
#
# WHY, AND IT IS WORTH READING ONCE. The adaptive controller this replaced
# steered `peak_scale` to a line-search optimum alpha*. alpha* is defined as
# s*/lr, so the slope of log(alpha*) against log(lr) MUST be -1 -- and measured
# 0.00 +- 0.2 across twelve runs, two stages and 2.7 decades of rate. The sensor
# was uncorrelated with the variable it steered, and everything built on it (the
# pooled estimator, the sweep, the rung ladder, alpha_target) inherited that. A
# cruise that held one rate for 1,200 steps with zero moves was reported as the
# controller working; it is the null output, and the null output is what a dead
# sensor produces. The bracket's only reading is "did this candidate detonate",
# which is not a statistic and so cannot be uncorrelated with the rate.


lr_control:  # todo RIP OUT the whole bracket -- scope and the three decisions it needs are in docs/TODO.md #1
  mode: fixed              # bracket | fixed. `fixed` performs burn-in, then holds fixed_scale and runs no trials -- for batteries of related runs where the rate is already known
  seed_lr: 1.25e-4           # what an `auto` lr_* key resolves to. THE CANDIDATE SCALES ARE MULTIPLIERS ON THIS, so a seed that is wrong by 10x moves the whole grid off the interesting region and the bracket reports unbracketed_high or all_failed rather than a boundary
  control_flow_lr: false     # true = the flow/Z groups also take the bracket's scale

  # ---- DIVERGENCE RESPONSE -----------------------------------------------
  # A fire ALWAYS rewinds (weights, EMA, optimizer moments) to the freshest
  # non-diverging checkpoint, and the max_reloads_per_1k_steps budget still
  # aborts a run that keeps re-detonating. This knob controls only whether the
  # RATE moves afterwards.
  #
  # 1.0 = the rate never moves, which is what makes an LR fan readable: with no
  # cut ever applied, the scale recorded in every checkpoint IS the nominal
  # scale, so fire_loss_spike's set_state_dict restore is a no-op and the rate
  # is pinned at nominal by induction. Under `mode: fixed` with repeat_every 0
  # the fire response is the ONLY thing that can move the scale, so 1.0 makes it
  # immutable for the stage and every arm keeps naming its own rate.
  #
  # The cost is deliberate: a genuinely too-hot arm re-detonates instead of
  # descending, burns the reload budget and dies. That death IS the measurement
  # -- "this rate does not hold, first fired at step N" -- where a descending
  # arm yields a rate nobody chose and a trajectory that is half one rate and
  # half another (measured: acr_b_aug31's only improving arm ran 20x below its
  # label, having cut twice during burn-in).
  #
  # Set below 1.0 only for a run whose goal is a good model rather than a clean
  # rate measurement, and expect to read lr_ctrl/scale rather than the arm name.
  fire_cut_factor: 1.0

  # ---- 1. BURN-IN --------------------------------------------------------
  # Exactly burn_in_steps at burn_in_scale, then the root checkpoint. Step count
  # only: it never waits on a learned metric to settle.
  #
  # THIS IS WHERE THE LONG HORIZON BELONGS, and the reason is arithmetic.
  # Optimizers are rebuilt at every stage transition, so Adam's step counter t
  # restarts, and Adam's update carries sqrt(1-beta2^t)/(1-beta1^t) relative to
  # steady state:  t=10 -> 0.153, t=100 -> 0.309, t=500 -> 0.627, t=1000 ->
  # 0.795, t=3000 -> 0.975. Bracket from a young root and EVERY trial descended
  # from it runs at that fraction of its nominal rate, so a too-hot rung survives
  # for a reason that has nothing to do with the rate. Burn-in is paid ONCE;
  # trials are paid N times. This is the cheap place to spend steps.
  burn_in_steps: 3000        # ~0.975 bias correction at beta2 0.999
  burn_in_scale: 0.05        # x seed_lr = 6.25e-6, the conservative end of the range measured survivable on this route (5e-6 through 8e-5 clean; 2e-4 non-finite by step 1560)
  # GO / NO-GO ON MEASURING AT ALL, checked once, when burn-in ends and the
  # root is taken. Pass -> the grid runs and a rate is selected. Fail -> NO
  # TRIALS RUN, and the stage holds burn_in_scale for its whole length: the
  # run trains at 0.05 x seed_lr with only a print to say so. The factor is
  # read from the optimizer's own step counter, not from burn_in_steps, so a
  # stage that never rebuilt its optimizers passes it trivially and correctly.
  min_root_bias_correction: 0.9   # at burn_in_steps 3000 the factor is ~0.975, so this cannot fire; lower burn_in_steps far enough and it does

  # ---- 2. THE CANDIDATE GRID -------------------------------------------
  # todo goes with the bracket -- docs/TODO.md #1
  # Strictly ascending multipliers on seed_lr, i.e. 6.25e-6 .. 2.0e-4 here. WIDE
  # ENOUGH THAT THE TOP RUNGS ARE EXPECTED TO FAIL -- a grid that fits inside the
  # safe region finds no boundary on any cycle and selects one rung below its own
  # ceiling, which is a number this file chose dressed as a measurement. 2e-4 is
  # where this route was measured to go non-finite, so the top rung is a real bet.
  candidate_scales: [ 0.05, 0.1, 0.2, 0.4, 0.8, 1.6 ]
  # SHORT, AND THERE IS NO FLOOR. Every trial restores a root whose Adam moments
  # are already equilibrated, and changing the LR does not invalidate `v` (it
  # estimates the gradient second moment, not the step size), so the
  # 1/(1-beta2)=1000 warm-up argument does not apply. Divergence from a too-hot
  # rate takes tens of steps. And CRUISE IS THE LONG TRIAL: a rate that survives
  # the screen and detonates at step 400 of cruise surfaces through the ordinary
  # fatal-error path, at a cost of one detonation rather than a silently wrong
  # rate held for tens of thousands of steps. The horizon validates itself --
  # steps_to_failure is recorded for every failure and a late one publishes
  # lr_bracket/horizon_marginal.
  trial_steps: 150
  safety_rungs: 1            # select this many rungs BELOW the lowest confirmed failure, so the margin IS the grid spacing (2x here) and the selected rate is one a trial actually ran. Widen the margin by widening the grid, not by cutting off the boundary
  # THE DOMINANT COST KNOB, more than trial_steps. A cycle costs about
  # len(candidate_scales) x trial_steps discarded steps: 900 here, negligible
  # amortised over a stage. At 1000-step trials on a 10k clock it would be 60% of
  # a stage, which on the MLIP routes can eat a 48-hour SLURM budget in
  # calibration alone. 0 = once per stage, which is the default posture; a
  # transition re-brackets regardless, because the optimizers were rebuilt.
  repeat_every: 20000

  # ---- 3. CONFIRMING THE BOUNDARY ----------------------------------------
  # Hard failure is stochastic, so one unlucky low rung would otherwise bound the
  # whole search far below the real boundary. The re-run uses a DIFFERENT seed,
  # derived from the root: screen trials all restore an identical RNG state so
  # they are comparable, which makes a same-seed re-run a deterministic replay
  # that reproduces the failure by construction and confirms nothing. A rung that
  # survives its repeat is recorded as a non-reproducing failure and the search
  # continues upward from it. Both of these are hard-capped -- no adaptive loop,
  # no convergence criterion.
  boundary_confirm_repeats: 1
  boundary_densify: true    # insert ONE geometric rung between the boundary and the survivor below it, once. Refines the boundary by one step and nothing more

  fixed_scale: 0.2           # mode: fixed only -- the multiplier held for the whole run, x seed_lr. On a standalone config this is redundant with seed_lr; it stays a separate key so a battery arm can override one number and keep the same seed_lr as its bracket-mode siblings
  trial_settle_steps: 10     # head of each trial where the BAR verdicts are not judged -- trials jump burn-in -> candidate instantly, and that jump alone produced few-step excursions past k x span on a quiet root. Non-finite values and exceptions still fail inside it. Refused at load if >= trial_steps
  logz_detour_nats: 2.0      # a candidate FAILS if its batch-mean log_Z_learned falls more than this many nats BELOW the root's -- one-sided, so a dip-and-recover survives and a detour does not. Catches a minority-branch destabilization the frac-weighted composite bar is blind to under a dominant bwd frac. Judged outside the settle window; inert wherever Z does not train. null/0 = off
  verbose: true

  # ---- 4. HARD FAILURE ----------------------------------------------------
  # TWO JOBS, ONE SET OF BARS: they fail a trial candidate, AND they are the live
  # tripwire on ordinary steps, where a hit rewinds to the last checkpoint and
  # spends one of the max_reloads_per_1k_steps budget.
  #
  # THE EXCURSION BAR IS DERIVED, NOT WRITTEN. A written 1.0e+9 catches numerical
  # overflow and nothing else -- a rate one rung too hot took this route's loss
  # from -25 to +318, eight orders under that bar. It is a SPAN, hi + k x (hi-lo)
  # over the burn-in window, not a ratio: the MLE channel crosses zero, so a
  # running minimum has no positive scale to divide by.
  # config_invariants.lr_bracket_is_well_formed refuses a bar that high.
  #
  # ONE CHANNEL PER step_type (fwd/bwd/replay/fused), judging the scalar that
  # step backpropagates -- so the channels differ by orders of magnitude and in
  # SIGN. A channel below min_observations gets no bar and can fail only on the
  # absolute backstops.
  hard_failure:
    loss_excursion_k: 10.0   # bar = root_hi + k x (root_hi - root_lo), per branch
    grad_excursion_x: 100.0  # bar = x  x  the largest pre-clip grad norm seen at the root
    loss_abs: 1.0e+6         # numerical backstop only; >= 1e8 is refused at load
    grad_abs: 1.0e+6
    # THE BARS ARE DRAWN TWICE. Above they are fitted to the tail of burn-in, at
    # burn_in_scale -- right for judging a trial (every trial restores that root),
    # wrong for the live tripwire, which then holds for a whole stage at a hotter
    # rate that moves the loss more for ordinary reasons. After promotion they are
    # refitted from ordinary training AT the promoted rate. Watch
    # lr_bracket/bars_redrawn and the step in lr_bracket/bar_loss_<channel>.
    # In `fixed` mode nothing tested the rate, so the cold bars stay live until
    # the refit replaces them: too tight costs a rewind, absent costs the run.
    cruise_rederive: true      # false = the live tripwire keeps the cold root bars for the whole stage
    cruise_settle_steps: 200   # steps discarded after promotion before the redraw window opens, so the rate change's own transient is not fitted as normal
    root_window: 200         # the TAIL of burn-in that defines the root scale. The opening of burn-in is the transient burn-in exists to pass through, and folding it in would inflate the span by the very movement that must not count as normal
    min_observations: 20     # below this on every channel, no bar can be derived and the bracket REFUSES rather than running with bars that cannot fire


# GPU region timing (profiling.py). OFF, and off is the normal state: with no
# block, or enabled false, `region()` returns one shared no-op and an energy call
# allocates nothing extra. Enable it to answer "how much GPU time does the energy
# consume", which wall clock cannot see through an async launch -- it reports
# energy/seconds_gpu beside the existing wall-clock energy/seconds, and their
# RATIO (energy/gpu_over_wall) is the reading: ~1 means the call occupies the
# device, >1 means work outlives the return, <1 means host-bound.
profiling:
  enabled: false
  regions: null              # null = every region asked for; a list restricts it
  # Layer 2: a BOUNDED torch.profiler window -- op-level CPU and CUDA detail,
  # written as files (a chrome trace + a text table) beside the run, never to
  # wandb. Left on, torch.profiler dominates what it measures and the trace grows
  # too large to open; bounded to a few steps its cost does not scale with run
  # length, and once written the window latches shut for the rest of the run.
  # start_step is deliberately late: the opening steps are CUDA context creation,
  # autotuning and cold caches, so profiling them measures startup, not training.
  trace:
    enabled: false
    start_step: 1500         # train step the window opens at
    active_steps: 8          # steps profiled, after which the window latches shut for the rest of the run
    outdir: profiling_results  # written beside the run as files, never to wandb
    write_trace: false       # also write the chrome timeline JSON. OFF: measured 748 MB for 8 steps (~93 MB/step) on ELJ with shapes and stacks both off, which is unopenable and is what pins active_steps to single digits. The *_table.txt beside it is 9 KB and carries the op breakdown; turn this on only when a TIMELINE is the question
    record_shapes: false     # per-op input shapes; larger trace, needed to spot a shape that recompiles
    with_stack: false        # python stacks; expensive, and only useful when the op table cannot say WHICH call site
compile_policy: false          # torch.compile the policy. false = eager; 'auto' = on for Linux+CUDA only (no inductor on native Windows); true forces it; 'step' compiles the whole per-timestep body instead of the trunk submodules. Compile errors degrade to eager with a warning. Recompiles on every new batch size
traj_checkpoint: false         # gradient-checkpoint each rollout step: trajectory activation memory ~O(1) in T instead of O(T), at ~1 extra policy forward per step. Values/gradients identical to false (verified bitwise incl. RNG stream). Set TRUE by default under MACE or UMA
# WHICH BRANCHES checkpoint. null = all of them. Only the forward branch holds
# the energy function's footprint, so under rare rollouts the bwd/replay steps
# pay the recompute while sitting on headroom nothing uses -- [fwd] buys the
# step time back there. fwd is usually MOOT in the list either way: checkpointing
# is skipped whenever grad is off, and at fracs.fwd 0 the forward branch carries
# no gradient. THE RISK IT DOES NOT REMOVE is fragmentation: peak memory is the
# worst step's, so a large bwd allocation can leave no contiguous block for the
# next rollout's MLIP even where each step fits alone. Inert while traj_checkpoint
# is false, and the OOM ladder's set_traj_checkpoint action clears it outright.
traj_checkpoint_modes: null    # null | a list from [fwd, bwd, replay]
# Fallback clip. With grad_clip_guard on it does NOT clip the policy -- the guard
# does -- so here it governs only the flow head in the z_calibration sidecars.
# `auto` is fitted to POLICY gradient magnitudes and is not calibrated for that.
gradient_norm_clip: auto     # explicit number overrides
# The policy's actual clip while enabled. Per branch, because an MLE gradient and
# a TB gradient are different distributions. See grad_clip_guard.py.
grad_clip_guard:             # per-branch quantile bar on pre-clip policy grad norms
  enabled: true                # false -> the bar is gradient_norm_clip, unchanged
  p: 0.99                      # target quantile; the bar binds on 1-p of steps
  eta: 0.01                    # log-space step of the bar per observation
  warmup_steps: 100            # observations per branch before the tracked bar takes over
  warmup_clip: static          # bar until then: static = gradient_norm_clip, off = no clip
  max_ratio: 100.0             # furthest the bar may travel from its last calibration, either direction
  refresh_on_stage: true       # recalibrate at stage transitions, holding the outgoing bar live meanwhile
ema_decay: null                # set to null for no ema # NOTE this breaks some important statistics - leave as null for now
max_reloads_per_1k_steps: 1.0  # divergence-rewind budget, as a RATE: a run is aborted once total rewinds exceed this x steps/1000 (floor 3). A rate rather than a count so a long run is not aborted for the same per-step behaviour as a short one

# model parameters
################################################################
model:
  full_flow: false           # true for subtb or db losses
  hold_dead_latent_rows: true  # clamp the latent rows that carry no degree of freedom for this (space group, Z') to their fixed values. false = let the policy write them, which trains dimensions the energy cannot see. The index set is per space group, NOT per crystal system
  # shared dimensions
  s_emb_dim: 512             # dimensionality of state embedding
  t_dim: 64                   # dimensionality of time embedding
  harmonics_dim: 64           # dimensionality of harmonic embedding
  condition_embedding_dim: 16  # dimensionality of the conditioning embedding
  # per-sub-model architecture
  t_hidden_dim: 512          # time encoder hidden dim
  s_hidden_dim: 512          # state encoder hidden dim
  s_layers: 4                 # state encoder layers
  policy_hidden_dim: 512     # forward/backward policy hidden dim
  policy_layers: 4            # forward/backward policy layers
  flow_hidden_dim: 512       # flow model hidden dim
  flow_layers: 4              # flow model layers
  cond_hidden_dim: 512       # conditioning embedding hidden dim
  cond_layers: 4              # conditioning embedding layers
  # regularization (shared)
  dropout: 0                  # dropout probability
  norm: layer                 # null, "layer" - DON'T PUT 'batch'
  zero_init: false
  # SDE params
  t_scale: 0.05               # scales fixed forward policy variance
  log_var_range: 6            # controls dynamic range of learned policy variance
  pb_drift_range: 0.4         # range of learned backward drift corrections
  pb_var_range: 6             # range of learned backward policy variance
  learn_pb: true              # whether to learn a correction to the backward policy
  learned_variance: true      # whether to learn policy variance
  clipping: true              # clip the maximum step size induced by the policy model
  gfn_clip: 200.0             # clip value for policy step size
  # Wrap the aunit centroid dims whose aunit spans the full cell width (auv == 1)
  # so the SDE flows through the aunit face instead of piling up against the
  # bounding-energy wall. Resolved per space group and intersected over
  # `space_groups` (models/aunit_periodicity.py); wrap-safe in all 80 SGs with
  # defined aunit bounds. Changes expanded_dim, so NOT checkpoint compatible
  # with a run trained without it.
  periodic_centroids: true  # for physical problems on crystals, not toy problems (false for toys)
  # Diagonal-plus-low-rank forward covariance C = diag(d) + V V^T, forward SDE
  # only. Fixed marginal-variance budget: rho redistributes the existing policy
  # variance between private (d) and correlated (V) parts, never inflating it.
  dplr_rank: 6                 # rank r of the low-rank factor V; 0 = disabled (exactly original diagonal SDE)
  dplr_rho_max: 0.5            # cap on correlated variance fraction; also an exact cap on pairwise |corr_jk| <= rho_max. Keep < 1 strictly
  dplr_mask_angular: true      # zero the correlated fraction on wrapped dims (angular, plus any periodic_centroids ones); correlations then only couple non-wrapped dims. Required true when DPLR runs with periodic dims (asserted at construction)
  pb_exact_reversal: true      # P_B on angular dims: true = exact reversal of the wrapped reference bridge (mixture over arrival lifts); false = its single-image term. See docs/periodic_scoring_fix.html

# training params
################################################################
buffer_device: cuda           # where the churned/static sample stores live (replay + prior + anchor buffers, mol/prior datasets). 'cuda' turns per-step buffer draws/admits/purges into async device gathers instead of serial CPU work + host round trips; footprint ~1KB/graph. 'cpu' = legacy
batch_size: 1000              # number of samples per training batch -- single shared batch size for all rollout work (train fwd/bwd/replay/fused AND eval sampling). CONDITIONAL ARM: 1000 (pinned: condition_draw's C = batch_size // 2 and the replay occupancy both scale with it)
grow_batch_size: false         # whether to dynamically grow the batch size to fill the RAM. false = select_batch_size never runs (no growth ladder, no max_step_seconds guard); an OOM cut then stands until a resume. CONDITIONAL ARM: false
max_batch_size: 20000
eval_num_samples: 10000       # minimum number of samples for evaluation
test_eval_num_samples: 2000   # held-out conditional eval batch; inert while test_molecules_path is null
fused_grad_accum_min_samples: 1000  # fused steps only: effective-gradient floor. Batches BELOW this accumulate micro-steps until this many samples contribute; batches AT/ABOVE it take a plain unscaled step. 0 disables
epochs: 100000             # number of training epochs
eval_period: 250              # how often to do evaluation & reporting
figs_period: 500             # how often to log custom figures EXPENSIVE # must be multiple of eval_period or it won't fire
# --- batch sizer (train.py select_batch_size; state 8, docs/design/phase6_batch_sizer.md) ---
# Two objectives in strict priority: occupancy constraint first, then optimizer-step
# throughput -- whose answer is the CONSTANT batch_size = fused_grad_accum_min_samples,
# so there is no throughput walk. With batch_util_target set (and grow_batch_size true,
# max_batch_size > batch_size), the sizer calibrates once per stage: it climbs rungs of
# batch_growth_factor, dwelling batch_growth_interval steps at each to measure step time
# and raw occupancy, holds the smallest rung clearing the target, says INFEASIBLE loudly
# when none does, and stands a kept growth back down if a full policy window fails to
# confirm it. Everything else here is a safety BOUND, never a selector.
batch_growth_factor: 1.6       # ladder rung spacing below the cap (torch.compile treats each distinct size as a recompile, so rungs are few)
batch_growth_cap: 1000          # rung step ceiling in samples: grow geometrically until batch*(factor-1) reaches this, then climb linearly at it. Bounds the held rung's overshoot past the true occupancy crossing to one accum quantum -- at large batch a factor-f overshoot costs up to ~40% of update rate, a 1000-sample one <=10%. The price is more compile shapes on a high climb. 0 = uncapped geometric
batch_growth_interval: 50       # minimum per-rung calibration dwell, in steps. WITH compile_policy active use ~250-500 (each new size is a ~30-60s recompile stall); 50 is fine locally where compile is off
batch_util_target: 0.0          # occupancy target the calibration must clear before holding a grown batch, as a FRACTION of the card (0.6 = 60% busy), NOT a percentage -- the sensor reports percent and the one conversion happens in train.select_batch_size. 0 = off. CONDITIONAL ARM: 0.0 (refused beside grow_batch_size false)
gpu_util_window_s: 900  # trailing WALL-CLOCK SECONDS averaged into gpu/util_recent
gpu_util_sample_period_s: 2   # wall-clock seconds between occupancy samples, taken on a background thread (never from the training loop, whose fixed intra-step phase biased the reading). Occupancy is bimodal -- measured sd ~19 pts over a 2..83 range, autocorrelation ~24 s -- so at 60 s a 900 s window held 15 point samples and carried ~3 pts of sampling error against a 5.4 pt cancellation bracket. Retention and the min-span gates scale off this value (train.py _gpu_util_capacity, _UTIL_MIN_SPAN_S); a rung dwell shorter than _UTIL_MIN_SPAN_S is unmeasurable by design, so batch_growth_interval must be worth at least that in wall clock
gpu_util_policy_window_s: 7200  # trailing wall-clock seconds averaged into gpu/util_policy, matching the window the cluster averages over when deciding to cancel. The scheduler judges its own out-of-process sampler, not this reading (docs/design/phase6_handoff.md section 2)
max_step_seconds: 60  # RUNAWAY GUARD, not a tuning knob: cut the batch only once the median step exceeds this. Stands down for the stage if a cut does not actually move step time (a fixed per-step cost is not batch-driven, and cutting further only shrinks the gradient). 0 = off
oom_batch_shrink_factor: 0.625
oom_cooldown_steps: 200  # steps to hold batch_size flat after an OOM before the sizer recalibrates
batch_oom_ceiling_retest_steps: 1000  # steps an OOM ceiling stands with no further OOM before it is cleared and an INFEASIBLE conclusion re-probes. Every OOM restarts this clock. A failed re-probe costs a shrink_factor cut, so this is not free. 0 = the ceiling never expires
batch_sizer_retest_steps: 1000    # steps a TARGET_MET ladder stands before it re-measures. Occupancy moves under a verdict -- the model grows, buffers fill, compile settles -- and until this existed the only re-arm was an OOM ceiling expiring, so a run that never took a train OOM never looked again. Only target_met is re-probed; infeasible has the ceiling clock, stood_down failed an audit, wallclock_cut is outranked. 0 = a satisfied ladder is final

# SDE integration
################################################################
# MUST equal integrator.T -- enforced at config load. Drift and variance are
# learned per step at one dt, and P_B's reference bridge is written in
# accumulated-variance time, so a different dt integrates a different SDE.
eval_T: 10
integrator:
  T: 10                        # training diffusion length, and the only trajectory-length parameter -- the discretizer is always uniform over T

# BASE DEFAULTS for the per-mode loss coefficients. The live values on any
# given step are these blocks overlaid with the CURRENT protocol stage's
# loss_coeffs overrides -- a pure function of (defaults, stage), rebuilt every
# set_loss_coeffs() call. Keep these blocks structural; put anything a stage
# turns on in that stage's own override dict.
# THE KEYS, defined once for all three blocks. Same name, same slot -- but
# several mean materially different things per mode, and those are called out.
#
# OBJECTIVES (a weight on a loss term; 0 = that term is off)
#   tb                trajectory balance. The default objective.
#   vg_lb / vg_lme    VarGrad, lower-bound or log-mean-exp centring. MUTUALLY
#                     EXCLUSIVE. Reward-free in the sense that the group centre
#                     replaces log Z, so they need a GROUP to centre over -- see
#                     GROUPING below, which is where the modes diverge most.
#   db / subtb        detailed balance / sub-trajectory balance. Both need
#                     model.full_flow: true. subtb_lambda is subtb's discount.
#   mle               bwd/replay only. Maximum likelihood on stored terminals;
#                     what train_prior warms the policy up with.
#   tbc               bwd only. Trajectory-balance consistency: reward-free
#                     VarGrad over K backward rollouts from ONE terminal, so it
#                     REQUIRES repeats > 1 in the bwd sense below.
#   pf_boost          bwd/replay only. A P_F retention term.
#   z_level           fwd only. Z-only regression of log_Z(c) onto the live
#                     per-condition mean log w, with log w detached: a Z
#                     gradient without an on-policy policy gradient.
#   emp_z             train Z(c) toward THIS BATCH's empirical per-condition
#                     estimate. emp_z_persistent regresses onto the tracker's
#                     PERSISTENT estimate instead -- batch vs accumulated.
#   pooled_vg         fwd only, and CROSS-BRANCH: one condition group spanning
#                     fwd rollouts AND buffer draws, so the fwd/bwd level offset
#                     is penalised structurally instead of being a flat
#                     direction of each branch's own term. Lives on
#                     fwd_loss_coeffs but ARMS THE BACKWARD blocked draw
#                     (config_invariants.runs_grouped_vargrad), and that
#                     predicate is unscoped by train_mode -- so a nonzero BASE
#                     value flips condition_block_m 0 -> 2 in every bwd stage,
#                     train_prior included. Turn it on in the stage that runs
#                     it, not here. pooled_beta is its OWN Huber knee, not the
#                     branch's (fwd/bwd rows sit ~lambda_b*Delta from the pooled
#                     centre, so scale it with the measured zmatch/delta_mean);
#                     pooled_ratio is the buffer share of the group, 0.5 being
#                     the 50:50 design point. pooled_source picks the group's
#                     other side: 'fwd' (this step's rollout rows) or 'replay'
#                     (the replay branch's draw); pooled_ratio is then bwd's
#                     share against it.
#   level_gap         bwd only. A controller pulling J_B(c) onto J_F(c); the
#                     coefficient is a detached EMA delta, so it self-cancels at
#                     gap 0. level_gap_clamp bounds the per-row force in nats.
#
# WHAT TRAINS (these gate the gradient, they are not losses)
#   freeze_policy: 1  train Z only -- policy and conditioner detached at source.
#   freeze_z: 1       train policy only -- log_Z_learned detached.
#                     Neither set = train both. Setting both trains nothing.
#   traj_grads: 0     detach the trajectory, so the loss cannot push back
#                     through the rollout. Nonzero keeps that path live.
#   reward_grads: 0   fwd only. Nonzero lets d log R / d x_T reach the policy.
#
# GROUPING -- the part where the same key is NOT the same thing
#   repeats           K-tiling: each drawn row is replicated K times. What a
#                     tile MEANS differs by mode, and this is the trap:
#                       fwd    the K copies share a condition but roll out to
#                              DISTINCT terminals -> a cross-terminal group,
#                              which is what VarGrad-by-condition needs.
#                       bwd    the K copies share the TERMINAL -> the reward
#                              cancels, giving TBC rather than cross-terminal
#                              VarGrad. A different object entirely.
#                       replay stored trajectories, so K copies are identical.
#                              Keep at 1.
#                     So fwd/repeats is the near-analogue of bwd/replay
#                     condition_block_m (M distinct same-condition terminals),
#                     NOT of bwd/repeats.
#   condition_block_m bwd and replay only. >= 2 makes the DRAW condition-blocked
#                     -- sample conditions, then up to M distinct rows
#                     (different terminals) each -- which is the only way those
#                     two branches get a cross-terminal group without birthday
#                     collisions. It shapes the draw for THIS loss, which is why
#                     it sits here rather than on the buffer, and it is inert
#                     unless the branch's own VarGrad coefficients are on.
#   vg_by_condition   group by condition_id instead of by the K-repeats tile.
#                     On a single-condition (unconditional) run every row is one
#                     group, so a tile-grouped loss is singleton-grouped and
#                     reads identically zero.
#
# NUMERICS
#   beta              Huber beta for the TB-style losses.
#   loss_clip         absolute ceiling on the per-row loss.
fwd_loss_coeffs:
  tb: 0.0
  z_level: 0.0
  freeze_policy: 0.0
  freeze_z: 0.0
  vg_lb: 0.0
  vg_lme: 0
  vg_by_condition: 0.0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0                # NB > 0 also disables fwd tb activation at phase1to3
  emp_z_persistent: 0
  tb_z_source: learned    # 'learned' | 'persistent'. CONDITIONAL routes want persistent -- set it in the stage, not here
  traj_grads: 0.0
  reward_grads: 0.0
  repeats: 1.0            # fwd tiles share a condition and land on DISTINCT terminals -- the cross-terminal group VarGrad needs
  loss_clip: 1.0E+9
  beta: 10.0
  pooled_vg: 0.0          # HELD AT 0 HERE: a nonzero base flips condition_block_m 0 -> 2 in EVERY bwd stage. Turn it on in var_conditioning
  pooled_beta: 40.0       # its OWN knee, not the branch's: fwd/bwd rows sit ~lambda_b*Delta from the pooled centre. Scale with the measured zmatch/delta_mean, not once
  pooled_ratio: 0.5       # buffer share of the pooled group. 0.5 = the 50:50 design point
  pooled_bridge_only: 0.0 # > 0.5 = restrict the buffer side of the draw to rows whose CONDITION the forward batch also holds. A kept row with no forward partner forms a single-source group, where the term degenerates to the backward branch's own and buys dilution instead of bridge. Read pooled_pairable_frac for the ceiling and pooled_lambda_b for what the ratio actually got
  pooled_source: fwd      # 'fwd' | 'replay': which branch's live rows pair with bwd's in the pooled term; pooled_ratio is then bwd's share against that branch. KEEP 'fwd' HERE and set 'replay' on the stage that runs the term: it is refused wherever pooled_vg is 0, where replay cannot carry weight, or with buffers.replay_buffer.prioritise.enabled. Published as pooled/pooled_source_replay
bwd_loss_coeffs:
  tb: 0.0                 # must be nonzero for the log-Z backwards-trained warm start
  freeze_policy: 0.0
  freeze_z: 1.0
  detach_pb: 0.0          # 1 = log P_B on this branch's rows is detached (no P_B gradient from this branch; P_F gradient untouched)
  vg_lb: 0
  vg_lme: 0
  vg_by_condition: 1.0    # cross-terminal here, so off-policy SAFE as a policy loss, and it doubles as mode retention. bwd emp_z is asserted off with this
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  tb_z_source: learned    # 'learned' | 'persistent'. CONDITIONAL routes want persistent -- set it in the stage, not here
  level_gap: 0.0
  level_gap_clamp: 10.0
  mle: 0.0                # train_prior turns this on
  tbc: 0.0                # REQUIRES repeats > 1. train_prior turns this on
  repeats: 1.0            # bwd tiles share the TERMINAL, so the reward cancels: this gives TBC, not cross-terminal VarGrad
  condition_block_m: 2    # >= 2: 'prior' draws are condition-blocked (M distinct same-condition terminals per block). Auto-active only while bwd vg_lb > 0. 0 = off
  traj_grads: 1.0
  loss_clip: 1.0E+9
  beta: 10.0
replay_loss_coeffs:       # applied to trajectories pulled from the replay buffer
  tb: 1.0
  freeze_policy: 0.0
  freeze_z: 1.0
  detach_pb: 0.0          # 1 = log P_B on this branch's rows is detached (no P_B gradient from stored paths; P_F gradient untouched); the pooled term's live stash carries the detached value
  vg_lb: 0
  vg_lme: 0
  vg_by_condition: 0.0    # needs condition_block_m >= 2 below to form groups at all: replay repeats is 1, so the tile path is singleton-grouped and reads identically zero
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  tb_z_source: learned    # 'learned' | 'persistent'. CONDITIONAL routes want persistent -- set it in the stage, not here
  mle: 0.0
  repeats: 1.0            # stored trajectories, so K copies would be identical. Keep at 1
  condition_block_m: 0    # >= 2: replay draws are condition-blocked (M distinct same-condition terminals per block). Auto-active only while replay vg_by_condition > 0 and vg_lb/vg_lme > 0. 0 = off. Mutually exclusive with buffers.replay_buffer.prioritise (blocked draws bypass p); the draw raises if both are on
  traj_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10.0

# persistent per-condition empirical log Z tracker (buffer.py: ConditionLogZTracker)
# NOTE on this route the tracker is MONITORING ONLY: all three tb_z_source keys
# are 'learned', emp_z_persistent is 0, z_calibration runs in rollout mode, and
# no stage declares weighted_condition_sampling. Nothing below feeds a gradient
# or a controller here -- it becomes load-bearing on the conditional route.
condition_log_z:
  min_visits: 20  # a condition needs this many visits before tb_z_source: persistent / emp_z_persistent will use its estimate
  half_life_visits: 200.0  # evidence half-life in OWN-VISITS, not steps. A "visit" is one update() call and a FUSED stage runs its branches together, so a two-branch stage burns two per train step -- 200 visits is ~100 steps there, ~200 on a single-branch unconditional run. A short half-life makes ema_logw little more than the last few batches, which destabilises the conditional route. Matches buffer.DEFAULT_HALF_LIFE_VISITS
  trim_frac: 0.01  # per-condition-group trimmed mean for ema_logw. log w is heavy-tailed here (logw_std 8-46), and a 1% two-sided trim removes the handful of extreme draws that would otherwise set the mean
  max_batch_weight: 200.0  # ceiling on the evidence one update() may contribute, in samples. At batch 1000 with ESS ~0.4 a call would otherwise carry ~400; capping at 200 with a 7-visit half-life puts the steady-state effective_count near 200/(1-0.5^(1/7)) ~ 2100
  discovery_half_life_steps: 200.0  # half-life (TRAINING STEPS) of the minima-discovery rate EMAs. Pure monitoring
  # {fwd,bwd,replay}_tb_z_source MOVED -> {fwd,bwd,replay}_loss_coeffs.tb_z_source.
  # It is a property of what a branch's loss does, and loss_coeffs is the one place
  # a protocol stage can override per branch -- so the conditional route now adopts
  # it automatically instead of needing three hand-edits at every mode switch.
  weighted_condition_sampling: true  # draw forward CONDITIONS in proportion to condition_log_z's tracked per-condition FIT ERROR, so badly-fit conditions come up more often. Applies only in stages declaring the flag. NB this is the forward half of a pair whose two sides read different signals: forward draws pick conditions and weight on a per-condition statistic; backward draws pick stored terminal states and weight on each row's own ema_loss
  weighted_condition_sampling_clip_quantile: 0.99  # fit error clipped at this quantile and NORMALIZED by it -> scale-free priority in [0,1]
  weighted_condition_sampling_temperature: 0.3  # softmax temperature over the normalized priority
  weighted_condition_sampling_uniform_beta: 0.5  # fraction of each draw taken uniformly regardless of weight
  rollout_condition_draw: iid  # how a forward rollout picks its batch_size mol_dataset rows. 'iid' = uniform without replacement within a rollout (or the weighted measure above, on a stage declaring the flag). 'cycle' = without replacement ACROSS rollouts: a shuffled pass over every row, reshuffled when spent; not checkpointed, so a resume starts a fresh pass. 'under_drawn' = p ~ (1 + n)^-power, n = trainable replay rows the row's conditions hold. Non-iid is refused beside a stage declaring flags.weighted_condition_sampling. Applies to every forward rollout (cadence, warm-up, trigger, z-pin, z_calibration). CONDITIONAL ARM: 'cycle'
  rollout_under_drawn_power: 1.0  # the power in 'under_drawn'; must be > 0 there. Read by 'under_drawn' only, so any other value under another draw is refused as a dead key

# Interspersed Z-only calibration: extra Z optimizer steps per policy step.
# Silent when disabled, inside the deadband, cold, mid-accumulation, or in a
# scramble_conditions stage.
z_calibration:  # todo RE-KEY: servo and fill are two mechanisms under one block name, and on this route the servo is entirely OFF (flags.z_calibration false) -- mode/sensor/sensor_quantile/threshold/grace/gain/max_steps_per_step and the whole regression sub-block below are 12 dead keys. What each half can actually do: docs/design/z_calibration_capabilities.md. Naming decision: docs/TODO.md #2
  # WHICH stages run this is now a stage flag (`z_calibration: true` in a stage's
  # flags block); everything below is only HOW. Off by omission, which is what the
  # conditional protocol wants -- as a global `enabled` this was a hand-edit every
  # mode switch had to remember. Parameters below are set for the UNCONDITIONAL
  # route; retired to hygiene duty after the 9x mean-pinned-Z falsification.
  # 'rollout': fresh fwd rollout under freeze_policy, scored by the fwd TB loss,
  #   so sidecar and fused step share one fixed point. Also feeds replay intake.
  # 'replay': same gradient over stored trajectories -- no energy call, but Z is
  #   calibrated to the buffer's measure, which lags the policy by the replay
  #   buffer's mean residence (buffers.replay_buffer.mean_residence_steps).
  # 'regression': least squares onto the tracker's ema_logw.
  mode: rollout              # SERVO mode (rollout|replay|regression) -- NOT the fill's. The fill's is fill_mode below
  sensor: pooled           # WHICH EMA THE TRIGGER READS. pooled = |EMA fwd/tb_resid_clipped| off the metric tracker, clipped at fwd_loss_coeffs.beta => exactly dL/dZ of the fused loss. grad_rms/rms/worst read the CONDITION tracker instead (z_grad_ema clipped at clip_beta / z_bias_ema unclipped / its upper tail). All four are LIVE on a single-condition run -- they are RMS or quantiles of the SIGNED level error, not of a cross-condition dispersion, so with one condition each collapses to that condition's own |EMA residual| and reads 0 only while the tracker is cold
  sensor_quantile: 0.5       # sensor: worst only -- the upper-tail quantile over conditions that worst_z_bias reads. Inert on the other three sensors
  threshold: 0.5             # nats. Same bar as buffers.anchor_buffer.health_gate_ceiling. Must stay above the flow head's own jitter floor (O(lr_flow) = 0.1 here)
  grace: 0.8                 # early-out bar as a fraction of threshold: the loop stops once a rollout's OWN fresh reading clears threshold * grace, rather than running out the sampled step count against a stale EMA
  gain: 1.0
  max_steps_per_step: 100.0
  # --- level fill: a direct re-level for gaps the servo cannot close ---
  # Fires only where the forward branch is Z-only (freeze_policy) on the
  # unconditional scalar head -- the equilibration stage below. Reads that
  # step's own logw, so it costs no rollout and no energy call.
  fill_mode: absorb          # 'absorb' = a 1-D Kalman filter on log Z: every measurement moves it by its own precision share K = P/(P+se^2). 'snap' = the gated overwrite, which is what fill_threshold/fill_se/fill_cooldown_steps below are the gates FOR -- under absorb all three are inert bar the notes on each
  fill_process_var: 0.01     # absorb only. Nats^2 per step added to P between applied measurements: how fast the level is assumed to drift while unmeasured. Larger = later measurements count for more
  fill_moment_reset: 0.5     # absorb only. Nats of |dz| above which the flow parameter's Adam moments are dropped; a small absorbed step leaves them meaningful
  fill_from_eval: fill       # off|report|fill. The eval rollout is 2500-10000 samples, so its se is the lowest the run ever measures and the absorber gives it a K near 1. CONDITIONAL ARM: 'off'
  fill_threshold: 0.5        # nats. Under ABSORB this is only the enable switch: any value > 0 arms the fill, 0 or null disables it. Under snap it is the deadband -- |log_Z - the batch's TB fixed point| must exceed it -- defaulted there at 2x fwd_loss_coeffs.beta, where the clipped dL/dZ the servo reads is fully saturated and the fill is the only instrument left. CONDITIONAL ARM: 0.0 (the fill cannot act on a Z(c) head; the Z sidecar's emp_z pins Z(c), and fwd_z_sidecar waives the cadence's fill requirement)
  fill_se: 5.0               # SNAP only: the gap must also exceed this many standard errors of the fixed point. Under absorb the se enters the Kalman gain instead of a gate, and only a non-finite se (no unclipped row) blocks
  fill_cooldown_steps: 0     # train steps before another fill may fire. 0 under absorb: the cooldown exists because a snap re-arms off fwd/tb_resid_clipped, an EMA still reporting the pre-fill level; the absorber reads the batch root directly and weights repeat measurements by precision
  # --- mode: regression only (inert on this route, which runs rollout) ---
  min_visits: null  # per-condition visit floor for a condition to enter the regression target set; null = the tracker's own condition_log_z.min_visits
  freshness_half_life_steps: 300.0  # regression weights decay by condition staleness (TRAIN STEPS since that condition's last tracker update), so a stale ema_logw target counts less than a current one
  se2_floor: 0.25  # nats^2 floor on a condition's estimated target variance, so the inverse-variance weights cannot blow up on a condition whose few samples happened to agree
  holdout_modulus: 8         # conditions with id % this == 0 are excluded from the fit and reported as z_cal/holdout_rms; a growing gap vs z_cal/train_rms means the head is fitting tracker noise. 0 = no holdout

# ============================================================================
# TRAINING PROTOCOL -- the declarative stage interface. Field docs live in
# protocol.py's module docstring, which is the authority on what a stage may
# declare. Two stages: train_prior (MLE) -> equilibration.
# ============================================================================
# Read by the upper-tail metrics the stages below gate on -- tb_err_worst,
# z_grad_worst, delta_worst -- so it lives with them rather than among the buffer
# knobs it has nothing to do with.
conditional_worst_quantile: 0.25  # fraction of conditions allowed to sit beyond the bar. Degrades to pooled on unconditional runs
# Per-condition PASS BARS for the two log_condition_fraction channels. Each is the
# per-row bar; conditional_worst_quantile above is how many conditions may miss it.
nonthermal_entropy_per_dim: 4.0  # nats/DoF defining the excess-energy bar u_star, against each condition's own energy floor. Publishes Excess Energy Nats {Mean,P50,P90,P99,Max} and Nonthermal fractions. 0 or null = the whole excess-energy channel is off
nonthermal_cond_bar: 0.1     # a condition FAILS when more than this fraction of its rows sit above u_star (higher is worse)
reasonable_cond_bar: 0.5     # a condition FAILS when fewer than this fraction of its rows pass _reasonable_sample_mask (higher is better)
per_step_probe_steps: 0      # log this many RAW per-step fwd values after arming -- no EMA, no tracker, which is the point: the tracker's smoothing destroys a 2-step mode. 0 = off

# THE LIVE PROTOCOL, by name. Every protocol lives below, so the alternatives sit
# side by side in one file and can be compared rather than reconstructed from git.
# SWITCHING ROUTE IS NOT THIS ONE WORD: four settings sit OUTSIDE the stage list
# and do not come across with it. The table is in docs/module_protocol.md §2
# ("Switching route"); two of the four are enforced at load by
# config_invariants.conditional_z_settings_are_conditional. conditional_vargrad's
# var_conditioning also needs the buffer and rollout-draw globals marked
# "CONDITIONAL ARM:" beside their keys in this file (same doc, second table).
protocol: unconditional_tb

protocols:
  # -- UNCONDITIONAL: MLE warm start, then one always-on terminal stage.
  unconditional_tb:
    stages:  # comments in here need to be cleaned up again
      # -- MLE warm-start: build a broad, self-consistent policy on the dataset
      #    prior (unconditional by design), then freeze it as THE prior model
      - name: train_prior
        train_mode: bwd
        bwd_sampling_mode: dataset
        skip_if: prior_loaded          # a prior loaded by path IS this stage's product
        # "The LR is hot" sensor -- REPORT-ONLY, moves nothing. It fills a
        # measured gap: `lr_ctrl/divergences` was 0 across all 97 stage segments
        # swept, INCLUDING all 19 failures, so the hard tripwire does not fire on
        # this failure mode at all. It compares the channel's current level
        # against the 10th percentile of a short trailing window and fires on a
        # single row -- no dwell, because a bad raw batch is smeared by the
        # metric EMA into a ~10-row bump, so a confirmation count would only
        # DELAY the same false fire while costing a real detection. Headroom is
        # the defence instead.
        #
        # THE THRESHOLDS ARE CALIBRATION DATA, like the grad-clip quantile: fitted
        # on the EMA-smoothed LOGGED channel, per stage, and not transferable
        # between stages or derivable at runtime. They also inherit their noise
        # margin from MetricTracker(period=100) -- change that period or the
        # 10-step logging cadence and every bar here is silently rescaled, which
        # is why lr_hot_sensor asserts the period rather than trusting a comment.
        # `absolute` because bwd/mle crosses zero (+9.75 to -33.74), where a log
        # ratio is undefined. 31 rows = 300 steps.
        # ⚠ WEAKEST OF THE THREE: this bar rests on ONE deliberate ~16x seed-LR
        # overshoot, so it stays report-only until 2x and 4x calibration arms run.
        hot_lr_sensor: { channel: bwd/mle, form: absolute, rows: 31, above: 5.0 }
        # NO `lr_sensor` BLOCK, and that is now the correct default rather than
        # a trap. Learning rates come from the run-level brute-force bracket
        # (lr_control), not from a per-stage sensor. `ray` and `hyper` survive
        # here only as opt-in DIAGNOSTICS that reach no learning rate; declaring
        # `ray` on this stage costs about 4.8% of step time at period 500, so it
        # is a purchase rather than a default.
        flags:
          update_log_z: true           # accumulate ema_logw / best_energy evidence
          scramble_conditions: true    # intent flag; applies only on conditional problems
        loss_coeffs:
          bwd: { mle: 1.0, tbc: 0.0, repeats: 1.0 }
        # EXIT ON THE LEVEL GATE (progress_gate at the top of this file):
        # gates/progress_done is 1 once every configured w1r bar is met on the
        # trailing median. PATIENCE 1 -- the gate's median window supplies the
        # persistence. An absent channel blocks the verdict rather than passing,
        # and progress_metrics ABSTAINS loudly when it cannot run at all.
        exit:
          - { metric: gates/progress_done, above: 0.5, patience: 1 }
        on_exit: [ 'snapshot:phase1_exit', 'snapshot_prior' ]

      # -- ONE always-on terminal stage, straight off the MLE prior. No exit
      #    block: it runs to `epochs`. Each parameter group has exactly one
      #    trainer and each trainer one sampler:
      #      fwd    -> Z only (freeze_policy), on-policy
      #      bwd    -> policy only, from the churned prior_buffer
      #      replay -> policy only, from a resample of the fwd rollouts. Stored
      #                trajectories, so its TB gradient has the same form as
      #                fwd's -- only the sampler differs.
      #    This is the direct 1->3 route (var_conditioning skipped): on_enter
      #    inherits what var_conditioning's entry would otherwise have done --
      #    rebuild_prior_by_churn swaps the dataset-seeded buffer for one built
      #    through the online admission gate (composition), and
      #    bootstrap_z:train_conditioner puts Z(c) somewhere reasonable before
      #    rollout-driven TB resumes and unfreezes the conditioner train_prior's
      #    scramble_conditions left frozen (nothing else here ever trains it).
      - name: equilibration
        train_mode: fused
        bwd_sampling_mode: prior       # churned prior_buffer, never the atomic dataset
        # "The LR is hot" sensor -- REPORT-ONLY, moves nothing. It fills a
        # measured gap: `lr_ctrl/divergences` was 0 across all 97 stage segments
        # swept, INCLUDING all 19 failures, so the hard tripwire does not fire on
        # this failure mode at all. It compares the channel's current level
        # against the 10th percentile of a short trailing window and fires on a
        # single row -- no dwell, because a bad raw batch is smeared by the
        # metric EMA into a ~10-row bump, so a confirmation count would only
        # DELAY the same false fire while costing a real detection. Headroom is
        # the defence instead.
        #
        # THE THRESHOLDS ARE CALIBRATION DATA, like the grad-clip quantile: fitted
        # on the EMA-smoothed LOGGED channel, per stage, and not transferable
        # between stages or derivable at runtime. They also inherit their noise
        # margin from MetricTracker(period=100) -- change that period or the
        # 10-step logging cadence and every bar here is silently rescaled, which
        # is why lr_hot_sensor asserts the period rather than trusting a comment.
        # 11 rows = 100 steps. Longer windows are strictly worse (separation
        # 6.3x at 100 steps, ~4.5x at 2000): healthy runs decline, so an older
        # floor sits below the current level and an ordinary pause reads as
        # drawdown. Detection 7/7, false positives 0/11.
        hot_lr_sensor: { channel: fwd/scatter_err, rows: 11, above: 2.0 }
        # todo THE OTHER lr_sensor KINDS ARE NOT WRITTEN DOWN ANYWHERE (docs/TODO.md #6a).
        # A stage may declare `lr_sensor: {kind: hyper|ray, ...}`, and those blocks carry
        # live keys that appear in NO config:
        #   kind: hyper   beta, beta_down, cos_target, every        (train.py:5082, :5137)
        #   kind: ray     alphas, n_sub, period, dual_score,
        #                 log_grid, larder_depth                    (train.py:2938)
        # Under the mk_dev-carries-everything rule they belong here as commented blocks.
        # NB the ray block was DELETED rather than flagged off (owner 2026-08-26: an enable
        # flag beside the stage declaration is a second switch able to disagree with it).
        # A commented block is not a second switch, so this probably does not conflict --
        # but it needs saying once before the block goes back in.
        flags:
          update_log_z: true
          buffers_active: true
          z_calibration: false          # the unconditional route's Z sidecar. Omitted on conditional_vargrad, which is what every completed conditional battery did
        on_enter: [ 'rebuild_prior_by_churn', 'bootstrap_z:rollout:4000' ]
        # ENTRY POINT ONLY: `balance` below seeds its share from these and walks
        # the split from here, so this states where the stage STARTS, not where it
        # settles. Both modes enter strictly inside their `bounds`, so the ramp has
        # room in both directions from step one.
        fracs: { fwd: 0.0, bwd: 0.9, replay: 0.1 }
        # Per-mode frac floors; the integrator kinds fold these into `bounds` at
        # parse. A floor at or above deactivate_threshold keeps that branch
        # always active; below it, the branch may switch off entirely.
        #min_fracs: { fwd: 0.0, bwd: 0.02, replay: 0.02 }
        deactivate_threshold: 0.01
        # --- FORWARD ROLLOUT CADENCE (docs/design/rarer_rollouts.md) -------------
        # THIS IS THE STANDARD MECHANISM, not an opt-in mode. The forward branch is
        # the only branch that calls the energy function, so this cadence IS the
        # energy-cost axis of a training step. `fwd_rollout_every: 0` is the
        # non-rare limit -- roll out every step -- and is a point on this axis, not
        # a bypass of it.
        # THE RARE REGIME (every > 1) REQUIRES TWO OTHER KEYS TO MOVE. Both are
        # refused at load, not silently ignored:
        #   flags.z_calibration -> false      that servo's rollout mode makes its own
        #                                     energy call per Z step, off a sensor frozen
        #                                     between rollouts, so it fires on every
        #                                     SKIPPED step and restores the cost removed
        #   z_calibration.fill_threshold > 0  z_level_fill is then the ONLY thing pinning
        #                                     log Z at each rollout; absent or 0 disables
        #                                     it and leaves log Z unpinned between them
        # Neither applies at every == 0: every step carries its own free fill stash,
        # and the servo's sensor is never stale.
        fwd_rollout_every: 20                 # run fwd on 1 step in N; 0 = every step. This is
                                             # the BACKSTOP period -- the triggers below are
                                             # what set the cadence in practice
        z_pin_rollout_every: 0               # an extra rollout whose only product is the
                                             # z_fill stash: carries no gradient and its rows
                                             # do not enter the replay buffer. Must be > 0 AND
                                             # strictly less than fwd_rollout_every, or it
                                             # fires on no step at all. 0 = off
        # fwd_z_sidecar: false               # true = on every rollout that is not a z-pin, the
                                             # forward loss is ADDED to the fused loss at weight
                                             # 1, outside the frac mix. Needs fwd_rollout_every
                                             # > 0; the stage must declare fracs, a
                                             # deactivate_threshold above fwd's share, and
                                             # loss_coeffs.fwd freeze_policy 1 + emp_z > 0
                                             # (+ fwd repeats >= 2, grouped), and nothing may
                                             # raise fwd. Waives z_calibration.fill_threshold
        # replay_warmup_rows: 0              # > 0 = roll out EVERY step until the replay buffer
                                             # holds this many trainable rows, then latch off for
                                             # the stage (never re-arms; not checkpointed).
                                             # Logged as rollout/warmup. Needs fwd_rollout_every
                                             # > 0 and a stage that trains replay; must be below
                                             # buffers.replay_buffer.max_size. 0 = off
        # condition_draw:                    # absent = off. { conditions: C, replay_rows: X,
        #   { conditions: 0, replay_rows: 2, #   prior_rows: Y, pick: uniform | weighted }: once
        #     prior_rows: 2, pick: uniform } #   per fused step choose C conditions holding >= X
                                             # trainable replay rows AND >= Y prior rows
                                             # (C 0 = live batch_size // max(X, Y); a fixed C is
                                             # capped there too), then replay draws EXACTLY X
                                             # and bwd EXACTLY Y distinct rows of each. None
                                             # eligible = replay skipped (share folds into bwd)
                                             # and bwd draws as without the block; a step then
                                             # left with no gradient takes no optimizer step
                                             # (cond_draw/no_grad_steps). X, Y >= 2.
                                             # Needs train_mode fused, bwd_sampling_mode prior, a
                                             # stage that trains replay, weighted_bwd_sampling
                                             # false, an effective bwd AND replay
                                             # condition_block_m 0, prioritise.enabled false and
                                             # one space group x Z'. Logged as cond_draw/*
        fwd_rollout_triggers:                # off-cadence bars: fire a rollout EARLY when the
                                             # state says one is needed, each reported under
                                             # its own name. 0 = that bar off. The whole block
                                             # is inert while fwd_rollout_every is 0
          occupancy_min_batches: 2.0         # fires BELOW: len(replay_buffer) / live batch_size.
                                             # NB the reading uses the LIVE batch while
                                             # admissions are capped at buffers.replay_buffer
                                             # .churn_rate -- if the batch grows past the value
                                             # churn was sized for, this bar cannot be cleared
                                             # by the actuator and fires continuously
          val_gap_max: 0.0                   # fires ABOVE: replay/val_gap_nats
          drift_std_max: 0.0                 # fires ABOVE: nats the policy has moved off the
                                             # rows it stored
          ess_min: 0.0                       # fires BELOW: replay/policy_drift_ess_frac. LEAVE
                                             # AT 0 -- at an ordinary learning rate no reachable
                                             # admission rate satisfies a useful bar, so the
                                             # trigger latches on and holds the rollout rate at
                                             # maximum, which inverts what this block is for
        loss_coeffs:
          fwd: { tb: 1.0, freeze_policy: 1.0 }   # Z ONLY: policy + conditioner detached at the source
          bwd: { tb: 1.0, beta: 80 }               # freeze_z stays 1 from base: policy only
          replay: { tb: 1.0, beta: 80 }               # freeze_z stays 1 from base: policy only
        # ONE SENSOR, TWO MOTIONS. replay's share drifts UP by `up` per tick while
        # the guard sensor is at or below `bar` AND the ratchet says the level is
        # at a recent best; it moves DOWN by `down` otherwise. The rails are
        # absolute frac bounds, so bwd's floor is a guarantee rather than an
        # equilibrium.
        #
        # REPLACES kind: ratio, which keyed replay on fwd/over_coverage against
        # bwd/relative_under_wcen at a setpoint. Two properties made that
        # unusable here: over_coverage is the positive half of the same residual
        # field fwd/tb_err measures, so on a positively-skewed field the two
        # coincide and the loop steers the split on the forward TB error; and
        # relative_under_wcen has an irreducible floor, so a scale-free setpoint
        # against it reduces to a bar on the numerator. A ratchet carries a level
        # reference instead, which is the thing a setpoint has no honest way to
        # choose.
        balance:
          kind: gated_ramp
          ramp: replay                       # the mode whose share drifts up when the guard is satisfied
          guard: bwd                         # the mode that owns the sensor and takes back share when it deteriorates
          pinned: { fwd: 0.0 }              # must equal fracs.fwd. Under freeze_policy any value above deactivate_threshold is equivalent (P7): fracs are loss weights, every active branch runs the full batch, and Adam cancels a single source's scale
          metric: bwd/under_coverage_rise150 # the guard sensor: the 150-step rise in bwd's coverage residual
          bar: 0.0                           # sensor level above which the ramp is vetoed. 0 = veto on ANY deterioration, making the loop a servo on the sensor's zero rather than an open-loop drift
          ratchet_metric: bwd/under_coverage # the LEVEL the ratchet tracks; its stage minimum is the reference
          ratchet_tol: 0.5                   # nats of slack above the running minimum that still counts as 'at a best'. At 0 only a new all-time low releases the ramp, which vetoes on a level that is far below its start and still falling
          ratchet_cooldown_steps: 500      # train steps after stage entry during which the fracs are FROZEN at their entry values and no gr_best is recorded. The reference is a running minimum, so a level read while the stage is still settling (log Z walking to its fixed point, the buffer reaching its churned mix) is one no later state can return to, and the trip then latches for the whole stage
          ratchet_release_tol: 0.25          # tighter re-arm level: the ratchet holds until the level comes back inside this, so it is a Schmitt trigger and not a chattering comparator
          up: 0.004                          # share added per tick when the ramp is earned
          down: 0.006                        # share removed per tick when guarded. > up, so a deterioration is undone faster than it was bought
          bounds: { bwd: [ 0.25, 0.9 ], replay: [ 0.1, 0.75 ] } # ABSOLUTE frac bounds on each split mode; a ceiling on one is a floor on the other, so naming both intersects. bwd's 0.25 floor is a hard rail: the controller cannot starve the branch that owns spread


  # -- CONDITIONAL: the same MLE warm start, then condition-grouped VarGrad
  #    with the REPLAY branch in the forward branch's seat.
  #    todo REWORK ENTIRELY -- docs/TODO.md #3
  #    NOT the live route here (`protocol:` above selects unconditional_tb), but
  #    parsed and validated anyway -- an inactive protocol that only fails when
  #    you select it fails at the switch, which is the worst moment.
  #
  #    train_prior is deliberately IDENTICAL to the unconditional one: the warm
  #    start does not differ by route, and duplicating it is what lets the switch
  #    be one word. ⚠ The numbers in the stages below are one battery's operating
  #    point, not settled defaults.
  #    var_conditioning ALSO NEEDS GLOBAL VALUES a stage cannot carry, each
  #    marked "CONDITIONAL ARM:" beside its key in this file and set by
  #    configs/qm9c_anneal/make.py. On mk_dev's own globals this protocol is
  #    REFUSED at step 0 (Modeller.set_loss_coeffs): buffers.replay_buffer
  #    .prioritise.enabled true beside pooled_source 'replay' and condition_draw.
  conditional_vargrad:
    stages:
      - name: train_prior
        train_mode: bwd
        bwd_sampling_mode: dataset
        skip_if: prior_loaded
        # Drawdown sensor. Fires when the channel's current level sits `above`
        # the 10th percentile of its trailing window; `action` defaults to
        # report, which moves nothing. `form: absolute` is required because
        # bwd/mle crosses zero, where the log ratio is undefined. `rows` is the
        # window in samples, at one sample per 10 steps.
        # ⚠ A BAR IS CALIBRATION DATA: fitted per stage on the EMA-smoothed
        # logged channel, and not transferable to another stage or channel. It
        # also inherits its noise margin from the metric tracker's period, which
        # lr_hot_sensor asserts at construction.
        # ⚠ WEAKEST OF THE THREE BARS -- keep it report-only.
        hot_lr_sensor: { channel: bwd/mle, form: absolute, rows: 31, above: 5.0 }
        flags:
          update_log_z: true
          scramble_conditions: true
        loss_coeffs:
          bwd: { mle: 1.0, tbc: 0.0, repeats: 1.0, tb_z_source: persistent }
        # EXIT ON THE LEVEL GATE (progress_gate at the top of this file):
        # gates/progress_done is 1 once every configured w1r bar is met on the
        # trailing median. PATIENCE 1 -- the gate's median window supplies the
        # persistence. An absent channel blocks the verdict rather than passing,
        # and progress_metrics ABSTAINS loudly when it cannot run at all.
        exit:
          - { metric: gates/progress_done, above: 0.5, patience: 1 }
        on_exit: [ 'snapshot:phase1_exit', 'snapshot_prior' ]

      # REPLAY IN THE FORWARD BRANCH'S SEAT. The forward rollout is the only
      # step that calls the energy function; it runs on 1 step in
      # fwd_rollout_every (every step during the replay warm-up) and its rows
      # are admitted to the replay buffer. The pooled VarGrad term pairs REPLAY
      # rows with bwd rows, so the policy trains on every step from stored
      # trajectories. One trainer per parameter group:
      #   fwd    -> Z(c) only (freeze_policy): the Z sidecar, rollout steps only
      #   bwd    -> policy, through the pooled term, from the churned prior_buffer
      #   replay -> policy, through the pooled term, from stored fwd rollouts
      - name: var_conditioning
        train_mode: fused
        bwd_sampling_mode: prior
        # Drawdown sensor, as on train_prior above. `form` defaults to log, so
        # the bar is a RATIO against the window's 10th percentile and survives a
        # change of scale in the channel.
        # THE CHANNEL MUST BE ONE THIS STAGE ACTUALLY WRITES. quick_tb_stats
        # writes `<mode>/logw_std_within` only on a step where some condition
        # holds >= 2 of that branch's rows. bwd trains on every step and
        # condition_draw below hands it prior_rows (2) rows per condition; fwd
        # writes on rollout steps only, and replay is skipped on any step with
        # no eligible condition (stage entry included).
        # (`channel` must name a real branch, so the pooled loss is not eligible.)
        # ⚠ THIS BAR IS TRANSPLANTED FROM ANOTHER CHANNEL, NOT CALIBRATED HERE.
        # Keep it report-only until it is fitted on this one.
        hot_lr_sensor: { channel: bwd/logw_std_within, rows: 11, above: 3.0 }
        flags:
          update_log_z: true
          buffers_active: true
          weighted_bwd_sampling: false         # condition_draw bypasses the loss-weighted bwd draw; refused true beside it
          weighted_condition_sampling: false   # refused beside a non-iid condition_log_z.rollout_condition_draw
        # set_lr_flow: the flow head is a per-condition NETWORK on this route,
        # not the unconditional LearnableScalar, and emp_z below is the only
        # thing that trains it. It needs a rate far below the canonical lr_flow,
        # set here rather than guarded: the divergence guard cannot rescue this
        # group, because peak_scale never reaches it while control_flow_lr is
        # false.
        # freeze_pb: P_B evaluated on a FULL snapshot (trunk + head) taken at
        # stage entry, everywhere, for the whole stage. On the replay seat any
        # moving P_B is a flat direction of the pooled term on stored rows (six
        # learned-P_B variants diverged 2026-09-12; see
        # docs/design/replay_seat_pb_freeze.md). The target path law is
        # P_B(tau|x) p_lambda(x|c): c enters through the terminal only, so the
        # frozen, condition-blind bridge is the natural backward kernel and P_F
        # learns the conditioning onto it.
        # No bootstrap_z: emp_z on the Z sidecar trains Z(c) on every rollout,
        # from the first.
        on_enter: [ 'rebuild_prior_by_churn', 'set_lr_flow:1.0e-4', 'freeze_pb' ]
        # fwd HAS NO FRAC: its loss enters only as the Z sidecar below, outside
        # the frac mix. min_fracs.fwd 0 holds it at exactly 0 (the
        # controller.min_mode_frac fallback would lift it to 0.001 on the first
        # nudge). bwd:replay 50:50 AND HELD THERE: `balance` below is
        # lexicographic with every boost the same 0.5/0.5 mix, so the nudge
        # target never moves. The controller's only live job here is gating the
        # lambda anneal.
        fracs: { fwd: 0.0, bwd: 0.5, replay: 0.5 }
        min_fracs: { fwd: 0.0 }
        deactivate_threshold: 0.01
        # --- FORWARD ROLLOUT CADENCE (the mechanism: equilibration above) -------
        # z_calibration.fill_threshold is NOT required here: fwd_z_sidecar waives
        # it, and the fill refuses a Z(c) head. flags.z_calibration stays refused.
        fwd_rollout_every: 20                # run fwd on 1 step in N
        z_pin_rollout_every: 0               # off
        fwd_rollout_triggers:                # all off: the cadence and the warm-up set the rollout steps
          occupancy_min_batches: 0.0
          val_gap_max: 0.0
          drift_std_max: 0.0
          ess_min: 0.0
        # Z SIDECAR: on every rollout that is not a z-pin, the forward loss is
        # ADDED to the fused loss at weight 1, outside the frac mix. Under
        # freeze_policy it reaches Z(c) only. Counted as rollout/n_sidecar.
        fwd_z_sidecar: true
        # REPLAY WARM-UP: every step rolls out until the replay buffer holds this
        # many trainable rows, then latches off for the stage (never re-arms; not
        # checkpointed, so a resume with a restored buffer is satisfied at once
        # and a weights-only start warms again). Counted as rollout/warmup. It
        # can only release below max_size (refused at or above) and below the
        # every-step occupancy, admissions per rollout x mean_residence_steps.
        replay_warmup_rows: 20000
        # ALIGNED PER-CONDITION DRAW. Once per step, before either buffer is
        # drawn: C = live batch_size // 2 conditions, uniformly without
        # replacement, among those holding >= 2 trainable replay rows AND >= 2
        # prior_buffer rows; replay then draws exactly 2 and bwd exactly 2
        # distinct rows of each. This is the only source of bwd and replay
        # groups here (condition_block_m 0 on both, repeats 1). No eligible
        # condition (an empty replay buffer at stage entry): replay is skipped
        # that step, its share folds into bwd, and bwd draws as without the
        # block. bwd and replay carry no term of their own here, so such a step
        # off the rollout cadence (no sidecar, pooled term INERT) has no
        # gradient at all and takes NO optimizer step; counted as
        # cond_draw/no_grad_steps. Logged as cond_draw/*.
        condition_draw: { conditions: 0, replay_rows: 2, prior_rows: 2, pick: uniform }
        loss_coeffs:
          # POOLED VarGrad between REPLAY and bwd. A branch vg_lb term centres on
          # its own rows, so a level offset between branches is an exact flat
          # direction of it; pooled_vg is the only term whose per-row
          # coefficients sum to zero ACROSS the branches -- a mass transfer
          # rather than a lift. It lives on the fwd block; pooled_source: replay
          # pairs the replay branch's live rows (gfn._live_replay) with bwd's
          # (gfn._live_bwd), and pooled_ratio is bwd's share of the group.
          # Published as pooled/pooled_source_replay. Check
          # `pooled/pooled_mixed_frac` before reading any result from this
          # stage: a silent fall to single-source groups voids the VarGrad
          # signal without failing anything.
          # fwd is the Z SIDECAR: tb 0, freeze_policy 1 (policy and conditioner
          # detached at the source), and emp_z fits the flow head to log Z of
          # the LAMBDA-MIXED target (log_r is -energy/T, and the mix happens
          # inside generator_energy), so it tracks the target the anneal is
          # moving. repeats 2: each rolled-out condition lands on two DISTINCT
          # terminals -- emp_z's group. (Replay admission at churn_rate 0 keeps
          # batch_size of the batch_size x repeats rows, drawn uniformly, so one
          # rollout stores both of a condition's rows only ~1/4 of the time; the
          # pairs condition_draw needs accumulate across rollouts.)
          # tb_z_source: persistent is the conditional Z regime, declared HERE
          # so that selecting this protocol adopts it.
          fwd: { tb: 0.0, vg_lb: 0.0, vg_by_condition: 1.0, emp_z: 1.0, freeze_policy: 1.0,
                 repeats: 2.0, pooled_vg: 1.0, pooled_beta: 40.0, pooled_ratio: 0.5,
                 pooled_source: replay, tb_z_source: persistent }
          # bwd and replay carry NO branch loss (tb 0, no vg flavour; mle, tbc
          # and level_gap 0), so the pooled term is their only gradient. replay
          # tb 0 overrides the base 1.0. condition_block_m 0 on both:
          # condition_draw sets the rows per condition (one switch; a nonzero
          # value is refused beside it). level_gap 0 = the per-condition Z-level
          # tether is off.
          bwd: { tb: 0.0, vg_lb: 0.0, condition_block_m: 0, repeats: 1.0, level_gap: 0.0, tb_z_source: persistent }
          replay: { tb: 0.0, vg_by_condition: 1.0, condition_block_m: 0, tb_z_source: persistent }
        balance:
          # LEXICOGRAPHIC, but not to arbitrate the split -- every boost below is
          # the same bwd/replay 0.5/0.5 mix, so _nudge_mode_fracs is a fixed
          # point and the fracs never move. The kind is lexicographic because
          # that is the only one anneal_coeffs fires off (it rides the
          # all-rules-clean streak). So the rules read as: "advance lambda only
          # while the sampler is keeping up", which is exactly the pacing an
          # anneal needs.
          kind: lexicographic
          default_boost: { replay: 0.5, bwd: 0.5 }
          # ANNEAL COOLDOWN, in train steps from the later of the stage's first
          # balance tick and the last anneal event (both ride the checkpoint):
          #   entry        until the first anneal: the rules are NOT evaluated, so
          #                no running best is seeded from the entry transient
          #                (replay buffer filling, Z(c) settling); the streak
          #                stays 0
          #   post-anneal  the rules ARE evaluated (their running bests follow
          #                the new lambda's level) but the clean streak is held
          #                at 0
          # So events are at least 1000 + (anneal_patience - 1) ticks apart, and
          # the 31 events from 0.001 to 1.0 at rate 0.8 take >= ~32k steps.
          # Logged as protocol/anneal_cooling and protocol/anneal_events.
          anneal_cooldown_steps: 1000
          rules:
            # PACING GATE on each branch's UNEXPLAINED fraction 1 - r2 of the
            # target's own per-condition spread (<branch>/r2_unexplained,
            # quick_tb_stats). Scale-free, so it separates "the target got
            # harder" (spread rises, r2 holds) from "the sampler fell behind"
            # (r2 falls). A rule is violated when its metric exceeds `margin` x
            # its OWN running best, a running minimum that relaxes upward by a
            # factor (1 + drift) per balance tick (one tick per 10 train steps):
            # at drift 0.001 the best relaxes ~5% per 500 steps, so a rung whose
            # 1 - r2 plateaus above the pre-rung level is eventually accepted
            # rather than welding the anneal shut. Written on the same cadence
            # as logw_std_within (fwd on rollout steps, bwd every 10th bwd
            # step); if_missing: violated holds the anneal until each has been
            # written. A violated rule's boost is the default mix, so a
            # violation only resets the clean streak.
            - { metric: fwd/r2_unexplained, relative: best, margin: 1.1, drift: 0.001,
                if_missing: violated, boost: { replay: 0.5, bwd: 0.5 } }
            - { metric: bwd/r2_unexplained, relative: best, margin: 1.1, drift: 0.001,
                if_missing: violated, boost: { replay: 0.5, bwd: 0.5 } }
          # THE ANNEAL. Fires once every rule above has been clean for
          # controller.anneal_patience ticks outside the cooldown, and is strictly
          # lower priority than all of them. Geometric: val <- min(val / rate, target).
          # ⚠ IT CANNOT LEAVE EXACTLY 0 -- a lambda run must start at a small
          # POSITIVE lambda_mix, and low enough that the physical leg is a small
          # fraction of the flow leg's spread, or the early rungs buy nothing.
          # `rate` is the GRANULARITY of one event (x1/rate = x1.25, so 31 events
          # from 0.001 to 1.0); the rules above supply the actual pacing. A step
          # of d(lambda) injects ~d(lambda) x sigma_Delta of within-condition
          # spread (sigma_Delta ~155 nats at lambda 0); the settled spread itself
          # scales ~lambda x sigma_Delta once above the lambda-0 floor, so a
          # fixed ratio is a roughly constant RELATIVE injection along the path.
          anneal_coeffs:
            lambda_mix: { target: 1.0, rate: 0.8 }
#        exit: # no exit condition, this is the terminal phase
#          - { metric: fwd/logw_std_within, below: 6.0, patience: 5 }
#          - { metric: bwd/logw_std_within, below: 3.0, patience: 5 }
#        on_exit: [ 'snapshot:var_conditioned' ]

# shared balance/fused mechanics (per-stage thresholds live in the rules above)
controller:
  min_mode_frac: 0.001  # FALLBACK frac floor for modes a stage's min_fracs doesn't name
  beta: 0.025  # EMA rate of the lexicographic frac nudge. LIVE ONLY under kind: lexicographic -- the ratio/constraint kinds set fracs directly from their integrator state and never call _nudge_mode_fracs
  deactivate_threshold: 0.01  # FALLBACK for stages without their own. Fused loss only: skip computing a branch entirely if its frac falls below this. Keep < 1/3
  refresh_every: 10  # fused loss only: force-evaluate every non-dormant branch at least this often so its rolling stats don't go stale
  decay_rate: 0.95  # per-anneal-event tightening factor for annealed rule thresholds
  anneal_patience: 5  # consecutive all-clean balance ticks before one anneal event
  lookahead_horizon: 5  # rules with lookahead: true -- controller ticks to extrapolate metrics ahead before thresholding
  lookahead_trend_alpha: 0.1  # EMA smoothing on the estimated per-tick trend

# Cheap, periodic diagnostic on fused steps only (see _log_fused_gradient_geometry
# in train.py) -- pairwise cosines between the active branches' raw (pre-weight)
# DIAGNOSTIC. Pairwise cosines between the fused branches' gradients: are they
# aligned, orthogonal, or in conflict. Costs one extra autograd.grad() per active
# branch on armed steps only. Off by omission, or with every <= 0.
grad_geometry:
  enabled: false
  every: 50


buffers:
  # SLOW store: a representation of a DISTRIBUTION, churned on a rate the
  # config sets rather than on any per-row property. Residence works out as
  # mean_lifetime * max_size / churn_batch_ref = 25,000 train steps here, i.e.
  # ~4 full turnovers in a 100k-step run -- against the replay buffer's 50, a
  # 500x separation that is the whole reason there are two of them.
  prior_buffer:
    source: 'prior_model'   # 'prior_model' | 'anchors'. WHERE top-ups come from. Under 'anchors', snapshot_prior and prior_model_name are unnecessary and the resume gap they create (no prior_model after a restart) does not exist -- and prior_buffer_prior_admit_rate reads nan, since it counts prior-MODEL admits only. CONDITIONAL ARM: 'anchors' (it still sets prior_model_name, which is what fires train_prior's skip_if)
    seed_source: 'prior_dataset'  # 'generated' or 'prior_dataset': seed at init with the full prebuilt prior dataset, FRESH per-sample records
    mean_lifetime: 100  # NOT a lifetime -- a rate divisor. Rows admitted per bwd step = churn_batch_ref / mean_lifetime = 10, so turnover time = mean_lifetime * max_size / churn_batch_ref steps. The VALUE is arbitrary; the 25k-step residence it implies is the number to argue about
    weighted_bwd_beta: 0.9  # uniform fraction for stages with weighted_bwd_sampling; 0.9 => 10% of the bwd batch drawn ~ema_loss. No stage here declares that flag
    churn_batch_ref: 1000  # fixed reference batch size for churn pacing -- decoupled from the live batch_size so a growth event doesn't multiply buffer turnover
    min_size: 10000
    max_size: 250000
    init_fraction: 0.25  # rebuild_prior_by_churn refill target as a fraction of max_size, admitted through the online gate. Fires at equilibration's on_enter
    expire_max_frac: 0.1  # per manage call, max fraction of the buffer purged for no longer clearing energy < Emin(c) + ramp_floor. 0 = channel off
    anchor_floor_frac: 0.1  # per churn cycle, minimum share of each condition's intake drawn from anchor_buffer. 0 = pooled shortfall backfill only
    reward_min: 0 # bootstrap-only fallback admission floor (absolute), used until a tracker/anchor_buffer exists to admit relative to each condition's best energy
    # quick_tb_stats' weighted under_coverage ramp, in ENERGY units of per-condition depth
    # above each condition's best known energy. ramp_floor doubles as manage_prior_buffer's
    # admission/reach-trigger margin (equivalence holds only at temperature==1.0; elj runs
    # hotter -- revisit if the ramp and admission margins need separating)
    ramp_floor: 100  # put a comment with the units here (reward, physical energy, what)
    ramp_width: 50

  # FAST store: full forward trajectories of the policy's own samples, kept so
  # they can be exactly replayed. Its three size knobs are three handles on ONE
  # steady state and must not be moved independently:
  #     occupancy = churn_rate * mean_residence_steps   (Little's law)
  #     draws_per_row = batch_size / churn_rate
  # max_size is a MEMORY GUARD, not a target -- it is sized above the
  # equilibrium so it never shapes eviction at the margin. The servo below
  # moves churn_rate and mean_residence_steps together (x B and / B), which
  # leaves occupancy exactly invariant and changes only reuse and policy lag.
  replay_buffer:
    churn_rate: 0  # admission attempts budgeted per manage call; SUPPLY-side. For 0, always equals live batch size. CONDITIONAL ARM: 0
    mean_residence_steps: 240  # memoryless hazard, so residence is exponential (CV ~ 1) -- a WIDE lag distribution, which is a strong lowpass on the policy -> buffer -> gradient path. A hard age cap would concentrate the phase lag at one frequency, and this codebase has a documented phase-2 limit cycle. CONDITIONAL ARM: 1200
    max_size: 50000  # hard cap. Meant as HEADROOM over the churn_rate x mean_residence_steps equilibrium, so the hazard sets occupancy; where the cap binds instead, eviction becomes displacement -- residual-dependent, which breaks birth_loss as an unbiased intake baseline. CONDITIONAL ARM: 150000
    # todo THIS CAP CURRENTLY BINDS. churn_rate 0 admits batch_size rows per manage call (the whole live draw only at fwd repeats 1), so at
    # batch_size 1000 x mean_residence_steps 80 the equilibrium is ~80,000 against
    # 50,000 -- i.e. exactly the displacement regime the line above warns about.
    # Either max_size wants ~240k or mean_residence_steps comes down. docs/TODO.md #5
    admit_reward_min: -200  # hard exclusion, applied UPSTREAM of admission unconditionally: admission scores badness, so without a floor the energy distribution is unbounded above
    backstop_mult: 5.0      # hard age cap as a multiple of mean_residence_steps -- a MEMORY GUARD on the exponential hazard's tail, not a target. 0 = no cap. Rows it claims are excluded before the hazard budget is spent
    admit_from_eval: true   # whether evaluation()'s rollout is admitted to REPLAY. manage_prior_buffer takes it either way -- this gates only the replay call beside it. What it admits is a DIFFERENT SAMPLE: the EMA model at eval_T over eval_num_samples, not the training policy at the training grid. Admission is capped at churn_rate, so at eval_num_samples 10000 with churn_rate = batch 1000 it admits 1000 rows per eval against a fwd intake of 1000 per fwd_rollout_every steps -- ~17% of the buffer at every 20. Those rows are born with NaN birth_log_pf and are excluded from the drift statistic, so they are visible ONLY as replay/policy_drift_covered_frac sitting at 0.84 rather than 1. true = the behaviour every route shipped with. CONDITIONAL ARM: false -- a different model on a different grid, on the one route where replay carries half the loss
    # --- held-out split: the only direct read on replay MEMORISATION ---
    val_frac: 0.0           # fraction of each ADMISSION batch flagged held-out and never trained on. 0 = off, and every draw path is then bit-identical to before the split existed (no row is flagged, so no mask is built). CONDITIONAL ARM: 0
    val_min: 64             # fewer held-out rows than this and the measurement is skipped -- the mean would be noise, and writing it poisons the EMA it is read on
    val_cap: 256            # most held-out rows scored per measurement. Also clipped to the LIVE batch_size, so an OOM-cut batch shrinks the probe instead of reproducing the OOM
    # --- prioritised replay (to_do_rebuild.md B5/B7b) ---
    # Admission is unconditionally uniform (D5); purge is hazard+backstop only
    # (floor/stalled retired -- exactly redundant with hazard+backstop once
    # the draw itself is prioritised). This block controls the DRAW only.
    prioritise:
      enabled: true     # CONDITIONAL ARM: false. REFUSED beside fwd pooled_source 'replay' and a stage condition_draw: both take the replay rows unweighted
      kappa: 1.0        # draw p ~ d+^kappa. The practical ceiling: kappa=2 blew is_ess_frac to 0.07 with one row at 58x the mean weight, and kappa=0 was the worst arm
      floor_frac: 0.25  # relative floor on surviving d+ as a fraction of the median, so the weight range is bounded by (median/floor)^kappa. Measured ESS knee: 0.01 -> ESS/n 0.11, 0.25 -> 0.63, 0.50 -> 0.80
      symmetric: true  # draw on |delta|^kappa instead of delta_plus^kappa. ON here (the code default is off): under the one-sided draw a row that falls to delta <= 0 gets p = 0, so its ema_logw is never refreshed and it ratchets out of the eligible set permanently -- is_elig_frac drifted 0.74 -> 0.33, monotonic. |delta| leaves every row eligible and holds is_elig_frac at 1.0. Whether it also closes the forward-tail fit gap is NOT yet measured: that needs an on/off arm

  # permanent archive of high-quality, mutually latent-distinct samples -- grows only
  # through admission, and tops up prior_buffer via noising + rescoring whenever a
  # prior-sampling churn cycle comes up short
  anchor_buffer:
    # --- anchor churn toggles. All three are independent; absence = today's behaviour ---
    frozen: true              # CONDITIONAL ARM: false (growth back on). true = anchor MEMBERSHIP is fixed after seeding. Guards AnchorBuffer.admit/thin
      # at the primitives, so all five mutation call sites are covered (eval-cadence thin,
      # screen_and_admit's admit+overflow thin, and top_up_prior_from_anchors' record-breaker
      # admit+overflow thin). Both constructors bypass them, so seeding still works.
    # NB admit() REPLACES 1-for-1, so anchor_buffer_length does not move when membership
    # churns -- judge a freeze on content, never on length
    online_loss_flow: false    # per-draw priority update. NOT IMPLEMENTED (raises if true): the version that existed
    # was removed as a biased partial refresh, and measurement agrees -- ~3/4 of anchors are
    # never drawn in a run, so an online-only update leaves them permanently unmeasured
    thin_every_n_evals: 0      # cadence (eval cycles) for the energy-window thin/hard-cap pass. 0/null = DISABLED. CONDITIONAL ARM: 0
    refresh_every_n_evals: 0   # cadence (eval cycles) for refresh_anchor_buffer_surprise's full sweep. 0/null = DISABLED. CONDITIONAL ARM: 0.
    # This is the ONLY writer of anchor ema_loss. With it off, ema_loss is blanked to all-NaN
    # at every construction and restore, and the anchor draw falls through to UNIFORM --
    seed_source: 'prior_dataset'   # domain rule (configs/problems.yaml): molecule problems seed from prior_dataset; toys seed from the CONDITIONS .pt
    max_size: 200000
    dup_cutoff: 0.05          # latent L2 distance below which two CONFIRMED-SURPRISING candidates are literal duplicates. Latents live in a unit box, so this is 5% of an axis
    # Energy windows above that condition's Emin(c), in kJ/mol. At temperature
    # 2.5 these are 8 kT (screen) and 20 kT (thin): a state 8 kT up carries
    # relative Boltzmann weight e^-8 ~ 3e-4, so screening past it spends
    # confirm budget on the unpopulated; thin's window is looser so it only
    # discards what is hopeless under any reweighting.
    screen_energy_window: 20
    thin_energy_window: 50
    # Gates on the CENTERED TB residual, in nats. -5 = the sample is e^5 ~ 150x
    # more probable under the reward than the policy says -- a mode the policy
    # under-weights by more than two orders of magnitude.
    surprise_cutoff: -5       # cheap k=1 screen estimate
    confirm_cutoff: -5        # K-rollout logsumexp estimate
    confirm_k: 5              # backward rollouts for the confirmation pass. The IWAE bound's bias falls ~1/K, so K=5 is comfortably tighter than the 5-nat gate it feeds
    # Policy-health gate on the whole screen/confirm path: admissions pause
    # while the floor metric sits below its bar OR |ceiling metric| exceeds
    # its bar; cold channels abstain. Both rulers are named in config -- and
    # a BAR DOES NOT SURVIVE A RULER SWAP, so change the pair together.
    # Anchor admission pauses while the policy is miscalibrated, so novelty is
    # never judged against a bad ruler. Two channels, both naming a fwd metric:
    # the FLOOR blocks when its metric falls below the bar, the CEILING when
    # |its metric| rises above. A cold channel abstains. floor_metric: null
    # disables that channel.
    health_gate_floor_metric: null      # r2 retired here -- its denominator is the batch's own diversity, so it reads composition as much as fit
    health_gate_floor: null
    health_gate_ceiling_metric: tb_resid_clipped  # signed pooled TB residual, clipped at beta. 0.5 is the Z-currency bar z_calibration holds
    health_gate_ceiling: 0.5
    replay_beta: 1.0           # random-floor fraction of anchor replay draws in top_up_prior_from_anchors
    noise_log_range: [ -2.5, -1.5 ]  # log10-uniform isotropic latent noise magnitude for prior top-ups
    topup_admit_record_breakers: true  # noised children that STRICTLY lower their condition's Emin(c) stand for anchor admission. CONDITIONAL ARM: true
    reach_quantile: 0.9        # prior_buffer quantile (energy above own condition's best) checked against ramp_floor
    reach_threshold: 0.75      # trigger a purge-and-replace top-up if that quantile covers less than this fraction of ramp_floor
    reach_topup_size: 1000     # samples purged from prior_buffer's worst and replaced from anchors when the trigger fires. 0 = the trigger is inert, which is the OFF switch for this whole reach path. (Anchor MEMBERSHIP churn is off separately, and already is: `frozen: true` at the head of this block, plus thin_every_n_evals/refresh_every_n_evals at 0)

# energy function settings
################################################################
energy_function: 'elj'
temperature_conditioning: false  # if false, temperatures are set to temperature, and there is no annealing
molecule_conditioning: false  # conditions the generative prediction on the molecule
sg_conditioning: False  # whether to conditionally sample across space groups
space_groups: [ 2 ]  # which space groups to sample over ([1] for toys)
zp_conditioning: false # whether to condition over z prime values
z_primes: [ 1 ]
vector_conditioning: false  # per-sample condition vectors embedded through a plain MLP -- for toy energy functions
vector_conditioning_dim: 3  # inert while vector_conditioning is false
# The MOLECULE-conditional route: conditions carry a pre-baked frozen Mo3ENet
# latent (build_qm9_conditions.py), so the policy is conditioned on an embedding
# rather than on a live GNN -- which is why molecule_conditioning stays false
# there too. train.py reads this via getattr(..., False), so its ABSENCE is
# silent: a config that omits it runs unconditional while reading as conditional.
embedding_conditioning: false      # QM9 / molecule-conditional route: true
embedding_conditioning_dim: 192    # 3 x Mo3ENet's 64-d bottleneck, flattened. Inert while embedding_conditioning is false
energy_config:
  internal_oom_recovery: false  # false = energy is scored on the SDE rollout's own batch in one call, and an OOM propagates up to train.py's global batch reduction. true made the energy chunk on a sticky internal size set by the init-time prior re-analysis -- which can sit below the rollout batch -- and swallowed OOMs the batch controller needed to see. The two init passes override it back to true for their one-off whole-dataset scans. Not part of the problem identity, so flipping it does not orphan checkpoints
  temperature: 2.5 # room temperature kT in kJ/mol (1.0 for toys)
  log_temperature_range: [ 0, 0.693147 ]
  # loss coefficients
  density_coeff: 10.0  # how much to weight the density penalty term in the energy function
  bounding_coeff: 10.0  # static (the old soft-start + terminal anneal was removed with the terminal-stage redesign)
  reduction_coeff: 10.0
  lj_coeff: 1.0  # loss coefficient
  reward_range: 250 # max ptp of reward values allowed before soft clipping, null to go unrestricted
  analyze_kwargs: { }  # elj: none
  # MLIP EXECUTION, uma route only; all three are the behaviour every run has had.
  mlip_compile: false            # torch.compile the MLIP. Needs mlip_edge_chunk_size set, or every distinct edge count is a recompile and dynamo silently falls back to eager. Unconditional/single-molecule arms only: a molecule-conditioned run makes atoms-per-batch dynamic too, which edge padding cannot fix. Changes float summation order, so energies move at ULP level
  mlip_edge_chunk_size: null     # pad the edge dimension into buckets of this size, the one truly dynamic shape in the batch. Set it comfortably above `energy/uma_edges_max`; too small forces recompiles, too large pads. null = no bucketing
  mlip_activation_checkpointing: true  # recompute MLIP activations instead of storing them. Inert on the training reward when reward_grads is 0 (the call runs under no_grad), load-bearing for the init-time prior re-analysis and whenever reward_grads is nonzero. Memory/speed trade, not a free win
  # LAMBDA PATH between the prior's own implied density and the physical energy:
  #     -log p_lambda = (1-lambda)*(-log q_flow) + lambda*E_phys/T
  # exactly linear in lambda, so Delta = (E_phys - (-log q))/T is the path's
  # sufficient statistic and lambda=0 has the fitted flow as its exact fixed point.
  # prior_flow_path is the density proxy for THIS run's phase-1 exit policy, fitted
  # by build_prior_flow.py; it is tied to the wrap mask, the dead rows AND to T.
  prior_flow_path: null   # null + lambda_mix 1.0 = the pre-existing physical target, untouched
  lambda_mix: 1.0         # 1 = pure physical. An anneal run sets this to its START value and lets
                          # var_conditioning's balance.anneal_coeffs ramp it. NB the ramp is
                          # MULTIPLICATIVE (val <- val/rate), so it cannot leave exactly 0.
