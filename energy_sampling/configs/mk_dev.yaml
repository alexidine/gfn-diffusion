    # - name: anchor_seed
    #   train_mode: bwd
    #   bwd_sampling_mode: prior
    #   flags: {update_log_z: true, buffers_active: false, weighted_bwd_sampling: true}
    #   on_enter: [ 'seed_prior_from_anchors:100:flush' ]
    #   loss_coeffs:
