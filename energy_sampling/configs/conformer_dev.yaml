run_name: 'conformer_butanol_v01'
tag: 'v01'
seed: 0
device: 'cuda'
wandb_mode: 'online'   # online | offline | disabled
num_threads: 2

# Problem
################################################################
problem:
  smiles: 'CCCCO'
  epsilon: 0.1                 # LJ well depth, kcal/mol
  log_temperature: 0.0         # energy() returns E / 10**log_temperature
  min_separation: 3            # include nonbonded pairs >= 3 bonds apart (1-2, 1-3 excluded)
  scale_14: 0.5                # epsilon multiplier for separation-3 pairs
  lj_k_factor: 2.5             # soft-core exponential stiffness below sigma
  include_trivial_rotations: false   # exclude methyl / amine / hydroxyl rotations

# Integrator
################################################################
integrator:
  T: 32

# Model
################################################################
model:
  policy_hidden_dim: 128
  policy_layers: 3
  s_emb_dim: 128
  harmonics_dim: 128
  t_dim: 128
  flow_hidden_dim: 128
  flow_layers: 2
  t_scale: 0.05               # sigma_step must stay << the wrap period
  zero_init: true
  clipping: true
  gfn_clip: 1.0e+4   # unsigned exponents (1.0e4) parse as strings in YAML 1.1

# Optimizers
################################################################
# Top level: resolve_derived_config reads these off the root namespace and treats a
# missing key as `auto`.
# EXPLICIT since 2026-08-08. `auto` used to mean the T-scaling rule (anchor x
# 25/T); it now means SERVO-MANAGED, and the conformer route has no step_probe
# block, so `auto` here is a hard config error rather than a silent pin at the
# servo seed. These four are the values the old rule gave at T=32, so this
# migration changes no learning rate.
lr_policy: 7.8125e-05
lr_back: 7.8125e-05
lr_replay: 7.8125e-05
lr_fused: 3.90625e-05
lr_flow: 1.0e-1
min_lr: 1.0e-6
lr_warmup_ratio: 100
gradient_norm_clip: 1.0
weight_decay: 1.0e-4
use_weight_decay: false

adaptive_lr:
  # v8 (2026-08-11): peak_scale is moved only by periodic ray calibration
  # (adaptive_lr.calibration / top-level ray_calibration), which the conformer
  # route does not configure -- these four LRs are explicit floats, never
  # `auto`, so no key here marks them servo-managed and peak_scale never
  # applies to them. Only the warmup envelope and the divergence bar act.
  warmup_steps: 200
  divergence_loss_abs: 1.0e+9   # non-finite or past this -> reload + peak cut
  divergence_grad_abs: 1.0e+9
  divergence_cut: 0.5

# Training
################################################################
training:
  steps: 10000000
  batch_size: 128
  grow_batch_size: true       # CPU: no OOM headroom to climb into
  max_batch_size: 2048
  batch_growth_factor: 1.65
  batch_growth_interval: 50
  batch_growth_slow_interval: 300
  auto_batch_throughput_opt: true
  batch_growth_min_gain: 0.15
  exploration_std: 0.0
  buffer_path: null            # .pt from build_conformer_buffer.py
  bwd_frac: 0.5

# Evaluation
################################################################
eval:
  report_every: 250
  figs_period: 500            # figures are heavier than scalars; 0 to disable
  brute_force_grid: 48         # exact references by quadrature; k <= 3 only, 0 to skip
  out: 'conformer_v01_run.json'
