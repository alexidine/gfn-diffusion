protocols:
  unconditional_tb:
    stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
        scramble_conditions: true
      mle_gate:
        slope_t: 2.0
        min_rate: 0.05
        window: 300
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
      exit:
      - metric: gates/progress_done
        above: 0.5
        patience: 1
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
    - name: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      hot_lr_sensor:
        channel: fwd/scatter_err
        rows: 11
        above: 2.0
      flags:
        update_log_z: true
        buffers_active: true
        z_calibration: true
      on_enter:
      - rebuild_prior_by_churn
      - bootstrap_z:train_conditioner
      fracs:
        fwd: 0.05
        bwd: 0.93
        replay: 0.02
      min_fracs:
        fwd: 0.02
        bwd: 0.02
        replay: 0.02
      deactivate_threshold: 0.01
      loss_coeffs:
        fwd:
          tb: 1.0
          freeze_policy: 1.0
        bwd:
          tb: 1.0
          beta: 80
        replay:
          tb: 1.0
          beta: 80
      balance:
        kind: ratio
        pinned:
          fwd: 0.05
        metrics:
          replay: fwd/over_coverage
          bwd: bwd/relative_under_wcen
        numerator: replay
        setpoint: 5.0
        gain: 0.05
        max_step: 0.05
        bounds:
          replay:
          - 0.02
          - 0.93
          bwd:
          - 0.02
          - 0.93
        converge_floor: 1.0
      buffer_servo:
        numerator: replay/ema_loss_mean
        denominator: replay/birth_loss_mean
        bar: 0.368
        release: 0.6
        scale: 0.15
        gain: 0.05
        relax: 0.5
        max_step: 0.05
        max_boost: 8.0
  conditional_vargrad:
    stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
        scramble_conditions: true
      mle_gate:
        slope_t: 2.0
        min_rate: 0.05
        window: 300
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
          tb_z_source: persistent
      exit:
      - metric: gates/progress_done
        above: 0.5
        patience: 1
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
    - name: var_conditioning
      train_mode: fused
      bwd_sampling_mode: prior
      hot_lr_sensor:
        channel: fwd/vg_lb
        rows: 11
        above: 3.0
      flags:
        update_log_z: true
        buffers_active: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      on_enter:
      - rebuild_prior_by_churn
      - set_lr_flow:1.0e-4
      fracs:
        fwd: 0.1
        bwd: 0.9
        replay: 0.0
      deactivate_threshold: 0.01
      loss_coeffs:
        fwd:
          vg_lb: 1.0
          vg_by_condition: 1.0
          emp_z: 1.0
          repeats: 2.0
          tb_z_source: persistent
        bwd:
          vg_lb: 1.0
          condition_block_m: 2.0
          repeats: 1.0
          level_gap: 1
          tb_z_source: persistent
        replay:
          tb_z_source: persistent
      balance:
        kind: proportional
        pinned:
          replay: 0.0
        metrics:
          fwd: fwd/logw_std_within
          bwd: bwd/logw_std_within
        drive: relative
        targets:
          fwd: 1.0
          bwd: 1.0
        default_boost:
          fwd: 0.5
          bwd: 0.5
        floor: 0.1
        alpha: 0.01
