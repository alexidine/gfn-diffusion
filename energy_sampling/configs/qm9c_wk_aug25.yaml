lr_back: auto
lr_replay: auto
lr_fused: auto
lr_flow: 0.0001
min_lr: 1.0e-08
weight_decay: 0.0001
use_weight_decay: false
progress_gate:
  horizon: 10000
  rate_bar: 0.02
  window: 20000
  level_window: 2500
  min_history: 2000
  veto_rate: 0.05
  # CONDITIONAL ROUTE: NO ENERGY TERMS (owner, 2026-08-25). Phase 1 trains the
  # prior UNCONDITIONALLY; samples converge to the pooled marginal {x}, whose
  # energy under any particular c is structurally garbage, while the dataset
  # rows are matched {x,c} pairs reading low -- so E/sample vs E/ref can never
  # close, pooled OR per-condition, and CONVERGED would be unreachable (the
  # gate would hang to the 20k SATURATED window). Marginal-shape (w1r) + the
  # MLE slope are the valid phase-1 instruments here; tight prior fit matters
  # less than coverage on the conditional route anyway.
  metrics:
  - key: w1r/median
    target_key: w1r/perfect_median
    bar: 20.0   # WORKOUT: deliberately loose -- owner wants the transition NOW
                # (fit eyeballed good-enough); fires at the first eligible eval
  veto_metrics:
  - key: w1r/worst
    target_key: w1r/perfect_worst
lr_control:
  mode: bracket
  seed_lr: 0.000125
  control_flow_lr: false
  burn_in_steps: 3000
  burn_in_scale: 0.05
  min_root_bias_correction: 0.9
  candidate_scales:
  # GRID CAPPED AT 0.8 (2026-08-25). The 150-step trial horizon cleared 1.13
  # twice; cruising there detonated fwd at ~500-700 steps (vg_lb 126 -> 2700,
  # two moderate fires). Sustained-stability boundary sits in (0.566, 1.13];
  # 0.566 is the only rate with a long clean cruise on record (1,700 steps).
  # All-survive on this grid selects 0.566 (top rung 0.8 minus safety_rungs).
  - 0.05
  - 0.1
  - 0.2
  - 0.4
  - 0.566
  - 0.8
  trial_steps: 150
  # 2 (owner 2026-08-25): the 0.566 promotion raised the loss ~15% immediately
  # -- a selection that worsens the loss on adoption is a bad answer whatever
  # its stability, and survival-only select() cannot see it. All-survive on
  # the capped grid now lands on 0.4 (5e-5).
  safety_rungs: 2
  repeat_every: 8000
  boundary_confirm_repeats: 1
  boundary_densify: true
  fixed_scale: 0.2
  verbose: true
  hard_failure:
    loss_excursion_k: 10.0
    grad_excursion_x: 100.0
    loss_abs: 1000000.0
    grad_abs: 50000000.0
    cruise_rederive: true
    cruise_settle_steps: 200
    root_window: 200
    min_observations: 20
  ray_calibration:
    period: 500
    n_sub: 8
    alphas:
    - 0
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
  trial_settle_steps: 10
  # DISABLED on the conditional route (owner, 2026-08-25): three competing
  # notions -- (1) falling log Z usually signals fwd deterioration, but (2)
  # the batch-mean over Z(c) is composition-confounded under high-dim
  # conditioning, and decisively (3) Z here is a SIDECAR whose estimate is
  # weak and which must not influence policy training BY DESIGN -- a guard
  # that picks the LR from it violates that. Off until a better-founded
  # per-condition form exists. Stays live on the unconditional route, where
  # Z trains in-loop and is load-bearing.
  logz_detour_nats: null
  fire_cut_factor: 0.5
  fire_cooldown_steps: 100
profiling:
  enabled: false
  regions: null
  trace:
    enabled: false
    start_step: 1500
    active_steps: 8
    outdir: profiling_results
    write_trace: false
    record_shapes: false
