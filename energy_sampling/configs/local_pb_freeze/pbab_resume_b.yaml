        patience: 1
      flags:
        scramble_conditions: true
        update_log_z: true
      hot_lr_sensor:
        above: 5.0
        channel: bwd/mle
        form: absolute
        rows: 31
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 1.0
          tb_z_source: persistent
          tbc: 0.0
      name: train_prior
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
    - balance:
        anneal_coeffs:
          lambda_mix:
            rate: 0.93
            target: 1.0
        default_boost:
          bwd: 0.5
          fwd: 0.5
        kind: lexicographic
        rules:
        - boost:
            bwd: 0.5
            fwd: 0.5
          drift: 0.01
          if_missing: violated
          margin: 1.25
          metric: pooled/pooled_vg
          relative: best
        - above: 20.0
          boost:
            bwd: 0.5
            fwd: 0.5
          if_missing: violated
          metric: zmatch/delta_mean
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        weighted_bwd_sampling: true
        weighted_condition_sampling: true
      fracs:
        bwd: 0.5
        fwd: 0.5
        replay: 0.0
      hot_lr_sensor:
        above: 3.0
        channel: fwd/logw_std_within
        rows: 11
      loss_coeffs:
        bwd:
          condition_block_m: 2.0
          level_gap: 0.0
          repeats: 1.0
          tb_z_source: persistent
          vg_lb: 0.0
        fwd:
          emp_z: 1.0
          pooled_beta: 40.0
          pooled_ratio: 0.5
          pooled_vg: 1.0
          repeats: 2.0
          tb_z_source: persistent
          vg_by_condition: 1.0
          vg_lb: 0.0
        replay:
          tb_z_source: persistent
      name: var_conditioning
      on_enter:
      - rebuild_prior_by_churn
      - set_lr_flow:1.0e-4
      train_mode: fused
  prod_eq:
    stages:
    - bwd_sampling_mode: dataset
      exit:
      - above: -1000000000.0
        metric: bwd/mle
        patience: 1
      flags:
        scramble_conditions: true
        update_log_z: true
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 1.0
          tb_z_source: persistent
          tbc: 0.0
      name: train_prior
      on_exit:
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
    - buffer_servo:
        bar: 0.368
        denominator: replay/birth_loss_mean
        gain: 0.05
        max_boost: 8.0
        max_step: 0.05
        numerator: replay/ema_loss_mean
        relax: 0.5
        release: 0.6
        scale: 0.15
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        z_calibration: true
      fracs:
        bwd: 0.475
        fwd: 0.05
        replay: 0.475
      hot_lr_sensor:
        above: 2.0
        action: report
        channel: fwd/scatter_err
        rows: 11
      loss_coeffs:
        bwd:
          beta: 80
          tb: 1.0
        fwd:
          freeze_policy: 1.0
          tb: 1.0
        replay:
          beta: 80
          tb: 1.0
      name: equilibration
      on_enter:
      - rebuild_prior_by_churn
      - freeze_pb
      train_mode: fused
  unconditional_tb:
    stages:
    - bwd_sampling_mode: dataset
      exit:
      - above: 0.5
        metric: gates/progress_done
        patience: 1
      flags:
        scramble_conditions: true
        update_log_z: true
      hot_lr_sensor:
        above: 5.0
        channel: bwd/mle
        form: absolute
        rows: 31
      loss_coeffs:
        bwd:
          mle: 1.0
          repeats: 1.0
          tbc: 0.0
      name: train_prior
      on_exit:
      - snapshot:phase1_exit
      - snapshot_prior
      skip_if: prior_loaded
      train_mode: bwd
    - balance:
        bounds:
          bwd:
          - 0.02
          - 0.93
          replay:
          - 0.02
          - 0.93
        converge_floor: 1.0
        gain: 0.05
        kind: ratio
        max_step: 0.05
        metrics:
          bwd: bwd/relative_under_wcen
          replay: fwd/over_coverage
        numerator: replay
        pinned:
          fwd: 0.05
        setpoint: 5.0
      buffer_servo:
        bar: 0.368
        denominator: replay/birth_loss_mean
        gain: 0.05
        max_boost: 8.0
        max_step: 0.05
        numerator: replay/ema_loss_mean
        relax: 0.5
        release: 0.6
        scale: 0.15
      bwd_sampling_mode: prior
      deactivate_threshold: 0.01
      flags:
        buffers_active: true
        update_log_z: true
        z_calibration: true
      fracs:
        bwd: 0.93
        fwd: 0.05
        replay: 0.02
      hot_lr_sensor:
        above: 2.0
        channel: fwd/scatter_err
        rows: 11
      loss_coeffs:
        bwd:
          beta: 80
          tb: 1.0
        fwd:
          freeze_policy: 1.0
          tb: 1.0
        replay:
          beta: 80
          tb: 1.0
      min_fracs:
        bwd: 0.02
        fwd: 0.02
        replay: 0.02
      name: equilibration
      on_enter:
      - rebuild_prior_by_churn
      - bootstrap_z:train_conditioner
      train_mode: fused
