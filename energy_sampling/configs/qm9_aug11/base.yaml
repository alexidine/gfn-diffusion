# qm9_aug11 -- conditional MOLECULE ladder: 1 -> 2 -> 8 QM9 molecules in SG2, ELJ,
# conditioned on a frozen Mo3ENet embedding of the molecule.
#
# Shared config for every arm; per-arm keys are set by make.py (see TARGETS there).
# Body is mk_dev.yaml as of 2026-08-11 (v8 ray calibration, hazard+backstop buffers,
# protocol.py stages) with the molecule-conditional layer folded in. It is a SNAPSHOT --
# mk_dev is the user's live dev config and would otherwise drift under this battery.
#
# THE CONDITION IS THE MOLECULE
# -----------------------------
# embedding_conditioning reads the `embedding` baked onto each molecules_path entry by
# build_qm9_conditions.py: a frozen Mo3ENet latent, [3, 64] equivariant, flattened to 192.
# conditions_type stays 'vector', so this rides the same scalarMLP conditioner the toy `c`
# vectors use -- no GNN in the training loop, no gradient into the encoder, no per-step
# cost. molecule_conditioning (the live-GNN route) stays false.
#
# FRAME DISCIPLINE (the thing that silently breaks conditional molecule runs)
# --------------------------------------------------------------------------
# aunit_orientation is expressed relative to the molecule's own frame, so packing is
# ANTI-covariant with that frame: rotate the molecule and the correct orientation values
# change inversely. A molecule embedded in one frame and built in another decorrelates the
# condition from its target with no error anywhere. The prep script pins every molecule to
# a fixed point of the trainer's own orient_molecule(mode='std'), verified per build, so
# train.py's and buffer.py's per-batch re-orientations move nothing. Do not regenerate
# these condition files with anything that does not preserve that property.
#
# Every arm is built with --valid-only, so all structures carry crystal_valid == 1 and the
# stored cell parameters really are their crystals -- which is what makes train_prior's
# bwd_sampling_mode: dataset legitimate here, exactly as on the toy route.
#
# TEMPERATURE: TRAIN HOT, CALIBRATE LATER
# ---------------------------------------
# These condition files carry NO thermal_scaling_factor, so lj_coeff stays 1.0 and the
# effective sampling temperature is energy_config.temperature in RAW elj units. The mipcas
# prior carries 0.3636, which train.py:init_prior_dataset lets REPLACE lj_coeff, so its
# nominal kT 2.5 reads as 2.5 / 0.3636 ~ 6.9 in raw elj units. temperature: 6.9 here puts
# this ladder at the same raw-unit hotness as the mipcas runs rather than at a nominal
# number that would actually be ~2.8x colder.
#
# This is deliberately the hot end: an uncalibrated run that samples too broadly can be
# reweighted afterwards, one that froze into a few basins cannot. Absolute energies here
# are NOT comparable to a mipcas run's until calibrated. Note the existing helper,
# data_processing/utils.calibrate_energy_function_vs_uma, does not apply off the shelf --
# it globs for a paired *_uma_N.pt search trajectory that does not exist for QM9, and it
# calibrates on the ratio of the low-energy TAILS (bottom decile), not the batch mean.
run_name: 'OVERRIDDEN_BY_MAKE'
tag: 'qm9a11'
seed: 12345
device: 'cuda'
cuda_memory_fraction: 0.9
anomaly_detection: false

# Checkpoints
################################################################
continue_from_checkpoint: false   # fresh: every arm trains its own phase 1
mlip_path: null
checkpoints_dir: 'C:\Users\mikem\Projects\mxt_gfn\gfn_diffusion\energy_sampling\checkpoints'
checkpoint_name: null             # no warm start exists for this problem identity
prior_model_name: null            # train_prior's snapshot_prior produces it in-run
load_weights_only: false
prior_path: 'OVERRIDDEN_BY_MAKE'
molecules_path: 'OVERRIDDEN_BY_MAKE'
test_molecules_path: null         # set on the N-molecule arm only
archive_period: 5000
archive_buffers: true
override_learning_rates: false

#Optimizers
################################################################
lr_policy: auto
lr_back: auto
lr_replay: auto
lr_fused: auto
lr_flow: 1.0e-4              # CONDITIONAL: flow_model is a scalarMLP over the condition embedding, not the unconditional LearnableScalar. 0.1 detonated Z(c) on the conditional route (cazwlyy1)
min_lr: 1.0e-6
lr_warmup_ratio: 10
adaptive_lr:
  warmup_steps: 1000
  seed_lr: 1.25e-4
  bounds: [ 0.01, 2000.0 ]
  calibration:
    # measured on the UNCONDITIONAL elj route (tuphwfkm). alpha* is a shape, not a
    # transferable setpoint -- read lr_ctrl/alpha_hat on this route before trusting it.
    alpha_target: 4.0
    eta_up: 0.25
    eta_down: 0.5
  divergence_loss_abs: 1.0e+9
  divergence_grad_abs: 1.0e+9
  divergence_cut: 0.5
  control_flow_lr: false

ray_calibration:
  enabled: true
  period: 500
  n_sub: 8
  alphas: [ 0, 1, 2, 4, 8, 16, 32, 64 ]
weight_decay: 1.0e-4
use_weight_decay: false
compile_policy: auto
traj_checkpoint: false
gradient_norm_clip: auto
ema_decay: null
max_reloads_per_1k_steps: 0.2

# model parameters
################################################################
model:
  full_flow: false
  s_emb_dim: 512
  t_dim: 64
  harmonics_dim: 64
  condition_embedding_dim: 16   # conditioner OUTPUT width; its input is the 192-d flattened Mo3ENet latent
  t_hidden_dim: 512
  s_hidden_dim: 512
  s_layers: 4
  policy_hidden_dim: 512
  policy_layers: 4
  flow_hidden_dim: 512
  flow_layers: 4
  cond_hidden_dim: 512
  cond_layers: 4
  dropout: 0
  norm: layer
  zero_init: false
  t_scale: 0.05
  log_var_range: 6
  pb_drift_range: 0.4
  pb_var_range: 6
  learn_pb: true
  learned_variance: true
  clipping: true
  gfn_clip: 200.0
  periodic_centroids: true     # CRYSTAL problem in SG2, unlike the toys
  dplr_rank: 6
  dplr_rho_max: 0.5
  dplr_mask_angular: true      # required true when DPLR runs with periodic dims
  pb_exact_reversal: true

# training params
################################################################
buffer_device: cuda
batch_size: 1000
grow_batch_size: false
max_batch_size: 1000
batch_growth_factor: 1.65
batch_growth_interval: 50
batch_growth_slow_interval: 300
auto_batch_throughput_opt: true
batch_growth_min_throughput_gain: 0.05  # samples/sec gain a jump must clear to be kept -- a SATURATION detector. opt-steps/sec = samples_per_sec / grad-accum target, so this maximises optimizer-step throughput; step time does not enter. MUST be < batch_growth_factor-1 (0.65 here): at or above it a factor-f jump can never deliver the demanded gain, so every jump is rejected and the batch FREEZES at batch_size
gpu_util_window_s: 900  # trailing window for the gpu/util_recent metric. DIAGNOSTIC ONLY -- nothing in the trainer acts on occupancy: batch size does not move it on the MLIP route (measured, umaperf0812)
gpu_util_sample_period_s: 60  # wall-clock seconds between occupancy samples. Time-based, not per-N-steps: a step-based cadence cannot fill a 900 s window at 200 s/step, which is how the metric came to be absent on exactly the slow MLIP arms it was there to watch
gpu_util_policy_window_s: 7200  # the window the CLUSTER averages over when deciding to cancel. Logged as gpu/util_policy so the number the scheduler judges is visible in wandb
batch_knee_recheck_steps: 2000
oom_batch_shrink_factor: 0.5
oom_cooldown_steps: 200
eval_num_samples: 10000
test_eval_num_samples: 2000
fused_grad_accum_min_samples: 1000
epochs: 100000
eval_period: 500              # cluster cadence
figs_period: 1000
################################################################
eval_T: 10
integrator:
  T: 10

fwd_loss_coeffs:
  tb: 0.0
  z_level: 0.0
  freeze_policy: 0.0
  freeze_z: 0.0
  vg_lb: 0.0
  vg_lme: 0
  vg_by_condition: 0.0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  traj_grads: 0.0
  reward_grads: 0.0
  repeats: 1.0
  loss_clip: 1.0E+9
  beta: 10.0
bwd_loss_coeffs:
  tb: 0.0
  freeze_policy: 0.0
  freeze_z: 1.0
  vg_lb: 0
  vg_lme: 0
  vg_by_condition: 1.0
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  level_gap: 0.0
  level_gap_clamp: 10.0
  mle: 0.0
  tbc: 0.0
  repeats: 1.0
  traj_grads: 1.0
  loss_clip: 1.0E+9
  beta: 10.0
replay_loss_coeffs:
  tb: 1.0
  freeze_policy: 0.0
  freeze_z: 1.0
  vg_lb: 0
  vg_lme: 0
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0
  emp_z_persistent: 0
  mle: 0.0
  repeats: 1.0
  traj_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10.0

# Load-bearing on this route: all three tb_z_source keys are persistent and the naive
# stage's emp_z_persistent reads the tracker, so Z(c) IS the tracker EMA and the learned
# head is a cache. On the 1-molecule arm there is exactly one condition, so the
# per-condition machinery degrades to pooled -- which is the point of that arm.
condition_log_z:
  min_visits: 20
  half_life_visits: 28.0
  trim_frac: 0.01
  max_batch_weight: 200.0
  discovery_half_life_steps: 200.0
  fwd_tb_z_source: persistent
  bwd_tb_z_source: persistent
  replay_tb_z_source: persistent
  weighted_condition_sampling: true
  weighted_condition_sampling_clip_quantile: 0.99
  weighted_condition_sampling_temperature: 0.3
  weighted_condition_sampling_uniform_beta: 0.5

mle_slope_t: 2.0
mle_min_rate: 0.05
mle_slope_window: 300

z_calibration:
  enabled: false
  mode: rollout
  sensor: pooled
  sensor_quantile: 0.5
  threshold: 0.5
  grace: 0.8
  gain: 1.0
  max_steps_per_step: 100.0
  min_visits: null
  freshness_half_life_steps: 300.0
  se2_floor: 0.25
  holdout_modulus: 8

# ============================================================================
# PROTOCOL -- the conditional route (mode_presets.yaml's
# conditional_toy_protocol_2026_07_29), with the naive stage's balance migrated to
# kind: ratio as that block instructs on restore. train_prior's dataset MLE is
# legitimate here because every arm is built --valid-only.
# ============================================================================
protocol:
  stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: prior_loaded
      flags: { update_log_z: true, scramble_conditions: true, mle_gate: true }
      loss_coeffs:
        bwd: { mle: 1.0, tbc: 1.0, repeats: 2.0 }
      exit:
        - { metric: gates/mle_flat, above: 0.5, patience: 5 }
        - { metric: eval/wass_debiased, below: 0.015 }
        - { metric: bwd/tbc, below: 2.0 }
      on_exit: [ 'snapshot:phase1_exit', 'snapshot_prior' ]

    - name: var_conditioning
      train_mode: fused
      bwd_sampling_mode: prior
      flags: { update_log_z: true, buffers_active: true, weighted_bwd_sampling: true,
               weighted_condition_sampling: true }
      on_enter: [ 'rebuild_prior_by_churn' ]
      fracs: { fwd: 0.5, bwd: 0.5, replay: 0.0 }
      deactivate_threshold: 0.01
      loss_coeffs:
        fwd: { vg_lb: 1.0, vg_by_condition: 1.0, emp_z: 1.0, repeats: 2.0 }
        bwd: { vg_lb: 1.0, repeats: 2.0, level_gap: 1.0 }
      balance:
        kind: proportional
        pinned: { replay: 0.0 }
        metrics: { fwd: fwd/logw_std_within, bwd: bwd/logw_std_within }
        drive: relative
        targets: { fwd: 1.0, bwd: 1.0 }
        default_boost: { fwd: 0.5, bwd: 0.5 }
        floor: 0.1
        alpha: 0.01
      on_exit: [ 'snapshot:var_conditioned' ]
      exit:
        # thresholds were read off the TOY route's structural floors -- re-read them on
        # the molecule route before treating a non-exit as a failure to converge
        - { metric: fwd/logw_std_within, below: 6.0, patience: 5 }
        - { metric: bwd/logw_std_within, below: 3.0, patience: 5 }

    - name: naive
      train_mode: fused
      bwd_sampling_mode: prior
      flags: { update_log_z: true, buffers_active: true, weighted_bwd_sampling: true,
               weighted_condition_sampling: true }
      fracs: { fwd: 0.4, bwd: 0.55, replay: 0.05 }
      min_fracs: { fwd: 0.02, bwd: 0.05, replay: 0.02 }
      deactivate_threshold: 0.01
      loss_coeffs:
        fwd: { tb: 1.0, z_level: 1.0, emp_z_persistent: 1.0 }
        bwd: { tb: 1.0 }
      balance:
        kind: ratio
        pinned: { fwd: 0.4 }
        metrics: { replay: fwd/over_coverage, bwd: bwd/relative_under_wcen }
        numerator: replay
        setpoint: 5.0                      # SEED from mk_dev's equilibration; rho has never been measured on the conditional route
        gain: 0.05
        max_step: 0.05
        bounds: { replay: [ 0.05, 0.60 ] }
        converge_floor: 1.0

controller:
  min_mode_frac: 0.001
  beta: 0.025
  deactivate_threshold: 0.01
  refresh_every: 10
  decay_rate: 0.95
  anneal_patience: 5
  lookahead_horizon: 5
  lookahead_trend_alpha: 0.1

conditional_worst_quantile: 0.25

buffers:
  prior_buffer:
    seed_source: 'prior_dataset'
    mean_lifetime: 100
    weighted_bwd_beta: 0.9
    churn_batch_ref: 1000
    min_size: 10000
    max_size: 250000
    init_fraction: 0.25
    condition_block_m: 1
    reward_min: 0
    ramp_floor: 100
    ramp_width: 50

  replay_buffer:
    churn_rate: 80
    mean_residence_steps: 50
    max_size: 12000
    admit_reward_min: -200
    prioritise:
      enabled: true
      kappa: 1.0
      floor_frac: 0.25
      symmetric: true

  anchor_buffer:
    # DOMAIN RULE (mode_presets.yaml): molecule problems seed anchors from prior_dataset --
    # the prior is high-quality but is NOT the target, unlike the toys' conditions file.
    # Coverage per condition will be partial on the conditional molecule route.
    seed_source: 'prior_dataset'
    max_size: 200000
    dup_cutoff: 0.05
    screen_energy_window: 20
    thin_energy_window: 50
    surprise_cutoff: -5
    confirm_cutoff: -5
    confirm_k: 5
    health_gate_floor_metric: null
    health_gate_floor: null
    health_gate_ceiling_metric: tb_resid_clipped
    health_gate_ceiling: 0.5
    replay_beta: 0.5
    thin_every_n_evals: 5
    refresh_every_n_evals: 3
    noise_log_range: [ -2.5, -1.5 ]
    topup_admit_record_breakers: true
    reach_quantile: 0.9
    reach_threshold: 0.75
    reach_topup_size: 1000

# energy function settings
################################################################
energy_function: 'elj'
temperature_conditioning: false
molecule_conditioning: false      # the live-GNN route; the embedding is pre-baked instead
sg_conditioning: False
space_groups: [ 2 ]
zp_conditioning: false
z_primes: [ 1 ]
vector_conditioning: false        # `c` is a toy target parameter and also feeds analyze(); an embedding is policy input only
vector_conditioning_dim: 3        # inert while vector_conditioning is false
embedding_conditioning: true      # pre-embedded molecule conditions (build_qm9_conditions.py)
embedding_conditioning_dim: 192   # 3 x Mo3ENet's 64-d bottleneck, flattened
energy_config:
  internal_oom_recovery: true
  temperature: 6.9   # RAW elj units -- matches mipcas's effective 2.5/0.3636. See header
  log_temperature_range: [ 0, 0.693147 ]
  density_coeff: 10.0
  bounding_coeff: 10.0
  reduction_coeff: 10.0
  lj_coeff: 1.0
  reward_range: 250
  analyze_kwargs: { }   # elj: none
