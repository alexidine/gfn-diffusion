protocol:
  stages:
  - bwd_sampling_mode: dataset
    exit:
    - above: 0.5
      metric: gates/mle_flat
      patience: 5
    - below: 0.015
      metric: eval/wass_debiased
    - below: 2.0
      metric: bwd/tbc
    flags:
      mle_gate: true
      scramble_conditions: true
      update_log_z: true
    loss_coeffs:
      bwd:
        mle: 1.0
        repeats: 2.0
        tbc: 1.0
    name: train_prior
    on_exit:
    - snapshot:phase1_exit
    - snapshot_prior
    skip_if: prior_loaded
    train_mode: bwd
  - balance:
      alpha: 0.01
      default_boost:
        bwd: 0.5
        fwd: 0.5
      drive: relative
      floor: 0.1
      kind: proportional
      metrics:
        bwd: bwd/logw_std_within
        fwd: fwd/logw_std_within
      pinned:
        replay: 0.0
      targets:
        bwd: 1.0
        fwd: 1.0
    bwd_sampling_mode: prior
    deactivate_threshold: 0.01
    exit:
    - below: 6.0
      metric: fwd/logw_std_within
      patience: 5
    - below: 3.0
      metric: bwd/logw_std_within
      patience: 5
    flags:
      buffers_active: true
      update_log_z: true
      weighted_bwd_sampling: true
      weighted_condition_sampling: true
    fracs:
      bwd: 0.5
      fwd: 0.5
      replay: 0.0
    loss_coeffs:
      bwd:
        level_gap: 1.0
        repeats: 2.0
        vg_lb: 1.0
      fwd:
        emp_z: 1.0
        repeats: 2.0
        vg_by_condition: 1.0
        vg_lb: 1.0
    name: var_conditioning
    lr_sensor:
      kind: hyper
      beta: 0.05
    on_enter:
    - rebuild_prior_by_churn
    on_exit:
    - snapshot:var_conditioned
    train_mode: fused
  - balance:
      bounds:
        replay:
        - 0.05
        - 0.6
      converge_floor: 1.0
      gain: 0.05
      kind: ratio
      max_step: 0.05
      metrics:
        bwd: bwd/relative_under_wcen
        replay: fwd/over_coverage
      numerator: replay
      pinned:
        fwd: 0.4
      setpoint: 5.0
    bwd_sampling_mode: prior
    deactivate_threshold: 0.01
    flags:
      buffers_active: true
      update_log_z: true
      weighted_bwd_sampling: true
      weighted_condition_sampling: true
    fracs:
      bwd: 0.55
      fwd: 0.4
      replay: 0.05
    loss_coeffs:
      bwd:
        tb: 1.0
      fwd:
        emp_z_persistent: 1.0
        tb: 1.0
        z_level: 1.0
    min_fracs:
      bwd: 0.05
      fwd: 0.02
      replay: 0.02
    name: naive
    train_mode: fused
