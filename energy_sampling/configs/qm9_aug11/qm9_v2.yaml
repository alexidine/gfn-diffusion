    reach_topup_size: 1000
    refresh_every_n_evals: 3
    replay_beta: 0.5
    screen_energy_window: 20
    seed_source: prior_dataset
    surprise_cutoff: -5
    thin_energy_window: 50
    thin_every_n_evals: 5
    topup_admit_record_breakers: true
  prior_buffer:
    churn_batch_ref: 1000
    condition_block_m: 1
    init_fraction: 0.25
    max_size: 250000
    mean_lifetime: 100
    min_size: 10000
    ramp_floor: 100
    ramp_width: 50
    reward_min: 0
    seed_source: prior_dataset
    weighted_bwd_beta: 0.9
  replay_buffer:
