run_name: ''
tag: 'dev'
seed: 12345
device: 'cuda'
cuda_memory_fraction: 0.95
anomaly_detection: false  # dramatic slowdown when True

# Checkpoints
################################################################
continue_from_checkpoint: false
mlip_path: 'D:\crystal_datasets\esen_s.pt' 
prior_path: null
molecules_path: null
test_molecules_path: null
checkpoints_dir: '/scratch/mk8347/projects/gfn_cond/gfn-diffusion/energy_sampling/checkpoints/'
checkpoint_name: null #new_multig_therm.pt #dev_mk_dev_prior.pt #multigauss_prior.pt #p123.pt
prior_model_name: null #new_multig_prior.pt #dev_mk_dev_prior.pt #multigauss_prior.pt #p123.pt
override_loss_coeffs: false  # if true, ignore the loss coeff schedule baked into a resumed checkpoint and re-parse fwd/bwd/replay_loss_coeffs from this config instead
override_learning_rates: false  # if true, overwrite just the numeric LR restored from a resumed checkpoint's optimizers with this config's lr_* values - warmup/anneal status and Adam momentum buffers are left as-is

#Optimizers
################################################################
lr_policy: 1.0e-3              # learning rate of the policy network
min_lr: 1.0e-5                # ihn
lr_flow: 0.1                 # learning rate of the flow network
lr_back: 1.0e-3                # learning rate of the backward pass
lr_replay: 1.0e-3               # learning rate of the trajectory replay pass
lr_fused: 1.0e-3                # learning rate of the fused fwd/bwd/replay pass
lr_warmup_ratio: 100           # how much smaller the initial (warmup) LR should be than the max policy value
scheduler: True               # does LR warmup from lr/lr_warup_ratio -> lr -> min_lr over the warmup and annealing period
lr_warmup_time: 2000
lr_anneal_time: 50000
weight_decay: 1.0E-4
use_weight_decay: false
gradient_norm_clip: 0.1        # gradient norm clip for updating gfn model weights
ema_decay: 0.9 #0.95  # set to null for no ema

# model parameters
################################################################
model:
  full_flow: false           # true for subtb or db losses
  # shared dimensions
  s_emb_dim: 1024             # dimensionality of state embedding
  t_dim: 64                   # dimensionality of time embedding
  harmonics_dim: 64           # dimensionality of harmonic embedding
  condition_embedding_dim: 1024  # dimensionality of the conditioning embedding
  # per-sub-model architecture
  t_hidden_dim: 1024          # time encoder hidden dim
  s_hidden_dim: 1024          # state encoder hidden dim
  s_layers: 4                 # state encoder layers
  policy_hidden_dim: 1024     # forward/backward policy hidden dim
  policy_layers: 4            # forward/backward policy layers
  flow_hidden_dim: 1024       # flow model hidden dim
  flow_layers: 1              # flow model layers
  cond_hidden_dim: 1024       # conditioning embedding hidden dim
  cond_layers: 4              # conditioning embedding layers
  # regularization (shared)
  dropout: 0                  # dropout probability
  norm: layer                 # null, "layer" - DON'T PUT 'batch'
  zero_init: false
  # SDE params
  t_scale: 0.05               # scales fixed forward policy variance
  log_var_range: 6            # controls dynamic range of learned policy variance
  pb_drift_range: 0.4         # range of learned backward drift corrections
  pb_var_range: 6             # range of learned backward policy variance
  learn_pb: true              # whether to learn a correction to the backward policy
  learned_variance: true      # whether to learn policy variance
  clipping: true              # clip the maximum step size induced by the policy model
  gfn_clip: 200.0             # clip value for policy step size
  # diagonal-plus-low-rank (DPLR) forward covariance: C = diag(d) + V V^T, forward SDE only.
  # fixed marginal-variance budget: rho redistributes the existing policy variance
  # between private (d) and correlated (V) parts, it never inflates the marginal.
  dplr_rank: 6                 # rank r of the low-rank factor V; 0 = disabled (exactly original diagonal SDE)
  dplr_rho_max: 0.5            # cap on correlated variance fraction; also an exact cap on pairwise |corr_jk| <= rho_max. Keep < 1 strictly
  dplr_mask_angular: false      # zero the correlated fraction on periodic angular dims; correlations only couple linear (cell/centroid) dims

# training params
################################################################
batch_size: 25              # number of samples per training batch -- single shared batch size for all rollout work (train fwd/bwd/replay/fused AND eval sampling), so there's one adaptive value reacting to OOMs instead of several independently-tuned ones
grow_batch_size: true        # whether to dynamically grow the batch size to fill the RAM
max_batch_size: 1000
batch_growth_increment: 1.01  # fast growth rate used before we've ever hit an OOM this run (slow-start) - GROWS FAST! # 1 is static, 1.1 10% growth, etc.
batch_growth_slow_increment: 1.002  # much slower growth rate used once we've OOM'd at least once and are past cooldown - avoids immediately re-triggering the same OOM
oom_batch_shrink_factor: 0.6  # multiplicative cut applied to batch_size on ANY OOM (train step or eval sampling share this one batch size/recovery path)
oom_cooldown_steps: 200  # steps to hold batch_size flat after an OOM before resuming growth, to let the reduced level prove stable first
eval_num_samples: 10000       # minimum number of samples for evaluation
epochs: 1000000             # number of training epochs
eval_period: 250              # how often to do evaluation & reporting
figs_period: 250             # how often to log custom figures EXPENSIVE # must be multiple of eval_period or it won't fire

# SDE integration
################################################################
eval_T: 10                  # diffusion trajectory length for inference
integrator:
  T: 10                        # static training diffusion length
  min_traj_length: 10
  max_traj_length: 10
  traj_length_strategy: static # 'static'  or 'sampled'  will do random between min and max traj lengths
  discretizer_max_ratio: 15    # maximum ratio between randomly sampled step sizes - needs to be >25 for 15 steps, or 10 for 30 steps to get good coverage at extrema
  discretizer: uniform #'random'        # 'random' 'low_discrepancy' 'equidistant' 'uniform'

# set a constant or
# as a set of line segments [[step, value], [step, value], ...]
fwd_loss_coeffs:
  tb: 1.0
  fwd_tb_z: 1.0  # 2 if we should only train the Z component in tb, 1 if we should train log Z normally on forward TB, 0 if not. fwd tb must be >0
  vg_lb: 0.0
  vg_lme: 0  # exclusive with vg_lb
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.95
  emp_z: 0  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
  traj_grads: 0.0
  reward_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10  # Huber beta
bwd_loss_coeffs:
  tb: 1.0 #1.0  # will be altered by bwd_tb_z - must be nonzero for log Z backwards-trained warm start
  bwd_tb_z: 2.0 #2.0  # 2 if we should only train the Z component in tb, 1 if we should train log Z on backward TB, 0 if not. bwd tb must be >0
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.9
  emp_z: 0  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
  mle: 1.0 # 1.0  # will do weighted MLE if VG is running with repeats, otherwise trajectory-wise
  traj_grads: 1.0
  loss_clip: 1.0E+9
  beta: 10  # Huber beta for TB-style losses
replay_loss_coeffs:  # applied to trajectories pulled from the replay buffer (see replay_buffer below)
  tb: 0.0
  bwd_tb_z: 0.0  # 2 if we should only train the Z component in tb, 1 if we should train log Z on backward TB, 0 if not. bwd tb must be >0
  vg_lb: 0
  vg_lme: 0  # exclusive with vg_lb
  pf_boost: 0
  db: 0.0
  subtb: 0.0
  subtb_lambda: 0.9
  emp_z: 0  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
  mle: 0.0  # will do weighted MLE if VG is running with repeats, otherwise trajectory-wise
  traj_grads: 0.0
  loss_clip: 1.0E+9
  beta: 10 # Huber beta for TB-style losses

# training style
both_ways: true #true             # forward and backward training
repeats: 1                   # for conditional training, multiplies batch size by this factor for VarGrad, MLE
bwd: false                   # backward training only
bwd_sampling_mode: 'dataset' # source for samples in backward training: 'dataset' | 'prior' (trajectory replay is its own step type, see replay_buffer)
# for controlling 3-phase convergence protocol
anchor_fwd_bwd: true #true #true  # whether to do this at all
fused: true  # phase-3 only: instead of randomly alternating fwd/bwd/replay steps by fraction, fire all three every step and fuse their losses by the same fractions, via its own optimizer
fused_grad_accum_min_samples: 0  # fused loss only: if > 0, accumulate gradients over successive fused steps (without stepping the optimizer) until at least this many samples have been seen, then clip and step. 0 disables accumulation (step every fused call, as before).
wass_threshold: 0.01  # threshold for phase 1-2 transition
controller:
  under_threshold: 8  # phase-3 target (nats) for backward under-coverage before easing off replay/bwd
  over_threshold: 8 # phase-3 target (nats) for forward over-coverage before easing off replay
  zerr_threshold: 2.0
  min_mode_frac: 0.001  # floor probability for each of fwd/bwd/replay in phase 3
  beta: 0.01  # probability mass to add per step
  deactivate_threshold: 0.01  # fused loss only: skip computing a branch entirely (not just down-weight it) if its frac falls below this. Keep < 1/3 so at least one branch always runs.
  refresh_every: 10  # fused loss only: force-evaluate every branch at least this often (even if deactivated) so its rolling metric_tracker stats don't go stale; deactivated branches still get zero weight in the fused loss
  decay_rate: 0.975  # how fast convergence criteria will tighten when all are satisfied
  anneal_patience: 5  # consecutive controller ticks the joint (under/over/zerr all within threshold) condition must hold before triggering a threshold decay; guards against noise-triggered anneals
  min_threshold: 1 # the minimum value to which all controller thresholds can be pushed
  zerr_min_threshold: 0.5
  lookahead_horizon: 5  # controller ticks (each ~10 train steps) to extrapolate metrics ahead before thresholding, to avoid overshooting a regime swap
  lookahead_trend_alpha: 0.1  # EMA smoothing on the estimated per-tick trend (already-EMA'd metrics only need trend smoothing, not a second level EMA)

buffers:
  # buffer
  prior_buffer:
    mean_lifetime: 100 # batch size adjusted mean lifetime to buffer samples
    min_size: 10000
    max_size: 100000
    reward_min: -200 # minimum allowed reward to be admitted to buffer (absolute, unrelated to the ramp below)
    # quick_tb_stats' weighted_under_coverage ramp, expressed as offsets below anchor_buffer's current best
    # reward M rather than absolute numbers, so it tracks the achievable reward scale as it rises over
    # training: weight 0 at M - ramp_floor_range, ramping linearly to weight 1 at M - ramp_knee_range, then
    # flat at 1 from there up through M. No-op (old uniform-RMS behavior) until an anchor buffer exists.
    ramp_floor_range: 200  # ramp_knee_range < ramp_floor_range
    ramp_knee_range: 100

  # trajectory replay buffer - stores full forward trajectories of overweighted on-policy
  # samples (residual > buffer_resid_cutoff) so they can later be exactly replayed
  # (get_traj_replay) during the "replay" training step instead of re-sampled backward from
  # the terminal state alone
  replay_buffer:
    random_churn_rate: 50  # number of random samples to add/purge per replay train step
    max_size: 100000  # if this is too big, or takes too long to churn, it becomes a lagging indicator

  # permanent archive of high-quality, mutually latent-distinct samples -- grows only
  # through admission (never churned like prior_buffer/replay_buffer above), and tops
  # up prior_buffer via isotropic noising + rescoring whenever a prior-sampling churn
  # cycle comes up short of admissible samples on its own
  anchor_buffer:
    max_size: 5000
    dist_cutoff: 0.25          # latent L2 distance below which two samples are deduped; conditioning-aware distance tabled for now
    admit_range: 50           # sole admission gate -- admits samples within this many nats of anchor_buffer's own current best reward (batch's own best when bootstrapping); null admits everything for consideration
    thin_every_n_evals: 20     # cadence (in eval cycles) for the full dedup/thin pass
    noise_log_range: [-2.5, -1.5]  # log10-uniform isotropic latent noise magnitude applied when topping up prior_buffer
    reach_quantile: 0.9        # prior_buffer reward quantile checked against the achievable range [prior_buffer.reward_min, anchor_buffer's best]
    reach_threshold: 0.75      # trigger a purge-and-replace top-up if that quantile covers less than this fraction of the achievable range
    reach_topup_size: 1000     # samples purged from prior_buffer's worst and replaced from anchors when the reach trigger fires

# energy function settings
################################################################
energy_function: 'latent_multiharmonic'
temperature_conditioning: false  # if false, temperatures are set to temperature, and there is no annealing
molecule_conditioning: False  # conditions the generative prediction on the molecule
sg_conditioning: False  # whether to conditionally sample across space groups
space_groups: [ 2 ]  # which space groups to sample over
zp_conditioning: false # whether to condition over z prime values
z_primes: [ 1 ]
energy_config:
  internal_oom_recovery: true  # if false, skip the energy function's own adaptive sub-batching/OOM catch-and-shrink loop and analyze the whole batch in one call, so an OOM propagates up to train.py's global batch size reduction instead. Recommended false in fused mode, where the internal recovery destabilizes memory management.
  temperature: 1.0 # 2.5 is room temperature kT in kJ/mol
  log_temperature_range: [0, 0.693147]
  # loss coefficients
  density_coeff: 10.0  # how much to weight the density penalty term in the energy function
  bounding_coeff: 10.0
  reduction_coeff: 10.0
  lj_coeff: 1.0  # loss coefficient
  reward_range: null # range of reward values allowed, null to go unrestricted
  analyze_kwargs: {c:[0,0,0,0,0,0,0,0]}  # extra kwargs passed through to crystal_batch.analyze(), e.g. noise: 0.01, rdf_mode: 'envwise', cutoff: 6
