run_name: 'urea'
seed: 12345
device: 'cuda'
lr_policy: 0.0001              # learning rate of the policy network
min_lr: 1.0e-6                # ihn
lr_flow: 0.1                  # learning rate of the flow network
lr_back: 0.0001                # learning rate of the backward pass
lr_warmup_ratio: 100           # how much smaller the initial (warmup) LR should be than the max policy value
scheduler: True               # does LR warmup from max/100 -> max -> 1e-6 over the warmup and annealing period
lr_warmup_time: 1000
lr_anneal_time: 20000
weight_decay: 1e-7
use_weight_decay: false
gradient_norm_clip: 0.1        # gradient norm clip for updating gfn model weights
reweight_T: null                # 'null' or float: smaller values reduce the impact of outlier samples, warning CAN BE SEVERELY DISTORTIONARY TO THE LOSS

# model parameters
zero_init: true
joint_layers: 8              # number of layers in forward/backward policy models
hidden_dim: 512              # dimensionality of hidden layer
s_emb_dim: 512                # dimensionality of state embedding
t_emb_dim: 32                # dimensionality of time embedding
harmonics_dim: 64            # dimensionality of harmonic embedding
condition_emb_dim: 32         # dimensionality of the conditioning embedding
dropout: 0                   # dropout probability
norm: null                   # null, "layer", "batch"

batch_size: 25               # number of samples per training batch
grow_batch_size: true        # whether to dynamically grow the batch size to fill the RAM
max_batch_size: 100           # maximum batch size to allow
eval_batch_size: 500        # batch size for evaluation
epochs: 100000             # number of training epochs: relatively large
eval_period: 500              # how often to do evaluation & reporting
figs_period: 1000             # how often to log custom figrues EXPENSIVE # must be multiple of eval_period or it won't fire

# GFlowNet settings

T: 10                        # static training diffusion length
eval_T: 100                  # diffusion trajectory length for inference
min_traj_length: 10
max_traj_length: 20
traj_length_strategy: sampled # 'static'  or 'sampled'  will do random between min and max traj lengths
discretizer_max_ratio: 10    # maximum ratio between randomly sampled step sizes
discretizer: 'random'        # 'random' 'low_discrepancy' 'equidistant' 'uniform'
t_scale: 0.1                 # scales fixed forward policy variance
log_var_range: 10           # controls dynamic range of learned policy variance, when (-1) there is no fixed range or tanh containment
pb_scale_range: 0.2          # range of learned backward policy corrections, only for 'brownian_bridge'
energy: "molecular_crystal"  # "molecular_crystal"
#mode_fwd: "tb"           # "tb" is trajectory balance, "vg" is VarGrad, "greedy" is a local greed + gradients, "tb_greedy", "vg_greedy" are combinations
#mode_bwd: "tb"               # "tb" is trajectory balance, "vg" is VarGrad, 'mle' is trajectory probability maximization, 'mle_batch' is a more stable MLE
fwd_loss_coeffs:
  tb: 0.0
  vg_lb: 0.0
  vg_lme: 0.0  # exclusive with vg_lb
  greedy: 0.0
  mle: 0.0
  smoothed: 0
  var: 0.0  # penalize forward policy for crowded samples - this and buffer will anneal on expl timescale
  var_gamma: 0.05  # smaller -> longer range repulsion
  var_cutoff: 2.0  # variance below which to penalize
  buffer: 0.0  # penalize forward policy for sampling near samples already in the buffer
  buffer_gamma: 1.0  # smaller -> longer range repulsion
bwd_loss_coeffs:
  tb: 0.0
  vg_lb: 0.0
  vg_lme: 0.0 # exclusive with vg_lb
  mle: 0.0
  smoothed: 0
repeats: 10                   # for conditional VarGrad training
both_ways: true             # forward and backward training
bwd_batch_multiplier: 5      # ratio of backward to foward batch size (much cheaper to evaluate)
fwd_to_bwd_ratio: 1           # whether to do forward (>1) or backward (<1) training more often
bwd: False                   # backward training only
learn_pb: true               # whether to learn a correction to the backward policy in 'brownian_bridge' mode
learned_variance: true       # whether to learn policy variance
clipping: true  # clip the maximum step size induced by the policy model
gfn_clip: 20.0  # clip the maximum step size induced by the policy model

# local search settings
################################################################
buffer_path: '/scratch/mk8347/csd_runs/datasets/urea_gfn_dataset.pt'
molecules_path: '/scratch/mk8347/csd_runs/datasets/test_qm9_dataset.pt'

# replay buffer / dataset settings

################################################################
beta: 1.0             # reward prioritized replay sampling: high beta = steep prioritization
rank_weight: 1.0     # rank-based replay sampling: low rank_weight = steep prioritization
prioritized: "boltzmann"   # three kinds of replay training: random, reward prioritized, rank-based
sampling: "buffer"
add_to_buffer_each: 10  # how often to add samples to the buffer during fwd passes in both_ways training
buffer_size: 50000          # size of replay buffer: relatively large

################################################################

# exploration controls
exploratory: False       # adds variance to optionally learned logvars
exploration_factor: 0.5  # initial exploration std value
exploration_wd: True  # decay exploration over time
wd_max_steps: 5000  # number of steps to terminate the added variance

# molecular crystal settings
################################################################
# scales the energy function
molecule: urea  # 'nicotinamide' or 'urea' or 'qm9' for molecule-conditional training
molecule_conditioning: True  # MUST be true for molecule='qm9' and false else
energy_function: combo
  # 'latent_harmonic' : unimadal harmonic potential in the latent space
  # 'crystal_harmonic': unimodal harmonic potential in the crystal space
  # 'latent_multiharmonic': multimodal harmonic potential in the latent space
  # 'crystal_multiharmonic': multimodal harmonic potential in the crystal space
  # 'ellipsoid_overlap' : minimize ellipsoid overlaps subject to energy_density_coeff external pressure
  # 'silu_energy' : minimize a softened LJ-tye energy subject to energy_density_coeff external pressure
  # 'combo' : silu + ellipsoid overlap
anneal_temperature: false  # scale temperature over time, when conditional it scales the distribution, when not it just decreases from static to min
temp_annealing_max_steps: 5000  # time for scaling_factor to reach 1 (uniform sampling from min to max)
anneal_repulsion: False
repulsion_annealing_max_steps: 5000
energy_density_coeff: 2.0  # how much to weight the density penalty term in the energy function
energy_lj_coeff: 1.0  # loss coefficient
energy_core_coeff: 10.0  # loss coefficient
lj_turnover_pot: 10.0  # value above which molecular LJ potential is softcly clipped
lj_repulsion: 0.85  # max 1. for values less than 1 the potential becomes more attractive
ellipsoid_scale: 0.0  # how big in angstroms to pad around the rough minimum bounding ellipsoid, maybe [-1,1]
temperature_conditioning: false  # if false, temperatures are set to energy_static_temperature, and there is no annealing
energy_min_temperature: 0.1
energy_max_temperature: 10
energy_static_temperature: 1  # for certain evaluations or static T training. Also initial temperature on unconditional temperature annealing
temperature_scaling_factor: 0.01  # controls relative frequency of higher vs lower temperatures (higher -> higher)
energy_clip: 100

############
############
############
############
############
############
############
############
############
############

# deprecated or un-used
max_iter_ls: 100                # DEPRECATED # how many iterations to run local search
samples_per_opt: 10             # DEPRECATED #how many noisy samples to take near each optimized minimum
burn_in: 100                    # DEPRECATED # NOT USED IN MXTAL how many iterations to burn in before making local search
ls_cycle: 100                   # DEPRECATED # how frequently to make local search
ld_step: 0.1                    # DEPRECATED # langevin step size
ld_schedule: true               # DEPRECATED # whether to use scheduled langevin step size
target_acceptance_rate: 0.574   # DEPRECATED # target acceptance rate for local search
langevin: false
langevin_scaling_per_dimension: false
lgv_clip: 100.0
lgv_layers: 4
eval: false
pis_architectures: false # false goes to our custom architectures, which are better for training bigger models
subtb_lambda: 2              # subtb currently deprecated
local_search: false             # DEPRECATED we now combine preloaded and sampled elements into a single buffer
energy_annealing_threshold: 1.0e-1 # UNUSED
convergence_history: 100  # UNUSED
bwd_policy: 'brownian_bridge'       # 'brownian_bridge' or 'gaussian'
partial_energy: false
