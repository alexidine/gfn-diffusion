# accidentally ran the below with temperature conditioning, so it makes sense it would kindof not work so good
- tag: 13_greedy_0_0  # greedy loss continuously improved up to 10k before erroring out. wide buffer, somewhat collapsed model. Energies and densities improving
  update:
    exploratory: False
    temperature_conditioning: False
    anneal_temperature: False
    space_groups: [2]
    joint_layers: 8
    hidden_dim: 512
    dropout: 0
    norm: null
    t_scale: 0.1
    pb_scale_range: 0.2
    fwd_loss_coeffs:
      mle: { init: 0.001, max: 0, min: 0.0, 'on': 0,    'off': 1 }
      greedy: { init: 1.0, max: 1.0, min: 1.0, 'on': 10000,    'off': 20000}

    bwd_loss_coeffs:
      mle: { init: 0.001, max: 0.0, min: 0.0, 'on': 10000,    'off': 20000}
      mle_prior_fraction: { init: 1.0,max: 1.0,min: 1.0, 'on': 0,    'off': 1 }
      pmle_std: { init: 4.0, max: 4.0, min: 4.0, 'on': 0,    'off': 1 }  # std deviation of the prior mle distribution


