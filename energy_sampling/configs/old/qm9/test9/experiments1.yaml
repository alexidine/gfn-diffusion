- tag: 6_greedy_RF
  update:
    max_batch_size: 200
    joint_layers: 16
    hidden_dim: 512
    dropout: 0
    norm: layer
    t_scale: 0.1
    log_var_range: 2
    pb_drift_range: 0.2
    pb_var_range: 2
    fwd_loss_coeffs:
      tb:               { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': .inf    }
      vg_lb:            { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }
      vg_lme:           { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }  # exclusive with vg_lb
      emp_z:            { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
      greedy:           { init: 1.0, max: 1.0, min: 1.0, 'on': 0,    'off': 1    }
      reinforce:        { init: 1.0, max: 1.0, min: 1.0, 'on': 0,    'off': 1    }
      mle:              { init: 1.0, max: 1.0, min: 1.0, 'on': 0,    'off': 1  }
      var:              { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }
      overlap:          { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }
      buffer:           { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }
      smoothed:         { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }

      detach_after:     { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }  # NON FUNCTIONAL
      var_cutoff:       { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }
      var_gamma:        { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }
      buffer_gamma:     { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }
      loss_clip:        { init: 100.0, max: 10000.0, min: 10000.0, 'on': 5000,    'off': 1.0E+9  }
    bwd_loss_coeffs:
      tb:               { init: 0.0, max: 0.0, min: 0.0, 'on': 1000,    'off': 1000    }
      vg_lb:            { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }
      vg_lme:           { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }  # exclusive with vg_lb
      emp_z:            { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1    }  # separate from tb, train Z to match the empirical lme estimate. Must combine with a VG loss
      mle:              { init: 1.0, max: 1.0, min: 0.1, 'on': 10000,    'off': 20000  }
      smoothed:         { init: 0.0, max: 0.0, min: 0.0, 'on': 0,    'off': 1  }
      mle_prior_fraction: { init: 1.0,max: 1.0,min: 0.0, 'on': 10000,    'off': 20000 }
      pmle_std:         { init: 1.0, max: 4.0, min: 4.0, 'on': 10000,    'off': 1.0E+9 }  # std deviation of the prior mle distribution. Best to start small (1) and smoothly grow
      loss_clip:        { init: 100.0, max: 10000.0, min: 10000.0, 'on': 5000,    'off': 1.0E+9  }

