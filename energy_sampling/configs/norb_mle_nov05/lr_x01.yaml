      skip_if: weights_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
        scramble_conditions: false
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
          tb_z_source: persistent
      max_steps: 20000
      on_exit:
      - snapshot:phase1_exit
      - stop
      lr_schedule:
      - to: 0.05
        steps: 3000
        kind: hold
      - to: 0.1
        steps: 1000
        kind: geometric
  conditional_vargrad:
    stages:
    - name: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      skip_if: weights_loaded
      hot_lr_sensor:
        channel: bwd/mle
        form: absolute
        rows: 31
        above: 5.0
      flags:
        update_log_z: true
        scramble_conditions: false
      loss_coeffs:
        bwd:
          mle: 1.0
          tbc: 0.0
          repeats: 1.0
          tb_z_source: persistent
      exit:
      - metric: gates/progress_done
        above: 0.5
        patience: 1
      max_steps: 50000
      on_exit:
      - snapshot:phase1_exit
    - name: var_conditioning
      train_mode: fused
      bwd_sampling_mode: prior
      hot_lr_sensor:
        channel: bwd/logw_std_within
        rows: 11
        above: 3.0
      flags:
        update_log_z: true
        buffers_active: true
        weighted_bwd_sampling: false
        weighted_condition_sampling: false
      on_enter:
      - set_lr_flow:1.0e-4
      - freeze_pb
      - bootstrap_z
      fracs:
        fwd: 0.0
        bwd: 0.5
        replay: 0.5
      min_fracs:
        fwd: 0.0
      deactivate_threshold: 0.01
      fwd_rollout_every: 20
      z_pin_rollout_every: 0
      fwd_rollout_triggers:
        occupancy_min_batches: 0.0
        val_gap_max: 0.0
        drift_std_max: 0.0
        ess_min: 0.0
      fwd_z_sidecar: true
      replay_warmup_rows: 20000
      condition_draw:
        conditions: 0
        replay_rows: 2
        prior_rows: 2
        pick: uniform
      loss_coeffs:
        fwd:
          tb: 0.0
          vg_lb: 0.0
          vg_by_condition: 1.0
          emp_z: 1.0
          freeze_policy: 1.0
          repeats: 2.0
          pooled_vg: 1.0
          pooled_beta: 40.0
          pooled_ratio: 0.5
          pooled_source: replay
          tb_z_source: persistent
        bwd:
          tb: 0.0
          vg_lb: 0.0
          condition_block_m: 0
          repeats: 1.0
          level_gap: 0.0
          tb_z_source: persistent
        replay:
          tb: 0.0
          vg_by_condition: 1.0
          condition_block_m: 0
          tb_z_source: persistent
      balance:
        kind: lexicographic
        default_boost:
          replay: 0.5
          bwd: 0.5
        anneal_cooldown_steps: 2000
        rules:
        - metric: gates/delta_mean
          relative: best
          margin: 1.05
          drift: 0.0
          if_missing: violated
          boost:
            replay: 0.5
            bwd: 0.5
        - metric: gates/delta_worst
          relative: best
          margin: 1.1
          drift: 0.0
          if_missing: violated
          boost:
            replay: 0.5
            bwd: 0.5
        anneal_coeffs:
          lambda_mix:
            target: 1.0
            rate: 0.5
