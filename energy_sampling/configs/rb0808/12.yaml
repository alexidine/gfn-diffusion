protocol:
  stages:
  - name: train_prior
    train_mode: bwd
    bwd_sampling_mode: dataset
    skip_if: prior_loaded
    flags:
      update_log_z: true
      scramble_conditions: true
      mle_gate: true
    loss_coeffs:
      bwd:
        mle: 1.0
        tbc: 1.0
        repeats: 2.0
    exit:
    - metric: gates/mle_flat
      above: 0.5
      patience: 5
    - metric: eval/wass_debiased
      below: 0.015
    - metric: bwd/tbc
      below: 2.0
    on_exit:
    - snapshot:phase1_exit
    - snapshot_prior
  - name: naive
    train_mode: fused
    bwd_sampling_mode: prior
    flags:
      update_log_z: true
      buffers_active: true
    fracs:
      fwd: 0.2
      bwd: 0.6
      replay: 0.2
    min_fracs:
      fwd: 0.02
      bwd: 0.05
      replay: 0.02
    deactivate_threshold: 0.01
    loss_coeffs:
      fwd:
        tb: 1.0
        freeze_policy: 1.0
      bwd:
        tb: 1.0
    balance:
      kind: ratio
      pinned:
        fwd: 0.2
      metrics:
        replay: fwd/over_coverage
        bwd: bwd/relative_under_wcen
      numerator: replay
      setpoint: 5.0
      gain: 0.02
      max_step: 0.05
      bounds:
        replay:
        - 0.05
        - 0.45
      converge_floor: 1.5
