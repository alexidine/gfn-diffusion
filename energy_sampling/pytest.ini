# Makes "run the full suite" mean one thing.
#
# Before this file, `pytest` with no arguments recursed into wandb/, checkpoints/
# and .claude/worktrees/ (which hold whole second copies of the tree, so every
# test collected two or three times), and the command people actually used --
# `pytest test_*.py bench/test_*.py` -- silently excluded analysis/tests.
#
#     pytest          # everything
#     pytest -m fast  # no GPU, no data drive: ~seconds
[pytest]
# Just `.` -- it already recurses into tests/, bench/ and analysis/tests/.
# Listing those alongside it makes pytest drop everything not named.
testpaths = .

# Root-level test_*.py moved to tests/<area>/ (2026-08-23). With pytest's default
# `prepend` import mode and no __init__.py under tests/, the directory pytest
# inserts on sys.path is tests/<area>/ -- NOT this one -- so every bare
# `from controller import ...` in a moved test would fail to resolve. These two
# entries put both spellings back on the path: `.` for the bare imports the tests
# already use, `..` for the `energy_sampling.x` form others use. Keeping both
# spellings working is deliberate; collapsing them is a separate change, and it is
# the one that has to deal with the dual-import module identity trap.
pythonpath = . ..

# Second copies of the tree, run artifacts, and data. Worktrees are the important
# one: they contain their own test_*.py, and collecting them runs a DIFFERENT
# revision of the code under the current revision's name.
norecursedirs =
    .claude
    .git
    __pycache__
    wandb
    checkpoints
    configs
    SCRATCH
    eval/paper1_results

# bench/old is NOT listed above, so pytest recurses into it -- and collects
# NOTHING from it, because bench/old/conftest.py's collect_ignore now names all
# five of the test files it contains. The inclusion is inert.
#
# It was not always, and the note that stood here recorded why: the inclusion
# was said to be parking live regression coverage, `bench/old/test_lr_controller.py`,
# "twelve behaviours of the SHIPPING LRController v8 that nothing else pins".
# Both halves of that are now false. The file was DELETED 2026-08-24 (0dfeef2,
# 681 lines, collateral in a commit about z-calibration timing), and v8 itself
# was replaced by the brute-force bracket -- see controller.py's "WHAT IS GONE",
# which lists seven of those eight behaviour families as deleted machinery. The
# eighth, the unmanaged-key control arm, survives and IS pinned, by
# tests/lr/test_lr_absolute_cap.py. The controller is not unprotected; the
# behaviours went with the mechanism. Details and the re-run mutation are in
# bench/old/conftest.py.
#
# MEASURED 2026-09-09: the quoted "111 passed / 3 skipped in 65 s" is dead too.
# Named explicitly, test_crucible_feasibility.py no longer imports and 48 of the
# other 68 fail. What pins the live controller is tests/lr/ (238 passed) and the
# collected bench/ (155 tests).

# Tiers are assigned automatically in conftest.py; see its docstring for the
# measurement and the rule. Marking a test explicitly overrides the automatic
# choice.
markers =
    fast: no torch import -- the dev loop (measured 491 tests / 66 s)
    slow: imports torch; builds models, runs rollouts, or reads the data drive
