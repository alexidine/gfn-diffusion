# Analysis configuration
run_name: mipcas_elj
device: cuda
energy_function: elj  # elj, uma
n_steps: 100
sg_ind: 2
zp: 1
kT: 2.5
units: 'kJ/mol'

# Sampling
num_samples: 10000
batch_size: 10
alpha: 2.0

# Flags
reload_results: true
show_figs: true
write_figs: false
save_results: true
overwrite_results: true

# Paths
