# Shared across all runs
base:
  device: cuda
  kT: 2.5
  units: 'kJ/mol'

  num_samples: 1000        # the RDF distance matrix is O(N^2)
  sample_batch_size: 250   # GFN rollout batch; no MLIP, cheap
  analysis_batch_size: 50  # crystal build + energy batch (grows itself, shrinks on OOM)
  max_analysis_batch_size: 200  # ceiling on that growth; drop it hard for MLIP runs

  # MUST be true, and the code raises if it is false on a non-standard conformer.
  # Train time uses false, but only survives it because its conditioning molecule
  # is already standard-oriented (measured: the two settings differ by 0.006 kJ/mol
  # on samples). Experimental structures carry their own conformer frame, where the
  # same switch moved ACRDIN04 from -60.06 to +3765.75 kJ/mol.
  std_orientation: true

  reload_results: true     # reuse <results_dir>/<run_name>.pt when its provenance (checkpoint step, rdf_mode, ...) matches
  save_results: true
  overwrite_results: true

  # Data only by default: the paper figures come from generate_figs.py. Set true
  # for the single-run combo figure + basin CIF export.
  make_figures: false
  show_fig: false

  max_n_clusters: 6        # ALSO the panel count in the figure grid; not a measurement
  min_basin_size: 10       # ~1% of num_samples; use 100 at 10k

  checkpoints_dir: D:\crystal_datasets\gfn_checkpoints
  results_dir: D:\crystal_datasets\gfn_results

# Per-run overrides.
# `checkpoint` is a single-file checkpoint written by checkpointing.py. Its
# gfn_config, model_eval (EMA weights), train_T, and problem_def (energy_function,
# space groups, Z') are all read from the file -- nothing about the model or the
# problem is restated here.
# `rdf_mode` is REQUIRED per run and is a property of the molecule: atomwise for
# mipcas/nehzor, envwise for acridine (C2-symmetric; atomwise is non-monotone there).
# `train_config` is the arm's training yaml (relative to energy_sampling/). It builds
# the arm's MolecularCrystal so results['log_r'] is the exact training reward.
# `molecule_path` is an OPTIONAL override; by default the conditioning molecule is
# taken from the prior's 'prior' key, which is what train.py conditions on.
# `identifiers` filters the experimental reference file. Every surviving reference
# must match the checkpoint's (space group, Z') or the run aborts.
runs:

  # ============ prod_sep12 paper arms (checkpoints in D:\crystal_datasets\checkpoints) ============
