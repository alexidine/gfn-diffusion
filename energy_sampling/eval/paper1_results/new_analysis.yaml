    rdf_mode: atomwise
    exp_sample_path: D:\crystal_datasets\nehzor\NEHZOR_structures_std_conf.pt
    dataset_path: D:\crystal_datasets\conditional\priors\nehzor_sg14_zp1_elj_prior_dataset.pt
