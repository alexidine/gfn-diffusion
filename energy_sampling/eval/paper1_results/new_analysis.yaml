    rdf_mode: envwise
    exp_sample_path: D:\crystal_datasets\acridine\opt_acrdin.pt
    dataset_path: D:\crystal_datasets\conditional\priors\acridine_sg14_zp1_mace_prior_dataset.pt
    # the file holds 7 forms across sg 9/14/19 and Z' 1/2/3; only these two are
