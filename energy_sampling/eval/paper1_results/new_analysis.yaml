    rdf_mode: envwise
    exp_sample_path: D:\crystal_datasets\acridine\opt_acrdin.pt
    dataset_path: D:\crystal_datasets\conditional\priors\acridine_sg14_zp1_mace_prior_dataset.pt
    identifiers: ['ACRDIN04', 'ACRDIN12']
    num_samples: 10000
    analysis_batch_size: 4
    max_analysis_batch_size: 16
    min_basin_size: 100
    make_figures: true
    # UMAP only -- never the table, densities or basin assignment. Every form in each
    # file, including those outside sg14 Z'=1. Both files carry the SAMPLES' conformer
    # (1.3668 A); std_opt_acridine_polymorphs.pt does NOT (0.199 A off) and is refused.
    embedding_references:
      - {path: 'D:\crystal_datasets\acridine\opt_acrdin.pt', tag: relaxed}
      - {path: 'D:\crystal_datasets\acridine\std_acridine_polymorphs.pt', tag: as-deposited}

