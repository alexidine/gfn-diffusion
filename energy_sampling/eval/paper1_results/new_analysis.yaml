  # ============ p20, REDUCED CELLS ONLY: same samples, reduction_en <= 1e-6 ============
  # Every sample with a nonzero reduction penalty is a (near-)duplicate of a crystal whose reduced
  # cell is also in the box, and inside the zero-penalty region the reward IS the intended
  # distribution, so this filter is an exact correction. 1e-6 sits above the 3e-7 float noise
  # between stored and live penalties. source_results reuses each run's samples and dmat (subset).
  - run_name: p20_mip_n5_running_10k_red0
    source_results: D:\crystal_datasets\gfn_results\p20_mip_n5_running_10k.pt
    max_reduction_en: 1.0e-6
