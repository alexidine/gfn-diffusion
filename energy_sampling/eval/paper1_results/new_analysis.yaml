  - run_name: p12_mip_lr1_best_10k
    checkpoints_dir: D:\crystal_datasets\checkpoints
    checkpoint: p12_p12_mip_lr1_elj-mipcas_sg2_zp1_elj_200k_prior_dataset-T2.5-a8b328_best.pt
    train_config: configs/prod_sep12/p12_mip_lr1.yaml
    rdf_mode: atomwise
    exp_sample_path: D:\crystal_datasets\mipcas\MIPCAS_standardized_niggli.pt
    dataset_path: D:\crystal_datasets\conditional\priors\mipcas_sg2_zp1_elj_200k_prior_dataset.pt
    num_samples: 10000
    min_basin_size: 100

