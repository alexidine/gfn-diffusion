  # way back. The reward's reduction term must match the walls the arm TRAINED under,
  # or log_r is scored against a different penalty than the policy saw. Which rule an
  # arm used is settled from its own draws by scratchpad/fin19_walls.py, and the value
  # in force is written into the results as 'legacy_triclinic_walls'.
  - run_name: fin19_mip_pb_running_10k
