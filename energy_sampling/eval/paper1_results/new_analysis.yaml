  # ============ acridine, MACE (checkpoints in gfn_checkpoints) ============
  # REFERENCE SET: opt_acrdin.pt, the rigid-body cell-relaxed forms. The
  # std_acridine_polymorphs / std_opt_acridine_polymorphs pair are NOT relaxed --
  # measured 2026-09-07, those two files carry byte-identical cells, angles,
  # packing and stored eLJ as each other and as the CSD deposition.
  # Small MACE batches: MACE is far heavier than eLJ and the GPU may be shared.
  - run_name: p12_acr_lr0p05_best_10k
    checkpoints_dir: D:\crystal_datasets\checkpoints
    checkpoint: p12_p12_acr_lr0p05_mace-acridine_sg14_zp1_mace_prior_dataset-T2.5-625524_best.pt
