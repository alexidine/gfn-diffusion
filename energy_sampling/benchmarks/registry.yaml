  - id: a100-batch-scaling-elj
    title: A100 batch and occupancy scaling, ELJ
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd, bwd, replay]
    hardware:
      class: a100
      local_adequate: false
      a100_required: true
      reason: >-
        the question is what the cluster scheduler judges. A 16 GB laptop with no
        scheduler cannot answer it at any batch.
    work:
      kind: fixed_steps_per_rung
      batch_size: null
      batch_rungs: [1000, 1650, 2722, 4491, 7410]
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      # AMENDED 2026-08-16 (phase6_measurement_request.md section 2 box): the old
      # formula 'resume_step + warmup_steps + measure_steps' = 500 steps reaches
      # min_wallclock_s only at >= 14.4 s/step, which an A100 ELJ step at batch
      # 1000 is not plausibly near -- so as previously declared the job ended
      # early and _gpu_util_mean(7200) printed a partial window LABELLED as the
      # policy average. The step budget must be sized from a MEASURED step time.
      # NB registry.epochs_for() hard-codes the old sum and does NOT evaluate this
      # formula (phase6_measurement_delta.md D10.1): a battery generator must
      # compute the budget itself and treat warmup+measure as the timing window
      # only, not the run length.
      epochs_formula: >-
        resume_step + max(warmup_steps + measure_steps,
        ceil(min_wallclock_s / measured_step_time)) rounded up to a multiple of
        10, per rung, one launch each
      wallclock_cap_s: 28800
      min_wallclock_s: 7200
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      eval_period: 100000000
    metrics:
      primary: [samples_per_sec, gpu/util_policy, train_step_time]
      secondary: [gpu/util_recent, vram/peak_reserved_mb, vram/cached_mb, energy/frac_of_step]
      catastrophes: [batch/oom_events, batch/ceiling_expiries, batch/oom_ceiling]
      unusable: {}
    liveness:
      - 'each rung ran at its declared batch for the whole window (Batch Size flat)'
      - 'the run lasted at least min_wallclock_s, so gpu/util_policy window is filled'
      - 'compile_policy resolved the same way on every rung'
    noise_floor:
      method: repeat_launch
      repeats: 3
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: tier_c_repeat_spread
      detail: 'rungs differ only in batch; the loss trace is not compared across rungs, only the cost metrics'
      gate: null
      exactness: floor
    comparison:
      valid_against: [a100-batch-scaling-elj]
      rule: within_suite_rungs
    purpose:
      - 'Phase 6 needs the throughput-vs-occupancy curve on the hardware that cancels jobs'
      - 'batch IS the occupancy lever on an analytic energy and is NOT on the MLIP route; the two must be measured separately'

  # From docs/design/phase6_measurement_request.md section 9.1 (landed 2026-08-16
  # with two amendments recorded inline). The request's other proposed entries do
  # NOT land yet, deliberately: a100-batch-scaling-uma carries batch_rungs: null
  # until the pre-flight measures a ladder (the validator refuses it, which is the
  # desired failure mode), and a100-util-sensor-crosscal collapsed to a single
  # confirmation launch after F-038 showed wandb's system stream already answers
  # the cadence question retroactively (phase6_measurement_delta.md D11) -- a
  # single probe launch is not a benchmark.
  - id: a100-util-production-shape
    title: Utilization on a production-shaped run, with eval ON
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd, bwd, replay]
    hardware:
      class: a100
      local_adequate: false
      a100_required: true
      reason: >-
        the proxy has to be calibrated on the run shape that actually gets
        cancelled. Every throughput benchmark disables eval by design, and the
        in-process occupancy sampler takes NO samples during an eval block, so a
        proxy validated on an eval-free arm does not transfer to a production run.
    work:
      # AMENDED from the request's draft in two places, both with cluster
      # evidence. (1) batch 4491, not 1000: every pinned batch-1000 T=10 ELJ arm
      # ever submitted was cancelled for low utilization (qm9anchor_aug14 v1, all
      # six arms), and this benchmark needs to SURVIVE ~4 h; 4491 sits in the
      # observed surviving range of grown cluster runs (1650-7410, prod0810). The
      # quantity measured -- the share of wall clock the in-process sensor never
      # samples -- is a property of the eval cadence, and batch enters only
      # through survival odds. (2) eval 500 / figs 1000, the actual production
      # cluster cadence, not the request's 250/500.
      kind: fixed_steps
      batch_size: 4491
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: >-
        resume_step + max(warmup_steps + measure_steps,
        ceil(min_wallclock_s / measured_effective_step_time)) rounded up to a
        multiple of 10, where effective step time includes the eval share
      wallclock_cap_s: 21600
      min_wallclock_s: 14400
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 4491
      max_batch_size: 4491
      eval_period: 500
      figs_period: 1000
      eval_num_samples: 10000
    metrics:
      primary: [gpu/util_policy, eval_step_time, inter_eval_time]
      secondary: [gpu/util_recent, eval_sampling_time, eval_figs_time,
                  eval_wrapup_time, train_step_time, energy/frac_outside_step,
                  vram/peak_reserved_mb]
      catastrophes: [batch/oom_events, batch/oom_min, gradnorm/nonfinite_steps]
      unusable:
        samples_per_sec: 'counts training samples only; eval sampling is not in the denominator'
        energy/ms_per_sample: 'pools training and eval energy calls'
    liveness:
      - 'at least 8 evaluations fired inside the gpu/util_policy window'
      - 'figs_period is a multiple of eval_period, so figures actually logged'
      - 'the external nvidia-smi CSV covers the whole job, eval blocks included'
      - >-
        the run lasted at least min_wallclock_s, VERIFIED from the external
        sidecar CSV duration -- the in-process sample count (G2) is not
        instrumented yet, so window fill cannot be checked from wandb alone
      - 'fwd/*, bwd/* and replay/* all present and changing'
    noise_floor:
      method: repeat_launch
      repeats: 3
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: paired_control
      detail: >-
        the a100-batch-scaling-elj rung at the same batch with eval disabled is
        the control; the delta is what eval does to the OCCUPANCY READING, which
        is a different question from what eval costs (elj-eval-cost owns that)
      gate: null
      exactness: floor
    comparison:
      valid_against: [a100-util-production-shape, a100-batch-scaling-elj]
      rule: same_hardware_class_paired_seed
    purpose:
      - 'measures the share of wall clock the in-process occupancy sensor never samples'
      - 'the single number that decides whether gpu/util_policy OVERSTATES what the scheduler sees'

suites:
  local-dev:
    description: Everything that runs on the dev box. The development smoke set.
    benchmarks:
      - toy-latentgauss-fused-uncond
      - toy-multiharm-fused-cond
      - elj-bwd-dataset-uncond
      - elj-bwd-prior-uncond
      - elj-fwd-solo-uncond
      - elj-replay-solo-uncond
      - elj-fused-uncond
      - elj-fused-cond
      - elj-eval-cost
  branch-ladder:
    description: >-
      The four branch profiles on one energy, one T and one batch. Only comparable
      to each other, and only paired by seed.
    benchmarks:
      - elj-bwd-dataset-uncond
      - elj-bwd-prior-uncond
      - elj-fwd-solo-uncond
      - elj-replay-solo-uncond
      - elj-fused-uncond
  a100-throughput:
    description: The standard A100 throughput suite.
    benchmarks:
      - elj-fused-uncond
      - elj-fused-cond
      - uma-fused-uncond
      - mace-fused-uncond
      - a100-batch-scaling-elj
  mlip-cost:
    description: The two MLIP routes, energy-call cost and its share of the step.
    benchmarks:
      - uma-fused-uncond
      - mace-fused-uncond
  conditional:
    description: Conditioning overhead, toy and molecule.
    benchmarks:
      - toy-multiharm-fused-cond
      - elj-fused-cond
  determinism:
    description: >-
      The config-equivalence instruments. The toy is exact; the ELJ shape is
      compared against its own measured repeat spread.
    benchmarks:
      - toy-latentgauss-fused-uncond
      - elj-fused-uncond
  phase4-utilisation:
    description: >-
      The utilisation proxy and the occupancy-versus-batch question, on the
      hardware that cancels jobs. Everything Phase 6 is gated on. Grows to the
      full five-benchmark set of phase6_measurement_request.md section 9 as the
      UMA ladder's pre-flight lands; absolute numbers here do not transfer to
      the dev box, which has no scheduler.
    benchmarks:
      - a100-batch-scaling-elj
      - a100-util-production-shape
