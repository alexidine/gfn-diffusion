---
# Canonical benchmark workloads. Argument and derivation: docs/design/benchmarks.md.
#
# This file is DATA and is LOADED (benchmarks/registry.py), not reference-only.
# Field semantics are documented in docs/design/benchmarks.md §3; they are not
# restated here, because a restated field doc is a field doc that drifts.
#
# `null` in a measured slot means NOT YET MEASURED. It is never a default and
# never a guess; the validator refuses a comparison claim that rests on one.
schema_version: 1

defaults:
  # Applied under every benchmark's own `overrides`, which win on conflict.
  # Every entry here removes a source of work that is not the work being timed.
  overrides:
    checkpoint_read_only: true
    archive_period: 0
    archive_buffers: false
    grow_batch_size: false
    auto_batch_throughput_opt: false
    max_step_seconds: 0
    batch_knee_recheck_steps: 0
    figs_period: 100000000
    # NO z_calibration ENTRY, and none is possible -- the same story as
    # ray_calibration below, and it cost a retracted floor to learn twice.
    # `z_calibration.enabled` was the switch until state 6 made it a STAGE FLAG
    # (`flags: {z_calibration: true}`). An override cannot reach a stage
    # declaration: stage lists merge WHOLESALE, so a patch would have to restate
    # the whole protocol. Setting the old key here is worse than useless -- it
    # reads as neutralised while every arm calibrates Z inside the measurement
    # window, which is exactly what voided a100_stab_aug16's first floor set.
    # Neutralising it is the WORKLOAD generator's job (see
    # configs/a100_stab_aug16/make.py::strip_z_calibration), and every
    # benchmark's liveness list requires the absence to be shown.
    # NO ray_calibration ENTRY, and none is possible. The ray probe is the other
    # piece of periodic work whose period is not the report period, but it now
    # arms iff some stage declares `lr_sensor: {kind: ray}` -- there is no flag
    # left to clear, and `ray_calibration.enabled` is a retired key that would
    # hard-fail the run at load. Overrides cannot reach it either: the
    # declaration lives on a stage, and stage lists merge WHOLESALE, so a patch
    # would have to restate the whole protocol. Neutralising it is therefore the
    # WORKLOAD's job -- a benchmark whose config declares a ray stage carries the
    # probe's cost in its timing, and its window must be read as such.
    anomaly_detection: false
    device: cuda

metrics:
  # Every literal here is grep-verifiable in the trainer. Source is recorded so a
  # rename lands in one place.
  cost:
    train_step_time: {source: 'utils.drain_elapsed_times', cadence: report}
    samples_per_sec: {source: 'train.py:814', cadence: report}
    step_time_max10: {source: 'train.py:2156', cadence: report}
    Batch Size: {source: train.py, cadence: report}
  energy:
    energy/ms_per_sample: {source: 'energies/base_set.py:81', cadence: report}
    energy/calls: {source: 'energies/base_set.py:78', cadence: report}
    energy/seconds: {source: 'energies/base_set.py:77', cadence: report}
    energy/seconds_in_step: {source: 'train.py:830', cadence: report}
    energy/frac_of_step: {source: 'train.py:832', cadence: report}
    energy/frac_outside_step: {source: 'train.py:833', cadence: report}
  energy_phase_split:
    # MACE. The UMA equivalent is energy_phase_split_uma below -- benchmarks.md §10's
    # claim that UMA has none is STALE (corrected 2026-08-18).
    energy/mace_build_s: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_collate_s: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_xfer_s: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_forward_s: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_calls: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_host_frac: {source: 'AL_mace_utils.py:137'}
    energy/mace_forward_frac: {source: 'AL_mace_utils.py:139'}
    energy/mace_neighbours_s: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    energy/mace_nl_frac_of_build: {source: 'AL_mace_utils.drain_mace_phase_timing'}
    # WHICH PATH RAN. Two arms otherwise log identical key sets with nothing to say
    # which was which, and an absent flag reads as "feature off" with no error.
    energy/mace_flag_batched_nl: {source: 'AL_mace_utils, MXT_BATCHED_MACE_NEIGHBOURS'}
    energy/mace_flag_gpu_batch: {source: 'AL_mace_utils, MXT_GPU_MACE_BATCH'}
    energy/mace_flag_hoisted: {source: 'AL_mace_utils, MXT_HOISTED_MACE_ATOMICDATA'}
  controller:
    # What the batch controller ACTS ON, as opposed to what the reporter averages.
    # increment_batch_size medians the last 20 step times and decides on that; every
    # other cost metric here is a 10-step report mean, so a ladder built from those
    # describes a curve no in-process controller can be shown to reproduce.
    batch/med_step_s: {source: 'train.py ten_step_reporting', cadence: report}
    batch/sps_rung: {source: 'train.py ten_step_reporting', cadence: report}
    # OPT-STEP throughput. Differs from samples_per_sec below the grad-accum
    # crossover, where the two candidate objectives have opposite argmaxes.
    updates_per_sec: {source: 'train.py ten_step_reporting', cadence: report}
    batch/accum_target: {source: 'train.py ten_step_reporting', cadence: report}
  energy_phase_split_uma:
    # UMA DOES have a phase split -- benchmarks.md section 10 said otherwise and was
    # stale. `graph` is NESTED INSIDE `forward` (fairchem runs otf_graph, so the
    # neighbour list is built inside the forward), and the graph keys appear ONLY
    # under MXT_UMA_GRAPH_TIMER=1, which costs a CUDA synchronise per graph build.
    energy/uma_guard_s: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_build_s: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_forward_s: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_calls: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_host_frac: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_forward_frac: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_flag_vectorised: {source: 'uma_utils.drain_uma_phase_timing'}
    energy/uma_graph_s: {source: 'uma_utils, MXT_UMA_GRAPH_TIMER=1 only'}
    energy/uma_graph_calls: {source: 'uma_utils, MXT_UMA_GRAPH_TIMER=1 only'}
    energy/uma_forward_ex_graph_s: {source: 'uma_utils, MXT_UMA_GRAPH_TIMER=1 only'}
    energy/uma_graph_frac_of_forward: {source: 'uma_utils, MXT_UMA_GRAPH_TIMER=1 only'}
  occupancy:
    gpu/util_recent: {source: 'train.py:844', window_s: 900}
    gpu/util_policy: {source: 'train.py:848', window_s: 7200}
    vram/cached_mb: {source: train.py, cadence: report}
    vram/peak_reserved_mb: {source: train.py, cadence: report}
  eval_cost:
    eval_step_time: {source: 'utils.drain_elapsed_times', cadence: eval}
    eval_sampling_time: {source: 'utils.drain_elapsed_times', cadence: eval}
    eval_figs_time: {source: 'utils.drain_elapsed_times', cadence: eval}
    inter_eval_time: {source: 'utils.drain_elapsed_times', cadence: eval}
    # needed for the eval-blindness arithmetic: the unsampled share of wall clock
    # is eval time over (inter_eval + eval), and wrapup is part of eval time.
    eval_wrapup_time: {source: 'train.py:5039 times pair, via drain_elapsed_times', cadence: eval}
    initialization_time: {source: 'utils.drain_elapsed_times', cadence: once}
  catastrophe:
    # Counts. Never averaged, never smoothed into a score.
    batch/oom_events: {source: 'train.py:869'}
    batch/ceiling_expiries: {source: 'train.py:870'}
    batch/oom_ceiling: {source: 'train.py:871'}
    batch/oom_min: {source: 'train.py:889'}
    gradnorm/nonfinite_steps: {source: 'train.py:802'}

# Metric-name patterns forbidden in `primary`. A benchmark's headline number may
# not be a ratio against another run.
forbidden_primary_patterns:
  - 'speedup'
  - 'vs_baseline'
  - 'relative_to'
  - 'x_faster'
  - 'frac_of_peak'
  - 'normali[sz]ed'

hardware:
  local:
    name: dev box
    gpu: RTX 5080 Laptop
    vram_mb: 16303
    os: Windows 11
    torch_compile_available: false
    scheduler: none
    notes_ref: 'docs/design/benchmarks.md#5'
  a100:
    name: cluster
    gpu: A100
    vram_mb: null
    os: Linux
    torch_compile_available: true
    scheduler: cancels on low utilisation, policy window 7200 s
    notes_ref: 'docs/design/benchmarks.md#5'

benchmarks:

  # ---------------------------------------------------------------- toys ----
  - id: toy-latentgauss-fused-uncond
    title: Analytic toy, fused, unconditional
    status: specified
    workload:
      energy_function: latent_gaussian
      conditioning: unconditional
      domain: toy_on_crystal_parameterisation
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mxtaltools/mini_datasets/mini_new_csd.pt'
      dataset_in_repo: true
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd, bwd, replay]
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: analytic energy, no MLIP weights, dataset ships in repo
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: 0
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: latent_gaussian
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
      controller: {refresh_every: 1000000}
    metrics:
      primary: [train_step_time, samples_per_sec]
      secondary: [vram/peak_reserved_mb, gpu/util_recent, step_time_max10]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'run is shorter than the 7200 s window'
        energy/frac_of_step: 'analytic energy is a negligible share; the ratio is noise'
    liveness:
      - 'fwd/* present and changing'
      - 'bwd/* present and changing'
      - 'replay/* present and changing'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: closed_form
      detail: 'log Z = (n_live/2) log(2 pi T) + n_live log w, plus n_dead * log(2 + sqrt(pi/k)) when dead rows are live'
      gate: 'pytest test_latent_gaussian.py'
      exactness: exact
    comparison:
      valid_against: [toy-latentgauss-fused-uncond]
      rule: same_hardware_class_paired_seed
    purpose:
      - 'the sharpest instrument available: a deterministic target with a closed-form reference'
      - 'tier-C config-equivalence check collapses to an exact test here'

  - id: toy-multiharm-fused-cond
    title: Conditional toy, fused, vector conditioning
    status: specified
    workload:
      energy_function: latent_multiharmonic
      conditioning: conditional_vector
      domain: toy
      space_groups: [1]
      z_primes: [1]
      T: 10
      dataset: 'toy_big_unif_prior.pt + toy_big_unif_conditions.pt + toy_big_unif_test_conditions.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd, bwd, replay]
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: analytic energy; the conditioner is a small MLP
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: latent_multiharmonic
      vector_conditioning: true
      vector_conditioning_dim: 3
      model: {periodic_centroids: false}
      space_groups: [1]
      energy_config: {temperature: 1.0}
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
      controller: {refresh_every: 1000000}
    metrics:
      primary: [train_step_time, samples_per_sec]
      secondary: [vram/peak_reserved_mb, gpu/util_recent]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'run is shorter than the 7200 s window'
    liveness:
      - 'fwd/* present and changing'
      - 'bwd/* present and changing'
      - 'replay/* present and changing'
      - 'the conditioner receives gradient on at least one branch'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: paired_unconditional_control
      detail: 'toy-latentgauss-fused-uncond at the same T and batch is the cost control; the delta is the conditioning overhead'
      gate: 'pytest test_condition_fractions.py'
      exactness: floor
    comparison:
      valid_against: [toy-multiharm-fused-cond, toy-latentgauss-fused-uncond]
      rule: same_hardware_class_paired_seed
    purpose:
      - 'isolates the cost of conditioning from the cost of an expensive energy'

  # ------------------------------------------------------- branch ladder ----
  - id: elj-bwd-dataset-uncond
    title: ELJ, bwd from the atomic dataset (train_prior MLE)
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: train_prior
      train_mode: bwd
      bwd_sampling_mode: dataset
      branches: [bwd]
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: no energy call at all on this stage; nothing about it is hardware-policy sensitive
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: 0
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
    metrics:
      primary: [train_step_time, samples_per_sec]
      secondary: [vram/peak_reserved_mb]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        energy/ms_per_sample: 'this stage never calls the energy; the key is ABSENT, not zero'
        energy/frac_of_step: 'same'
        gpu/util_policy: 'run is shorter than the 7200 s window'
    liveness:
      - 'bwd/* present and changing'
      - 'energy/* ABSENT for the whole run'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: mle_descent
      detail: 'bwd/mle descending over the window; gates/mle_flat not yet tripped'
      gate: 'pytest -m fast'
      exactness: floor
    comparison:
      valid_against: [elj-bwd-prior-uncond, elj-fwd-solo-uncond, elj-replay-solo-uncond, elj-fused-uncond]
      rule: branch_ladder_paired_seed
    purpose:
      - 'the energy-free floor of the branch ladder: policy + backward rollout cost alone'

  - id: elj-bwd-prior-uncond
    title: ELJ, bwd from the churned prior buffer
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: bwd
      bwd_sampling_mode: prior
      branches: [bwd]
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: analytic energy
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
    metrics:
      primary: [train_step_time, samples_per_sec]
      secondary: [energy/calls, energy/ms_per_sample, vram/peak_reserved_mb]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'run is shorter than the 7200 s window'
    liveness:
      - 'bwd/* present and changing'
      - 'prior_buffer occupancy non-zero for the whole window'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: paired_control
      detail: 'elj-bwd-dataset-uncond is the same branch off a different sampler; the delta is buffer draw plus churn'
      gate: 'pytest -m fast'
      exactness: floor
    comparison:
      valid_against: [elj-bwd-dataset-uncond, elj-fwd-solo-uncond, elj-replay-solo-uncond, elj-fused-uncond]
      rule: branch_ladder_paired_seed
    purpose:
      - 'separates the buffer draw and churn cost from the backward rollout cost'
      - 'settles by measurement whether the prior draw triggers energy calls: read energy/calls'

  - id: elj-fwd-solo-uncond
    title: ELJ, fused stage driven to fwd only
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd]
      isolation: deactivate_threshold
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: analytic energy
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
      controller: {refresh_every: 1000000}
    metrics:
      primary: [train_step_time, samples_per_sec, energy/ms_per_sample]
      secondary: [energy/frac_of_step, energy/calls, vram/peak_reserved_mb]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'run is shorter than the 7200 s window'
    liveness:
      - 'fwd/* present and changing'
      - 'bwd/* and replay/* FROZEN for the whole window (proof the branches were skipped, not merely down-weighted)'
      - 'energy/calls > 0'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: paired_control
      detail: 'the fwd branch of elj-fused-uncond at the same batch and T'
      gate: 'pytest -m fast'
      exactness: floor
    comparison:
      valid_against: [elj-bwd-dataset-uncond, elj-bwd-prior-uncond, elj-replay-solo-uncond, elj-fused-uncond]
      rule: branch_ladder_paired_seed
    purpose:
      - 'the on-policy rollout plus one full-batch energy call, alone'

  - id: elj-replay-solo-uncond
    title: ELJ, fused stage driven to replay only
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [replay]
      isolation: deactivate_threshold
    hardware:
      class: local
      local_adequate: true
      a100_required: false
      reason: analytic energy
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 3600
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
      controller: {refresh_every: 1000000}
    metrics:
      primary: [train_step_time, samples_per_sec]
      secondary: [energy/calls, vram/peak_reserved_mb]
      catastrophes: [batch/oom_events, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'run is shorter than the 7200 s window'
    liveness:
      - 'replay/* present and changing'
      - 'Replay Frac has NOT been folded into Bwd Frac (train.py:2157 fires on an empty buffer and silently makes this a bwd benchmark)'
      - 'replay_buffer occupancy non-zero at every report'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      measured: null
    correctness:
      reference: paired_control
      detail: 'stored trajectories are replayed exactly; the loss form matches fwd, only the sampler differs'
      gate: 'pytest test_replay_gating.py'
      exactness: floor
    comparison:
      valid_against: [elj-bwd-dataset-uncond, elj-bwd-prior-uncond, elj-fwd-solo-uncond, elj-fused-uncond]
      rule: branch_ladder_paired_seed
    purpose:
      - 'the cheapest branch: a buffer draw and a scored replay, with no new energy call'

  # ------------------------------------------------------ production shape --
  - id: elj-fused-uncond
    title: ELJ, fused, unconditional — the production shape
    status: specified
    workload:
      energy_function: elj
      conditioning: unconditional
      domain: molecule
      space_groups: [2]
      z_primes: [1]
      T: 10
      dataset: 'mipcas_sg2_zp1_elj_prior_dataset.pt'
      dataset_in_repo: false
    training_mode:
      stage: equilibration
      train_mode: fused
      bwd_sampling_mode: prior
      branches: [fwd, bwd, replay]
    hardware:
      class: both
      local_adequate: true
      a100_required: false
      reason: >-
        local for step-cost deltas; the A100 for absolute throughput at production
        batch and for anything the scheduler judges
    work:
      kind: fixed_steps
      batch_size: 1000
      pin_batch: true
      resume_step: null
      warmup_steps: 100
      measure_steps: 400
      epochs_formula: 'resume_step + warmup_steps + measure_steps'
      wallclock_cap_s: 7200
    overrides:
      energy_function: elj
      integrator: {T: 10}
      eval_T: 10
      batch_size: 1000
      max_batch_size: 1000
      eval_period: 100000000
    metrics:
      primary: [train_step_time, samples_per_sec, energy/frac_of_step]
      secondary: [energy/ms_per_sample, energy/calls, gpu/util_recent, vram/peak_reserved_mb, step_time_max10]
      catastrophes: [batch/oom_events, batch/ceiling_expiries, gradnorm/nonfinite_steps]
      unusable:
        gpu/util_policy: 'requires a run at least 7200 s long; see a100-batch-scaling-elj'
    liveness:
      - 'fwd/*, bwd/* and replay/* all present and changing'
      - 'Replay Frac not folded into Bwd Frac'
      - 'energy/calls > 0'
    noise_floor:
      method: repeat_launch
      repeats: 5
      seed_policy: fixed
      run_statistic: median
      dispersion: relative_span
      # RETRACTED 2026-08-17, same day it was recorded. The five launches
      # (a100_stab_aug16_elj_r0..r4) ran with Z-CALIBRATION ON, so they did not
      # execute this benchmark's declared work quantity.
      #
      # HOW: `defaults.overrides` below disabled z_calibration through
      # `z_calibration.enabled`, and state 6 turned that switch into a STAGE FLAG
      # (`flags: {z_calibration: true}`). The override kept setting a key nothing
      # reads, the equilibration stage kept its flag, and the arms calibrated Z
      # inside the measurement window. Section 2 of benchmarks.md is explicit
      # about why that voids the numbers: the sidecar rollouts run INSIDE the
      # step-timing window while `_throughput['samples']` is charged only
      # `attempted_batch`, so `samples_per_sec` is wrong by a moving factor and
      # `train_step_time` carries work this benchmark does not define.
      #
      # This is the SECOND time a neutralisation here died when its key moved --
      # see the ray_calibration note at defaults.overrides. Same lesson: an
      # override cannot reach a stage declaration, so neutralising a stage flag
      # is the WORKLOAD generator's job, not this file's.
      #
      # The retracted values, for the record only -- do not compare against them:
      #   train_step_time 0.7838 (span 3.0%) | samples_per_sec 1284 (10.7%)
      #   energy/frac_of_step 0.3725 (5.8%)  | window steps 2100-2500, batch flat
      # RE-RUN clean 2026-08-17 with the stage flag stripped; z_cal/* absent on
      # all five. The contaminated step time was 43% HIGH (0.784 -> 0.548).
      measured:
        date: '2026-08-17'
        host: a100
        repeats: 5
        run_ids: [a100_stab_aug16_elj_r0, a100_stab_aug16_elj_r1, a100_stab_aug16_elj_r2,
                  a100_stab_aug16_elj_r3, a100_stab_aug16_elj_r4]
        window_steps: [2100, 2500]
        per_metric:
          train_step_time: 0.108
          samples_per_sec: 0.118
          energy/frac_of_step: 0.042
        medians:
          train_step_time: 0.5484
          samples_per_sec: 1820.0
          energy/frac_of_step: 0.2731
        notes: >-
          CROSS-NODE AND LIKELY BIMODAL. Four launches sit at 0.548-0.555 s and
          one at 0.496; the span is set by that single fast launch rather than by
          scatter around a centre. That is the shape a node difference makes, and
          SLURM_NODELIST was captured per job but not yet joined. Treat 10.8% as
          an UPPER bound that mixes machine spread with run-to-run noise -- the
          within-node floor is probably far tighter, and benchmarks.md section 10's
          node-confound question (request arm E) is what separates them.
    correctness:
      reference: tier_c_repeat_spread
      detail: >-
        loss and metric traces of the same config run twice are the null
        distribution; a change is indistinguishable from it or it is not equivalent
